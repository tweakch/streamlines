<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STROMLINIEN · Gewässer-Labor v1 · b Kacheln</title>
<!--
  A/B-Variante "Kacheln": Grund-Texturen (Gras/Kies-Erde/Wasser) statt Flächenfarbe,
  als kleine wiederholte Muster in den bestehenden Hex-Umriss geklemmt — die Hex-Form
  bleibt unser eigenes pointy-top-Sechseck, es wird nur der Flächeninhalt ersetzt.
  Quelle: "Hex Tileset Pack" von adythewolf, OpenGameArt.org, Lizenz CC0
  (https://opengameart.org/content/hex-tileset-pack) — drei 20×20-Ausschnitte
  (Gras/Erde/Wasser) aus dem Spritesheet, als PNG eingebettet. Vergleichsstück zu
  a-vektor.html (unverändertes gewaesser-labor-v1). Siehe NOTES.md.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap');

/* ============================================================
   Palette — identisch zur App (stromlinien.css), dazu die
   Gewässerfarben: eine Stufe je Klasse, damit man die Ordnung
   eines Laufs an der Farbe liest, nicht nur an der Breite.
   ============================================================ */
:root{
  --bg:#dce3d8; --panel:#ecefe6; --panel2:#e2e7dc; --ink:#22302c; --ink2:#5a6b64;
  --river:#7fb2ac; --riverdeep:#5e9793; --lake:#8fbdb6; --ember:#c96f2e;
  --bone:#f2ede0; --line:#b8c2b4; --good:#4e7d5b; --bad:#9c4a33;
  --tile:#cdd6c8; --tileink:#33443e; --berg:#a9b3a8; --bergdeep:#8d9a8c;
  --shadow:0 2px 10px rgba(30,45,40,.12);
  --kies:#d8d1b8; --aue:#c6cfae; --fels:#8d9a8c;
  --w0:#a9cdc7; --w1:#84b9b3; --w2:#63a29e; --w3:#488a8b; --w4:#356e7c; --wk:#8aa3b4;
}
body.night{
  --bg:#0d151d; --panel:#141f28; --panel2:#101a22; --ink:#e6e1d2; --ink2:#8b9690;
  --river:#2e5457; --riverdeep:#24444a; --lake:#2f5a5c; --ember:#e08a3c;
  --bone:#1b2731; --line:#2c3b44; --good:#7fb08b; --bad:#d07b5e;
  --tile:#1e2c34; --tileink:#c9d2c6; --berg:#26333c; --bergdeep:#1b262d;
  --shadow:0 2px 14px rgba(0,0,0,.5);
  --kies:#3a3c33; --aue:#2c3a2a; --fels:#26333c;
  --w0:#33565c; --w1:#2c5058; --w2:#264a54; --w3:#20424f; --w4:#1b3947; --wk:#2b3f4e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);color:var(--ink);font-family:'Instrument Sans',system-ui,sans-serif;
  height:100dvh;overflow:hidden;transition:background .6s ease,color .6s ease;}
h1,h2,h3,h4{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;margin:0;}
.mono{font-family:'Space Mono',monospace;}
button{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.03em;
  border-radius:9px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);
  padding:7px 10px;cursor:pointer;transition:transform .12s,background .2s,color .2s,border-color .2s;}
button:active{transform:scale(.97);}
button.ghost{background:transparent;border-color:var(--line);}
button.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
button:disabled{opacity:.4;pointer-events:none;}

/* ============================================================
   Bühne: mobil eine Spalte, ab 900px Seitenpanel
   ============================================================ */
/* min-width:0 überall auf den Rasterkindern — sonst setzt die breiteste
   Zeile (die Kopfknöpfe) die Seitenbreite und alles läuft rechts hinaus. */
.stage{display:grid;grid-template-rows:auto 1fr auto;height:100dvh;max-width:100vw;overflow:hidden;}
.stage>*{min-width:0;}
.wrap{display:grid;grid-template-columns:minmax(0,1fr);min-height:0;min-width:0;}
.wrap>*{min-width:0;}
@media(min-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr) 0;transition:grid-template-columns .28s cubic-bezier(.2,.9,.3,1);}
  .wrap.side{grid-template-columns:minmax(0,1fr) 372px;}
}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding:9px 13px 7px;
  border-bottom:1px solid var(--line);flex-wrap:wrap;}
.brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:13.5px;letter-spacing:.13em;}
.brand small{display:block;font-family:'Space Mono',monospace;font-weight:400;font-size:9.5px;
  letter-spacing:.06em;color:var(--ink2);margin-top:2px;}
.hbtns{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.hbtns button{font-size:10px;padding:5px 8px;border-radius:7px;border-color:var(--line);}

/* ---------- Karte ---------- */
.mapwrap{position:relative;overflow:hidden;background:var(--bg);min-height:0;touch-action:none;}
#map{display:block;width:100%;height:100%;cursor:grab;}
#map.drag{cursor:grabbing;}
.hud{position:absolute;left:9px;bottom:9px;font-family:'Space Mono',monospace;font-size:9.5px;
  color:var(--ink2);background:color-mix(in srgb,var(--bg) 80%,transparent);
  border:1px solid var(--line);border-radius:7px;padding:4px 7px;pointer-events:none;line-height:1.5;}
.zoombar{position:absolute;right:9px;bottom:9px;display:flex;flex-direction:column;gap:4px;}
.zoombar button{width:30px;height:30px;padding:0;font-size:14px;border-radius:8px;box-shadow:var(--shadow);}
.hint{position:absolute;left:50%;top:9px;transform:translateX(-50%);font-size:10.5px;
  background:var(--ink);color:var(--bg);border-radius:99px;padding:5px 11px;font-weight:600;
  box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity .2s;}
.hint.on{opacity:1;}

/* ---------- Werkzeugleiste ---------- */
.tools{border-top:1px solid var(--line);background:var(--panel2);padding:6px 8px;
  display:flex;gap:5px;overflow-x:auto;align-items:center;}
.tools button{white-space:nowrap;font-size:10.5px;padding:6px 9px;border-radius:8px;border-color:var(--line);}
.tools .sep{width:1px;height:20px;background:var(--line);flex:none;margin:0 2px;}
.sub{border-top:1px solid var(--line);background:var(--panel);padding:6px 9px;
  display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;}
.sub.hid{display:none;}
.sub label{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink2);}

/* ---------- Panel ---------- */
.panel{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;
  min-width:0;}
@media(max-width:899px){
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:62dvh;z-index:30;
    border-left:none;border-top:1.5px solid var(--ink);border-radius:16px 16px 0 0;
    box-shadow:0 -6px 24px rgba(30,45,40,.2);transform:translateY(101%);transition:transform .28s cubic-bezier(.2,.9,.3,1);}
  .wrap.side .panel{transform:translateY(0);}
}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;}
.tabs button{flex:1;border:none;border-radius:0;background:transparent;padding:9px 4px;font-size:10.5px;
  color:var(--ink2);border-bottom:2px solid transparent;}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ember);background:transparent;}
.pbody{padding:11px 13px 60px;}
.pbody h3{font-size:13px;margin:0 0 5px;}
.pbody h4{font-size:10px;font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;color:var(--ink2);margin:15px 0 6px;}
.pbody p{font-size:12px;line-height:1.55;margin:0 0 8px;color:var(--ink);}
.pbody p.dim{color:var(--ink2);font-size:11px;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 9px;font-size:11.5px;margin:0 0 8px;}
.kv b{font-family:'Space Mono',monospace;font-weight:400;font-size:10px;color:var(--ink2);
  letter-spacing:.03em;align-self:center;}
.kv span{font-weight:600;}
.chip{display:inline-block;font-family:'Space Mono',monospace;font-size:9.5px;padding:2px 6px;
  border-radius:99px;border:1px solid var(--line);color:var(--ink2);margin:0 3px 3px 0;}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.chip.warn{border-color:var(--bad);color:var(--bad);}
.chip.good{border-color:var(--good);color:var(--good);}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;}
.tree{font-size:11.5px;line-height:1.75;}
.tree ul{list-style:none;margin:0;padding-left:13px;border-left:1px dotted var(--line);}
.tree>ul{padding-left:0;border-left:none;}
.tree li{position:relative;}
.tree .nd{cursor:pointer;padding:1px 4px;border-radius:5px;display:inline-block;}
.tree .nd:hover{background:var(--panel2);}
.tree .nd.hit{background:var(--ink);color:var(--bg);}
.tree .cnt{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--ink2);margin-left:5px;}
.tree .nd.hit .cnt{color:var(--bg);opacity:.75;}
.tree .grp{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink2);}
.row{display:flex;align-items:center;gap:8px;margin:0 0 7px;}
.row label{flex:0 0 122px;font-family:'Space Mono',monospace;font-size:9.5px;color:var(--ink2);}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--ember);}
.row .val{flex:0 0 52px;text-align:right;font-family:'Space Mono',monospace;font-size:10px;}
.note{border-left:2px solid var(--ember);padding:5px 0 5px 9px;font-size:11px;line-height:1.5;
  color:var(--ink2);margin:0 0 9px;}
.note b{color:var(--ink);display:block;font-size:10px;font-family:'Space Mono',monospace;
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px;}
table.t{width:100%;border-collapse:collapse;font-size:11px;margin:0 0 9px;}
table.t th{text-align:left;font-family:'Space Mono',monospace;font-size:9px;font-weight:400;
  color:var(--ink2);text-transform:uppercase;letter-spacing:.07em;padding:3px 4px;border-bottom:1px solid var(--line);}
table.t td{padding:3px 4px;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent);}
table.t td.n{font-family:'Space Mono',monospace;text-align:right;}
.empty{font-size:11px;color:var(--ink2);font-style:italic;padding:5px 0;}
</style>
</head>
<body>
<div class="stage">

  <header>
    <div class="brand">GEWÄSSER-LABOR<small>b · Kacheln statt Flächenfarbe (Grund-Texturen: „Hex Tileset Pack", adythewolf/OpenGameArt, CC0)</small></div>
    <div class="hbtns">
      <button id="bMass" class="ghost">Maßstab: lesbar</button>
      <button id="bFlow" class="ghost">Fließrichtung</button>
      <button id="bSeit" class="ghost">Ufer-Seiten</button>
      <button id="bNight" class="ghost">☾</button>
      <button id="bPanel" class="ghost">Panel</button>
    </div>
  </header>

  <div class="wrap side" id="wrap">
    <div class="mapwrap">
      <svg id="map"></svg>
      <div class="hud" id="hud"></div>
      <div class="hint" id="hint"></div>
      <div class="zoombar">
        <button id="bZin">+</button><button id="bZout">−</button><button id="bFit" title="Ganze Karte">⤢</button>
      </div>
    </div>
    <aside class="panel" id="panel">
      <div class="tabs" id="tabs"></div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>

  <div class="tools" id="tools"></div>
  <div class="sub hid" id="sub"></div>

</div>

<script>
/* ============================================================================
   GEWÄSSER-LABOR v1
   ----------------------------------------------------------------------------
   Die Frage: Ein Hexfeld ist 1 km breit, ein Bach 3 m. Ein Feld als "Fluss"
   zu färben rendert einen 1 km breiten Fluss — falsch für alles unterhalb
   eines Stroms. Hier fließt das Wasser deshalb als BAND DURCH das Feld,
   von Kantenmitte zu Kantenmitte: gerade (Gegenkanten), gebogen (zwei
   Kanten Abstand) oder geknickt (Nachbarkanten). Was neben dem Band bleibt,
   ist Ufer — das Ufer wohnt damit IM Flussfeld, es braucht keine eigenen
   Uferfelder mehr.

   Zweite Idee: Die limnologische Benennung wird nicht gemalt, sondern
   GERECHNET. Fließgewässer aus dem Abfluss (Breite b = 6·√Q), Stillgewässer
   aus Fläche und Herkunft. Damit ist das Netz immer widerspruchsfrei:
   Bach + Bach = kleiner Fluss, eine Ausleitung macht den Fluss darunter
   wieder kleiner, und ein "Strom" heißt nur so, wenn er das Meer erreicht.
   ============================================================================ */

/* ---------- Debug-Parameter ---------- */
const Q = new URLSearchParams(location.search);
const qs = (k,d)=>Q.has(k)?(Q.get(k)===''?true:Q.get(k)):d;
const qn = (k,d)=>Q.has(k)?parseFloat(Q.get(k)):d;

/* ---------- Geometrie: pointy-top, odd-r offset (ungerade Reihen rechts) ---- */
const SQ3=Math.sqrt(3), HEXW=60, HEXH=HEXW*2/SQ3;   /* Modelleinheiten, Zoom über viewBox */
const MW=15, MH=18;                                  /* Kartengröße in Feldern */

/* Kantenindizes: 0=NO 1=O 2=SO 3=SW 4=W 5=NW  (Kante i liegt zwischen Ecke i und i+1) */
const NB_EVEN=[[0,-1],[1,0],[0,1],[-1,1],[-1,0],[-1,-1]];
const NB_ODD =[[1,-1],[1,0],[1,1],[0,1],[-1,0],[0,-1]];
const ENAME=['NO','O','SO','SW','W','NW'];
const opp=e=>(e+3)%6;

const cxOf=(c,r)=>(c+(r&1?0.5:0))*HEXW+HEXW/2;
const cyOf=(c,r)=>r*HEXH*0.75+HEXH/2;
function corners(c,r){const x=cxOf(c,r),y=cyOf(c,r);
  return [[x,y-HEXH/2],[x+HEXW/2,y-HEXH/4],[x+HEXW/2,y+HEXH/4],
          [x,y+HEXH/2],[x-HEXW/2,y+HEXH/4],[x-HEXW/2,y-HEXH/4]];}
function edgePt(c,r,e,t){const p=corners(c,r),a=p[e],b=p[(e+1)%6];
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];}
const edgeMid=(c,r,e)=>edgePt(c,r,e,0.5);
function nbOf(c,r,e){const d=(r&1?NB_ODD:NB_EVEN)[e];return [c+d[0],r+d[1]];}
function edgeTo(c,r,c2,r2){for(let e=0;e<6;e++){const n=nbOf(c,r,e);if(n[0]===c2&&n[1]===r2)return e;}return -1;}
const inMap=(c,r)=>c>=0&&r>=0&&c<MW&&r<MH;
const key=(c,r)=>c+','+r;
function cube(c,r){const x=c-((r-(r&1))>>1);return [x,-x-r,r];}
function hexDist(a,b){const A=cube(a[0],a[1]),B=cube(b[0],b[1]);
  return Math.max(Math.abs(A[0]-B[0]),Math.abs(A[1]-B[1]),Math.abs(A[2]-B[2]));}

/* Die Form, die ein Lauf im Feld hat — die drei Fälle der Aufgabenstellung. */
function laufForm(ein,aus){
  if(ein===null||aus===null) return {id:'ende',nm:ein===null?'Quelle / Eintritt':'Mündung / Austritt'};
  const d=Math.min((aus-ein+6)%6,(ein-aus+6)%6);
  if(d===3) return {id:'gerade',nm:'gerade'};
  if(d===2) return {id:'gebogen',nm:'gebogen (120°)'};
  return {id:'geknickt',nm:'geknickt (60°)'};
}

/* ============================================================================
   Die Systematik der Limnologie — und was Stromlinien davon braucht.
   Die Namen sind ABGELEITET: aus Breite (fließend) bzw. Fläche+Herkunft
   (stehend). Deshalb steht hier nur die Schwelle, nicht die Zuweisung.
   ============================================================================ */
const FLIESS=[
  {id:'rinnsal',nm:'Rinnsal',      bmax:0.5,  col:'--w0',ufer:.30,d:'Schmelz- und Regenwasser, das eben erst einen Weg gefunden hat. Trocknet aus.'},
  {id:'bach',   nm:'Bach',         bmax:5,    col:'--w1',ufer:.55,d:'Ständig wasserführend, überall zu durchwaten. 0,5 bis 5 m breit.'},
  {id:'kfluss', nm:'kleiner Fluss',bmax:10,   col:'--w2',ufer:.75,d:'5 bis 10 m. Durchwatbar nur an flachen Stellen, sonst nass bis zur Brust.'},
  {id:'gfluss', nm:'grosser Fluss',bmax:100,  col:'--w3',ufer:1.0,d:'Ab 10 m Breite. Trennt Ufer voneinander — die Furt wird zum Ort.'},
  {id:'strom',  nm:'Strom',        bmax:1e9,  col:'--w4',ufer:1.3,d:'Über 100 m und mündet ins Meer. Ohne Boot eine Grenze.'},
];
const KANAL={id:'kanal',nm:'Kanal',col:'--wk',ufer:.5,d:'Künstlich: gebaute Breite, gebautes Gefälle, meist gerade. Steile Ufer.'};

const STILL=[
  {id:'pfuetze',nm:'Pfütze', hamax:0.005,dauer:false,kuenstl:false,d:'Regenwasser in einer Mulde. Tage.'},
  {id:'tuempel',nm:'Tümpel', hamax:0.1,  dauer:false,kuenstl:false,d:'Temporär, aber mit eigenem Leben. Fällt im Sommer trocken.'},
  {id:'weiher', nm:'Weiher', hamax:1,    dauer:true, kuenstl:false,d:'Dauerhaft, flach, bis zum Grund durchlichtet — keine Sprungschicht.'},
  {id:'see',    nm:'See',    hamax:1e9,  dauer:true, kuenstl:false,d:'Mit Tiefenzonen und Sprungschicht. Eigenes Klima am Ufer.'},
  {id:'teich',  nm:'Teich',  hamax:1,    dauer:true, kuenstl:true, d:'Angelegt und ablassbar — Mühlteich, Fischteich.'},
  {id:'stausee',nm:'Stausee',hamax:1e9,  dauer:true, kuenstl:true, d:'Aufgestaut. Der Damm macht aus einem Lauf eine Fläche.'},
];
const byId=(arr,id)=>arr.find(x=>x.id===id);

/* Die Systematik als Baum — genau die Gliederung, die den Prototyp bestellt hat. */
const BAUM={nm:'Gewässer',kinder:[
  {nm:'Binnengewässer',kinder:[
    {nm:'Fließgewässer',kinder:[
      {nm:'natürlich',grp:1,kinder:[
        {nm:'Rinnsal',t:'rinnsal'},{nm:'Bach',t:'bach'},{nm:'kleiner Fluss',t:'kfluss'},
        {nm:'grosser Fluss',t:'gfluss'},{nm:'Strom',t:'strom'}]},
      {nm:'künstlich',grp:1,kinder:[{nm:'Kanal',t:'kanal'}]},
    ]},
    {nm:'Stillgewässer',kinder:[
      {nm:'natürlich',grp:1,kinder:[
        {nm:'Pfütze',t:'pfuetze'},{nm:'Tümpel',t:'tuempel'},{nm:'Weiher',t:'weiher'},{nm:'See',t:'see'}]},
      {nm:'künstlich',grp:1,kinder:[{nm:'Teich',t:'teich'},{nm:'Stausee',t:'stausee'}]},
    ]},
  ]},
]};

/* Merkmale — Orte, an denen ein Lauf sich anders verhält als seine Klasse. */
const MERKMAL={
  furt:   {nm:'Furt',        gl:'▨',d:'Flache, breite Stelle — meist in der verzweigten Strecke. Der Ort, an dem man hinüberkommt.'},
  schnell:{nm:'Stromschnelle',gl:'≋',d:'Steiles Gefälle über Blöcke. Schnell, laut, gefährlich.'},
  fall:   {nm:'Wasserfall',  gl:'⇊',d:'Absturz über eine Stufe. Weder quer noch längs passierbar.'},
  klamm:  {nm:'Klamm',       gl:'⋔',d:'Der Fluss hat sich eingeschnitten; die Wände sperren, nicht das Wasser.'},
  bruecke:{nm:'Brücke',      gl:'╤',d:'Gebauter Übergang. Hebt jede Sperre auf — auch die Klamm.'},
  steg:   {nm:'Steg',        gl:'┈',d:'Baumstamm oder Bohlen. Nur bis zum kleinen Fluss.'},
  damm:   {nm:'Damm',        gl:'▬',d:'Sperrt den Lauf und staut ihn zum Stausee auf.'},
};

/* ============================================================================
   Regelwerk — alles schiebbar, damit man am Gefühl feilen kann.
   ============================================================================ */
const R={
  qlok:0.20,          /* m³/s, den ein durchflossenes Feld selbst beisteuert */
  bfak:6.0,           /* Breite b = bfak·√Q  (hydraulische Geometrie) */
  nMan:0.040,         /* Manning-Rauheit für die Tiefen-/Geschwindigkeitsschätzung */
  braid:3.0,          /* Verzweigungsfaktor: um wieviel breiter die Furkation ist */
  jBraid:0.012,       /* darunter verzweigt sich ein breiter Lauf */
  jFall:0.120,        /* ab diesem Gefälle: Wasserfall */
  jSchnell:0.055,     /* ab diesem Gefälle: Stromschnelle */
  tvFurt:0.80,        /* Tiefe·Geschwindigkeit, unter der eine Furt entsteht */
  /* Eine Klamm ist mehr als ein Bach im Gebirge: die Flanken müssen deutlich
     steiler stehen als der allgemeine Hang, sonst wäre jedes Quellbachfeld
     eine Klamm (mit 80 m waren es genau das). */
  klammDh:150, klammN:4,
  stauH:130,          /* Stauhöhe über dem Dammfeld */
  hexKm:1.0,          /* Kantenlänge eines Feldes in km (Feldbreite) */
  reichw:6,           /* Reichweite des Menschen */
  modell:'klasse',    /* 'klasse' | 'hydraulik' */
  kost:{rinnsal:0,bach:1,kfluss:2,gfluss:3,strom:Infinity,kanal:2},
  kFurt:1, kSchnell:5, pSchnell:0.5,
  gel:{flach:1,aue:2,hang:2,berg:Infinity,see:Infinity,rand:Infinity},
};

/* Drei Textur-Kacheln aus dem CC0 'Hex Tileset Pack' (adythewolf, OpenGameArt.org) —
   20×20-Ausschnitte aus dem Spritesheet, als Muster wiederholt statt als ganzes Hex

  {c:8,r:10,kuenstl:false,ha:0.60,dauer:true, nm:'Der Weiher überm Tal'},
  {c:7,r:13,kuenstl:false,ha:0.04,dauer:false,nm:'Tümpel in der Aue'},

];

/* ---------- Zustand ---------- */
const S={
  runs:null, seen:null, klein:null, mark:null, meer:null,
  cells:new Map(),          /* key -> Feld */
  net:null,                 /* Ergebnis von netzRechnen() */
  sel:null,                 /* gewähltes Feld */

  reach:null,

  tab:qs('tab','feld'),

  flow:!!qs('fluss',false), seiten:!!qs('seiten',false),
  ufer:qs('ufer','1')!=='0', merk:qs('merkmale','1')!=='0',
  hi:null,                  /* hervorgehobene Klasse aus dem Katalog */
