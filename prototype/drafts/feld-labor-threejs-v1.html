     Gesucht wird bis zum GRÖSSEREN der beiden; die Trennung in Fläche und
     Linie passiert danach, beim Auslesen. */
  const decke = Math.max(P.heim, P.fern);
  wKosten[start] = 0;
  const h = new Halde(); h.rein(0, start);
  while (!h.leer) {
    const [k, i] = h.raus();
    if (k !== wKosten[i]) continue;   /* veralteter Eintrag — siehe oben, strikt */
    if (k > decke) continue;
    const r = (i / L.cols) | 0, c = i - r * L.cols;
    /* Die Kosten einer Kante sind das Mittel der beiden Felder — sonst ist
       der Sprung vom Fluss ans Bergland genauso billig wie der Fluss. */
    const tc = wGelaende(L, c, r);
    for (const nb of SOT.hex.neighbors(c, r)) {
      const t = wGelaende(L, nb.c, nb.r);
      if (t < 0) continue;
      const j = idx(nb.c, nb.r);
      const kn = k + (KOSTEN[t] + KOSTEN[tc < 0 ? t : tc]) / 2;
      if (kn < wKosten[j] && kn <= decke) { wKosten[j] = kn; wVorher[j] = i; h.rein(kn, j); }
    }
  }

  /* HEIM — die Fläche. */
  for (let i = 0; i < n; i++) if (wKosten[i] <= P.heim) wStand[i] = W_BEKANNT;

  /* FERN — die Linien. Jede erreichbare Landmarke zieht ihren Weg zurück zum
     Lager; der Weg ist bekannt, sein Rand nur gesehen. Genau hier steht der
     Unterschied zwischen „kennt den Umkreis" und „kennt einen Weg". */
  const s1 = seiteVon(L);
  for (const lm of (TS.landmarks || [])) {
    const [kx, ky] = kmVonLonLat(lm.lon, lm.lat);
    const [lc, lr] = zelleBeiKm(kx, ky, s1);
    if (lc < 0 || lr < 0 || lc >= L.cols || lr >= L.rows) continue;
    let i = idx(lc, lr);
    if (!(wKosten[i] <= P.fern)) continue;
    let schutz = 0;
    while (i >= 0 && schutz++ < 20000) {
      wStand[i] = W_BEKANNT;
      const r = (i / L.cols) | 0, c = i - r * L.cols;
      for (const nb of SOT.hex.neighbors(c, r)) {          /* der Sichtstreifen */
        if (wGelaende(L, nb.c, nb.r) < 0) continue;
        const j = idx(nb.c, nb.r);
        if (wStand[j] === W_NIE) wStand[j] = W_GESEHEN;
      }
      i = wVorher[i];
    }
  }

  /* SICHT — eine Breitensuche durch OFFENES Gelände. Kein Kreis: Bergland
     wird gesehen, aber nicht durchschaut, also endet die Suche dort. Mit einem
     Sichtkreis überstrahlte im Labor die Sicht alles und machte den
     Sesshaftigkeits-Einbruch unsichtbar; so hat der Nebel die Form der Grate,
     und die Karte sieht aus wie ein Tal, nicht wie ein Radar. */
  if (P.sicht > 0) {
    let rand = [];
    for (let i = 0; i < n; i++) if (wStand[i] === W_BEKANNT) rand.push(i);
    for (let schritt = 0; schritt < P.sicht && rand.length; schritt++) {
      const naechste = [];
      for (const i of rand) {
        const r = (i / L.cols) | 0, c = i - r * L.cols;
        for (const nb of SOT.hex.neighbors(c, r)) {
          const t = wGelaende(L, nb.c, nb.r);
          if (t < 0) continue;
          const j = idx(nb.c, nb.r);
          if (wStand[j] !== W_NIE) continue;
          wStand[j] = W_GESEHEN;
          if (t !== 2) naechste.push(j);      /* durch Bergland geht der Blick nicht weiter */
        }
      }
      rand = naechste;
    }
  }

  /* VERGESSEN — das Gedächtnis. Was einmal bekannt war und es nicht mehr ist,
     fällt nicht auf „nie" zurück, sondern behält seine Umrisse. Das ist der
     dritte Nebelzustand, und er kostet genau ein Uint8Array. */
  for (let i = 0; i < n; i++) {
    if (wStand[i] === W_NIE && wJeBekannt[i]) wStand[i] = W_VERGESSEN;
    if (wStand[i] === W_BEKANNT) wJeBekannt[i] = 1;
  }
  wZaehlungStellen();
}

function wZaehlungStellen() {
  const z = { nie:0, gesehen:0, bekannt:0, vergessen:0 };
  const L = wEbene, n = L.cols * L.rows;
  for (let i = 0; i < n; i++) {
    const s = wStand[i];
    if (s === W_BEKANNT) z.bekannt++;
    else if (s === W_GESEHEN) z.gesehen++;
    else if (s === W_VERGESSEN) z.vergessen++;
  }
  z.nie = n - z.bekannt - z.gesehen - z.vergessen;
  wZaehlung = z;
}

/* Von einem Feld IRGENDEINER Ebene auf sein Wissen. Über Kilometer, nicht über
   Indexarithmetik — die Ebenen sind Projektionen derselben Geokoordinaten und
   lassen sich nicht ineinander schachteln. */
function wissenBei(L, c, r) {
  if (!wStand) return W_BEKANNT;
  if (L.id === wEbene.id) {
    if (c < 0 || r < 0 || c >= L.cols || r >= L.rows) return W_NIE;
    return wStand[r * L.cols + c];
  }
  const [x, y] = mitteKm(c, r, seiteVon(L));
  const [wc, wr] = zelleBeiKm(x, y, seiteVon(wEbene));
  if (wc < 0 || wr < 0 || wc >= wEbene.cols || wr >= wEbene.rows) return W_NIE;
  return wStand[wr * wEbene.cols + wc];
}
const wissenIndex = (L, c, r) => {
  if (L.id === wEbene.id) return (c < 0 || r < 0 || c >= L.cols || r >= L.rows) ? -1 : r * L.cols + c;
  const [x, y] = mitteKm(c, r, seiteVon(L));
  const [wc, wr] = zelleBeiKm(x, y, seiteVon(wEbene));
  if (wc < 0 || wr < 0 || wc >= wEbene.cols || wr >= wEbene.rows) return -1;
  return wr * wEbene.cols + wc;
};

/* ============================================================================
   4 · Palette aus Tokens
   ========================================================================= */
let stil = null;
const tok = n => stil.getPropertyValue(n).trim();
const farbe = n => new THREE.Color(tok(n));
const farbenAus = ns => ns.map(farbe);
let PAL = null;
function paletteLesen() {
  stil = getComputedStyle(document.body);
  PAL = {
    gras:  farbenAus(['--d-gras-1','--d-gras-2','--d-gras-3','--d-gras-4','--d-gras-5']),
    wiese: farbenAus(['--d-wiese-1','--d-wiese-2','--d-wiese-3']),
    wald:  farbenAus(['--d-wald-boden-1','--d-wald-boden-2','--d-wald-boden-3']),
    hoch:  farbenAus(['--d-hoch-1','--d-hoch-2','--d-hoch-3']),
    sand:  farbenAus(['--d-sand-1','--d-sand-2','--d-sand-3']),
    kies:  farbenAus(['--d-sand-2','--d-sand-3','--d-sand-flanke']),
    flanke:{ gras:farbe('--d-flanke'), sand:farbe('--d-sand-flanke'), fels:farbe('--d-fels-2') },
    erde:  farbe('--d-erde'), erdeTief:farbe('--d-erde-tief'), strata:farbe('--d-strata'),
    fels:  farbenAus(['--d-fels-1','--d-fels-2','--d-fels-3']),
    wasser:farbe('--d-wasser'), wasserTief:farbe('--d-wasser-tief'),
    papier:farbe('--d-papier'), boden:farbe('--d-boden'),
    sonne: farbe('--d-sonne'), fuell:farbe('--d-fuell'), rueck:farbe('--d-rueck'),
    warm:  farbe('--d-warm'), kuehl:farbe('--d-kuehl'),
    karte: TERRAIN.map(t => farbe(t.tok)),
    nebel: farbe('--k-nebel')
  };
  if (typeof nebelFarbe !== 'undefined') nebelFarbe.value.copy(PAL.nebel);
}
function ton(liste, rnd, drift) {
  const i = Math.floor(rnd() * liste.length) % liste.length;
  const c = liste[i].clone();
  if (drift) {
    const j = (i + (rnd() < 0.5 ? 1 : liste.length - 1)) % liste.length;
    c.lerp(liste[j], rnd() * drift);
  }
  return c;
}
const dunkler = (c, f) => c.clone().multiplyScalar(f);

const LICHT = {
  morgen: { sonne:1.95, fuell:1.40, rueck:0.60, azimut:-100, hoehe:22, belichtung:1.02 },
  mittag: { sonne:2.40, fuell:1.25, rueck:0.55, azimut: -72, hoehe:50, belichtung:1.00 },
  abend:  { sonne:2.10, fuell:1.30, rueck:0.62, azimut: -45, hoehe:18, belichtung:1.05 },
  nacht:  { sonne:0.50, fuell:1.45, rueck:0.22, azimut: -85, hoehe:42, belichtung:1.12 }
};

/* ============================================================================
   5 · Der Bauplan (uebernommen aus `plaettchen-pfade-v1`)

   Alles wird in FLACHE Felder geschrieben und am Ende zu je einer Geometrie
   verschmolzen: eine ganze Kachel kostet EINEN Zeichenaufruf, nicht 1024.
   Flaechennormalen werden hier gerechnet, nicht interpoliert — damit ist die
   Facettierung eingebaut und `flatShading` unnoetig.
   ========================================================================= */
class Bauplan {
  constructor() { this.p = []; this.n = []; this.c = []; this.f = []; this.anz = 0;
                  this.bereiche = []; }
  /* Vor den Dreiecken EINES Feldes ansagen, zwischen welchen zwei Hoehen es
     liegt. Daraus faellt fuer jede Ecke ihre FLACHE Hoehe ab — die Hoehe, die
     sie haette, wenn das Gelaende abgeschaltet ist: Deckflaeche auf 0, Boden
     auf -Lippe, alles dazwischen anteilig. Ein Feld behaelt damit im flachen
     Zustand seine Kante; es wird ein Plaettchen auf dem Tisch, kein Anstrich
     auf einer Platte. */
  zelle(yTop, unten, lippe, wIdx) {
    this.zTop = yTop; this.zUnten = unten; this.zLip = lippe;
    this.zSpanne = (yTop - unten) || 1e-9;
    /* Wo im Puffer dieses Feld anfaengt und wohin es im Wissensfeld zeigt.
       Damit laesst sich das Wissen spaeter NEU SCHREIBEN, ohne die Geometrie
       anzufassen: das Lager zu verschieben kostet einen Lauf ueber diese
       Liste, nicht einen Neubau der Kachel. */
    if (this.offen) this.offen.bis = this.p.length / 3;
    this.offen = { von: this.p.length / 3, bis: this.p.length / 3, wIdx };
    this.bereiche.push(this.offen);
  }
  flachVon(vy) {
    return this.zLip * ((vy - this.zUnten) / this.zSpanne - 1);
  }
  dreieck(A, B, C, cA, cB, cC) {
    const ux = B[0]-A[0], uy = B[1]-A[1], uz = B[2]-A[2];
    const vx = C[0]-A[0], vy = C[1]-A[1], vz = C[2]-A[2];
    let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    const l = Math.hypot(nx, ny, nz) || 1; nx/=l; ny/=l; nz/=l;
    this.p.push(A[0],A[1],A[2], B[0],B[1],B[2], C[0],C[1],C[2]);
    this.n.push(nx,ny,nz, nx,ny,nz, nx,ny,nz);
    this.c.push(cA.r,cA.g,cA.b, cB.r,cB.g,cB.b, cC.r,cC.g,cC.b);
    this.f.push(this.flachVon(A[1]), this.flachVon(B[1]), this.flachVon(C[1]));
    this.anz++;
  }
  viereck(A, B, C, D, cA, cB, cC, cD) {
    this.dreieck(A, B, C, cA, cB, cC);
    this.dreieck(A, C, D, cA, cC, cD);
  }
  leer() { return this.anz === 0; }
  geometrie() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal',   new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('color',    new THREE.Float32BufferAttribute(this.c, 3));
    /* Die zweite Hoehe reist als eigenes Attribut mit. Das ist der ganze Grund,
       warum das Ein- und Ausschalten der Hoehe nichts kostet: es wird nichts
       neu gebaut und nichts hochgeladen — der Vertex-Shader mischt zwischen
       zwei Zahlen, die beide schon auf der Karte liegen. */
    g.setAttribute('aFlach',   new THREE.Float32BufferAttribute(this.f, 1));
    /* Zwei Wissensfelder — das, von dem wir kommen, und das, zu dem wir gehen.
       Ein Uniform blendet dazwischen, und darum ist das Verschieben des Lagers
       eine BEWEGUNG und kein Umspringen. */
    const anzV = this.p.length / 3;
    g.setAttribute('aWissenA', new THREE.Float32BufferAttribute(new Float32Array(anzV), 1));
    g.setAttribute('aWissenB', new THREE.Float32BufferAttribute(new Float32Array(anzV), 1));
    g.computeBoundingSphere();
    return g;
  }
  fertig() { if (this.offen) this.offen.bis = this.p.length / 3; return this.bereiche; }
}

/* ============================================================================
   6 · Die Kachel als Baueinheit

   Eine Kachel ist 32x32 Zellen — dieselbe Einheit, in der die Pipeline liefert.
   Das ist kein Zufall und keine Bequemlichkeit: die Einheit, in der Daten
   ankommen, ist die einzige Einheit, in der man sie sinnvoll wieder wegwirft.
   Ein anderer Zuschnitt haette bedeutet, dass ein Auswurf immer nur Teile
   einer geladenen Kachel freigibt.

   `bauen()` liefert ein Objekt mit einer `gruppe` (three) und einer Angabe,
   auf welcher Stufe es gebaut wurde. Aendert sich die Stufe, wird neu gebaut —
   nicht umgeschaltet. Eine Kachel haelt genau eine Fassung ihrer selbst.
   ========================================================================= */
const FASE = 0.11, FALL = 0.035;   /* wie in der Arena, in Anteilen der Hexbreite */
const LIPPE_FLACH = 0.14;          /* Dicke jedes Plaettchens, wenn die Hoehe aus ist */

function nachbarHoehen(L, c, r) {
  const h = {};
  for (const n of SOT.hex.neighbors(c, r)) {
    const d = zelleLesen(L, n.c, n.r);
    h[n.dir] = d ? hoeheKm(d.e) : null;
  }
  return h;
}

function kachelBauen(L, tx, ty, stufe) {
  const roh = kachelRoh(L, tx, ty);
  if (!roh) return null;
  const s = seiteVon(L);
  const rad = s;                 /* Umkreisradius = Seitenlaenge */
  const ao = P.ao / 100;
  const nah = stufe === 'nah';
  const land = new Bauplan(), wasser = new Bauplan();
  const c0 = tx * L.tile, r0 = ty * L.tile;

  for (let j = 0; j < L.tile; j++)
    for (let i = 0; i < L.tile; i++) {
      const c = c0 + i, r = r0 + j;
      if (c >= L.cols || r >= L.rows) continue;
      const idx = j * L.tile + i;
      const t = roh.t[idx], e = roh.e ? roh.e[idx] : 0;
      /* Eine Zelle ohne Gelaende UND ohne Hoehe ist Nichts, nicht Flachland —
         sonst pflastert das Labor die halbe Nordsee mit Wiese zu. */
      if (!t && !e) continue;
      const T = TERRAIN[t] || TERRAIN[0];
      const [mx, mz] = mitteKm(c, r, s);
      const y = hoeheKm(e);
      const rnd = rngFeld(c, r, 2);

      /* Kontakt: eine Kante, hinter der es HOEHER weitergeht, verschattet ihre
         zwei Ecken. Das ist der Ersatz fuer SSAO — billig, steuerbar, und der
         halbe Grund, warum die Kacheln gemalt aussehen. Bei echtem Gelaende
         zeichnet er ausserdem die Gratlinien nach, ohne dass jemand Grate
         berechnet haette. */
      const dunkel = [1,1,1,1,1,1];
      let tiefsterNachbar = y;
      const nh = nachbarHoehen(L, c, r);
      for (const dir in nh) {
        const gh = nh[dir];
        if (gh === null) continue;
        if (gh < tiefsterNachbar) tiefsterNachbar = gh;
        const kante = KANTE_VON_DIR[dir];
        const d = gh - y;
        if (d > 0.0006) {
          const sv = 1 - Math.min(0.34, d / (rad * 2.2)) * ao;
          dunkel[kante] = Math.min(dunkel[kante], sv);
          dunkel[(kante + 1) % 6] = Math.min(dunkel[(kante + 1) % 6], sv);
        }
      }
      /* Die Schuerze reicht bis unter den TIEFSTEN Nachbarn. Eine feste
         Unterkante wie in der Arena geht hier nicht: dort liegen alle
         Plaettchen auf einem Tisch, hier steht ein Tal mit 3 000 Metern
         Unterschied, und eine feste Unterkante waere entweder ein Loch am
         Grat oder eine Saeule ueber dem halben Bild.

         Zwei Zahlen, beide am Bild getunt und beide notwendig:

         Die LIPPE (0.08) ist alles, was ebenes Land bekommt. Mit den 0.45 aus
         dem ersten Wurf stand bei 344 px/Hex auch auf der Talsohle eine
         155-px-Wand um jedes Feld — das Brett las sich als Schlucht, und der
         Fehler war nicht das Gelaende, sondern die Schuerze.

         Die KLEMME (3 rad) deckelt die Gegenrichtung: an einer Felskante
         faellt das Gelaende ueber 400 m Feldbreite auch mal 800 m, und ohne
         Klemme waere die Flanke sechs Hexbreiten hoch — eine Saeule, die ihre
         eigenen Nachbarn verdeckt. Verdeckt wird sie ohnehin von der Kachel
         darunter; sichtbar ist nur der oberste Teil. */
      const unten = Math.max(tiefsterNachbar - rad * 0.08, y - rad * 3);

      const eck = ECKEINHEIT.map(([ex, ez]) => [mx + ex * rad, mz + ez * rad]);
      const bau = T.wasser ? wasser : land;
      /* Die flache Lippe ist fuer ALLE Felder gleich — das ist der Punkt des
         flachen Zustands: die Hoehe sagt nichts mehr, also darf sie auch nicht
         mehr durch die Dicke sprechen. */
      bau.zelle(y, unten, rad * LIPPE_FLACH, wissenIndex(L, c, r));

      if (T.wasser) {
        /* Wasser ist eine FLAECHE, kein Koerper: ein Spiegel plus eine
           Schuerze in Tiefton. Zwei Toene genuegen — der Spiegel eines Sees
           liegt auf einer Hoehe, die Farbe unterscheidet nur, wie tief
           darunter der Boden liegt. */
        const cOben = PAL.wasser.clone().lerp(PAL.wasserTief, Math.min(0.8, rnd() * 0.35));
        const mitte = [mx, y, mz];
        for (let k = 0; k < 6; k++) {
          const k2 = (k + 1) % 6;
          bau.dreieck(mitte, [eck[k][0], y, eck[k][1]], [eck[k2][0], y, eck[k2][1]],
                      cOben, cOben, cOben);
        }
        for (let k = 0; k < 6; k++) {
          const k2 = (k + 1) % 6;
          bau.viereck([eck[k][0],y,eck[k][1]], [eck[k][0],unten,eck[k][1]],
                      [eck[k2][0],unten,eck[k2][1]], [eck[k2][0],y,eck[k2][1]],
                      cOben, PAL.wasserTief, PAL.wasserTief, cOben);
        }
        continue;
      }

      const listeOben = { gras:PAL.gras, wiese:PAL.wiese, wald:PAL.wald, hoch:PAL.hoch,
                          sand:PAL.sand, kies:PAL.kies }[T.oben] || PAL.gras;
      const fOben = [0,1,2,3,4,5].map(k => dunkler(ton(listeOben, rnd, 0.45), dunkel[k]));
      const fMitte = ton(listeOben, rnd, 0.3);

      if (nah) {
        /* Fase: die Deckflaeche sitzt auf einem eingezogenen Ring, der Ring
           faellt ein Stueck ab. Ein Segment genuegt — der Grat faengt das
           Licht. Nur auf der nahen Stufe: bei 20 px je Hex kostet die Fase
           zwei Drittel der Dreiecke und traegt nichts. */
        const innen = eck.map(([x, z]) => [mx + (x - mx) * (1 - FASE), y, mz + (z - mz) * (1 - FASE)]);
        const aussen = eck.map(([x, z]) => [x, y - FALL * rad, z]);
        for (let k = 0; k < 6; k++) {
          const k2 = (k + 1) % 6;
          bau.dreieck([mx, y, mz], innen[k], innen[k2], fMitte, fOben[k], fOben[k2]);
        }
        for (let k = 0; k < 6; k++) {
          const k2 = (k + 1) % 6;
          bau.viereck(innen[k], aussen[k], aussen[k2], innen[k2],
            dunkler(fOben[k], 0.93), dunkler(fOben[k], 0.8),
            dunkler(fOben[k2], 0.8), dunkler(fOben[k2], 0.93));
        }
        /* Flanke in zwei Baendern — das mittlere darf Gestein zeigen. Die
           OBERE bleibt Gras, auch bei Gestein: sonst hat der Berg einen grauen
           Kragen direkt unter seiner gruenen Decke. */
        const stein = T.flanke === 'fels';
        const oben = stein ? PAL.flanke.gras : (PAL.flanke[T.flanke] || PAL.flanke.gras);
        const yTeil = 0.52;
        for (let k = 0; k < 6; k++) {
          const k2 = (k + 1) % 6;
          const yT = aussen[k][1], yM = unten + (yT - unten) * yTeil;
          /* Das Gestein ist ein ANFLUG in der Erde, keine Betonwand. */
          const cM = stein ? PAL.erde.clone().lerp(PAL.strata, 0.20 + rnd() * 0.22)
                           : PAL.erde.clone().lerp(oben, 0.18);
          const s1 = 1 - 0.16 * ao, s2 = 1 - 0.46 * ao;
          bau.viereck([aussen[k][0],yT,aussen[k][2]], [aussen[k][0],yM,aussen[k][2]],
                      [aussen[k2][0],yM,aussen[k2][2]], [aussen[k2][0],yT,aussen[k2][2]],
                      dunkler(oben, dunkel[k]), dunkler(cM, s1),
                      dunkler(cM, s1), dunkler(oben, dunkel[k2]));
          bau.viereck([aussen[k][0],yM,aussen[k][2]], [aussen[k][0],unten,aussen[k][2]],
                      [aussen[k2][0],unten,aussen[k2][2]], [aussen[k2][0],yM,aussen[k2][2]],
                      dunkler(cM, s1), dunkler(PAL.erdeTief, s2),
                      dunkler(PAL.erdeTief, s2), dunkler(cM, s1));
        }
      } else {
        /* MITTEL: Deckflaeche und EIN Flankenband. Dieselbe Kontaktverschattung,
           dieselben Toene — was wegfaellt, ist die Fase und die Zweiteilung der
           Flanke, also genau das, was man bei 20 px ohnehin nicht sieht. */
        for (let k = 0; k < 6; k++) {
          const k2 = (k + 1) % 6;
          bau.dreieck([mx, y, mz], [eck[k][0], y, eck[k][1]], [eck[k2][0], y, eck[k2][1]],
                      fMitte, fOben[k], fOben[k2]);
        }
        const oben = PAL.flanke[T.flanke] || PAL.flanke.gras;
        const s2 = 1 - 0.46 * ao;
        for (let k = 0; k < 6; k++) {
          const k2 = (k + 1) % 6;
          bau.viereck([eck[k][0],y,eck[k][1]], [eck[k][0],unten,eck[k][1]],
                      [eck[k2][0],unten,eck[k2][1]], [eck[k2][0],y,eck[k2][1]],
                      dunkler(oben, dunkel[k]), dunkler(PAL.erdeTief, s2),
                      dunkler(PAL.erdeTief, s2), dunkler(oben, dunkel[k2]));
        }
      }
    }

  const gruppe = new THREE.Group();
  let dreiecke = 0;
  const netze = [];
  if (!land.leer()) {
    const m = new THREE.Mesh(land.geometrie(), matGelaende);
    m.castShadow = true; m.receiveShadow = true;
    m.customDepthMaterial = matTiefe;
    m.__bereiche = land.fertig();
    gruppe.add(m); netze.push(m); dreiecke += land.anz;
  }
  if (!wasser.leer()) {
    const m = new THREE.Mesh(wasser.geometrie(), matWasser);
    m.receiveShadow = true;
    m.customDepthMaterial = matTiefe;
    m.__bereiche = wasser.fertig();
    gruppe.add(m); netze.push(m); dreiecke += wasser.anz;
  }
  const eintrag = { gruppe, stufe, dreiecke, netze };
  wissenSchreiben(eintrag, true);
  return eintrag;
}

/* Das Wissen einer gebauten Kachel neu schreiben. `beide` heisst: A und B auf
   denselben Stand setzen — das gilt fuer eine Kachel, die MITTEN in einer
   Bewegung neu dazukommt; sie soll nicht nachtraeglich losfahren, sondern
   dort stehen, wo die anderen schon sind. */
function wissenSchreiben(eintrag, beide) {
  if (!eintrag.netze) return;
  for (const m of eintrag.netze) {
    const A = m.geometry.getAttribute('aWissenA'), B = m.geometry.getAttribute('aWissenB');
    if (!A || !B) continue;
    for (const b of m.__bereiche) {
      const v = b.wIdx < 0 ? W_MISCHUNG[W_NIE] : W_MISCHUNG[wStand ? wStand[b.wIdx] : W_BEKANNT];
      for (let i = b.von; i < b.bis; i++) { if (beide) A.array[i] = v; B.array[i] = v; }
    }
    if (beide) A.needsUpdate = true;
    B.needsUpdate = true;
  }
}
/* Vor einem Wechsel den JETZIGEN Stand nach A retten — auch mitten in einer
   laufenden Bewegung. Sonst springt ein zweiter Klick auf den Anfangswert
   zurueck, und das sieht aus wie ein Fehler, weil es einer ist. */
function wissenEinfrieren() {
  const t = wissenT.value;
  for (const e of gebaut.values()) {
    if (!e.netze) continue;
    for (const m of e.netze) {
      const A = m.geometry.getAttribute('aWissenA'), B = m.geometry.getAttribute('aWissenB');
      if (!A || !B) continue;
      for (let i = 0; i < A.array.length; i++) A.array[i] += (B.array[i] - A.array[i]) * t;
      A.needsUpdate = true;
    }
  }
}

/* ---------------------------------------------------------------------------
   FERN: die Kachel als EIN Rechteck mit einer gemalten Textur.

   Die Sechsecke werden in eine 2D-Leinwand gemalt — derselbe Weg, den
   `rhein-tiles-v4` fuer die ganze Karte geht. Das ist hier kein Rueckschritt,
   sondern die richtige Antwort: unter 12 px je Hex ist ein Sechseck ein
   Farbfleck, und ein Farbfleck ist in einer Textur billiger als in Geometrie.
   Die Hoehenschummerung ersetzt dabei die Hoehe — das Relief bleibt LESBAR,
   auch wenn es flach liegt.
   --------------------------------------------------------------------------- */
const PXPROZELLE = 6;
function fernBauen(L, tx, ty) {
  const roh = kachelRoh(L, tx, ty);
  if (!roh) return null;
  const s = seiteVon(L);
  const c0 = tx * L.tile, r0 = ty * L.tile;
  /* Die km-Ausdehnung der Kachel, mit einer halben Zelle Rand: die odd-r-Reihen
     stehen versetzt, die aeusserste Spalte ragt also ueber. */
  const x0 = mitteKm(c0, r0, s)[0] - s * SQRT3 / 2 - s * SQRT3 / 2;
  const z0 = mitteKm(c0, r0, s)[1] - s;
  const x1 = mitteKm(c0 + L.tile, r0 + 1, s)[0] + s * SQRT3 / 2;
  const z1 = mitteKm(c0, r0 + L.tile, s)[1] + s;
  const wKm = x1 - x0, hKm = z1 - z0;

  const pxProKm = PXPROZELLE / L.hexKm;
  const cv = document.createElement('canvas');
  cv.width = Math.max(2, Math.round(wKm * pxProKm));
  cv.height = Math.max(2, Math.round(hKm * pxProKm));
  const g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);

  const rad = s * pxProKm;
  for (let j = 0; j < L.tile; j++)
    for (let i = 0; i < L.tile; i++) {
      const c = c0 + i, r = r0 + j;
      if (c >= L.cols || r >= L.rows) continue;
      const idx = j * L.tile + i;
      const t = roh.t[idx], e = roh.e ? roh.e[idx] : 0;
      if (!t && !e) continue;
      const col = PAL.karte[t] || PAL.karte[0];
      /* Hoehenschummerung aufs Land — Wasser bleibt Wasser, sonst leuchtet der
         Bodensee wie ein Gletscher. */
      let cc = col.clone();
      if (e && !(TERRAIN[t] || TERRAIN[0]).wasser) {
        const m = METER(e);
        cc.lerp(new THREE.Color(1, 1, 1), 0.04 + 0.30 * Math.min(1, Math.max(0, (m - 400) / 2600)));
      }
      const [mx, mz] = mitteKm(c, r, s);
      const px = (mx - x0) * pxProKm, py = (mz - z0) * pxProKm;
      g.beginPath();
      for (let k = 0; k < 6; k++) {
        const X = px + ECKEINHEIT[k][0] * rad, Y = py + ECKEINHEIT[k][1] * rad;
        if (k === 0) g.moveTo(X, Y); else g.lineTo(X, Y);
      }
      g.closePath();
      /* Ein Haarstrich derselben Farbe schliesst die Fugen: ohne ihn zeigt die
         Textur ein Gitter aus Papier, und das liest sich als Raster, nicht als
         Land. */
      g.fillStyle = g.strokeStyle = '#' + cc.getHexString();
      g.lineWidth = 1; g.fill(); g.stroke();
    }

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.generateMipmaps = true;
  tex.anisotropy = maxAniso;
  const mat = new THREE.MeshBasicMaterial({ map:tex, transparent:true, depthWrite:true });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(wKm, hKm), mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.set(x0 + wKm / 2, 0, z0 + hKm / 2);
  const gruppe = new THREE.Group();
  gruppe.add(mesh);
  return { gruppe, stufe:'fern', dreiecke:2, tex, mat };
}

/* ============================================================================
   7 · Der Kachelspeicher — bauen, halten, AUSWERFEN

   Das ist die Haelfte des Labors, die "Millionen" ueberhaupt beantwortet.
   Gehalten wird nach dem zuletzt gesehenen Bild; wer aus dem Blick faellt und
   ueber dem Budget liegt, wird abgeraeumt — Geometrien und Texturen einzeln,
   denn three gibt GPU-Speicher nicht von selbst zurueck.
   ========================================================================= */
const gebaut = new Map();     /* "ebene:tx,ty" -> {gruppe, stufe, dreiecke, gesehen} */
let bildNr = 0, gebautZaehler = 0, ausgeworfen = 0;

function eintragWeg(key) {
  const e = gebaut.get(key);
  if (!e) return;
  welt.remove(e.gruppe);
  e.gruppe.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material && o.material.map) o.material.map.dispose();
    /* Die geteilten Materialien (`matGelaende`, `matWasser`) duerfen NICHT
       entsorgt werden — nur die, die diese Kachel sich selbst gemacht hat. */
    if (o.material && o.material.__eigen) o.material.dispose();
  });
  gebaut.delete(key);
  ausgeworfen++;
}

function kachelHolen(L, tx, ty, stufe) {
  const key = L.id + ':' + tx + ',' + ty;
  const alt = gebaut.get(key);
  if (alt && alt.stufe === stufe) { alt.gesehen = bildNr; return alt; }
  if (alt) eintragWeg(key);
  const neu = stufe === 'fern' ? fernBauen(L, tx, ty) : kachelBauen(L, tx, ty, stufe);
  if (!neu) { return null; }
  if (neu.mat) neu.mat.__eigen = true;
  neu.gesehen = bildNr;
  gebaut.set(key, neu);
  welt.add(neu.gruppe);
  gebautZaehler++;
  return neu;
}

function aufraeumen() {
  if (gebaut.size <= P.kacheln) return;
  const liste = [...gebaut.entries()].sort((a, b) => a[1].gesehen - b[1].gesehen);
  let weg = gebaut.size - P.kacheln;
  for (const [key, e] of liste) {
    if (weg <= 0) break;
    if (e.gesehen === bildNr) continue;   /* was gerade im Bild steht, bleibt */
    eintragWeg(key); weg--;
  }
}

/* ============================================================================
   8 · Renderer, Licht, Nachbearbeitung (uebernommen)
   ========================================================================= */
const leinwand = document.getElementById('gl');
const buehne = document.getElementById('buehne');
let renderer, scene, welt, kamera, sonne, fuell, rueck, maxAniso = 1;
let matGelaende, matWasser, matTiefe, hoehenRegler = { value:0 };
const wissenLinse = { value:0 }, wissenT = { value:1 }, nebelFarbe = { value:new THREE.Color(1,1,1) };
let matHell, matBlur, matEnde, quad, quadScene, quadCam;
let rtScene, rtA, rtB;

function rendererBauen() {
  renderer = new THREE.WebGLRenderer({
    canvas:leinwand, antialias:true, alpha:false, preserveDrawingBuffer:!!P.still
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  /* `PCFSoftShadowMap` ist in r185 abgekuendigt und faellt still auf PCF
     zurueck — "weich" haette gar nichts getan. Weiche Schatten kommen aus VSM. */
  renderer.shadowMap.enabled = P.schatten !== 'aus';
  renderer.shadowMap.type = P.schatten === 'weich' ? THREE.VSMShadowMap : THREE.PCFShadowMap;
  maxAniso = renderer.capabilities.getMaxAnisotropy();

  scene = new THREE.Scene();
  welt = new THREE.Group(); scene.add(welt);
  kamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 4000);

  sonne = new THREE.DirectionalLight(0xffffff, 1);
  sonne.castShadow = true;
  sonne.shadow.mapSize.set(2048, 2048);
  sonne.shadow.bias = -0.0012; sonne.shadow.normalBias = 0.02;
  sonne.shadow.radius = 2; sonne.shadow.blurSamples = 10;
  scene.add(sonne, sonne.target);
  fuell = new THREE.HemisphereLight(0xffffff, 0x888888, 1); scene.add(fuell);
  rueck = new THREE.DirectionalLight(0xffffff, 0.2); scene.add(rueck);

  /* ---------------------------------------------------------------------
     Die Hoehe ist ein REGLER im Vertex-Shader, kein Neubau.

     `uFlach` laeuft von 0 (wahres Gelaende) bis 1 (alles auf einer Ebene).
     Jede Ecke kennt beide Hoehen — ihre eigene in `position.y`, ihre flache in
     `aFlach` —, der Shader mischt. Damit kostet das Umschalten NICHTS: kein
     Neubau, kein Hochladen, keine neuen Kacheln, und es laeuft auch mitten in
     einer Bewegung fluessig weiter.

     Die Normalen bleiben dabei richtig, und das ist kein Glueck, sondern die
     Geometrie: ein Feld ist ein PRISMA. Unter einer reinen y-Stauchung bleibt
     eine waagerechte Normale waagerecht und eine senkrechte senkrecht — die
     Flanken sind in beiden Zustaenden senkrecht, die Deckflaechen in beiden
     waagerecht. Nur der Fasenring kippt ein wenig, und der kippt in die
     richtige Richtung.
     --------------------------------------------------------------------- */
  hoehenRegler = { value: P.hoehe ? 0 : 1 };
  /* Der Endzustand der Mischung wird aus DREI Zahlen gerechnet, und die
     Reihenfolge ist eine Aussage:

       wm = mix(aWissenA, aWissenB, uWissenT) * uLinse   je Feld
       f  = max(uFlach, wm)                              der flache Schalter
                                                         gewinnt immer

     Der flache Schalter ist ein Werkzeug ueber allem — er sagt „zeig mir die
     Klassifikation", und darauf hat das Wissen keinen Einwand. Die Linse
     dagegen sagt „zeig mir, was wir kennen", und das ist eine Aussage je Feld. */
  const hoeheEinbauen = (mat, mitFarbe) => {
    mat.onBeforeCompile = shader => {
      shader.uniforms.uFlach = hoehenRegler;
      shader.uniforms.uLinse = wissenLinse;
      shader.uniforms.uWissenT = wissenT;
      shader.vertexShader =
        'attribute float aFlach;\nattribute float aWissenA;\nattribute float aWissenB;\n' +
        'uniform float uFlach;\nuniform float uLinse;\nuniform float uWissenT;\n' +
        'varying float vNebel;\n' +
        shader.vertexShader.replace('#include <begin_vertex>',
          'float wm = mix( aWissenA, aWissenB, uWissenT ) * uLinse;\n' +
          'vNebel = wm;\n' +
          'vec3 transformed = vec3( position );\n' +
          'transformed.y = mix( position.y, aFlach, max( uFlach, wm ) );');
      if (mitFarbe) {
        /* Flach allein genuegt nicht: unbegangenes Land waere sonst eine
           saftige Wiese ohne Relief, und das liest sich als Weide, nicht als
           Unwissen. Der Nebel nimmt ihm die Farbe, nicht nur die Hoehe. */
        shader.uniforms.uNebel = nebelFarbe;
        shader.fragmentShader = 'uniform vec3 uNebel;\nvarying float vNebel;\n' +
          shader.fragmentShader.replace('#include <color_fragment>',
            '#include <color_fragment>\n' +
            'diffuseColor.rgb = mix( diffuseColor.rgb, uNebel, vNebel * 0.86 );');
      }
    };
    /* Ohne eigenen Cache-Schluessel steckt three dieses Material mit einem
       gleich konfigurierten ohne Einbau in dasselbe Programm — dann haengt am
       Ende ein Shader ohne `aFlach` an der Geometrie und nichts bewegt sich. */
    mat.customProgramCacheKey = () => 'hoehe' + (mitFarbe ? 'F' : '');
    return mat;
  };

  matGelaende = hoeheEinbauen(new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.92, metalness:0 }), true);
  /* Glatt und leicht spiegelnd — das ist der ganze Unterschied zum Gelaende,
     und er genuegt. `DoubleSide`, weil man bei flachem Blick unter den Spiegel
     schaut, wenn ein Ufer davor hoeher liegt. */
  matWasser = hoeheEinbauen(new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:0.22, metalness:0.04,
    transparent:true, opacity:0.92, side:THREE.DoubleSide }), true);

  /* Der Schattenwurf rechnet in einem EIGENEN Material. Ohne denselben Einbau
     bliebe der Schatten am wahren Relief stehen, waehrend das Gelaende
     zusammensinkt — Schatten von Bergen, die nicht mehr da sind. */
  matTiefe = hoeheEinbauen(new THREE.MeshDepthMaterial({
    depthPacking: THREE.RGBADepthPacking }));

  /* Nachbearbeitung. RawShaderMaterial, damit three NICHTS anhaengt — keine
     Tonwertabbildung, keine Farbraumwandlung. Der letzte Durchgang macht
     beides selbst; sonst waere das Bild doppelt kodiert. */
  const vs = 'attribute vec3 position; varying vec2 vUv;' +
    'void main(){ vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }';
  const roh = (fs, uni) => new THREE.RawShaderMaterial({
    vertexShader:vs, fragmentShader:fs, uniforms:uni, depthTest:false, depthWrite:false });

  matHell = roh([
    'precision highp float; varying vec2 vUv;',
    'uniform sampler2D tBild; uniform float uSchwelle;',
    'void main(){ vec3 c = texture2D(tBild, vUv).rgb;',
    '  float l = max(max(c.r, c.g), c.b);',
    '  gl_FragColor = vec4(c * smoothstep(uSchwelle, uSchwelle + 0.7, l), 1.0); }'
  ].join('\n'), { tBild:{ value:null }, uSchwelle:{ value:1.05 } });

  matBlur = roh([
    'precision highp float; varying vec2 vUv;',
    'uniform sampler2D tBild; uniform vec2 uRichtung;',
    'void main(){',
    '  vec3 s = texture2D(tBild, vUv).rgb * 0.2270;',
    '  s += (texture2D(tBild, vUv + uRichtung*1.3846).rgb + texture2D(tBild, vUv - uRichtung*1.3846).rgb) * 0.3162;',
    '  s += (texture2D(tBild, vUv + uRichtung*3.2308).rgb + texture2D(tBild, vUv - uRichtung*3.2308).rgb) * 0.0702;',
    '  gl_FragColor = vec4(s, 1.0); }'
  ].join('\n'), { tBild:{ value:null }, uRichtung:{ value:new THREE.Vector2() } });

  matEnde = roh([
    'precision highp float; varying vec2 vUv;',
    'uniform sampler2D tBild, tGlut; uniform vec2 uPixel;',
    'uniform float uBelichtung, uGlut, uSaettigung, uScharf, uVignette;',
    'uniform vec3 uWarm, uKuehl;',
    'vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }',
    'vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(max(c, vec3(1e-5)), vec3(1.0/2.4)) - 0.055, step(vec3(0.0031308), c)); }',
    'void main(){',
    '  vec3 c = texture2D(tBild, vUv).rgb;',
    '  vec3 u = texture2D(tBild, vUv + vec2(uPixel.x, 0.0)).rgb',
    '         + texture2D(tBild, vUv - vec2(uPixel.x, 0.0)).rgb',
    '         + texture2D(tBild, vUv + vec2(0.0, uPixel.y)).rgb',
    '         + texture2D(tBild, vUv - vec2(0.0, uPixel.y)).rgb;',
    '  c += (c - u * 0.25) * uScharf;',
    '  c += texture2D(tGlut, vUv).rgb * uGlut;',
    '  c = aces(c * uBelichtung);',
    '  float l = dot(c, vec3(0.2126, 0.7152, 0.0722));',
    '  c *= mix(uKuehl, uWarm, smoothstep(0.16, 0.86, l));',
    '  c = mix(vec3(l), c, uSaettigung);',
    '  c *= 1.0 - uVignette * smoothstep(0.34, 0.90, distance(vUv, vec2(0.5)));',
    '  gl_FragColor = vec4(srgb(clamp(c, 0.0, 1.0)), 1.0); }'
  ].join('\n'), {
    tBild:{ value:null }, tGlut:{ value:null }, uPixel:{ value:new THREE.Vector2() },
    uBelichtung:{ value:1 }, uGlut:{ value:0.5 }, uSaettigung:{ value:1.12 },
    uScharf:{ value:0.30 }, uVignette:{ value:0.16 },
    uWarm:{ value:new THREE.Vector3(1,1,1) }, uKuehl:{ value:new THREE.Vector3(1,1,1) } });

  quadScene = new THREE.Scene();
  quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), matHell);
  quad.frustumCulled = false;
  quadScene.add(quad);
  quadCam = new THREE.Camera();

  const opt = { type:THREE.HalfFloatType, colorSpace:THREE.NoColorSpace, stencilBuffer:false };
  rtScene = new THREE.WebGLRenderTarget(2, 2, { ...opt, depthBuffer:true, samples:4 });
  rtA = new THREE.WebGLRenderTarget(2, 2, { ...opt, depthBuffer:false });
  rtB = new THREE.WebGLRenderTarget(2, 2, { ...opt, depthBuffer:false });
}

/* ============================================================================
   9 · Die Kamera — EIN durchgehender Zoom

   `spannKm` ist die Bildbreite in Kilometern und die einzige Zoomgroesse des
   Labors. Aus ihr folgt alles andere: welche Ebene gilt, welche Stufe baut,
   ob es Marken gibt. Es gibt KEINEN Moduswechsel, den man umlegen koennte —
   "Weltkarte", "Brett" und "Feld" sind drei Werte derselben Zahl.
   ========================================================================= */
const SPRUNG = {           /* Bildbreite in km */
  welt:  Math.max(XMAX, YMAX) * 1.05,
  tal:   90,
  brett: 12,
  feld:  1.6
};
let spannKm = 0;
const blick = new THREE.Vector3();   /* Blickmitte in km (x, 0, z) */
let sichtOben = false;

const istOben = () => sichtOben;
const neigungJetzt = () => istOben() ? 90 : P.neigung;

function pxProKm() { return (buehne.clientWidth || 1) / spannKm; }
function pxProHex(L) { return L.hexKm * pxProKm(); }

/* Die Ebene ist die FEINSTE, deren Sechsecke noch gross genug sind. Die
   Schwelle 9 px ist die aus `rhein-tiles-v4` — sie steht hier nicht neu
   erfunden da, weil zwei Konsumenten desselben Tilesets nicht bei
   verschiedenen Zoomstufen umschalten duerfen. */
function ebeneJetzt() {
  if (P.ebene >= 0) return EBENEN.find(L => L.id === P.ebene) || EBENEN[0];
  let gewaehlt = EBENEN[0];
  for (const L of EBENEN) if (pxProHex(L) >= 9) { gewaehlt = L; break; }
  /* Rueckwaerts: die feinste Ebene, die noch nicht zu grob ist. */
  for (let i = EBENEN.length - 1; i >= 0; i--) {
    if (pxProHex(EBENEN[i]) >= 9) return EBENEN[i];
  }
  return EBENEN[0];
}

const GRENZE_MITTEL = 12, GRENZE_NAH = 46;
function stufeJetzt(L) {
  if (P.stufe !== 'auto') return P.stufe;
  const px = pxProHex(L);
  if (px < GRENZE_MITTEL) return 'fern';
  if (px < GRENZE_NAH) return 'mittel';
  return 'nah';
}

function kameraStellen() {
  const azi = P.azimut * Math.PI / 180;
  const neig = neigungJetzt() * Math.PI / 180;
  /* Der Abstand waechst mit der Bildbreite: eine orthografische Kamera braucht
     ihn nur, damit die Near/Far-Ebenen das Gelaende einschliessen — aber ein
     fester Abstand schnitte beim Weltblick das halbe Alpenrelief weg. */
  const d = Math.max(20, spannKm * 2.2);
  kamera.position.set(
    blick.x + Math.cos(neig) * Math.sin(azi) * d,
    blick.y + Math.sin(neig) * d,
    blick.z + Math.cos(neig) * Math.cos(azi) * d
  );
  /* Senkrecht von oben ist `lookAt` mit der Hochachse als Aufwaertsvektor
     entartet — dann zeigt Norden nach oben, indem der Aufwaertsvektor auf -z
     kippt. Ohne das dreht sich das Bild bei 90° willkuerlich weg. */
  kamera.up.set(0, 1, 0);
  if (neigungJetzt() > 88) kamera.up.set(0, 0, -1);
  kamera.lookAt(blick);

  const w = buehne.clientWidth || 1, h = buehne.clientHeight || 1;
  const hx = spannKm / 2, hy = hx * h / w;
  kamera.left = -hx; kamera.right = hx; kamera.top = hy; kamera.bottom = -hy;
  kamera.near = 0.1; kamera.far = d * 2 + 400;
  kamera.updateProjectionMatrix();
  kamera.updateMatrixWorld(true);
  neuZeichnen();
}

function lichtStellen() {
  const L = LICHT[P.zeit] || LICHT.mittag;
  const azi = (P.azimut + L.azimut) * Math.PI / 180;
  const hoe = L.hoehe * Math.PI / 180;
  const d = Math.max(30, spannKm * 3);
  sonne.target.position.copy(blick);
  sonne.position.set(
    blick.x + Math.cos(hoe) * Math.sin(azi) * d,
    blick.y + Math.sin(hoe) * d,
    blick.z + Math.cos(hoe) * Math.cos(azi) * d
  );
  sonne.color.copy(PAL.sonne); sonne.intensity = L.sonne;
  /* Die Schattenkamera eng um das legen, was wirklich im Bild ist: jede
     ueberfluessige Einheit kostet Aufloesung, und bei einem Feld ist der
     Unterschied zwischen "eng" und "ganzer Rhein" der zwischen scharf und
     Brei. Sie haengt darum am ZOOM, nicht an der Weltgroesse. */
  const sc = sonne.shadow.camera;
  const rad = spannKm * 0.8 + 1;
  sc.left = -rad; sc.right = rad; sc.top = rad; sc.bottom = -rad;
  sc.near = 0.1; sc.far = d + rad * 4 + 40;
  sc.updateProjectionMatrix();
  sonne.shadow.radius = P.schatten === 'weich' ? 2 : 1;
  /* Schatten nur, wo sie etwas erzaehlen: beim Weltblick liegt das ganze Tal
     in zwei Pixeln, und eine 2048er Schattenkarte darueber ist Rauschen. */
  renderer.shadowMap.enabled = P.schatten !== 'aus' && spannKm < 120;

  fuell.color.copy(PAL.fuell); fuell.groundColor.copy(PAL.rueck); fuell.intensity = L.fuell;
  rueck.color.copy(PAL.fuell); rueck.intensity = L.rueck;
  rueck.position.set(blick.x - Math.sin(azi) * d, blick.y + d * 0.3, blick.z - Math.cos(azi) * d);

  scene.background = PAL.papier;
  matEnde.uniforms.uBelichtung.value = L.belichtung;
  matEnde.uniforms.uWarm.value.set(PAL.warm.r, PAL.warm.g, PAL.warm.b);
  matEnde.uniforms.uKuehl.value.set(PAL.kuehl.r, PAL.kuehl.g, PAL.kuehl.b);
  renderer.toneMappingExposure = L.belichtung;
  neuZeichnen();
}

/* ============================================================================
   10 · Was im Bild steht — und nur das wird gebaut

   Der Sichtbereich wird in km gerechnet und mit einem Rand versehen. Bei
   Schraegsicht steht in der Tiefe mehr Land im Bild, als die Bildbreite
   vermuten laesst; der Rand traegt das, ohne dass eine Projektion des
   Sichtkoerpers noetig waere. Ein grosszuegiger Rand ist hier billiger als eine
   exakte Rechnung: was zu viel gebaut wird, wirft der Speicher wieder aus.
   ========================================================================= */
function sichtbereichKm() {
  const w = buehne.clientWidth || 1, h = buehne.clientHeight || 1;
  const halbX = spannKm / 2, halbY = halbX * h / w;
  /* In der Schraegsicht laeuft die Bildhoehe schraeg durch die Ebene: geteilt
     durch sin(Neigung) wird aus der Bildhoehe die Landtiefe. */
  const neig = Math.max(0.2, Math.sin(neigungJetzt() * Math.PI / 180));
  const tiefe = halbY / neig;
  const rand = Math.max(halbX, tiefe) * 0.35;
  const rr = Math.max(halbX, tiefe) + rand;
  return { x0:blick.x - rr, x1:blick.x + rr, z0:blick.z - rr, z1:blick.z + rr };
}

let sichtbar = [];    /* die Kacheln des laufenden Bildes, fuer Marken und Messwerte */
function weltStellen() {
  const L = ebeneJetzt();
  const stufe = stufeJetzt(L);
  const s = seiteVon(L);
  const b = sichtbereichKm();
  bildNr++;
  sichtbar = [];

  /* Von km zurueck auf Kachelindizes. Die Umkehrung ist grob absichtlich: eine
     Kachel zu viel ist ein Zeichenaufruf, eine Kachel zu wenig ist ein Loch. */
  const [cA, rA] = zelleBeiKm(b.x0, b.z0, s);
  const [cB, rB] = zelleBeiKm(b.x1, b.z1, s);
  const tx0 = Math.max(0, Math.floor(Math.min(cA, cB) / L.tile) - 1);
  const tx1 = Math.min(Math.ceil(L.cols / L.tile), Math.floor(Math.max(cA, cB) / L.tile) + 2);
  const ty0 = Math.max(0, Math.floor(Math.min(rA, rB) / L.tile) - 1);
  const ty1 = Math.min(Math.ceil(L.rows / L.tile), Math.floor(Math.max(rA, rB) / L.tile) + 2);

  /* Eine Obergrenze, die nie greifen SOLL — sie ist die Sicherung dafuer, dass
     ein Rechenfehler in der Umkehrung nicht 60 000 Kacheln baut, waehrend der
     Browser stillsteht. Wenn sie greift, sagt es der Messstreifen. */
  let gedeckelt = 0;
  const HOECHST = 400;
  for (let ty = ty0; ty < ty1; ty++)
    for (let tx = tx0; tx < tx1; tx++) {
      if (sichtbar.length >= HOECHST) { gedeckelt++; continue; }
      const e = kachelHolen(L, tx, ty, stufe);
      if (e) sichtbar.push(e);
    }

  /* Alles, was diesmal nicht drankam, aus der Szene nehmen — aber im Speicher
     lassen, solange das Budget es traegt. Der Unterschied ist der zwischen
     "beim Zurueckschwenken sofort da" und "jedes Mal neu gebaut". */
  for (const [key, e] of gebaut) {
    const drin = e.gesehen === bildNr;
    if (drin && !e.gruppe.parent) welt.add(e.gruppe);
    if (!drin && e.gruppe.parent) welt.remove(e.gruppe);
  }
  aufraeumen();
  letzteEbene = L; letzteStufe = stufe; letzteGedeckelt = gedeckelt;
  lichtStellen();
  markenStellen();
  stempelSchreiben();
  messenSchreiben();
}
let letzteEbene = EBENEN[0], letzteStufe = 'fern', letzteGedeckelt = 0;

/* ============================================================================
   11 · Die Marken — HTML, an der projizierten Feldmitte

   Nur auf der NAHEN Stufe, und nur bis zum Budget. Das ist keine
   Sparmassnahme: unterhalb von 46 px je Hex hat `feld-labor-v1` gemessen, dass
   Krone, Wange und Fuss nicht mehr lesbar sind — sie wegzulassen ist die
   AUSSAGE der Stufe, nicht ihr Verzicht.
   ========================================================================= */
const markenWurzel = document.getElementById('marken');
const hilfsVec = new THREE.Vector3();
let markenPool = [];

function projizieren(x, y, z, w, h) {
  hilfsVec.set(x, y, z).project(kamera);
  return [(hilfsVec.x * 0.5 + 0.5) * w, (-hilfsVec.y * 0.5 + 0.5) * h, hilfsVec.z];
}

function markenStellen() {
  const w = buehne.clientWidth || 1, h = buehne.clientHeight || 1;
  const L = letzteEbene;
  if (!P.marken || letzteStufe !== 'nah') { markenLeeren(); return; }
  const s = seiteVon(L);
  const b = sichtbereichKm();
  const [cA, rA] = zelleBeiKm(b.x0, b.z0, s);
  const [cB, rB] = zelleBeiKm(b.x1, b.z1, s);
  const c0 = Math.min(cA, cB) - 1, c1 = Math.max(cA, cB) + 1;
  const r0 = Math.min(rA, rB) - 1, r1 = Math.max(rA, rB) + 1;

  /* Die Hexbreite auf dem Schirm wird GEMESSEN, nicht gerechnet: bei
     Schraegsicht ist sie nicht `hexKm * pxProKm`, sondern die Projektion
     zweier benachbarter Mitten. Genau diese Zahl fuettert `font-size`, damit
     die Marken in `em` mitwachsen. */
  const mA = projizieren(...mitteKmZuXYZ(c0 + 1, r0 + 1, s, 0), w, h);
  const mB = projizieren(...mitteKmZuXYZ(c0 + 2, r0 + 1, s, 0), w, h);
  const hexBreite = Math.max(6, Math.hypot(mB[0] - mA[0], mB[1] - mA[1]));
  /* VERKUERZUNG — der dritte Befund dieses Labors, und einer, den nur 3D
     hervorbringt: in der Schraegsicht ist die Silhouette eines Feldes kein
     Sechseck im Verhaeltnis 1:1.1547 mehr, sondern ein GEDRUECKTES. Der Ring,
     auf dem die Slots sitzen, muss um denselben Faktor gedrueckt werden — sonst
     liegen Krone und Fuss in der Luft ueber bzw. unter der Deckflaeche, und
     zwar umso weiter, je flacher der Blick.

     Die Regel aus `feld-labor-v1` ("Slots auf einem Ring bei ~22 % Hoehe")
     ueberlebt das unveraendert; was sie braucht, ist eine Bezugshoehe, die
     nicht mehr aus der Breite folgt. Ein zweites Argument fuer HTML-Marken:
     ein gedruecktes Kaestchen ist eine Zeile CSS, eine gedrueckte Textur waere
     ein eigener Durchgang. */
  const hexHoehe = Math.max(4, hexBreite * 1.1547 *
    Math.max(0.28, Math.sin(neigungJetzt() * Math.PI / 180)));

  let n = 0;
  const wollen = [];
  for (let r = r0; r <= r1; r++)
    for (let c = c0; c <= c1; c++) {
      if (n >= P.budget) break;
      const d = zelleLesen(L, c, r);
      if (!d || (!d.t && !d.e)) continue;
      const T = TERRAIN[d.t] || TERRAIN[0];
      const ext = erfunden(c, r, T);
      const gewaehltHier = gewaehlt && gewaehlt.c === c && gewaehlt.r === r && gewaehlt.ebene === L.id;
      /* Ein Feld ohne Aussage bekommt keine Marke. Das ist das Gegenstueck zum
         Budget: nicht "die ersten 220", sondern "die, die etwas zu sagen
         haben" — sonst tapeziert die Krone das ganze Bild mit Leere. */
      if (!ext.leute.length && !ext.ereignis && !ext.arten.length && !ext.fund && !gewaehltHier) continue;
      const [px, py, tiefe] = projizieren(...mitteKmZuXYZ(c, r, s, hoeheZeigen(d.e)), w, h);
      if (tiefe > 1 || px < -60 || py < -60 || px > w + 60 || py > h + 60) continue;
      wollen.push({ c, r, px, py, ext, T, gewaehlt:gewaehltHier });
      n++;
    }

  while (markenPool.length < wollen.length) {
    const el = document.createElement('div');
    el.className = 'mk';
    markenWurzel.appendChild(el);
    markenPool.push(el);
  }
  for (let i = 0; i < markenPool.length; i++) {
    const el = markenPool[i], d = wollen[i];
    if (!d) { el.style.display = 'none'; continue; }
    el.style.display = '';
    el.style.fontSize = (hexBreite * 0.155) + 'px';
    el.style.width = hexBreite + 'px';
    el.style.height = hexHoehe + 'px';
    el.style.transform = 'translate(' + (d.px - hexBreite / 2) + 'px,' +
                                        (d.py - hexHoehe / 2) + 'px)';
    el.className = 'mk' + (d.gewaehlt ? ' gewaehlt' : '');
    const key = markenKey(d);
    if (el.__key !== key) { el.innerHTML = markenHTML(d); el.__key = key; }
  }
  markenZahl = wollen.length;
}
function markenLeeren() {
  for (const el of markenPool) el.style.display = 'none';
  markenZahl = 0;
}
let markenZahl = 0;

function mitteKmZuXYZ(c, r, s, y) {
  const [x, z] = mitteKm(c, r, s);
  return [x, y, z];
}
const markenKey = d => d.c + ',' + d.r + ':' + d.ext.leute.map(m => m.id).join('') +
  ':' + (d.ext.ereignis ? d.ext.ereignis.id + d.ext.dauer : '') + ':' + d.ext.arten.length +
  ':' + (d.ext.fund ? 'f' : '');

function ikon(name) {
  /* Symbole sind SVG. IMMER. Ein Schriftzeichen erbt die Metrik der Schrift,
     faellt je Geraet anders aus und laesst sich nicht mit dem Rest umzeichnen. */
  return (SOT.icon && SOT.icon(name)) || '';
}
function markenHTML(d) {
  let s = '';
  if (d.ext.leute.length) {
    s += '<div class="slot krone">' + d.ext.leute.slice(0, 2).map(m =>
      '<span class="scheibe" title="' + m.name + '">' + ikon(m.icon) + '</span>').join('') + '</div>';
  }
  if (d.ext.ereignis) {
    s += '<div class="slot wange"><span class="scheibe" title="' + d.ext.ereignis.name +
         '">' + ikon(d.ext.ereignis.icon) + '</span></div>';
  }
  if (d.ext.arten.length) {
    s += '<div class="slot ferse">' + d.ext.arten.map(a =>
      '<span class="punkt" style="background:var(' + a + ')"></span>').join('') + '</div>';
  }
  if (d.ext.fund) s += '<div class="slot fuss">' + ikon('fundkies') + '</div>';
  return s;
}

/* ============================================================================
   12 · Zeichnen
   ========================================================================= */
function groesseStellen() {
  const w = Math.max(1, buehne.clientWidth), h = Math.max(1, buehne.clientHeight);
  renderer.setSize(w, h, false);
  const dpr = renderer.getPixelRatio();
  const pw = Math.max(2, Math.floor(w * dpr)), ph = Math.max(2, Math.floor(h * dpr));
  rtScene.setSize(pw, ph);
  rtA.setSize(Math.max(2, pw >> 2), Math.max(2, ph >> 2));
  rtB.setSize(Math.max(2, pw >> 2), Math.max(2, ph >> 2));
  matEnde.uniforms.uPixel.value.set(1 / pw, 1 / ph);
  kameraStellen();
  weltStellen();
}

function durchgang(mat, ziel) {
  quad.material = mat;
  renderer.setRenderTarget(ziel);
  renderer.render(quadScene, quadCam);
}

function zeichnen() {
  if (P.post > 0) {
    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene, kamera);
    matHell.uniforms.tBild.value = rtScene.texture;
    durchgang(matHell, rtA);
    matBlur.uniforms.tBild.value = rtA.texture;
    matBlur.uniforms.uRichtung.value.set(1 / rtA.width, 0);
    durchgang(matBlur, rtB);
    matBlur.uniforms.tBild.value = rtB.texture;
    matBlur.uniforms.uRichtung.value.set(0, 1 / rtA.height);
    durchgang(matBlur, rtA);
    const sk = P.post / 100;
    matEnde.uniforms.tBild.value = rtScene.texture;
    matEnde.uniforms.tGlut.value = rtA.texture;
    matEnde.uniforms.uGlut.value = 0.55 * sk;
    matEnde.uniforms.uSaettigung.value = 1 + 0.14 * sk;
    matEnde.uniforms.uScharf.value = 0.34 * sk;
    matEnde.uniforms.uVignette.value = 0.18 * sk;
    durchgang(matEnde, null);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, kamera);
  }
}

/* `?still` heisst NICHT "eingefroren", sondern "nur auf Zuruf zeichnen" — und
   dann SOFORT. Der Bildschirmfoto-Ablauf der Werkstatt spult mit
   `--virtual-time-budget` die Zeit vor; eine laufende rAF-Schleife rendert
   dann hunderte Bilder, eine wartende liefert einen geleerten Puffer. */
let bereit = false, schmutzig = true, fps = 0, letzteZeit = 0, bilder = 0;
function neuZeichnen() { if (!bereit) return; if (P.still) zeichnen(); else schmutzig = true; }
function schleife(t) {
  requestAnimationFrame(schleife);
  if (letzteZeit && t - letzteZeit > 500) {
    fps = Math.round(bilder * 1000 / (t - letzteZeit));
    bilder = 0; letzteZeit = t; messenSchreiben();
  } else if (!letzteZeit) letzteZeit = t;
  if (flachSchritt(t)) schmutzig = true;
  if (linseSchritt(t)) schmutzig = true;
  if (P.still || !schmutzig) return;
  schmutzig = false; bilder++;
  zeichnen();
}

/* ============================================================================
   12b · Der Hoehenschalter, und wie er sich bewegt

   Gewuenscht war `transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1)`.
   Ein CSS-Uebergang greift hier nicht: die Hoehe steckt nicht in einem
   `transform`, sondern in den Ecken einer Geometrie. Die KURVE aber ist die
   Absicht, und die laesst sich genau uebernehmen — CSS loest dieselbe
   Einheits-Bezierkurve numerisch, und das steht unten.

   Es ist ausserdem dieselbe Kurve, die die Shell fuer ihre Uebergaenge nutzt.
   Dass die Welt sich nach derselben Regel bewegt wie das Menue darueber, ist
   kein Detail: es ist der Unterschied zwischen einem Programm mit Animationen
   und einem, das sich wie ein Stueck bewegt.
   ========================================================================= */
const DAUER = 600;   /* 0.6 s */

/* Einheits-Bezier, wie ihn CSS rechnet: die Kurve laeuft von (0,0) nach (1,1)
   ueber zwei Griffe. Gesucht ist y(x); x(t) wird dafuer mit Newton umgekehrt
   (und, wo die Ableitung zu flach wird, halbiert — sonst laeuft Newton bei
   den waagerechten Enden dieser Kurve davon). */
function bezier(x1, y1, x2, y2) {
  const A = (a, b) => 1 - 3*b + 3*a, B = (a, b) => 3*b - 6*a, C = a => 3*a;
  const f = (t, a, b) => ((A(a,b)*t + B(a,b))*t + C(a))*t;
  const df = (t, a, b) => 3*A(a,b)*t*t + 2*B(a,b)*t + C(a);
  return x => {
    if (x <= 0) return 0;
    if (x >= 1) return 1;
    let t = x;
    for (let i = 0; i < 8; i++) {
      const d = df(t, x1, x2);
      if (Math.abs(d) < 1e-6) break;
      const e = f(t, x1, x2) - x;
      if (Math.abs(e) < 1e-7) return f(t, y1, y2);
      t -= e / d;
    }
    let lo = 0, hi = 1; t = x;
    for (let i = 0; i < 20; i++) {
      const e = f(t, x1, x2) - x;
      if (Math.abs(e) < 1e-7) break;
      if (e > 0) hi = t; else lo = t;
      t = (lo + hi) / 2;
    }
    return f(t, y1, y2);
  };
}
const KURVE = bezier(0.16, 1, 0.3, 1);

let hoeheAn = true;              /* was der Schalter sagt */
let flachVon = 0, flachNach = 0; /* woher, wohin — in `uFlach` */
let flachStart = 0, flachLaeuft = false;

function hoeheSchalten(an, sofort) {
  hoeheAn = an;
  flachVon = hoehenRegler.value;
  flachNach = an ? 0 : 1;
  if (sofort || P.still || flachVon === flachNach) {
    hoehenRegler.value = flachNach;
    flachLaeuft = false;
    hoeheSchreiben();
    markenStellen(); neuZeichnen();
    return;
  }
  flachStart = performance.now();
  flachLaeuft = true;
  hoeheSchreiben();
}

/* Ein Bild der Animation. Gibt zurueck, ob es weitergeht — die Schleife
   zeichnet nur, solange das so ist, und faellt danach wieder in den
   Ruhezustand zurueck (die Szene bewegt sich sonst nicht von selbst). */
function flachSchritt(t) {
  if (!flachLaeuft) return false;
  const p = Math.min(1, (t - flachStart) / DAUER);
  hoehenRegler.value = flachVon + (flachNach - flachVon) * KURVE(p);
  if (p >= 1) { hoehenRegler.value = flachNach; flachLaeuft = false; }
  /* Die Marken haengen an der projizierten Feldmitte, und die Mitte wandert
     mit — ohne das kleben sie waehrend der Bewegung in der Luft. */
  markenStellen();
  return true;
}

/* Die Anzeigehoehe eines Feldes — dieselbe Mischung wie im Shader. Zeiger und
   Marken muessen sie kennen, sonst zeigt man waehrend (und nach) der Bewegung
   auf ein Gelaende, das nicht mehr dort liegt. */
const hoeheZeigen = e => hoeheKm(e) * (1 - hoehenRegler.value);

/* ---------------------------------------------------------------------------
   Die Linse an- und abschalten, und das Lager verschieben.

   Zwei verschiedene Bewegungen auf derselben Kurve, und sie duerfen sich
   ueberlagern: `uLinse` blendet die Aussage ein, `uWissenT` blendet von einem
   Wissensstand zum naechsten. Wer die Linse einschaltet und sofort das Lager
   verschiebt, sieht beides gleichzeitig — das ist kein Sonderfall, den man
   verbieten muesste, sondern zwei Regler, die sich nicht kennen.
   --------------------------------------------------------------------------- */
let linseAn = false;
let linseVon = 0, linseNach = 0, linseStart = 0, linseLaeuft = false;
let wandernStart = 0, wandernLaeuft = false;

function linseSchalten(an, sofort) {
  linseAn = an;
  linseVon = wissenLinse.value;
  linseNach = an ? 1 : 0;
  if (sofort || P.still || linseVon === linseNach) {
    wissenLinse.value = linseNach; linseLaeuft = false;
  } else { linseStart = performance.now(); linseLaeuft = true; }
  linseSchreiben(); wissenPaneSchreiben(); markenStellen(); neuZeichnen();
}

function lagerSetzen(c, r, sofort) {
  /* Das Lager lebt auf Ebene 1. Ein Klick auf ein Feld der Ebene 2 setzt es
     also nicht dorthin, sondern in das 2-km-Feld, in dem dieser Punkt liegt —
     dieselbe Umrechnung ueber Kilometer wie ueberall sonst. */
  lagerC = c; lagerR = r;
  wissenEinfrieren();
  wissenRechnen();
  for (const e of gebaut.values()) wissenSchreiben(e, false);
  if (sofort || P.still) { wissenT.value = 1; wandernLaeuft = false; }
  else { wissenT.value = 0; wandernStart = performance.now(); wandernLaeuft = true; }
  wissenPaneSchreiben(); markenStellen(); neuZeichnen();
}

function linseSchritt(t) {
  let weiter = false;
  if (linseLaeuft) {
    const p = Math.min(1, (t - linseStart) / DAUER);
    wissenLinse.value = linseVon + (linseNach - linseVon) * KURVE(p);
    if (p >= 1) { wissenLinse.value = linseNach; linseLaeuft = false; }
    weiter = true;
  }
  if (wandernLaeuft) {
    const p = Math.min(1, (t - wandernStart) / DAUER);
    wissenT.value = KURVE(p);
    if (p >= 1) { wissenT.value = 1; wandernLaeuft = false; }
    weiter = true;
  }
  if (weiter) markenStellen();
  return weiter;
}

const bLinse = document.getElementById('bLinse');
function linseSchreiben() {
  bLinse.textContent = linseAn ? 'Wissen an' : 'Wissen aus';
  bLinse.classList.toggle('an', linseAn);
}
bLinse.onclick = () => linseSchalten(!linseAn, false);

const paneWissen = document.getElementById('paneWissen');
function wissenPaneSchreiben() {
  if (!linseAn && wissenLinse.value < 0.01) { paneWissen.classList.add('hid'); return; }
  paneWissen.classList.remove('hid');
  const L = wEbene;
  const proFeld = L.hexKm * L.hexKm * 0.866;   /* Fläche eines Sechsecks */
  const z = wZaehlung;
  const zeile = (n, v, kl) => '<div class="zeile"><span class="w">' +
    '<i class="pkt ' + kl + '"></i>' + n + '</span><span class="v">' + zahl(v) + '</span></div>';
  paneWissen.innerHTML =
    '<div class="blabel">Bekanntes Land<span class="co">Ebene ' + L.id + '</span></div>' +
    zeile('begangen', z.bekannt, 'bekannt') +
    zeile('gesehen', z.gesehen, 'gesehen') +
    zeile('vergessen', z.vergessen, 'vergessen') +
    '<div class="zeile summe"><span class="w">Fläche</span><span class="v">' +
      zahl(Math.round(z.bekannt * proFeld)) + ' km&sup2;</span></div>' +
    '<div class="note" style="font-size:9.5px;margin-top:7px;line-height:1.5">' +
      'Lager <b>' + lagerC + ',' + lagerR + '</b> · heim <b>' + P.heim + '</b> · fern <b>' +
      P.fern + '</b> · Sicht <b>' + P.sicht + '</b>.<br>' +
      'Ein Feld im Explorer wählen und <b>Lager hierher</b> — was aus dem ' +
      'Heim-Budget fällt, sinkt zurück und behält nur seine Umrisse.' +
    '</div>';
}

const bHoehe = document.getElementById('bHoehe');

  bHoehe.textContent = hoeheAn ? 'Hoehe an' : 'Hoehe aus';
  bHoehe.classList.toggle('an', hoeheAn);
}
bHoehe.onclick = () => hoeheSchalten(!hoeheAn, false);

/* ============================================================================
   13 · Anfassen — Schieben, Zoomen, Waehlen

   Gezeigt wird ueber die EBENE y = Hoehe der getroffenen Zelle, nicht ueber
   einen Netzschnitt: der erste Treffer auf dem Netz ist in der Schraegsicht
   die FLANKE der Kachel davor, man landete also systematisch auf dem Feld VOR
   dem gemeinten. Bei echtem Gebirge ist das kein Schoenheitsfehler — auf einen
   Talboden neben einer Bergflanke zu tippen waehlte zuverlaessig den Berg.

   Weil die Hoehe erst bekannt ist, wenn die Zelle bekannt ist, wird zweimal
   gerechnet: einmal gegen y = 0, dann gegen die Hoehe des dort gefundenen
   Feldes. Zwei Durchgaenge genuegen; ein dritter aenderte in den Messungen
   nichts mehr.
   ========================================================================= */
const strahl = new THREE.Raycaster();
const zeiger = new THREE.Vector2();
let gewaehlt = null;

function kmUnterZeiger(ev, yEbene) {
  const rect = leinwand.getBoundingClientRect();
  zeiger.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  zeiger.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  strahl.setFromCamera(zeiger, kamera);
  const o = strahl.ray.origin, d = strahl.ray.direction;
  if (Math.abs(d.y) < 1e-6) return null;
  const tt = (yEbene - o.y) / d.y;
  if (tt < 0) return null;
  return [o.x + d.x * tt, o.z + d.z * tt];
}
function feldUnter(ev) {
  const L = letzteEbene, s = seiteVon(L);
  let p = kmUnterZeiger(ev, 0);
  if (!p) return null;
  let [c, r] = zelleBeiKm(p[0], p[1], s);
  let d = zelleLesen(L, c, r);
  if (d) {
    p = kmUnterZeiger(ev, hoeheZeigen(d.e));
    if (p) { [c, r] = zelleBeiKm(p[0], p[1], s); d = zelleLesen(L, c, r); }
  }
  if (!d) return null;
  return { c, r, ebene:L.id, d };
}

let zieht = false, zogWirklich = false, letzterZeiger = null;
leinwand.addEventListener('pointerdown', ev => {
  zieht = true; zogWirklich = false;
  letzterZeiger = kmUnterZeiger(ev, blick.y);
  leinwand.setPointerCapture(ev.pointerId);
  leinwand.classList.add('zieht');
});
leinwand.addEventListener('pointermove', ev => {
  if (!zieht || !letzterZeiger) return;
  const p = kmUnterZeiger(ev, blick.y);
  if (!p) return;
  const dx = p[0] - letzterZeiger[0], dz = p[1] - letzterZeiger[1];
  if (Math.hypot(dx, dz) > spannKm * 0.004) zogWirklich = true;
  blick.x -= dx; blick.z -= dz;
  klemmen();
  kameraStellen(); weltStellen();
  /* `letzterZeiger` NICHT nachfuehren: der Punkt unter dem Finger soll unter
     dem Finger bleiben, und weil die Kamera sich gerade bewegt hat, liegt er
     nach der Bewegung wieder dort, wo er beim Aufsetzen war. */
});
function zeigerLos(ev) {
  if (!zieht) return;
  zieht = false; letzterZeiger = null;
  leinwand.classList.remove('zieht');
  if (!zogWirklich) {
    const f = feldUnter(ev);
    if (f) waehlen(f);
  }
}
leinwand.addEventListener('pointerup', zeigerLos);
leinwand.addEventListener('pointercancel', () => { zieht = false; leinwand.classList.remove('zieht'); });

/* Zoom um den ZEIGER, nicht um die Bildmitte. Das ist der Unterschied zwischen
   "ich zoome auf das, was ich anschaue" und "ich zoome und suche es wieder". */
leinwand.addEventListener('wheel', ev => {
  ev.preventDefault();
  const vor = kmUnterZeiger(ev, 0);
  const f = Math.exp(ev.deltaY * 0.0016);
  spannKm = Math.max(0.35, Math.min(Math.max(XMAX, YMAX) * 1.3, spannKm * f));
  kameraStellen();
  const nach = kmUnterZeiger(ev, 0);
  if (vor && nach) { blick.x += vor[0] - nach[0]; blick.z += vor[1] - nach[1]; }
  klemmen();
  kameraStellen(); weltStellen();
}, { passive:false });

/* Die Blickmitte darf die Karte verlassen, aber nicht verlieren: ohne Klemme
   schiebt ein beherzter Wisch die Welt aus dem Bild, und was dann kommt, ist
   ein leeres Papier ohne Anhaltspunkt zurueck. */
function klemmen() {
  const rand = spannKm * 0.5;
  blick.x = Math.max(-rand, Math.min(XMAX + rand, blick.x));
  blick.z = Math.max(-rand, Math.min(YMAX + rand, blick.z));
}

function springen(name) {
  spannKm = SPRUNG[name] || SPRUNG.brett;
  if (name === 'welt') { blick.set(XMAX / 2, 0, YMAX / 2); }
  kameraStellen(); weltStellen();
}

function waehlen(f) {
  gewaehlt = f;
  explorerSchreiben();
  markenStellen();
  neuZeichnen();
}

const messen = document.getElementById('messen');
const zahl = n => n.toLocaleString('de-CH');
function messenSchreiben() {
  const L = letzteEbene;
  const zellenGesamt = EBENEN.reduce((a, e) => a + e.cols * e.rows, 0);
  let dreiecke = 0;
  for (const e of sichtbar) dreiecke += e.dreiecke;

    ['Zellen im Datensatz', zahl(zellenGesamt)],

    ['Zellen darin', '~' + zahl(zellenImBild)],
    ['Dreiecke', zahl(dreiecke)],
    ['Marken', zahl(markenZahl) + ' / ' + P.budget],
    ['Kacheln gebaut', zahl(gebautZaehler)],
    ['im Speicher', zahl(gebaut.size) + ' / ' + P.kacheln],
    ['ausgeworfen', zahl(ausgeworfen)],
    ['Kacheln dekodiert', zahl(dekodiert)],

  ];
  messen.innerHTML = '<div class="blabel" style="margin-bottom:5px">Messwerte</div><table>' +
    zeilen.map(z => '<tr><td>' + z[0] + '</td><td class="n">' + z[1] + '</td></tr>').join('') +
    '</table>';

}

/* ============================================================================
   15 · Der Feld-Explorer

   Ein Klick auf ein Feld laedt es IMMER in den Explorer — auch auf leeres
   Gelaende. Er ist nicht-diegetisch: ein Werkzeug, das erklaert und rechnet,
   kein Ort der Welt.
   ========================================================================= */
const explorer = document.getElementById('explorer');
function explorerSchreiben() {
  if (!gewaehlt) { explorer.classList.add('zu'); groesseStellen(); return; }
  const L = EBENEN.find(e => e.id === gewaehlt.ebene) || letzteEbene;
  const { c, r, d } = gewaehlt;
  const T = TERRAIN[d.t] || TERRAIN[0];
  const ext = erfunden(c, r, T);
  const m = METER(d.e);
  const s = seiteVon(L);
  const [kmx, kmy] = mitteKm(c, r, s);
  const abschnitt = d.s ? (SECNAME[SECIDS[d.s]] || SECIDS[d.s]) : '—';
  const posten = ledgerVon(c, r, T, ext, m);
  const summe = posten.filter(p => !p.tot).reduce((a, p) => a + p.w, 0);

  const zeile = (w, v) => '<div class="zeile"><span class="w">' + w + '</span><span class="v">' + v + '</span></div>';

  explorer.classList.remove('zu');
  explorer.innerHTML =
    '<div class="ex-kopf">' +
      '<h2>' + T.name + '</h2>' +
      '<span class="adr">E' + L.id + ' · ' + c + ',' + r + '</span>' +
      '<button class="small ghost" id="exZu" title="Schliessen">&times;</button>' +
    '</div>' +
    '<div class="ex-hero"><div class="hx" style="background:var(' + T.tok + ')">' +
      ikon(T.zeichen) + '</div></div>' +

    '<div class="ex-abschnitt"><h3>Landschaft</h3>' +
      zeile('Gelaende', T.name) +
      zeile('Hoehe', d.e ? Math.round(m) + ' m ue. M.' : 'ohne Messung') +
      zeile('Abschnitt', abschnitt) +
      zeile('Ort', kmx.toFixed(1) + ' / ' + kmy.toFixed(1) + ' km') +
      zeile('Feldgroesse', L.hexKm + ' km · ' + (L.hexKm * L.hexKm * 0.866).toFixed(2) + ' km&sup2;') +
      zeile('Kachel', Math.floor(c / L.tile) + ',' + Math.floor(r / L.tile)) +
    '</div>' +

    '<div class="ex-abschnitt"><h3>Menschen</h3>' +
      (ext.leute.length
        ? ext.leute.map(p => zeile(p.name, '1')).join('')
        : '<div class="zeile"><span class="w">niemand hier</span></div>') +
    '</div>' +

    '<div class="ex-abschnitt"><h3>Flora &amp; Fauna</h3>' +
      (ext.arten.length
        ? zeile('Vorkommen', ext.arten.length + ' von 3')
        : '<div class="zeile"><span class="w">kein Vorkommen erfasst</span></div>') +
    '</div>' +

    '<div class="ex-abschnitt"><h3>Ereignisse</h3>' +
      (ext.ereignis
        ? zeile(ext.ereignis.name, 'noch ' + ext.dauer)
        : '<div class="zeile"><span class="w">ruhig</span></div>') +
    '</div>' +

    '<div class="ex-abschnitt ledger"><h3>Feldwert</h3>' +
      posten.map(p =>
        '<div class="zeile' + (p.tot ? ' tot' : '') + '">' +
          '<span class="w">' + p.q + ' · ' + p.was + '</span>' +
          '<span class="v">' + (p.w > 0 ? '+' : '') + p.w + '</span></div>').join('') +
      '<div class="zeile summe"><span class="w">Summe</span>' +
        '<span class="v">' + (summe > 0 ? '+' : '') + summe + '</span></div>' +
    '</div>' +

    '<div class="ex-abschnitt"><h3>Wissen</h3>' +
      zeile('Nebel', W_NAME[wissenBei(L, c, r)]) +
      (wKosten && wissenIndex(L, c, r) >= 0 && isFinite(wKosten[wissenIndex(L, c, r)])
        ? zeile('Weg vom Lager', wKosten[wissenIndex(L, c, r)].toFixed(1) + ' Kosten')
        : zeile('Weg vom Lager', 'ausser Reichweite')) +
      (ext.fund
        ? zeile('Fundstelle', 'unberuehrt')
        : '<div class="zeile"><span class="w">keine Fundstelle</span></div>') +
    '</div>' +

    '<div class="ex-fuss">' +
      '<button class="small" id="exHin">Hierher zoomen</button>' +
      '<button class="small ghost" id="exLager">Lager hierher</button>' +
      '<button class="small ghost" id="exWeg">Zurueck aufs Brett</button>' +
    '</div>' +
    '<p class="erfunden">Gelaende, Hoehe und Abschnitt stammen aus der Pipeline ' +
      '(Sonny-DTM, OSM). Menschen, Arten, Ereignisse und der Feldwert sind ' +
      '<b>erfunden</b> und aus der Feldadresse gewuerfelt — sie stehen hier nur, ' +
      'damit die Marken etwas zu zeigen haben. Historische Angaben waeren ' +
      '&laquo;historisch inspiriert und vereinfacht&raquo;.</p>';

  explorer.querySelector('#exZu').onclick = () => { gewaehlt = null; explorerSchreiben(); markenStellen(); };
  explorer.querySelector('#exHin').onclick = () => {
    blick.set(kmx, 0, kmy); spannKm = SPRUNG.feld;
    kameraStellen(); weltStellen();
  };
  explorer.querySelector('#exLager').onclick = () => {
    const wi = wissenIndex(L, c, r);
    if (wi < 0) { SOT.toast('Ausserhalb der Wissensebene'); return; }
    lagerSetzen(wi % wEbene.cols, (wi / wEbene.cols) | 0, false);
    if (!linseAn) linseSchalten(true, false);
    explorerSchreiben();
  };
  explorer.querySelector('#exWeg').onclick = () => {
    blick.set(kmx, 0, kmy); spannKm = SPRUNG.brett;
    kameraStellen(); weltStellen();
  };
  groesseStellen();
}

/* ============================================================================
   16 · Bedienung oben
   ========================================================================= */
const ZEITEN = ['morgen','mittag','abend','nacht'];
function zeitStellen(name) {
  P.zeit = name;
  document.body.classList.toggle('night', name === 'nacht');
  document.body.dataset.zeit = name;
  paletteLesen();
  /* Die Farben stecken in den Ecken, nicht in einem Material — eine neue
     Palette heisst darum: alles neu bauen. Das ist der Preis dafuer, dass die
     Nacht die Welt wirklich umfaerbt, statt einen Schleier darueberzulegen. */
  for (const key of [...gebaut.keys()]) eintragWeg(key);
  document.getElementById('bZeit').innerHTML =
    (SOT.icon ? '<span class="ibtn">' + ikon(name === 'nacht' ? 'mond' : 'sonne') + '</span> ' : '') + name;
  weltStellen();
}
document.getElementById('bZeit').onclick = () =>
  zeitStellen(ZEITEN[(ZEITEN.indexOf(P.zeit) + 1) % ZEITEN.length]);

const bSicht = document.getElementById('bSicht');
bSicht.onclick = () => {
  sichtOben = !sichtOben;
  bSicht.textContent = sichtOben ? 'Schraeg' : 'Aufsicht';
  kameraStellen(); weltStellen();
};

for (const b of document.querySelectorAll('#segSprung button')) {
  b.onclick = () => {
    for (const o of document.querySelectorAll('#segSprung button')) o.classList.toggle('an', o === b);
    springen(b.dataset.s);
  };
}

window.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;
  if (ev.key === 'Escape' && gewaehlt) { gewaehlt = null; explorerSchreiben(); markenStellen(); }
  if (ev.key === 'h' || ev.key === 'H') hoeheSchalten(!hoeheAn, false);
  if (ev.key === 'w' || ev.key === 'W') linseSchalten(!linseAn, false);
  if (ev.key === '1') springen('welt');
  if (ev.key === '2') springen('tal');
  if (ev.key === '3') springen('brett');
  if (ev.key === '4') springen('feld');
});

/* ============================================================================
   17 · Anlauf
   ========================================================================= */
function anlauf() {
  paletteLesen();
  rendererBauen();
  paletteLesen();

  sichtOben = P.sicht === 'oben';
  bSicht.textContent = sichtOben ? 'Schraeg' : 'Aufsicht';
  document.body.classList.toggle('night', P.zeit === 'nacht');
  document.body.dataset.zeit = P.zeit;
  paletteLesen();
  document.getElementById('bZeit').innerHTML =
    (SOT.icon ? '<span class="ibtn">' + ikon(P.zeit === 'nacht' ? 'mond' : 'sonne') + '</span> ' : '') + P.zeit;

  /* Einstieg: die Mitte des Alpenrheintals, weil dort die Hoehendaten liegen
     und ein Labor ohne Relief nichts zeigt. Die Region steht im Tileset selbst
     (`regionKm` der feinsten Ebene) — sie hier zu wiederholen waere dieselbe
     Bounding Box zum zweiten Mal. */
  const fein = EBENEN[EBENEN.length - 1];
  const reg = fein.regionKm;
  if (reg) blick.set((reg[0] + reg[2]) / 2, 0, (reg[1] + reg[3]) / 2);
  else blick.set(XMAX / 2, 0, YMAX / 2);

  spannKm = P.spann > 0 ? P.spann : (SPRUNG[P.sprung] || SPRUNG.brett);
  if (P.sprung === 'welt' && !(P.spann > 0)) blick.set(XMAX / 2, 0, YMAX / 2);

  if (P.ziel) {
    const t = P.ziel.split(',').map(Number);
    if (t.length === 2 && t.every(isFinite)) blick.set(t[0], 0, t[1]);
  }
  for (const b of document.querySelectorAll('#segSprung button'))
    b.classList.toggle('an', b.dataset.s === P.sprung);

  /* `?hoehe=0` steigt FLACH ein, ohne Anlaufbewegung: ein Bildschirmfoto soll
     den Zustand zeigen, nicht den Weg dorthin. */
  hoeheSchalten(!!P.hoehe, true);
  if (P.flach >= 0) { hoehenRegler.value = P.flach / 100; flachLaeuft = false; }

  /* Das Wissen wird EINMAL vor dem ersten Bild gerechnet — die Kacheln lesen
     es beim Bauen, und ohne diese Reihenfolge stuenden die ersten Kacheln mit
     leerem Wissen da, bis sie zufaellig neu gebaut werden. */
  /* Die Wissensebene ist Ebene 1, wenn es sie gibt — die Spielauflösung. Das
     Lager startet in der Mitte der Höhenregion, weil ein Labor ohne Relief
     nichts über Relief aussagen kann. */
  wEbene = EBENEN.find(L => L.id === 1) || EBENEN[0];
  {
    const [lc, lr] = zelleBeiKm(blick.x, blick.z, seiteVon(wEbene));
    const [sc, sr] = lagerSuchen(wEbene,
      Math.max(0, Math.min(wEbene.cols - 1, lc)),
      Math.max(0, Math.min(wEbene.rows - 1, lr)));
    lagerC = sc; lagerR = sr;
  }
  linseSchreiben();
  /* Eine Kette von Lagern wird NACHEINANDER bezogen. Das ist nicht Bequem-
     lichkeit: `vergessen` ist ein Zustand mit Vorgeschichte — es gibt ihn nur,
     wenn ein Feld schon einmal bekannt WAR. Ohne diese Kette waere der dritte
     Nebelzustand nur durch Klicken erreichbar, und ein Bildschirmfoto kann
     nicht klicken. */
  const kette = (P.lager || '').split(';').map(s => s.trim()).filter(Boolean);
  if (kette.length) {
    for (const glied of kette) {
      const t = glied.split(',').map(Number);
      if (t.length !== 2 || !t.every(isFinite)) continue;
      lagerC = t[0]; lagerR = t[1];
      wissenRechnen();
    }
  } else wissenRechnen();
  linseSchalten(P.linse === 'wissen', true);
  if (P.wissen >= 0) { wissenLinse.value = P.wissen / 100; linseLaeuft = false; }
  wissenPaneSchreiben();

  bereit = true;
  groesseStellen();

  if (P.zelle) {
    const t = P.zelle.split(',').map(Number);
    if (t.length === 2 && t.every(isFinite)) {
      const L = letzteEbene, s = seiteVon(L);
      const d = zelleLesen(L, t[0], t[1]);
      if (d) {
        const [x, z] = mitteKm(t[0], t[1], s);
        blick.set(x, 0, z);
        kameraStellen(); weltStellen();
        waehlen({ c:t[0], r:t[1], ebene:L.id, d });
      }
    }
  }

  if (P.gitter) {
    matGelaende.wireframe = true; matWasser.wireframe = true;
  }

  requestAnimationFrame(schleife);
  if (P.still) zeichnen();
  SOT.debug && SOT.debug(P);
  window.__labor = true;
  document.getElementById('not').classList.add('hid');
}

if (window.ResizeObserver) new ResizeObserver(() => { if (bereit) groesseStellen(); }).observe(buehne);
window.addEventListener('resize', () => { if (bereit) groesseStellen(); });

anlauf();
</script>
