<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feld-Labor 3D — durchgehender Zoom</title>
<link rel="stylesheet" href="../kit/sot.css">
<style>
/* ============================================================================
   FELD-LABOR 3D v1 — EINE KAMERA VON DER WELT BIS ZUM FELD

   Die Frage dieses Labors ist EINE, und sie ist keine Kunstfrage:

     Kann derselbe Renderer, dieselbe Kamera und derselbe Datensatz die
     Weltkarte (2,1 Mio. Zellen), das Brett (~500 Zellen) und den Feld-Explorer
     (ein Feld) tragen — ohne Modus-Umschaltung, nur durch Zoom?

   Wenn ja, sind Weltkarte, Brett und Explorer nicht drei Bildschirme, sondern
   drei ENTFERNUNGEN. Dann fällt die Frage "wie kommt man von der Karte ins
   Spiel" ersatzlos weg, und der Nebel des Ungespielten, das Brett und der
   Hero-Hex des Explorers sind dieselbe Zelle in drei Auflösungen.

   ---------------------------------------------------------------------------
   WARUM NICHT `feld-labor-v1` WEITERBAUEN

   `feld-labor-v1` ist sieben DOM-Sechsecke mit `clip-path`, vier Schichten und
   sieben festen Slots. Sein Befund — die vier Boxecken eines spitz-oben-Hex
   sind leer, Slots gehoeren auf einen Ring bei ~22 % Hoehe, Marken in `em`
   statt in Pixeln — ist eine AUSSAGE UEBER DIE ANATOMIE und gilt weiter. Was
   NICHT weitergilt, ist das Mittel: DOM traegt ~880 Zellen (die heutige Welt in
   `world.ts`), aber Ebene 1 der Pipeline hat 85 806 und Ebene 2 hat 2 126 280.
   Darum three.js — und darum ein neues Labor statt eines Umbaus: v1 bleibt als
   Gegenprobe stehen, gegen die man messen kann.

   ---------------------------------------------------------------------------
   DER BEFUND, DER DAS GANZE TRAEGT (gemessen, nicht vermutet)

   Ein Bildschirm von 1400x900 fasst bei 52 px Hexbreite ~540 Zellen; an der
   Ebenengrenze (~9 px) ~15 500. Der Renderer zeichnet also NIE mehr als
   ~15 000 Zellen, egal wie gross die Karte ist. "Millionen von Plaettchen" ist
   damit ein DATENPROBLEM (Kacheln nachladen, dekodieren, auswerfen), kein
   Zeichenproblem — und die Datenhaelfte hat die Pipeline schon geloest: sie
   liefert 32x32-Kacheln, base64-Uint8Array, leere Kacheln entfallen.

   Dieses Labor tut deshalb genau zwei Dinge, die `rhein-tiles-v4` nicht tut:
   es baut aus einer Kachel GEOMETRIE statt Pixel, und es wirft sie wieder weg.

   ---------------------------------------------------------------------------
   DIE DREI STUFEN — sie NEHMEN WEG, sie verkleinern nicht

   Dieselbe Haltung wie die Detailstufen in `feld-labor-v1` (S/M/L nehmen Slots
   weg), nur eine Ebene tiefer, beim Bauen:

     FERN   < 12 px/Hex   Die ganze Kachel ist EIN Rechteck mit einer Textur,
                          in die 1024 Sechsecke gemalt sind. Kein Licht, keine
                          Hoehe, ein Zeichenaufruf.
     MITTEL 12-46 px/Hex  Die Kachel wird GEOMETRIE: Deckflaeche + Schuerze,
                          Hoehe aus dem Hoehenlayer, Kontaktverschattung in die
                          Eckenfarben gebacken. Eine verschmolzene Geometrie je
                          Kachel — 1024 Plaettchen, ein Zeichenaufruf.
     NAH    >= 46 px/Hex  Dieselbe Geometrie mit Fase und zwei Flankenbaendern —
                          der Bauplan aus `plaettchen-pfade-v1`, unveraendert.
                          Dazu die MARKEN.

   ---------------------------------------------------------------------------
   DIE MARKEN BLEIBEN HTML — und das ist der zweite Befund

   Die Slots (Krone, Wange, Ferse, Fuss, Zahl) werden NICHT in die Szene
   gezeichnet. Sie liegen als HTML ueber der Leinwand und haengen an der
   PROJIZIERTEN Feldmitte. Das ist dieselbe Entscheidung wie im Diorama und in
   der Arena — "three.js macht die Miniaturwelt, die Bedienung macht der
   Baukasten" — und sie hat hier eine Folge, die zaehlt:

     Die CSS-Arbeit aus `feld-labor-v1` UEBERLEBT den Rendererwechsel.

   Slots bleiben Prozentversaetze auf einem Ring, Marken bleiben in `em`
   gegenueber der gemessenen Hexbreite, Symbole bleiben SVG aus `SOT.icon`. Was
   sich aendert, ist allein die Quelle der Mitte: nicht mehr `offsetLeft`,
   sondern `Vector3.project()`. Das Budget ("hoechstens zwei Figuren, drei
   Artenpunkte, ein Ereignis, sonst +n") wird hier von der Stufe erzwungen —
   unterhalb von NAH gibt es gar keine Marken, also kann es kein Gedraenge
   geben.

   ---------------------------------------------------------------------------
   WAS ERFUNDEN IST, UND WAS NICHT

   ECHT: Gelaende, Abschnitt und Hoehe kommen aus `rhein-tiles-v4.data.js`, dem
   gebackenen Ergebnis der Pipeline — Sonny-DTM, OSM-Rhein, OSM-Seen. Die drei
   Ebenen, die 32x32-Kacheln und die Hexgeometrie sind unveraendert die der
   Pipeline; die Formeln stehen doppelt in `bake.mjs` und in `rhein-tiles-v4`
   und hier ein drittes Mal, identisch.

   ERFUNDEN: alles Spielerische — Menschen, Ereignisse, Arten, Feldwert. Es ist
   aus (c,r) gewuerfelt, damit es beim Zurueckkommen dasselbe ist, und es ist
   ueberall als "erfunden" ausgezeichnet. Es steht hier NUR, damit die Marken
   etwas zu zeigen haben; dieses Labor entscheidet nichts ueber Spielinhalte.

   ---------------------------------------------------------------------------
   ES BRAUCHT EINEN SERVER

   ES-Module laedt Chrome unter file:// nicht. `npx http-server ..` im Ordner
   `prototype`, dann `http://localhost:8080/drafts/feld-labor-threejs-v1.html`.
   Fuer Bildschirmfotos `--allow-file-access-from-files`. Laeuft der Modulteil
   nicht an, SAGT die Seite das — sie bleibt nicht weiss.
   ========================================================================= */

/* ---------------------------------------------------------------------------
   Die Palette. Zwei Familien, und die Trennung ist Absicht:

   `--k-*` sind die GELAENDEFARBEN der Karte — sie gelten auf jeder Stufe und
   sind das, was die Ferntextur malt. `--d-*` ist die Diorama-Palette aus
   `plaettchen-pfade-v1`, unveraendert uebernommen; sie faerbt die Ecken auf den
   nahen Stufen. Beide sind Tokens, kein #hex im JS — nur darum dreht `?night`
   die ganze Welt mit, Ferntextur eingeschlossen.
   --------------------------------------------------------------------------- */
:root{
  /* Gelaende der Karte — Reihenfolge = Terrain-Index aus bake.mjs */
  --k-flach:#7FA83E; --k-ufer:#6E9A45; --k-berg:#9AA0A0; --k-fluss:#4E9FD6;
  --k-see:#3B7FB4; --k-meer:#2E6E9E; --k-zufluss:#5FAEDD; --k-hang:#88A85A;
  /* Der Nebel. Nicht Grau, sondern das Papier selbst, eine Spur kuehler: ein
     unbegangenes Feld ist kein beschaedigtes Feld, es ist ein unbeschriebenes. */
  --k-nebel:#D9CFB4;

  /* Diorama — Gras, fuenf benachbarte Toene. Streuung je Ecke macht das Gemalte. */
  --d-gras-1:#6F9D32; --d-gras-2:#78A83A; --d-gras-3:#86BD63;
  --d-gras-4:#66952F; --d-gras-5:#8BAE45;
  --d-wiese-1:#5E8F31; --d-wiese-2:#6B9B38; --d-wiese-3:#7EB65B;
  --d-wald-boden-1:#4F7C2E; --d-wald-boden-2:#5C8A36; --d-wald-boden-3:#69973C;
  --d-hoch-1:#8EC468; --d-hoch-2:#9ACF74; --d-hoch-3:#7FB65C;
  --d-flanke:#4D7C3A; --d-erde:#6B5236; --d-erde-tief:#42301D;
  --d-strata:#9AA0A0;
  --d-fels-1:#B6BABB; --d-fels-2:#8F9394; --d-fels-3:#CFD2D3;
  --d-sand-1:#DDC98F; --d-sand-2:#CDB67E; --d-sand-3:#C2AB73;
  --d-sand-flanke:#AD9662;
  --d-wasser:#4E9FD6; --d-wasser-tief:#2E6E9E;
  --d-papier:#ECE0C8; --d-boden:#B7A079;
  --d-sonne:#FFF3DE; --d-fuell:#BFD7FF; --d-rueck:#7E9A55;
  --d-warm:#FFF0DC; --d-kuehl:#D6E2FF;
}
/* Nacht ist eine Spielmechanik, keine Vorliebe — die Welt kippt mit. */
body.night{
  --k-flach:#2F4B2A; --k-ufer:#294526; --k-berg:#404849; --k-fluss:#1E4C74;
  --k-see:#173042; --k-meer:#123049; --k-zufluss:#28587F; --k-hang:#33502D;
  --k-nebel:#141C22;

  --d-gras-1:#2A4426; --d-gras-2:#2F4B2A; --d-gras-3:#37542F;
  --d-gras-4:#264020; --d-gras-5:#33502D;
  --d-wiese-1:#243D21; --d-wiese-2:#294526; --d-wiese-3:#2F4C2A;
  --d-wald-boden-1:#1E3A1D; --d-wald-boden-2:#234121; --d-wald-boden-3:#284826;
  --d-hoch-1:#3B5A33; --d-hoch-2:#436439; --d-hoch-3:#35522E;
  --d-flanke:#1E3320; --d-erde:#2C2318; --d-erde-tief:#191309;
  --d-strata:#404849;
  --d-fels-1:#4A5254; --d-fels-2:#3A4143; --d-fels-3:#5A6365;
  --d-sand-1:#5B5138; --d-sand-2:#524931; --d-sand-3:#48402B;
  --d-sand-flanke:#3C3524;
  --d-wasser:#1E4C74; --d-wasser-tief:#123049;
  --d-papier:#0F1A22; --d-boden:#070C10;
  --d-sonne:#B8CBF0; --d-fuell:#4E6C96; --d-rueck:#20301F;
  --d-warm:#FFE6C0; --d-kuehl:#C3D4FF;
}
body[data-zeit=morgen]{ --d-sonne:#FFD9C0; --d-fuell:#CFDCFF; --d-warm:#FFE2C4; }
body[data-zeit=abend] { --d-sonne:#FFCB93; --d-fuell:#B9CBF5; --d-warm:#FFDDAF; }

/* ------------------------------------------------------------------ Buehne ---*/
html,body{height:100%;}
body{overflow:hidden;}
.app{height:100dvh;display:flex;flex-direction:column;padding:10px 12px 12px;
     box-sizing:border-box;}
.app > header.appbar{flex:0 0 auto;}

/* Ab 900px schiebt der Explorer die Buehne SCHMALER, statt sie zu verdecken —
   die Nebenwirkung gehoert zum Prinzip: das schmalere Brett senkt die Stufe,
   und die Information wandert dorthin, wo Platz ist. */
#raum{flex:1 1 auto;min-height:0;display:flex;gap:10px;}
#buehne{position:relative;flex:1 1 auto;min-width:0;border-radius:var(--r-lg);
        overflow:hidden;background:var(--d-papier);border:1px solid var(--line);}
#gl{display:block;width:100%;height:100%;cursor:grab;}
#gl.zieht{cursor:grabbing;}

/* --------------------------------------------------------------- Die Marken ---
   HTML ueber der Welt. Die Slots sind Prozentversaetze auf einem RING bei ~22 %
   Hoehe — die vier Boxecken eines spitz-oben-Sechsecks liegen ausserhalb der
   Silhouette, das war der erste Befund von `feld-labor-v1` und er gilt in 3D
   unveraendert, weil er ueber die FORM redet und nicht ueber den Renderer.
   Bemessen wird in `em` gegenueber der gemessenen Hexbreite, nie in festen
   Pixeln: feste Groessen ersticken kleine Felder.
   --------------------------------------------------------------------------- */
#marken{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.mk{position:absolute;transform:translate(-50%,-50%);line-height:1;
    will-change:transform;}
.mk .slot{position:absolute;transform:translate(-50%,-50%);display:flex;
          align-items:center;gap:.18em;white-space:nowrap;}
.mk .krone{left:78%;top:22%;}
.mk .wange{left:22%;top:22%;}
.mk .ferse{left:22%;top:78%;}
.mk .fuss {left:50%;top:87%;}
.mk .zahl {left:78%;top:78%;}
.mk .scheibe{width:1.15em;height:1.15em;border-radius:50%;display:grid;
             place-items:center;background:color-mix(in srgb,var(--panel) 88%,transparent);
             border:1px solid color-mix(in srgb,var(--ink) 34%,transparent);
             box-shadow:0 1px 2px rgba(0,0,0,.35);}
.mk .scheibe svg{width:.78em;height:.78em;display:block;color:var(--ink);}
.mk .zahl b{font-family:var(--f-mono);font-size:.92em;font-variant-numeric:tabular-nums;
            color:var(--ink);background:color-mix(in srgb,var(--panel) 84%,transparent);
            border-radius:var(--r-pill);padding:.06em .38em;
            border:1px solid color-mix(in srgb,var(--ink) 26%,transparent);}
.mk .punkt{width:.42em;height:.42em;border-radius:50%;border:1px solid rgba(0,0,0,.35);}
.mk .wange .scheibe{border-color:var(--ember);}
.mk .fuss svg{width:1em;height:1em;color:var(--bone);
              filter:drop-shadow(0 1px 1px rgba(0,0,0,.55));}
.mk.gewaehlt::after{content:'';position:absolute;left:50%;top:50%;
  width:1.05em;height:1.05em;transform:translate(-50%,-50%);border-radius:50%;
  box-shadow:0 0 0 2px var(--ember),0 0 12px 2px color-mix(in srgb,var(--ember) 60%,transparent);}

/* ------------------------------------------------------------------- HUD ---*/
.hud{position:absolute;inset:0;pointer-events:none;display:flex;padding:10px;gap:8px;}
.hud, .hud .links, .hud .rechts, .hud .fuss{pointer-events:none;}
.hud .stempel, .hud .pane{pointer-events:auto;}
.hud .links{display:flex;flex-direction:column;gap:8px;align-items:flex-start;
            flex:1;min-width:0;}
.hud .rechts{display:flex;flex-direction:column;gap:8px;align-items:stretch;
             width:212px;flex:none;overflow-y:auto;max-height:100%;}
.hud .fuss{margin-top:auto;}
.hud .pane{background:color-mix(in srgb,var(--panel) 92%,transparent);
           backdrop-filter:blur(3px);padding:9px 10px;border:1px solid var(--line);
           border-radius:var(--r-lg);}
.stempel{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;
         text-transform:uppercase;color:var(--ink2);
         background:color-mix(in srgb,var(--panel) 80%,transparent);
         border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 9px;
         backdrop-filter:blur(3px);white-space:nowrap;}
.blabel{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;
        text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:6px;}
.blabel .co{margin-left:auto;color:var(--ember);letter-spacing:.06em;}

/* Der Messstreifen. Ein Labor, das "Millionen" behauptet, muss zaehlen — sonst
   ist es eine Meinung mit Sechsecken. */
#messen{font-family:var(--f-mono);font-size:10px;line-height:1.5;color:var(--ink2);}
#messen table{border-collapse:collapse;width:100%;}
#messen td{padding:1px 0;}
#messen td.n{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;}
#paneWissen .zeile{font-size:11px;}
#paneWissen .summe{border-top:1px solid var(--line);margin-top:5px;padding-top:5px;}
.pkt{display:inline-block;width:.62em;height:.62em;border-radius:50%;margin-right:.5em;
     vertical-align:baseline;border:1px solid rgba(0,0,0,.3);}
.pkt.bekannt{background:var(--k-flach);}
.pkt.gesehen{background:color-mix(in srgb,var(--k-flach) 45%,var(--k-nebel));}
.pkt.vergessen{background:color-mix(in srgb,var(--k-flach) 16%,var(--k-nebel));}

/* Die Stufenleiste zeigt, WELCHE Stufe gerade zeichnet — die Grenzen sind der
   eigentliche Pruefgegenstand, also gehoeren sie ins Bild und nicht ins Log. */
.stufen{display:flex;gap:3px;margin-top:7px;}
.stufen div{flex:1;height:4px;border-radius:2px;background:var(--line);}
.stufen div.an{background:var(--ember);}
.stufennamen{display:flex;gap:3px;margin-top:3px;font-family:var(--f-mono);
             font-size:8px;letter-spacing:.1em;color:var(--ink2);}
.stufennamen span{flex:1;text-align:center;}
.stufennamen span.an{color:var(--ember);}

/* --------------------------------------------------------- Der Feld-Explorer ---
   NICHT-DIEGETISCH: ein Werkzeug, das erklaert und rechnet, kein Ort der Welt.
   Darum ein eigenes Register — Mono-Beschriftungen, Haarlinien,
   Datenblatt-Anmutung — statt der warmen Karten der Nacht-Ereignisse.
   --------------------------------------------------------------------------- */
#explorer{width:326px;flex:none;background:var(--panel);border:1px solid var(--line);
          border-radius:var(--r-lg);overflow:auto;display:flex;flex-direction:column;}
#explorer.zu{display:none;}
.ex-kopf{display:flex;align-items:center;gap:8px;padding:9px 11px;
         border-bottom:1px solid var(--line);position:sticky;top:0;
         background:var(--panel);z-index:2;}
.ex-kopf h2{font-size:13px;margin:0;flex:1;}
.ex-kopf .adr{font-family:var(--f-mono);font-size:9px;color:var(--ink2);
              letter-spacing:.1em;}
.ex-hero{padding:12px;display:flex;justify-content:center;
         border-bottom:1px solid var(--line);}
.ex-hero .hx{width:106px;aspect-ratio:1/1.1547;
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
  position:relative;display:grid;place-items:center;}
.ex-hero .hx svg{width:42%;height:42%;color:rgba(0,0,0,.42);}
.ex-abschnitt{padding:9px 11px;border-bottom:1px solid var(--line);}
.ex-abschnitt h3{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;
                 text-transform:uppercase;color:var(--ink2);margin:0 0 6px;}
.zeile{display:flex;gap:8px;font-size:11.5px;padding:2px 0;align-items:baseline;}
.zeile .w{flex:1;color:var(--ink2);}
.zeile .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink);}
/* Der Feldwert ist ein LEDGER, keine Zahl: jede Zeile nennt ihre Quelle und
   ihren Beitrag, unwirksame Posten stehen ausgegraut dabei. Der Spieler soll
   die Summe NACHVOLLZIEHEN, nicht glauben. */
.ledger .zeile.tot{opacity:.42;}
.ledger .zeile.tot .v{text-decoration:line-through;}
.ledger .summe{border-top:1px solid var(--line);margin-top:5px;padding-top:5px;
               font-weight:600;}
.ex-fuss{margin-top:auto;padding:9px 11px;border-top:1px solid var(--line);
         display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.erfunden{font-size:9px;color:var(--ink2);font-style:italic;padding:0 11px 9px;
          line-height:1.5;}

@media (max-width:900px){
  /* Mobil VOLLBILD — kein halbes Panel auf einem Bildschirm, der fuer zwei
     Spalten nie Platz hatte. */
  #explorer{position:fixed;inset:0;width:auto;z-index:60;border-radius:0;}
  .hud .rechts{width:auto;flex-direction:row;order:2;overflow-x:auto;
               align-items:flex-start;}
  .hud .rechts > *{flex:none;min-width:180px;}
  .hud{flex-direction:column;}
  .hud .links{order:1;}
}

#not{position:absolute;inset:0;display:grid;place-items:center;padding:24px;
     background:color-mix(in srgb,var(--bg) 90%,transparent);z-index:80;}
#not .pane{max-width:580px;background:var(--panel);border:1px solid var(--line);
           border-radius:var(--r-lg);padding:16px 18px;}
#not code{font-family:var(--f-mono);font-size:11px;}
</style>
</head>
<body>

<div class="app">
  <header class="appbar ruled">
    <div class="brand">FELD-LABOR 3D<small>eine Kamera von der Welt bis zum Feld</small></div>
    <div class="hright">
      <div class="seg" id="segSprung">
        <button data-s="welt" class="small">Welt</button>
        <button data-s="brett" class="small">Brett</button>
        <button data-s="feld" class="small">Feld</button>
      </div>
      <button id="bLinse" class="small ghost" title="Wissenslinse: nur begangenes Land traegt sein Relief (W)"></button>
      <button id="bHoehe" class="small ghost" title="Gelaendehoehe an- und abschalten (H)"></button>
      <button id="bZeit" class="small ghost" title="Tageszeit weiterschalten"></button>
      <button id="bSicht" class="small ghost" title="Schraegsicht / Aufsicht">Aufsicht</button>
    </div>
  </header>

  <div id="raum">
    <div id="buehne">
      <canvas id="gl"></canvas>
      <div id="marken"></div>
      <div class="hud">
        <div class="links">
          <div class="stempel" id="stempel"></div>
          <div class="fuss"><div class="stempel" id="hinweis">Ziehen schiebt · Rad zoomt · Klick oeffnet das Feld</div></div>
        </div>
        <div class="rechts">
          <div class="pane hid" id="paneWissen"></div>
          <div class="pane" id="paneStufe"></div>
          <div class="pane" id="paneMessen"><div id="messen"></div></div>
        </div>
      </div>
      <div id="not" class="hid">
        <div class="pane">
          <b>Das Labor ist nicht gestartet.</b>
          <p class="note" id="notgrund"></p>
        </div>
      </div>
    </div>
    <aside id="explorer" class="zu"></aside>
  </div>
</div>

<script src="../kit/sot.js"></script>
<script src="../kit/sot-icons.js"></script>
<script src="../kit/sot-hex.js"></script>
<script src="rhein-tiles-v4.data.js"></script>
<script>
/* Wenn der Modulteil nicht anlaeuft (haeufigste Ursache: Chrome verweigert
   ES-Module unter file://), soll die Seite es SAGEN statt weiss zu bleiben.
   Ein Fehler in der Zeichenschleife hinterliesse sonst ein STEHENDES Bild und
   saehe aus, als waere die Seite fertig. */
window.__labor = false;
function notMelden(html){
  var n = document.getElementById('not'), g = document.getElementById('notgrund');
  g.innerHTML = html; n.classList.remove('hid');
}
window.addEventListener('error', function (ev) {
  notMelden('<b>Laufzeitfehler.</b><br><code>' +
    String((ev.error && ev.error.stack) || ev.message).slice(0, 700) + '</code>');
});
if (!window.RHEIN_TILESET) {
  notMelden('<b>Das Tileset fehlt.</b> <code>rhein-tiles-v4.data.js</code> liegt ' +
    'nicht neben dieser Datei oder wurde nicht geladen. Es entsteht mit ' +
    '<code>node pipeline/bake.mjs</code>.');
}
setTimeout(function () {
  if (window.__labor || !window.RHEIN_TILESET) return;
  notMelden('Der Modulteil hat sich nicht gemeldet. Unter <code>file://</code> ' +
    'verweigert Chrome ES-Module (Herkunft "null"). Zwei Wege:<br><br>' +

  { id:'fluss',   name:'Fluss',      tok:'--k-fluss',   zeichen:'furt',      oben:'kies',  flanke:'sand', wasser:true  },

/* ---- Kachel-Cache: base64 -> Uint8Array erst bei Sichtkontakt.
   Identisch zu `rhein-tiles-v4`, absichtlich: zwei Konsumenten desselben
   Formats duerfen es nicht verschieden lesen. ---- */
const rohCache = new Map();

function kachelRoh(L, tx, ty) {
  const key = L.id + ':' + tx + ',' + ty;

  if (!k) return { t:0, s:0, e:0 };
  const i = (r % L.tile) * L.tile + (c % L.tile);

/* ============================================================================

   Spitz-oben, odd-r — DIE Konvention des Projekts. Die Formeln sind Zeichen

   Zoomstufen-Labor: nur in Weltkoordinaten passen drei Ebenen ueberhaupt

   sechseckige Loecher da. Mit FALLENDEM Winkel stimmt alles von selbst. */

const MENSCHEN = [

const EREIGNISSE = [

  { id:'kaelte',     name:'Kaelteeinbruch', icon:'frost' },
  { id:'wild',       name:'Wildwechsel', icon:'hirsch' }

const ARTEN = ['--d-nadel-2', '--d-beere', '--d-busch'];

function erfunden(c, r, T) {
  const rnd = rngFeld(c, r, 11);

function ledgerVon(c, r, T, ext, hoeheM) {

   3b · DAS WISSEN — bekanntes Land ist begangenes Land

   Die Wissenslinse zeigt nicht eine zweite Grösse, sondern DIESELBE: die Höhe
   des Geländes. Sie zeigt sie nur dort, wo jemand war. Das ist die ehrliche
   Fassung des Reliefs einer Karte — **das Relief einer Karte ist das, was
   vermessen wurde.** Man kennt den Berg nicht, bevor man ihn begangen hat.

           Eine FLÄCHE — man kennt sie ganz.
     FERN  wie weit Wege zu anderen ORTEN reichen. LINIEN mit Sichtstreifen —

   Flächen.** Ein Modell, das nur den Erreichbarkeits-Kreis kennt, behauptet,
   ein Händler kenne alles im Umkreis von 200 km. Er kennt einen Weg.

   ---------------------------------------------------------------------------
   VIER ZUSTÄNDE, und der vierte ist der interessante

     bekannt    volle Höhe        begangen
     gesehen    gedrückte Höhe    vom Grat aus gesehen, nie betreten
     vergessen  fast flach        war bekannt, ist es nicht mehr — behält

   der gerade gezeichneten Ebene laufen, änderte sich beim Zoomen, was man

   Suche läuft darum immer auf Ebene 1 (2 km/Feld, die Spielauflösung), und

/* Ein Minimum-Heap. Ohne ihn ist die Kostensuche eine lineare Suche über
   85 806 Felder je Schritt, und das Verschieben des Lagers ruckelt sichtbar. */
class Halde {
  constructor() { this.a = []; }
  rein(k, v) {
    const a = this.a; a.push([k, v]);
    let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; }
  }
  raus() {
    const a = this.a; if (!a.length) return null;
    const top = a[0], last = a.pop();
    if (a.length) {

      for (;;) {
        const l = 2*i+1, r = l+1; let m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l;
        if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break;
        [a[m], a[i]] = [a[i], a[m]]; i = m;
      }
    }
    return top;
  }
  get leer() { return this.a.length === 0; }
}

/* Ein Feld, das keine Kachel hat oder weder Gelände noch Höhe trägt, ist
   NICHTS — kein Flachland. Ohne diese Unterscheidung läuft die Kostensuche
   über die halbe Nordsee spazieren. */
function wGelaende(L, c, r) {
  if (c < 0 || r < 0 || c >= L.cols || r >= L.rows) return -1;
  const k = kachelRoh(L, Math.floor(c / L.tile), Math.floor(r / L.tile));
  if (!k) return -1;
  const i = (r % L.tile) * L.tile + (c % L.tile);
  const t = k.t[i], e = k.e ? k.e[i] : 0;
  if (!t && !e) return -1;

}

const kmVonLonLat = (lon, lat) => [(lon - TS.cfg.lon0) * TS.cfg.kmx, (TS.cfg.lat1 - lat) * TS.cfg.kmy];

   trifft im Alpenrheintal zuverlässig eine Bergflanke — von dort gerechnet
   kostet der erste Schritt talwärts so viel, dass das Heim-Gebiet ein Fleck
   am Hang wird und das Modell seine eigene Aussage nicht zeigt. Darum ein
   Sprung ins nächste Ufer- oder Flussfeld: eine Zeile, die eine ganze
   Fehlinterpretation verhindert. */
function lagerSuchen(L, c0, r0) {
  const gut = t => t === 1 || t === 3 || t === 0;   /* Ufer · Fluss · Flachland */
  for (let ring = 0; ring < 40; ring++)
    for (const f of (ring === 0 ? [{ c:c0, r:r0 }] : SOT.hex.ring(c0, r0, ring))) {
      const t = wGelaende(L, f.c, f.r);
      if (t >= 0 && gut(t)) return [f.c, f.r];

function wissenRechnen() {
  const L = wEbene;
  const n = L.cols * L.rows;

    /* Float64, nicht Float32 — und das ist kein Geiz an der falschen Stelle,
       sondern ein Fehler, der acht Sekunden gekostet hat. Mit Float32 wird der
       gespeicherte Wert beim Ablegen gerundet; der Schluessel in der Halde ist
       aber ein Double. Die Pruefung auf veraltete Eintraege vergleicht dann
       zwei Zahlen, die sich um ein halbes ULP unterscheiden, verwirft gueltige
       Knoten und laesst dieselben Felder wieder und wieder in die Halde
       laufen — 5 Mio. Entnahmen fuer 24 846 Felder, und der Browser steht.
       Mit Double ist der abgelegte Wert EXAKT der Schluessel, und der
       Vergleich darf strikt sein. */

    wStand = new Uint8Array(n); wJeBekannt = new Uint8Array(n);
