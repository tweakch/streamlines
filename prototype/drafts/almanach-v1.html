<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almanach — was im Tal lebt, liegt und gebaut wird</title>
<!--
  ALMANACH v1 — der Inhaltskatalog des Spiels, als erkundbares Nachschlagewerk.
  Jeder Eintrag: Darstellung (Hex/Karte/Glyphe), Belegstatus, was er gibt,
  WO und WANN er zu finden ist — und „Der Zug": der Satz, der aus den Daten
  folgt („das Lager am Waldrand, der Jäger am Hang → +2 und die Fährte").
  Später zweimal portiert: Datentabellen → app/src/stromlinien/data/,
  Ansicht → In-Game-Almanach (Einträge öffnen sich durch Begegnung, P3).
-->
<link rel="stylesheet" href="../kit/sot.css">
<style>
  /* Nur was dieser Prototyp allein braucht. */
  .intro{margin:10px 0 14px;}
  .gtitle{font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
          color:var(--ink2);margin:18px 0 8px;display:flex;align-items:center;gap:8px;}
  .gtitle::after{content:"";flex:1;height:1px;background:var(--line);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:10px;}
  /* Alles lesbar ohne Klick: der Eintrag IST die Karteikarte. */
  .eintrag{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);
           padding:14px;display:flex;gap:14px;align-items:flex-start;}
  .eintrag .etext{flex:1;min-width:0;}
  .eintrag .kopf{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .eintrag .kopf b{font-size:14px;line-height:1.2;}
  .eintrag .sub{display:block;font-size:11px;color:var(--ink2);margin:2px 0 6px;}
  .eintrag .txt{font-size:12px;line-height:1.5;margin:0 0 8px;}
  .eintrag .kv{font-size:11px;}
  .eintrag .kv b{text-align:right;}
  .eintrag .chips{margin-top:8px;}
  .eintrag.blitz{outline:2px solid var(--ember);outline-offset:2px;}
  /* Hexfeld: pointy-top, Farbe über Token (--tc) */
  .hexon{width:56px;height:64px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
         background:var(--tc,var(--tile));display:flex;align-items:center;justify-content:center;
         color:var(--hc,var(--ink));flex-shrink:0;position:relative;}
  .hexon svg{width:32px;height:32px;}
  /* .mark trägt das SVG des Vorkommens/Merkmals im Hexfeld. Bemessen als
     BOX (nicht font-size): ein Icon sitzt auf keiner Grundlinie. */
  .hexon .mark{position:relative;width:26px;height:26px;display:flex;
               align-items:center;justify-content:center;}
  .hexon .mark svg{width:100%;height:100%;display:block;}
  .hexon .mark.leer{font-size:22px;line-height:1;}
  /* Gewässer: das Band im Feld — der Eintrag wird als das Ding selbst
     gerendert, und das Ding ist LAND mit Wasser hindurch (gewaesser-labor,
     erkundung-v3). Klassenfarben aus den Wasser-Tokens gemischt. */
  body{--w-bach:color-mix(in srgb,var(--river) 62%,var(--bg));
       --w-kfluss:var(--river);
       --w-gfluss:var(--riverdeep);
       --w-saum:color-mix(in srgb,var(--kies) 72%,var(--bg));}
  .hexon .bandv{position:absolute;inset:0;width:100%;height:100%;}
  /* Spielkarte: das Rechteck */
  .spielkarte{width:76px;aspect-ratio:5/7;border:1.5px solid var(--line);border-radius:8px;
              background:var(--bone);display:flex;flex-direction:column;align-items:center;
              justify-content:center;gap:4px;padding:6px 4px;flex-shrink:0;position:relative;}
  .spielkarte svg{width:30px;height:30px;color:var(--ink);}
  .spielkarte .kart{font-family:var(--f-mono);font-size:7px;letter-spacing:.1em;
                    text-transform:uppercase;color:var(--ink2);}
  .spielkarte .kch{width:30px;height:30px;display:flex;align-items:center;justify-content:center;}
  .spielkarte .kch svg{width:100%;height:100%;display:block;}
  .spielkarte .kch.leer{font-size:24px;line-height:1;}
  .spielkarte.n{background:var(--panel2);border-color:var(--ink2);}
  /* Mensch: der Kreis */
  .wesen{width:64px;height:64px;border-radius:50%;border:1.5px solid var(--line);
         background:var(--bone);display:flex;align-items:center;justify-content:center;
         font-size:28px;flex-shrink:0;}
  .wesen svg{width:34px;height:34px;color:var(--ink);}
  .wesen>svg{width:34px;height:34px;}
  /* Flora: das Fünfeck */
  .pent{width:60px;height:58px;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);
        background:var(--wald);color:var(--ink);display:flex;align-items:center;
        justify-content:center;flex-shrink:0;}
  .pent svg{width:32px;height:32px;margin-top:4px;}
  /* Fauna: das Quadrat */
  .quad{width:56px;height:56px;border-radius:4px;background:var(--kies);color:var(--ink);
        display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .quad svg{width:34px;height:34px;}
  /* Nebel des Unbegegneten (?nebel) */
  .eintrag.unbegegnet{opacity:.5;}
  .eintrag.unbegegnet .hexon,.eintrag.unbegegnet .pent,.eintrag.unbegegnet .quad{
    background:var(--tile);color:var(--tileink);}
  .eintrag.unbegegnet .mark.leer{font-size:22px;}
  .zug{border-left:3px solid var(--ember);background:var(--emberglow);
       border-radius:0 var(--r-sm) var(--r-sm) 0;padding:8px 11px;margin:8px 0 0;font-size:12px;line-height:1.5;}
  .zug::before{content:"DER ZUG";display:block;font-family:var(--f-mono);font-size:9px;
               letter-spacing:.14em;color:var(--ember);margin-bottom:3px;}
</style>
</head>

/* ================= PARAMS & NEBEL ================= */
const P=SOT.params({
  typ:    {t:'enum',values:['gelaende','karten','menschen','flora','fauna'],def:'gelaende',help:'geöffneter Reiter'},
  eintrag:{help:'zum Eintrag springen (id, z. B. rothirsch)'},
  nebel:  {t:'flag',help:'Nebel des Unbegegneten: nur begegnete Einträge sind lesbar (In-Game-Vorschau, P3)'},
});
const BEGEGNET=new Set(['flach','ufer','fluss','lager','auenwald','sammlerin','jaeger','hasel','rothirsch']);
const alle={},tabVon={};
const FORM={menschen:'wesen',flora:'pent',fauna:'quad'};
Object.keys(A).forEach(sek=>A[sek].forEach(e=>{
  alle[e.id]=e;
  e.form=e.hex?'hex':e.karte?'karte':FORM[sek];
  tabVon[e.id]=(sek==='plaettchen'||sek==='vorkommen'||sek==='gewaesser')?'gelaende':sek;
}));
const sichtbar=e=>!P.nebel||BEGEGNET.has(e.id);

/* ================= DARSTELLUNG =================
   Formsprache: Hex = Land · Rechteck = Karte · Kreis = Mensch ·
   Fünfeck = Flora · Quadrat = Fauna. */
/* Das Wasserband im Eintrag — dieselbe Zeichnung wie erkundung-v3 und
   auftakt-v1 (Baukasten-Kandidat sot-wasser): Kantenmitte → Feldmitte →
   Kantenmitte, Breite und Farbe je Klasse; rinnen:3 für die verzweigte
   Strecke, quelle/muendung für Läufe, die im Feld beginnen oder enden. */
const EDGEM={E:[100,57.7],W:[0,57.7],NE:[75,14.4],NW:[25,14.4],SE:[75,101],SW:[25,101]};
function bandSVG(b){
  const C=[50,57.7], a=b.ein?EDGEM[b.ein]:null, z=b.aus?EDGEM[b.aus]:null;
  const w=b.b||9, farbe='var('+(b.farbe||'--w-kfluss')+')';
  function pfad(off){
    if(!a)return 'M '+C[0]+' '+C[1]+' L '+z[0]+' '+z[1];
    if(!z)return 'M '+a[0]+' '+a[1]+' L '+C[0]+' '+C[1];
    let cx=C[0],cy=C[1];
    if(off){const dx=z[0]-a[0],dy=z[1]-a[1],L=Math.hypot(dx,dy)||1;cx+=-dy/L*off;cy+=dx/L*off;}
    return 'M '+a[0]+' '+a[1]+' Q '+cx+' '+cy+' '+z[0]+' '+z[1];
  }
  let h='<path d="'+pfad(0)+'" fill="none" stroke="var(--w-saum)" stroke-width="'+(w+Math.max(3,w*.6)*(b.rinnen?2.6:1))+'" stroke-linecap="round"/>';
  if(b.rinnen)for(const off of [-18,0,18])
    h+='<path d="'+pfad(off)+'" fill="none" stroke="'+farbe+'" stroke-width="'+(w*.45).toFixed(1)+'" stroke-linecap="round"/>';
  else h+='<path d="'+pfad(0)+'" fill="none" stroke="'+farbe+'" stroke-width="'+w+'" stroke-linecap="round"/>';
  if(b.quelle)h+='<circle cx="50" cy="57.7" r="'+Math.max(4,w*.9)+'" fill="'+farbe+'"/>';
  if(b.furt)for(let i=-1;i<=1;i++)
    h+='<line x1="'+(50+i*8-0)+'" y1="'+(57.7-(b.rinnen?24:w*.9))+'" x2="'+(50+i*8)+'" y2="'+(57.7+(b.rinnen?24:w*.9))+'" stroke="var(--bone)" stroke-width="3" stroke-linecap="round"/>';
  return '<svg class="bandv" viewBox="0 0 100 115.47" preserveAspectRatio="none">'+h+'</svg>';
}
/* Jeder Eintrag wird als das Ding selbst gezeichnet — und jedes Zeichen ist
   ein SVG aus dem Baukasten. Frueher gab es hier zwei Wege: `g` fuer eine
   Zeichnung, `mark`/`ch` fuer ein Schriftzeichen. Der zweite ist weg; die
   Marke im Hexfeld (`ico`) ist jetzt derselbe Aufruf wie alles andere. */
function visual(e){
  if(e.form==='hex'){
    const zeichen=e.hex.g||e.hex.ico;
    const glyph=zeichen?'<span class="mark">'+SOT.icon(zeichen)+'</span>':'';
    const wasser=['fluss','see'].includes(e.hex.t);
    const band=e.hex.band?bandSVG(e.hex.band):'';
    return '<div class="hexon" style="--tc:var(--'+({fluss:'river',see:'lake',berg:'trocken'}[e.hex.t]||e.hex.t)+');--hc:var(--'+(wasser?'on-river':'ink')+')">'+band+glyph+'</div>';}
  if(e.form==='karte')
    return '<div class="spielkarte'+(e.karte.n?' n':'')+'"><span class="kart">'+e.karte.stapel+'</span>'
      +'<span class="kch">'+SOT.icon(e.karte.g)+'</span></div>';
  return '<div class="'+e.form+'">'+SOT.icon(e.wesen.g)+'</div>';
}
/* Der unbegegnete Eintrag: die Silhouette der FORM, ohne das Ding darin.
   Das Fragezeichen ist Schrift und darf es sein — es ist kein Icon, sondern
   die Abwesenheit eines Icons. */
function silhouette(e){
  const leer='<span class="mark leer">?</span>';
  if(e.form==='karte')return '<div class="spielkarte"><span class="kch leer">?</span></div>';
  return '<div class="'+(e.form==='hex'?'hexon':e.form)+'">'+leer+'</div>';
}
/* ico(name) — ein Icon in einer Zeichenkette; .ibtn bemisst das SVG.
   t(text) — expandiert {name} zu diesem Icon. So bleibt der DATENTEXT lesbar
   („Sammlerin {sammlerin}") statt eingeklebtes SVG zu tragen, und die Regel
   „Icons sind SVG" gilt trotzdem bis in die Fliesstexte der Karteikarten.
   Ein unbekanntes {wort} bleibt unangetastet stehen — Fliesstext in
   geschweiften Klammern soll nicht stillschweigend verschwinden. */
const ico=n=>'<i class="ibtn">'+SOT.icon(n)+'</i>';
const t=s=>String(s==null?'':s).replace(/\{([a-z]+)\}/g,(m,n)=>SOT.hasIcon(n)?ico(n):m);

function kachel(e){
  if(!sichtbar(e))return '<div class="eintrag unbegegnet" id="e-'+e.id+'">'+silhouette(e)+
    '<div class="etext"><div class="kopf"><b>· · ·</b><span class="pill">unbegegnet</span></div>'+
    '<span class="sub">Noch nicht begegnet — geh hin.</span></div></div>';
  let h='<div class="eintrag" id="e-'+e.id+'">'+visual(e)+'<div class="etext">';
  h+='<div class="kopf"><b>'+e.nm+'</b><span class="pill '+e.beleg+'">'+beleg2txt[e.beleg]+'</span></div>';
  h+='<span class="sub">'+t(e.sub)+'</span>';
  h+='<p class="txt">'+t(e.txt)+'</p>';
  (e.kv||[]).forEach(p=>{h+='<div class="kv"><span>'+p[0]+'</span><b>'+t(p[1])+'</b></div>';});
  if(e.zug)h+='<div class="zug">'+t(e.zug)+'</div>';
  if(e.links&&e.links.length){h+='<div class="chips">'+e.links.map(id=>{
    const z=alle[id];return z?'<span class="chip on" data-go="'+id+'">'+z.nm+'</span>':'';}).join('')+'</div>';}
  return h+'</div></div>';
}
function gruppe(titel,list){return '<div class="gtitle">'+titel+'</div><div class="grid">'+list.map(kachel).join('')+'</div>';}

document.getElementById('p-gelaende').innerHTML=
  gruppe('Gelände — was das Tal vorgibt (nicht gelegt, sondern da)',A.gelaende)+
  gruppe('Gewässer — das Band im Feld; die Klasse wird gerechnet, nicht gemalt',A.gewaesser)+
  gruppe('Plättchen — was der Mensch dazu baut',A.plaettchen)+
  gruppe('Was das Land birgt — Vorkommen und Merkmale',A.vorkommen);
document.getElementById('p-karten').innerHTML=
  '<p class="dim small">Drei Stapel hat Epoche I: <b>Mensch</b> (→ Reiter Menschen) · <b>Ausrüstung</b> · <b>Land</b> (→ Reiter Gelände &amp; Plättchen). Dazu die Wahlen der Dämmerung und des Abends — und der Nachtstapel, der niemanden fragt.</p>'+
  gruppe('Ausrüstung — was einer trägt',A.karten.filter(e=>e.karte.stapel==='Ausrüstung'))+
  gruppe('Dämmerung — die Rüstwahl (eine je Tag)',A.karten.filter(e=>e.karte.stapel==='Rüstwahl'))+
  gruppe('Abend — die Verwandlung (eine je Abend)',A.karten.filter(e=>e.karte.stapel==='Verwandlung'))+
  gruppe('Nacht — der Stapel, der dich liest',A.karten.filter(e=>e.karte.stapel==='Nachtkarte'));
document.getElementById('p-menschen').innerHTML=
  '<p class="dim small">Zwei Personenarten kennt Epoche I — keine Klassen: „Beides lernt ihr später. Der Anfang bestimmt nur, was euch leichter fällt." Sie teilen sich das Tal von selbst: sie den Talboden, er die Höhe.</p>'+
  gruppe('Menschen',A.menschen);
document.getElementById('p-flora').innerHTML=
  '<p class="dim small">Das Revier der Sammlerin — verlässlich, planbar, mit Terminen im Jahr. Bisher als „+1 Ertrag" abstrahiert; hier bekommt der Ertrag Namen. Ihr Ort ist der <b>Auenwald</b> — der steht als Gelände im ersten Reiter, denn auf zwei Kilometern im Feld ist Bewuchs Gelände.</p>'+
  gruppe('Flora',A.flora);
document.getElementById('p-fauna').innerHTML=
  '<p class="dim small">Das Revier des Jägers — schwankend, wandernd, mit Aufstellung zu bezahlen. Jedes Tier trägt sein <i>wo</i>, <i>wann</i> und sein Verhalten.</p>'+
  gruppe('Fauna',A.fauna);

/* ================= QUERVERWEISE (springen statt blättern) ================= */
const reiter=SOT.tabs('#tabs');
function springe(id){
  const e=alle[id];if(!e)return;
  reiter.select(tabVon[id]);
  const el=document.getElementById('e-'+id);if(!el)return;
  el.scrollIntoView({block:'center'});
  el.classList.add('blitz');setTimeout(()=>el.classList.remove('blitz'),1600);
}
document.addEventListener('click',ev=>{
  const c=ev.target.closest('[data-go]');if(c)springe(c.dataset.go);
});

/* ================= START ================= */
reiter.select(P.typ);
if(P.eintrag&&alle[P.eintrag])springe(P.eintrag);
SOT.debug(P);
</script>
