   `?zoom=` schlägt das: ein Bildschirmfoto muss den Maßstab festnageln können.
   Am Rad zu drehen setzt denselben Merker, denn wer selbst zoomt, will nicht
   beim nächsten Ring zurückgeworfen werden. */
let zoomFest = new URLSearchParams(location.search).has('zoom') && P.zoom > 0;
let zoomAuto = 6;
const zoomJetzt = () => (zoomFest && P.zoom > 0) ? P.zoom : zoomAuto;

function passen(sagen) {
  const w = buehne.clientWidth || 1, h = buehne.clientHeight || 1;
  const azi = P.azimut * Math.PI / 180;
  const neig = neigungJetzt() * Math.PI / 180;
  const cr = new THREE.Vector3(Math.cos(azi), 0, -Math.sin(azi));
  const cu = new THREE.Vector3(-Math.sin(azi) * Math.sin(neig), Math.cos(neig),
                               -Math.cos(azi) * Math.sin(neig));
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const f of alle())
    for (let k = 0; k < 6; k++)
      for (const y of [f.hoehen[k], UNTEN]) {
        const px = f.eck[k][0]*cr.x + y*cr.y + f.eck[k][1]*cr.z;
        const py = f.eck[k][0]*cu.x + y*cu.y + f.eck[k][1]*cu.z;
        if (px < x0) x0 = px; if (px > x1) x1 = px;
        if (py < y0) y0 = py; if (py > y1) y1 = py;
      }
  if (!isFinite(x0)) return;
  /* 0.62 statt 0.92 wie im Diorama: dort füllt das Tal das Bild, hier soll um
     die Arena Papier stehen bleiben — sie ist ein Objekt auf einem Tisch, und
     ein Objekt braucht Rand. */
  const brX = (x1 - x0) / 0.62, brY = ((y1 - y0) / 0.62) * w / h;
  /* Die Untergrenze ist nicht Vorsicht, sondern eine Aussage: ein EINZELNES
     Plättchen füllt sonst das ganze Bild und liest sich als Wand statt als
     Spielstein. Vier Feldbreiten lassen genug Papier ringsum, damit es auf
     einem Tisch liegt — und ein Baum darauf behält seine Grösse gegenüber dem
     Plättchen, statt zum Baum eines Waldes zu werden. */
  zoomAuto = Math.min(40, Math.max(4.4, Math.max(brX, brY) / W));
  blickZiel.set(arenaMitte.x, 0, arenaMitte.z);
  kameraStellen(); lichtStellen();
  if (sagen) SOT.toast('Eingepasst — ' + zoomJetzt().toFixed(1) + ' Felder Bildbreite');
}

/* ============================================================================
   11 · Bildgrösse und Zeichnen
   ========================================================================= */
function groesseStellen() {
  const w = Math.max(1, buehne.clientWidth), h = Math.max(1, buehne.clientHeight);
  renderer.setSize(w, h, false);
  const dpr = renderer.getPixelRatio();
  const pw = Math.max(2, Math.floor(w * dpr)), ph = Math.max(2, Math.floor(h * dpr));
  rtScene.setSize(pw, ph);
  rtA.setSize(Math.max(2, pw >> 2), Math.max(2, ph >> 2));
  rtB.setSize(Math.max(2, pw >> 2), Math.max(2, ph >> 2));
  matEnde.uniforms.uPixel.value.set(1 / pw, 1 / ph);
  if (!zoomFest) passen(false); else kameraStellen();
}

function durchgang(mat, ziel) {
  quad.material = mat;
  renderer.setRenderTarget(ziel);
  renderer.render(quadScene, quadCam);
}

function zeichnen() {
  if (P.post > 0) {
    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene, kamera);
    matHell.uniforms.tBild.value = rtScene.texture;
    durchgang(matHell, rtA);
    matBlur.uniforms.tBild.value = rtA.texture;
    matBlur.uniforms.uRichtung.value.set(1 / rtA.width, 0);
    durchgang(matBlur, rtB);
    matBlur.uniforms.tBild.value = rtB.texture;
    matBlur.uniforms.uRichtung.value.set(0, 1 / rtA.height);
    durchgang(matBlur, rtA);
    const s = P.post / 100;
    matEnde.uniforms.tBild.value = rtScene.texture;
    matEnde.uniforms.tGlut.value = rtA.texture;
    matEnde.uniforms.uGlut.value = 0.55 * s;
    matEnde.uniforms.uSaettigung.value = 1 + 0.14 * s;
    matEnde.uniforms.uScharf.value = 0.34 * s;
    matEnde.uniforms.uVignette.value = 0.18 * s;
    durchgang(matEnde, null);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, kamera);
  }
}

/* `?still` heisst NICHT „bewegte Szene eingefroren", sondern „nur auf Zuruf
   zeichnen" — und dann SOFORT, nicht beim nächsten Bild. Der Unterschied ist
   der Bildschirmfoto-Ablauf der Werkstatt: `--virtual-time-budget` spult die
   Zeit vor; eine laufende rAF-Schleife rendert dann hunderte Bilder, eine
   wartende liefert einen geleerten Puffer, wenn das Budget zwischen
   Grössenänderung und nächstem Bild ausläuft. Synchron zeichnen umgeht beides.

   In dieser Arena bewegt sich ohnehin nichts von selbst — es gibt kein Feuer,
   keinen Regen, kein Wasser. Die Schleife zeichnet darum NUR, wenn etwas
   schmutzig ist; das ist kein Sparen, sondern die Wahrheit über die Szene. */
let bereit = false, schmutzig = true;
function neuZeichnen() {
  if (!bereit) return;
  if (P.still) zeichnen(); else schmutzig = true;
}
function schleife() {
  requestAnimationFrame(schleife);
  if (P.still || !schmutzig) return;
  schmutzig = false;
  zeichnen();
}

/* ============================================================================
   12 · Anfassen: Schieben, Drehen, Wählen

   Zeigen läuft über das HÖHENFELD, nicht über einen Netzschnitt — der erste
   Treffer auf dem Netz ist in der Schrägsicht die FLANKE der Kachel davor, man
   landete also systematisch auf dem Plättchen VOR dem gemeinten. In einer
   Arena mit Terrassen ist das kein Schönheitsfehler: von einer Hochebene auf
   das Grasland daneben zu tippen wählte zuverlässig die Hochebene.

   Nebenwirkung, und eine erwünschte: der BEWUCHS spielt keine Rolle. Ein Baum
   ist kein Gelände; durch ihn hindurch zeigt man auf sein Plättchen.
   ========================================================================= */
const strahl = new THREE.Raycaster();
const maus = new THREE.Vector2();
let gewaehlt = null, ueber = null;

/* Weltpunkt → Plättchen, in KONSTANTER Zeit. Aus `mitteVon` rückwärts: die
   Zeile folgt aus z, die Spalte aus x abzüglich des Zeilenversatzes. Weil sich
   die Zeilen überlappen, werden die drei Zeilen ringsum geprüft — neun
   Kandidaten, nicht alle. */
function feldBei(x, z) {
  const r0 = Math.round(z / (H * 0.75));
  let best = null, bd = Infinity;
  for (let r = r0 - 1; r <= r0 + 1; r++) {
    const c0 = Math.round(x / W - (r & 1) * 0.5);
    for (let c = c0 - 1; c <= c0 + 1; c++) {
      const f = plAn(c, r); if (!f) continue;
      const d = (f.x - x) ** 2 + (f.z - z) ** 2;
      if (d < bd) { bd = d; best = f; }
    }
  }
  /* Ausserhalb des eigenen Sechsecks liegt kein Plättchen — sonst „trifft" der
     Strahl neben der Arena noch das nächstbeste, und in einer Arena mit einem
     einzigen Plättchen wäre das jeder Klick auf das Papier. */
  return best && bd <= RAD * RAD ? best : null;
}
const PICK_SCHRITT = 0.055;
function feldUnter(ev) {
  if (!mGelaende) return null;
  const b = leinwand.getBoundingClientRect();
  maus.x = ((ev.clientX - b.left) / b.width) * 2 - 1;
  maus.y = -((ev.clientY - b.top) / b.height) * 2 + 1;
  strahl.setFromCamera(maus, kamera);
  const o = strahl.ray.origin, d = strahl.ray.direction;
  if (Math.abs(d.y) < 1e-6) return null;
  const t0 = Math.max(0, (arenaHoch + 0.5 - o.y) / d.y);
  const t1 = (UNTEN - o.y) / d.y;
  if (!(t1 > t0)) return null;
  for (let t = t0; t <= t1; t += PICK_SCHRITT) {
    const f = feldBei(o.x + d.x * t, o.z + d.z * t);
    if (f && o.y + d.y * t <= f.hoehe) return f;
  }
  return feldBei(o.x + d.x * t1, o.z + d.z * t1);
}
/* Zeigerbewegung → Weltverschiebung auf der Grundebene. Waagrecht entspricht
   der Kamera-Rechtsachse; senkrecht der Blickrichtung am Boden, und die wird
   durch die Neigung gestaucht — darum das Teilen durch sin(Neigung). */
function schiebeAchsen() {
  const azi = P.azimut * Math.PI / 180;
  const neig = Math.max(12, neigungJetzt()) * Math.PI / 180;
  const w = Math.max(1, buehne.clientWidth), h = Math.max(1, buehne.clientHeight);
  const hx = zoomJetzt() * W / 2, hy = hx * h / w;
  return {
    rechts:{ x:Math.cos(azi), z:-Math.sin(azi) },
    vor:{ x:Math.sin(azi), z:Math.cos(azi) },
    sx:(2 * hx) / w,
    sz:(2 * hy) / h / Math.sin(neig)
  };
}

let zieht = null, zogGerade = false;
leinwand.addEventListener('pointerdown', ev => {
  /* Ein Ziehen, das AUSSERHALB der Leinwand endet, bekommt nie sein `click` —
     die Sperre bliebe stehen und frässe den nächsten echten Klick. Hier ist
     der sichere Ort, sie zurückzunehmen: vor jeder neuen Geste. */
  zogGerade = false;
  zieht = { x:ev.clientX, y:ev.clientY, weit:0, dreht:ev.shiftKey || ev.button === 2,
            a:P.azimut, n:P.neigung, zx:blickZiel.x, zz:blickZiel.z };
  leinwand.setPointerCapture(ev.pointerId);
  leinwand.classList.add('zieht');
});
leinwand.addEventListener('contextmenu', ev => ev.preventDefault());
/* EIN pointermove für alles: zeigen, schieben, drehen. Zwei Zuhörer würden
   während des Ziehens jedes Bild einen Strahl schiessen. */
leinwand.addEventListener('pointermove', ev => {
  if (!zieht) {
    if (ev.pointerType === 'touch') return;
    ueberSetzen(feldUnter(ev));
    return;
  }
  const dx = ev.clientX - zieht.x, dy = ev.clientY - zieht.y;
  zieht.weit = Math.max(zieht.weit, Math.abs(dx) + Math.abs(dy));
  if (zieht.weit < 5) return;
  if (mRingHover) mRingHover.visible = false;
  if (zieht.dreht) {
    P.azimut = ((Math.round(zieht.a - dx * 0.4) % 360) + 360) % 360;
    P.neigung = Math.max(12, Math.min(80, Math.round(zieht.n + dy * 0.25)));
    kameraStellen();
    if (P.lichtdreht) lichtStellen();
  } else {
    const A = schiebeAchsen();
    blickZiel.x = zieht.zx - A.rechts.x * dx * A.sx - A.vor.x * dy * A.sz;
    blickZiel.z = zieht.zz - A.rechts.z * dx * A.sx - A.vor.z * dy * A.sz;
    kameraStellen();
    lichtStellen();
  }
});
addEventListener('pointerup', () => {
  if (!zieht) return;
  leinwand.classList.remove('zieht');
  if (zieht.weit > 5) {
    zogGerade = true;
    /* Der Stand ist die URL — ein gefundener Blick muss teilbar sein. */
    if (zieht.dreht) { P.set('azimut', P.azimut); P.set('neigung', P.neigung); }
  }
  zieht = null;
});
leinwand.addEventListener('click', ev => {
  /* Ein Ziehen endet ebenfalls in einem `click`. Ohne diese Sperre wählt jedes
     Schieben ein Plättchen. */
  if (zogGerade) { zogGerade = false; return; }
  waehlen(feldUnter(ev));
});
leinwand.addEventListener('wheel', ev => {
  ev.preventDefault();
  /* Wer selbst zoomt, will nicht beim nächsten Ring zurückgeworfen werden —
     also übernimmt das Rad den Maßstab endgültig. „Einpassen" gibt ihn zurück. */
  const jetzt = zoomJetzt();
  const z = Math.max(2, Math.min(40, Math.round((jetzt + (ev.deltaY > 0 ? 1 : -1)) * 10) / 10));
  zoomFest = true;
  P.set('zoom', Math.round(z));
  kameraStellen(); lichtStellen();
}, { passive:false });

/* ============================================================================
   13 · Wählen und Sorte setzen — die eigentliche Bedienung
   ========================================================================= */
function waehlen(f) {
  gewaehlt = f || null;
  ringSetzen(mRing, gewaehlt);
  if (gewaehlt && gewaehlt === ueber) ringSetzen(mRingHover, null);
  P.set('wahl', gewaehlt ? gewaehlt.c + ',' + gewaehlt.r : null);
  sortenbrettBauen();
  minikarteMarken();
  stempelSchreiben();
}

/* Der Zeiger hat ZWEI Wege in die Welt — über die Leinwand und über die
   Minikarte —, und beide sollen dasselbe anzeigen. Darum eine Stelle: wer
   auf die Minikarte zeigt, sieht den Ring im Diorama, und umgekehrt. Zwei
   getrennte Zustände wären zwei Wahrheiten über denselben Zeiger. */
function ueberSetzen(f) {
  if (f === ueber) return;
  ueber = f || null;
  leinwand.classList.toggle('ziel', !!ueber);
  ringSetzen(mRingHover, ueber && ueber !== gewaehlt ? ueber : null);
  minikarteMarken();
}

/* Eine Sorte setzen heisst: die Arena NEU BAUEN. Nicht aus Faulheit — die
   Kontaktverschattung eines Plättchens hängt an den Höhen seiner NACHBARN, und
   eine neue Sorte ist meist auch eine neue Höhe. Wer nur das eine Plättchen
   umschriebe, liesse den Kontakt der sechs Nachbarn falsch stehen. Bei
   Ring 8 (217 Plättchen) kostet der ganze Aufbau wenige Dutzend Millisekunden;
   der Stempel nennt sie, damit die Behauptung prüfbar bleibt. */
function sorteSetzen(t) {
  if (!gewaehlt || !SORTEN[t]) return;
  sorte.set(schluessel(gewaehlt.c, gewaehlt.r), t);
  sortenSchreiben();
  weltBauen();
}
/* ------------------------------------------------------------- Einebnen (T) ---
   Kein Bildschalter, sondern ein BEDIENUNGSWERKZEUG, und es ist gemessen:
   ein Strahlgang über alle Plättchenmitten trifft bei der Voreinstellung
   (37° Neigung) 91 von 91, bei ganz flachem Blick (14°) nur 71 — die zwanzig
   fehlenden sind von der Terrasse DAVOR wirklich verdeckt, denn mit
   `?stufen=0` sind es wieder 91 von 91. Was verdeckt ist, kann man nicht
   antippen; `T` nimmt darum die Höhen weg, statt am Zeigen herumzudoktern.
   Dieselbe Antwort gibt `diorama-labor-v1` auf dieselbe Frage. */
function ebnen(an) {
  P.set('stufen', an ? 0 : 100);
  P.stufen = an ? 0 : 100;
  weltBauen();
  if (!zoomFest) passen(false);
  SOT.toast(an ? 'Eingeebnet — alle Plättchen auf einer Höhe'
               : 'Höhen der Sorten wieder da');
}

function ringeSetzen(n) {
  const neu = Math.max(0, Math.min(8, n));
  if (neu === P.ringe) return;
  P.set('ringe', neu);
  P.ringe = neu;
  sortenSchreiben();
  weltBauen();
  /* Die Arena hat ihre Grösse geändert — der Maßstab folgt, sofern ihn nicht
     jemand festgenagelt hat. */
  if (!zoomFest) passen(false);
}

/* ============================================================================
   14 · Die Bedienung — Baukasten über der Leinwand
   ========================================================================= */
function stempelSchreiben() {
  const n = plaettchen.size;
  document.getElementById('stempel').textContent =
    (istOben() ? 'Aufsicht' : 'Schräg ' + P.azimut + '°/' + P.neigung + '°') +
    ' · Ring ' + P.ringe + ' · ' + n + ' Plättchen · ' +
    feldJetzt().name + ' ' + P.hub + (P.stufenlos ? ' stufenlos' : ' Stufen') + ' · ' +
    (() => { const n = seen.filter(S => S.gespeist).length;
             return n ? n + (n === 1 ? ' See · ' : ' Seen · ') : ''; })() +
    (messung.dreiecke / 1000).toFixed(1) + 'k Dreiecke · ' +
    messung.bauzeit.toFixed(0) + ' ms' +
    (gewaehlt ? ' · gewählt ' + gewaehlt.c + ',' + gewaehlt.r : '');
}

function ringbrettBauen() {
  const n = plaettchen.size;
  const brett = document.getElementById('ringbrett');
  brett.innerHTML =
    '<div class="blabel">Ringe<span class="co">' + n + ' Plättchen</span></div>' +
    '<div class="zaehler">' +
    '<button id="bWeg" title="Äussersten Ring wegnehmen"' + (P.ringe === 0 ? ' disabled' : '') + '>−</button>' +
    '<b>' + P.ringe + '</b>' +
    '<button id="bDazu" title="Einen Ring anlegen"' + (P.ringe >= 8 ? ' disabled' : '') + '>+</button>' +
    '</div>' +
    '<div class="werkzeug">' +
    '<button class="small ghost" id="bWuerfeln" title="Alle Plättchen aus der Saat würfeln">Würfeln</button>' +
    '<button class="small ghost" id="bLeeren" title="Alle Plättchen auf Grasland">Leeren</button>' +
    '</div>' +
    '<div class="bnote">Ziehen schiebt, <b>Shift</b>+Ziehen dreht, Rad zoomt. ' +
    'Tasten <b>+</b> / <b>−</b> wie die Knöpfe, <b>F</b> blättert die Felder, ' +
    '<b>Bild ↑↓</b> den Hub, <b>Q</b> setzt eine Quelle, <b>S</b> füllt die Senken, ' +
    '<b>T</b> ebnet die Sorten ein, <b>Esc</b> wählt ab.</div>';
  brett.querySelector('#bWeg').addEventListener('click', () => ringeSetzen(P.ringe - 1));
  brett.querySelector('#bDazu').addEventListener('click', () => ringeSetzen(P.ringe + 1));
  brett.querySelector('#bWuerfeln').addEventListener('click', () => {
    sortenVorgeben('zufall'); sortenSchreiben(); weltBauen();
  });
  brett.querySelector('#bLeeren').addEventListener('click', () => {
    sortenVorgeben(STANDARD); sortenSchreiben(); weltBauen();
  });
}

/* ---------------------------------------------------------- Die Minikarte ---
   Aufsicht auf das Raster, jedes Sechseck in seinem Höhenwert. Zwei Regeln
   haben sie geformt:

   1. Sie malt `f.schau` — den Wert, den die Kachel WIRKLICH bekommen hat, samt
      Rundung auf ganze Stufen. Ein Keil, der feiner abgestuft ist als das
      Gelände, behauptet eine Genauigkeit, die die Welt nicht hat.
   2. Gefärbt wird in CSS über `color-mix` der Tokens, nicht in JS. Damit kippt
      der Keil mit der Nacht mit, ohne dass die Karte neu gebaut wird — und es
      steht kein `#hex` im Quelltext, das jemand vergessen könnte.

   Sie wird bei jedem Weltaufbau neu geschrieben, aber Auswahl und Zeiger
   ändern nur KLASSEN (`minikarteMarken`): das ist der Unterschied zwischen
   einem Zeigerring, der mit der Maus läuft, und einem, der bei jeder Bewegung
   217 Polygone neu erzeugt.
   --------------------------------------------------------------------------- */
const MMW = 10, MMH = SOT.hex.height(MMW);
function minikarteBauen() {
  const brett = document.getElementById('minikarte');
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const teile = [];
  for (const f of alle()) {
    const m = SOT.hex.center(f.c, f.r, MMW, 0);
    x0 = Math.min(x0, m.x - MMW/2); x1 = Math.max(x1, m.x + MMW/2);
    y0 = Math.min(y0, m.y - MMH/2); y1 = Math.max(y1, m.y + MMH/2);
    teile.push({ f, m });
  }
  const pad = MMW * 0.22;
  const vb = [x0 - pad, y0 - pad, (x1 - x0) + 2*pad, (y1 - y0) + 2*pad]
    .map(v => v.toFixed(2)).join(' ');
  const F = feldJetzt();
  brett.innerHTML =
    '<div class="blabel">Höhenfeld<span class="co">' + F.name + '</span></div>' +
    '<svg id="mmsvg" viewBox="' + vb + '">' +
    teile.map(t =>
      /* Ein GESPEISTER See wird blau gemalt, nicht grau — sonst müsste man ihn
         im Bild suchen, und die Minikarte ist der Ort, an dem man ihn finden
         soll. Die Tiefe steckt im Ton, wie in der Fläche selbst. Eine PFANNE
         OHNE ZUFLUSS behält ihr Grau und bekommt nur einen gestrichelten Rand:
         sie ist kein Gewässer, aber sie ist der Ort, an dem eines entstünde —
         und genau das will man beim Entwerfen sehen. */
      '<polygon data-c="' + t.f.c + '" data-r="' + t.f.r + '" ' +
      (t.f.tiefe > EPS && !t.f.nass ? 'class="pfanne" ' : '') +
      'points="' + SOT.hex.points(t.m.x, t.m.y, MMW * 0.94) + '" ' +
      'style="fill:' + (t.f.nass
        ? 'color-mix(in srgb, var(--d-wasser-tief) ' +
          (Math.min(1, t.f.tiefe / SEE_TIEFTON) * 100).toFixed(0) + '%, var(--d-wasser))'
        : 'color-mix(in srgb, var(--mm-hoch) ' + (t.f.schau * 100).toFixed(1) +
          '%, var(--mm-tief))') + '">' +
      '<title>' + t.f.c + ',' + t.f.r + ' · ' + t.f.S.name + ' · ' +
      (t.f.stufen).toFixed(P.stufenlos ? 1 : 0) + ' Stufen' +
      (t.f.tiefe > EPS ? (t.f.nass ? ' · See, ' : ' · Pfanne ohne Zufluss, ') +
        (t.f.tiefe / STUFE).toFixed(P.stufenlos ? 1 : 0) + ' tief' : '') +
      (t.f.q ? ' · ' + klasseVon(t.f.q).name + ' (' + t.f.q + ')' : '') +
      '</title></polygon>').join('') +
    /* Die Läufe liegen ÜBER den Sechsecken — SVG malt in Reihenfolge, und ein
       Weg, den das nächste Feld überdeckt, wäre keiner. */
    laeufe.map(L => {
      const pk = L.pfad.map(f => SOT.hex.center(f.c, f.r, MMW, 0));
      const q = pk[0], z = pk[pk.length - 1];
      return (pk.length > 1
        ? '<polyline class="mmlauf" points="' +
          pk.map(m => m.x.toFixed(2) + ',' + m.y.toFixed(2)).join(' ') + '"/>' : '') +
        '<circle class="mmziel' + (L.amTiefsten ? '' : ' senke') + '" cx="' + z.x.toFixed(2) +
        '" cy="' + z.y.toFixed(2) + '" r="' + (MMW * 0.26).toFixed(2) + '"/>' +
        '<circle class="mmquelle" cx="' + q.x.toFixed(2) + '" cy="' + q.y.toFixed(2) +
        '" r="' + (MMW * 0.20).toFixed(2) + '"/>';
    }).join('') +
    '</svg>' +
    '<div class="mmkeil">tief<i></i>hoch</div>' +
    '<div id="mmfelder">' + Object.keys(FELDER).map(k =>
      '<span class="chip' + (k === P.feld ? ' on' : '') + '" data-f="' + k + '">' +
      FELDER[k].name + '</span>').join('') + '</div>' +
    '<div class="zaehler">' +
    '<button id="bHubWeg" title="Flacher"' + (P.hub === 0 ? ' disabled' : '') + '>−</button>' +
    '<b>' + P.hub + '</b>' +
    '<button id="bHubDazu" title="Höher"' + (P.hub >= 8 ? ' disabled' : '') + '>+</button>' +
    '</div>' +
    /* Ein Feld ohne Spanne ist ganz schwarz, und ganz schwarz sieht aus wie
       kaputt. Es SAGEN ist billiger, als den Keil zu einer Notlüge in
       Mittelgrau zu machen — schwarz IST hier der tiefste Wert. */
    (feldNorm.span > 1e-6
      ? '<div class="bnote"><b>Hub</b> = Stufen zwischen Schwarz und Weiss, und damit ' +
        'auch die Zahl der Ebenen. <b>0</b> hebt nichts.</div>'
      : '<div class="bnote">Überall derselbe Wert — dieses Feld hebt nichts, ' +
        'die Höhen kommen allein von den Sorten. Ein anderes Feld wählen ' +
        'oder <b>F</b> drücken.</div>');

  const svg = brett.querySelector('#mmsvg');
  svg.addEventListener('click', ev => {
    const p = ev.target.closest('polygon'); if (!p) return;
    waehlen(plAn(+p.dataset.c, +p.dataset.r));
  });
  /* `pointerover`/`pointerout` statt `mousemove`: das Ereignis kommt je
     Sechseck einmal, nicht je Bildpunkt. */
  svg.addEventListener('pointerover', ev => {
    const p = ev.target.closest('polygon'); if (!p) return;
    ueberSetzen(plAn(+p.dataset.c, +p.dataset.r));
  });
  svg.addEventListener('pointerleave', () => ueberSetzen(null));
  brett.querySelectorAll('#mmfelder .chip').forEach(ch =>
    ch.addEventListener('click', () => feldSetzen(ch.dataset.f)));
  brett.querySelector('#bHubWeg').addEventListener('click', () => hubSetzen(P.hub - 1));
  brett.querySelector('#bHubDazu').addEventListener('click', () => hubSetzen(P.hub + 1));
  minikarteMarken();
}
function minikarteMarken() {
  document.querySelectorAll('#mmsvg polygon').forEach(p => {
    const c = +p.dataset.c, r = +p.dataset.r;
    p.classList.toggle('sel', !!gewaehlt && gewaehlt.c === c && gewaehlt.r === r);
    p.classList.toggle('hov', !!ueber && ueber.c === c && ueber.r === r);
  });
}
/* Ein Feld wechseln ist ein Neuaufbau — die Höhen ändern sich, und mit ihnen
   die Kontaktverschattung ALLER Nachbarn. Der Maßstab folgt mit: eine Kuppe
   mit Hub 8 ist deutlich höher als das flache Brett, und sie soll ins Bild
   passen, ohne dass man erst „Einpassen" sucht. */
function feldSetzen(name) {
  if (!FELDER[name] || name === P.feld) return;
  P.feld = name; P.set('feld', name);
  weltBauen();
  if (!zoomFest) passen(false);
}
function hubSetzen(n) {
  const neu = Math.max(0, Math.min(8, n));
  if (neu === P.hub) return;
  P.hub = neu; P.set('hub', neu);
  weltBauen();
  if (!zoomFest) passen(false);
}

function sortenbrettBauen() {
  const brett = document.getElementById('sortenbrett');
  const f = gewaehlt;
  brett.innerHTML =
    '<div class="blabel">Plättchen' +
    (f ? '<span class="co">' + f.c + ',' + f.r + ' · Ring ' + f.ring + '</span>' : '') +
    '</div>' +
    (f ? '' : '<div class="bnote">Keines gewählt — ein Plättchen antippen.</div>') +
    '<div id="sortenliste">' +
    FOLGE.map((t, i) =>
      '<button class="sorte small' + (f && f.t === t ? ' on' : '') + '" data-t="' + t + '"' +
      (f ? '' : ' disabled') + '>' + SOT.icon(SORTEN[t].zeichen) +
      '<span>' + SORTEN[t].name + '</span><span class="taste">' + (i + 1) + '</span></button>').join('') +
    '</div>' +
    '<div class="werkzeug"><button class="small' + (istQuelle(f) ? ' on' : '') +
    '" id="bQuelle"' + (f ? '' : ' disabled') + ' title="Quelle setzen oder entfernen (Q)">' +
    SOT.icon('lauf') + (istQuelle(f) ? 'Quelle weg' : 'Quelle setzen') + '</button></div>' +
    '<div class="bnote">Die Höhe gehört zur Sorte: Hochebene <b>+2</b>, Felsig <b>+1</b>, ' +
    'Kiesbank <b>−1</b> Stufen. Darum wirft ein Sortenwechsel neuen Kontaktschatten ' +
    '— und einen anderen Lauf.</div>';
  brett.querySelectorAll('.sorte').forEach(b =>
    b.addEventListener('click', () => sorteSetzen(b.dataset.t)));
  const bq = brett.querySelector('#bQuelle');
  bq.querySelector('svg').style.cssText = 'width:13px;height:13px;flex:none';
  bq.addEventListener('click', () => quelleSchalten(gewaehlt));
}

/* --------------------------------------------------------- Der Wasserbericht ---
   Was gerechnet wurde, muss man LESEN können — ein Weg, den man nur sieht,
   lässt sich nicht nachprüfen. Darum je Quelle eine Zeile mit Schritten, Fall
   in Stufen und dem, worauf es eigentlich ankommt: ob der Lauf am tiefsten
   Punkt der Karte ankommt oder vorher in einer Senke stehen bleibt.
   --------------------------------------------------------------------------- */
function seenZeilen() {
  if (!P.fuellen) return '<div class="bnote">Senken werden nicht gefüllt (<b>S</b>) — ' +
    'ein Lauf endet darum in der Pfanne statt sie zu queren.</div>';
  if (!seen.length) return '<div class="bnote">Keine Senke, also kein See: von jedem ' +
    'Plättchen führt ein Weg abwärts bis zum tiefsten Punkt.</div>';
  const voll = seen.filter(S => S.gespeist), leer = seen.length - voll.length;
  const trocken = leer
    ? '<div class="bnote"><b>' + leer + '</b> ' + (leer === 1 ? 'Pfanne' : 'Pfannen') +
      ' ohne Zufluss — in der Minikarte gestrichelt. Hier stünde ein See, sobald ' +
      'Wasser ankommt.</div>'
    : '';
  if (!voll.length) return '<div class="bnote">Kein See: die Pfannen bekommen kein ' +
    'Wasser. Eine Quelle oberhalb setzen (<b>Q</b>).</div>' + trocken;
  const zeig = voll.slice(0, 4);
  return zeig.map((S, i) =>
    '<div class="see" data-c="' + S.felder[0].c + '" data-r="' + S.felder[0].r + '">' +
    '<div class="lkopf"><b>See ' + (i + 1) + '</b>' +
    '<span class="lzahl">' + S.felder.length +
    (S.felder.length === 1 ? ' Feld · ' : ' Felder · ') +
    (S.tiefe / STUFE).toFixed(P.stufenlos ? 1 : 0) +
    ' tief · Überlauf ' + (S.abfluss ? S.abfluss.c + ',' + S.abfluss.r : '—') +
    '</span></div></div>').join('') +
    (voll.length > zeig.length
      ? '<div class="bnote">… und ' + (voll.length - zeig.length) + ' weitere.</div>' : '') +
    trocken;
}

/* Die Schüttung ist ein Hebel wie „Ringe" und „Hub" — dieselbe Bauform, damit
   man sie ohne Nachdenken bedient. Sie ändert keine Höhe, also wird die Welt
   nicht neu gebaut; nur die Mengen und damit die Breiten. */
function schuettungSetzen(n) {
  const neu = Math.max(1, Math.min(16, n));
  if (neu === P.schuettung) return;
  P.schuettung = neu; P.set('schuettung', neu);
  wasserFrisch();
}

function schuettungZeile() {
  return '<div class="zaehler">' +
    '<button id="bSchWeg" title="Weniger Wasser je Quelle"' +
    (P.schuettung <= 1 ? ' disabled' : '') + '>−</button>' +
    '<b>' + P.schuettung + '</b>' +
    '<button id="bSchDazu" title="Mehr Wasser je Quelle"' +
    (P.schuettung >= 16 ? ' disabled' : '') + '>+</button>' +
    '</div>' +
    '<div class="bnote">Schüttung je Quelle. <b>1</b> ist ein Bach; die Menge summiert ' +
    'sich talwärts, und das Band wird breiter, wo sie wächst.</div>';
}

function wasserbrettBauen() {
  const brett = document.getElementById('wasserbrett');
  const seeKopf = '<div class="blabel" style="margin-top:8px">Seen<span class="co">' +
    (P.fuellen ? seen.length : '—') + '</span></div>' + seenZeilen();
  if (!laeufe.length) {
    brett.innerHTML =
      '<div class="blabel">Wasser</div>' +
      '<div class="bnote">Keine Quelle. Ein Plättchen wählen und <b>Q</b> drücken — ' +
      'der Lauf wird von dort gerechnet: nie bergauf, kürzester Weg, ' +
      'zum tiefsten erreichbaren Punkt.</div>' + seeKopf;
    brett.querySelectorAll('.see').forEach(z =>
      z.addEventListener('click', () => waehlen(plAn(+z.dataset.c, +z.dataset.r))));
    return;
  }
  brett.innerHTML =
    '<div class="blabel">Wasser<span class="co">' + laeufe.length +
    (laeufe.length === 1 ? ' Quelle' : ' Quellen') + '</span></div>' +
    schuettungZeile() +
    laeufe.map(L =>
      '<div class="lauf' + (L.amTiefsten ? '' : ' senke') + '" data-c="' + L.start.c +
      '" data-r="' + L.start.r + '">' +
      '<div class="lkopf"><b>' + L.start.c + ',' + L.start.r + '</b>' +
      '<span class="pfeil">→</span><b>' + L.ziel.c + ',' + L.ziel.r + '</b>' +
      '<span class="lzahl">' + (L.schritte === 1 ? '1 Schritt' : L.schritte + ' Schritte') +
      ' · ' + (L.fall ? '−' + L.fall + (L.fall === 1 ? ' Stufe' : ' Stufen') : 'kein Gefälle') +
      ' · an der Mündung <b>' + L.klasse.name + '</b> (' + L.menge + ')</span></div>' +
      '<div class="lstatus">' + (L.amTiefsten
        ? (L.schritte ? 'erreicht den tiefsten Punkt' : 'liegt schon am tiefsten Punkt')
        : 'bleibt in einer Senke — <b>' + L.ueberTief + '</b> ' +
          (L.ueberTief === 1 ? 'Stufe' : 'Stufen') + ' über dem Tiefsten') +
      (L.durchSeen ? ' · durch <b>' + L.durchSeen +
        (L.durchSeen === 1 ? '</b> See' : '</b> Seen') : '') +
      '</div></div>').join('') +
    '<div class="bnote">Gerechnet ist der PFAD auf der Wasseroberfläche: gleich hoch oder ' +
    'tiefer, kürzester Weg zuerst, bei Gleichstand der, der früher fällt.</div>' +
    seeKopf;
  /* Eine Zeile ist zugleich der Weg zu ihrer Quelle bzw. zum See — bei acht
     Ringen sucht man sie sonst im Bild. */
  brett.querySelectorAll('.lauf, .see').forEach(z =>
    z.addEventListener('click', () => waehlen(plAn(+z.dataset.c, +z.dataset.r))));
  const bw = brett.querySelector('#bSchWeg'), bd = brett.querySelector('#bSchDazu');
  if (bw) bw.addEventListener('click', () => schuettungSetzen(P.schuettung - 1));
  if (bd) bd.addEventListener('click', () => schuettungSetzen(P.schuettung + 1));
}

/* Eine Quelle setzen ändert KEINE Höhe — also wird die Welt nicht neu gebaut,
   nur der Lauf neu gerechnet und seine Markierung neu gelegt. Das ist der
   Unterschied zwischen einem Klick, der 60 ms kostet, und einem, der 2 ms
   kostet; bei einem Werkzeug, mit dem man herumprobiert, merkt man ihn. */
/* Das Füllen an- und abschalten ist ein Neuaufbau: die Wasseroberfläche ist die
   Fläche, auf der geroutet wird, also ändert sich mit ihr JEDER Lauf — und die
   Seen kommen und gehen. Die Gegenprobe ist der Zweck des Schalters. */
function fuellenSchalten(an) {
  P.fuellen = an ? 1 : 0;
  P.set('fuellen', P.fuellen);
  weltBauen();
  SOT.toast(an ? 'Senken gefüllt — Läufe queren ihre Seen'
               : 'Senken roh — ein Lauf endet in der Pfanne');
}

/* Alles neu rechnen, was am WASSER hängt, und nur das. Die Seenfläche gehört
   dazu: ob eine Pfanne einen See trägt, entscheidet der Zufluss — eine Quelle
   umzusetzen kann also einen See erscheinen oder verschwinden lassen. */
function wasserFrisch() {
  wasserRechnen();
  for (const m of [mLauf, mSee]) {
    if (!m) continue;
    scene.remove(m);
    m.geometry.dispose();
    if (m.material !== matWasser) m.material.dispose();
  }
  mLauf = mSee = null;
  seenBauen();
  laufBauen();
  minikarteBauen();
  wasserbrettBauen();
  sortenbrettBauen();
  stempelSchreiben();
  neuZeichnen();
}

function quelleSchalten(f) {
  if (!f) { SOT.toast('Erst ein Plättchen antippen.'); return; }
  const k = schluessel(f.c, f.r);
  if (quellen.has(k)) quellen.delete(k); else quellen.add(k);
  quellenSchreiben();
  wasserFrisch();
}

/* Die Legende zählt mit. Sie ist nicht Zierde: wer eine Arena von Hand malt,
   verliert schnell den Überblick, wie viel von was liegt. */
function legendeBauen() {
  const zahl = {};
  for (const f of alle()) zahl[f.t] = (zahl[f.t] || 0) + 1;
  document.getElementById('legende').innerHTML = FOLGE
    .filter(t => zahl[t])
    .map(t => '<span class="chip">' + SOT.icon(SORTEN[t].zeichen) + ' ' +
              SORTEN[t].name + ' <b>' + zahl[t] + '</b></span>').join('');
}

function zeitKnopf() {
  const b = document.getElementById('bZeit');
  const zn = { morgen:'morgen', mittag:'sonne', abend:'abend', nacht:'mond' }[P.zeit];
  b.innerHTML = SOT.icon(zn) + ' ' + P.zeit;
  b.querySelector('svg').style.cssText = 'width:13px;height:13px;vertical-align:-2px';
}
function sichtKnopf() {
  document.querySelectorAll('#segSicht button').forEach(b =>
    b.classList.toggle('on', b.dataset.s === P.sicht));
}
function zeitStellen(name) {
  P.zeit = name; P.set('zeit', name);
  document.body.classList.toggle('night', name === 'nacht');
  document.body.dataset.zeit = name;
  zeitKnopf();
  /* Die Palette steckt in den ECKENFARBEN — eine andere Tageszeit ist darum
     ein Neuaufbau, kein Umschalten eines Materials. Genau dafür sind die
     Tokens da: es steht kein `#hex` im JS, das man vergessen könnte. */
  weltBauen();
}

addEventListener('keydown', ev => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target || {}).tagName || '')) return;
  if (ev.key >= '1' && ev.key <= '6') {
    if (gewaehlt) sorteSetzen(FOLGE[+ev.key - 1]);
    else SOT.toast('Erst ein Plättchen antippen.');
    return;
  }
  if (ev.key === '+' || ev.key === '=') { ringeSetzen(P.ringe + 1); return; }
  if (ev.key === '-' || ev.key === '_') { ringeSetzen(P.ringe - 1); return; }
  if (ev.key === 't' || ev.key === 'T') { ebnen(P.stufen > 0); return; }
  /* `F` blättert durch die Felder. Sieben Felder nacheinander zu sehen, ohne
     den Blick von der Welt zu nehmen, ist die eigentliche Prüfung dieses
     Durchgangs — mit der Maus wandert das Auge jedes Mal in die Ecke. */
  if (ev.key === 'f' || ev.key === 'F') {
    const ks = Object.keys(FELDER);
    feldSetzen(ks[(ks.indexOf(P.feld) + (ev.shiftKey ? ks.length - 1 : 1)) % ks.length]);
    return;
  }
  if (ev.key === 'PageUp')   { hubSetzen(P.hub + 1); return; }
  if (ev.key === 'PageDown') { hubSetzen(P.hub - 1); return; }
  if (ev.key === 'q' || ev.key === 'Q') { quelleSchalten(gewaehlt); return; }
  if (ev.key === 's' || ev.key === 'S') { fuellenSchalten(!P.fuellen); return; }
  if (ev.key === '[' || ev.key === ']') {
    P.set('azimut', ((P.azimut + (ev.key === '[' ? -15 : 15)) % 360 + 360) % 360);
    P.azimut = +P.azimut;
    kameraStellen(); if (P.lichtdreht) lichtStellen(); return;
  }
  if (ev.key === 'Escape') { waehlen(null); return; }
  const A = schiebeAchsen(), s = (ev.shiftKey ? 3 : 1) * W;
  let hin = null;
  if (ev.key === 'ArrowLeft')  hin = [-A.rechts.x * s, -A.rechts.z * s];
  else if (ev.key === 'ArrowRight') hin = [A.rechts.x * s, A.rechts.z * s];
  else if (ev.key === 'ArrowUp')    hin = [-A.vor.x * s, -A.vor.z * s];
  else if (ev.key === 'ArrowDown')  hin = [A.vor.x * s, A.vor.z * s];
  else return;
  ev.preventDefault();
  blickZiel.x += hin[0]; blickZiel.z += hin[1];
  kameraStellen(); lichtStellen();
});

/* ============================================================================
   15 · Anlaufen
   ========================================================================= */
document.body.dataset.zeit = P.zeit;
if (P.zeit === 'nacht') document.body.classList.add('night');
zeitKnopf(); sichtKnopf();

rendererBauen();
sortenVorgeben(P.sorten);
quellenVorgeben(P.quellen);
weltBauen();
bereit = true;
window.__arena = true;
groesseStellen();
passen(false);
sortenSchreiben();

if (P.wahl) {
  const w = P.wahl.split(',').map(Number);
  waehlen(plAn(w[0], w[1]));
}

document.getElementById('bPassen').addEventListener('click', () => {
  zoomFest = false; P.set('zoom', null); passen(true);
});
document.getElementById('bZeit').addEventListener('click', () => {
  const o = ['morgen','mittag','abend','nacht'];
  zeitStellen(o[(o.indexOf(P.zeit) + 1) % o.length]);
});
document.querySelectorAll('#segSicht button').forEach(b =>
  b.addEventListener('click', () => {
    P.sicht = b.dataset.s; P.set('sicht', P.sicht);
    sichtKnopf();
    if (!zoomFest) passen(false); else { kameraStellen(); lichtStellen(); }
  }));

SOT.regler(P, { onChange:(name) => {
  if (name === 'azimut' || name === 'neigung' || name === 'sicht') {
    kameraStellen(); if (P.lichtdreht) lichtStellen();
  } else if (name === 'zoom') {
    zoomFest = P.zoom > 0; kameraStellen(); lichtStellen();
  } else if (name === 'post' || name === 'still') neuZeichnen();
  else if (name === 'gitter') {
    matGelaende.wireframe = matSonstiges.wireframe = !!P.gitter; neuZeichnen();
  } else if (name === 'zeit') zeitStellen(P.zeit);
  else if (name === 'lichtdreht') lichtStellen();
  else if (name === 'schatten') {
    renderer.shadowMap.enabled = P.schatten !== 'aus';
    renderer.shadowMap.type = P.schatten === 'weich' ? THREE.VSMShadowMap : THREE.PCFShadowMap;
    /* Die Schattenart steckt im Shader — JEDES Material muss neu übersetzt
       werden, sonst schaltet nur um, was danach zum ersten Mal gezeichnet
       wird. */
    for (const m of [matGelaende, matSonstiges]) m.needsUpdate = true;
    lichtStellen();
  } else if (name === 'ringe' || name === 'feld' || name === 'hub' ||
             name === 'stufenlos' || name === 'feldkehr' || name === 'fuellen') {
    weltBauen(); if (!zoomFest) passen(false);
  }
  else if (name === 'sorten') { sortenVorgeben(P.sorten); weltBauen(); }
  else if (name === 'quellen') { quellenVorgeben(P.quellen); weltBauen(); }
  else if (name === 'schuettung') wasserFrisch();
  else weltBauen();
} });
SOT.debug(P);

/* Der Beobachter genügt — er feuert auch beim Fensterwechsel, und anders als
   `resize` auch dann, wenn nur das Reglerbrett die Bühne schmaler macht. */
new ResizeObserver(groesseStellen).observe(buehne);
requestAnimationFrame(schleife);
</script>
</body>
</html>
