         dünner. Die Decke muss darum neu gebaut werden, nicht nur umgefärbt. */
      deckeBauen();
      reichweiteZeichnen();
      kameraStellen();          /* die Klemme kann enger geworden sein */
      klankarteBauen();
      leuteKartenBauen();
    });
  });
}
const wertZeile = (L, w, txt) =>
  '<div class="ew"><span>' + txt + '</span>' +
  '<button class="small" data-id="' + L.id + '" data-w="' + w + '" data-d="-1">−</button>' +
  '<b>' + L[w] + '</b>' +
  '<button class="small" data-id="' + L.id + '" data-w="' + w + '" data-d="1">+</button></div>';

function zuEinheit(L) {
  const f = feldAn(L.c, L.r); if (!f) return;
  ueberblick = false;
  blickZiel.set(f.x, 0, f.z);
  kameraStellen(); lichtStellen();
  P.set('blick', L.c + ',' + L.r);
  waehlen(f);
}

/* --------------------------------------------------------- Der Zugwechsel ---
   „Zug beenden" tut ZWEI Dinge, und die Reihenfolge ist die Regel: erst altert
   die Erinnerung des Klans, der gespielt hat (ein Diffusionsschritt), dann
   kommt der andere an die Reihe. Wer nichts tut, verliert Karte — das ist der
   ganze Druck, den dieses Labor prüfen will.

   Neu gebaut wird beim Wechsel nichts ausser der Decke: Gelände, Wasser und
   Bewuchs sind für beide Klane dasselbe Netz, es wird nur anders eingefärbt. */
function zugBeenden() {
  frontSchieben(aktiv());
  amZug = (amZug + 1) % KLANE.length;
  if (amZug === 0) runde++;
  P.set('amzug', aktiv().id);
  zugAnzeigen(true);
  SOT.toast('Runde ' + runde + ' · ' + aktiv().name + ' am Zug');
}

/* Alles, was am aktiven Klan hängt, auf den Stand bringen. */
function zugAnzeigen(hinschauen) {
  gewaehlteEinheit = null;
  sichtRechnen();
  nebelAnwenden(true);
  deckeBauen();
  reichweiteZeichnen();
  feuerStelle = feuerStellen[aktiv().id] || null;
  flammeBauen();
  klankarteBauen();
  leuteKartenBauen();
  if (hinschauen) {
    const L = leuteVon(aktiv().id)[0], f = L && feldAn(L.c, L.r);
    if (f) { ueberblick = false; blickZiel.set(f.x, 0, f.z); P.set('blick', f.c + ',' + f.r); }
  }
  kameraStellen(); lichtStellen();
  if (gewaehlt) waehlen(gewaehlt);
}

/* ============================================================================
   18 · Legende und Messblatt
   ========================================================================= */
function legendeBauen() {
  const zaehl = {}, wz = {};
  let wn = 0, faelle = 0, muendungen = 0;
  for (const f of felders()) {
    zaehl[f.t] = (zaehl[f.t] || 0) + 1;
    if (!f.wasser) continue;
    wn++;
    wz[f.wasser.kl.name] = (wz[f.wasser.kl.name] || 0) + 1;
    if (f.wasser.faelle[f.wasser.ab] === 'fall') faelle++;
    if (f.wasser.zu.length >= 2) muendungen++;
  }
  /* Gelände und Wasser stehen NEBENEINANDER in der Legende — genau das ist

const stilmenu = document.getElementById('stilmenu');

function menuZeigen(familie, knopf) {
  menuFamilie = familie;
  stilmenu.innerHTML = '<div class="kopf">' + STILE[familie].titel + '</div>';
  for (const v of variantenNamen(familie)) {
    const z = STILE[familie].varianten[v];
    const b = document.createElement('button');
    b.setAttribute('role', 'menuitem');
    b.classList.toggle('on', familie === P.stil && v === P.variante);
    b.innerHTML = v + '<span class="wie">' +
      'stufen ' + z.stufen + ' · kontur ' + z.kontur + ' · korn ' + z.korn +
      ' · raster ' + z.raster + (z.pixelig > 1 ? ' · pixel ' + z.pixelig : '') +
      '</span>';
    b.addEventListener('click', () => { menuSchliessen(); stilWechseln(familie, v); });
    stilmenu.appendChild(b);
  }
  /* Unter dem Knopf, aber am rechten Rand ausgerichtet und ins Fenster
     geklemmt — die Leiste sitzt rechts, ein linksbündiges Menü hinge draussen. */
  const r = knopf.getBoundingClientRect();
  stilmenu.classList.remove('hid');
  const br = stilmenu.getBoundingClientRect();
  stilmenu.style.top = (r.bottom + 6) + 'px';
  stilmenu.style.left =
    Math.max(8, Math.min(window.innerWidth - br.width - 8, r.left)) + 'px';

   nicht getippt, und ein Zuhörer je Knopf müsste bei jedem Neubau mitwandern.
   Der Pfeil öffnet die Spielarten, der Rest des Knopfes wechselt die Familie —
   auch die einer FREMDEN Familie lassen sich so ansehen, ohne sie zu wählen. */
document.getElementById('segStil').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-s]');
  if (!b) return;
  const fam = b.dataset.s;
  if (ev.target.closest('[data-menu]')) {
    if (menuFamilie === fam) menuSchliessen(); else menuZeigen(fam, b);
    return;
  }
  menuSchliessen();
  stilWechseln(fam);
});
bereit = true;
neuZeichnen();

if (P.wahl) {
  const w = P.wahl.split(',').map(Number);
  waehlen(feldAn(w[0], w[1]));
}

const blatt = SOT.sheet('#messblatt');
document.getElementById('bMess').addEventListener('click', () => { messblattFuellen(); blatt.toggle(); });
if (P.mess) { messblattFuellen(); blatt.open(); }
document.getElementById('bZeit').addEventListener('click', () => {
  const o = ['morgen','mittag','abend','nacht'];
  zeitStellen(o[(o.indexOf(P.zeit) + 1) % o.length]);
});
document.querySelectorAll('#segSicht button').forEach(b =>
  b.addEventListener('click', () => {
    P.sicht = b.dataset.s; P.set('sicht', P.sicht);
    sichtKnopf(); kameraStellen(); lichtStellen();
  }));
{
  const b = document.getElementById('bZug');
  b.innerHTML = SOT.icon('runde') + 'Zug beenden';
  b.addEventListener('click', zugBeenden);
}

const LEUTE_P = new Set(LEUTE.flatMap(L => [L.pS, L.pT]));
const KULTUR_P = new Set(KLANE.map(K => K.pK));
/* Das Reglerbrett wird beim Bauen EINMAL bestückt und kennt keine Auffrischung.
   Ein Stilwechsel dreht aber elf Hebel gleichzeitig — stünden dort danach die
   alten Zahlen, wäre das Brett eine Lüge, und man diskutierte über Werte, die
   nicht wirken. Darum wird es verworfen und neu gebaut. Das greift von aussen
   in den Baukasten; braucht ein zweiter Prototyp dasselbe, gehört eine
   Auffrischung IN `SOT.regler` statt hierher. */
function reglerNeu() {
  /* BEIDE Knoten: `SOT.regler` hängt das Brett und den Griff getrennt an den
     Körper. Nur das Brett zu entfernen liesse den alten Griff stehen und legte
     einen zweiten daneben. */
  document.querySelectorAll('.sheet.regler, .reglergriff').forEach(el => el.remove());
  reglerBauen();
}
function reglerBauen() {
SOT.regler(P, { onChange:(name) => {
  if (name === 'azimut' || name === 'neigung' || name === 'zoom' || name === 'sicht') {
    kameraStellen(); if (P.lichtdreht) lichtStellen();
  } else if (name === 'post' || name === 'still') neuZeichnen();
  else if (name === 'gitter') {
    matGelaende.wireframe = matSonstiges.wireframe = !!P.gitter; neuZeichnen();
  } else if (name === 'zeit') zeitStellen(P.zeit);
  else if (name === 'nebel') { nebelAnwenden(true); deckeBauen(); }
  else if (name === 'amzug') {
    /* Am Regler wird nur UMGESCHALTET, nicht gezogen: den Zug beenden heisst
       vergessen, und das darf kein Nebeneffekt eines Reglers sein. */
    amZug = Math.max(0, KLANE.findIndex(K => K.id === P.amzug));
    zugAnzeigen(true);
  }
  else if (KULTUR_P.has(name)) {
    for (const K of KLANE) K.kultur = P[K.pK];
    klankarteBauen();
  }
  else if (LEUTE_P.has(name)) {
    for (const L of LEUTE) { L.sicht = P[L.pS]; L.tempo = P[L.pT]; }
    sichtRechnen(); nebelAnwenden(false); deckeBauen(); reichweiteZeichnen();
    kameraStellen(); klankarteBauen(); leuteKartenBauen();
  } else if (name === 'schatten') {
    renderer.shadowMap.enabled = P.schatten !== 'aus';
    renderer.shadowMap.type = P.schatten === 'weich' ? THREE.VSMShadowMap : THREE.PCFShadowMap;
    /* Schattenart steckt im Shader — JEDES Material muss neu übersetzt werden,
       sonst schaltet nur um, was danach zum ersten Mal gezeichnet wird. */
    for (const m of [matGelaende, matSonstiges, matWolke, matWasser]) m.needsUpdate = true;
    lichtStellen();
  } else if (name === 'lichtdreht') lichtStellen();
  /* Der Stil dreht alle Hebel; ein einzelner Hebel dreht nur sich. Beides
     lässt die Welt stehen — kein `weltBauen`, nichts wird neu gerechnet. */
  else if (name === 'stil') stilWechseln(P.stil);
  else if (name === 'variante') stilWechseln(P.stil, P.variante);
  else if (name === 'pixelig') { groesseStellen(); neuZeichnen(); }
  else if (STIL_HEBEL.indexOf(name) >= 0) stilStellen();
  else weltBauen();
} });
}
reglerBauen();
document.getElementById('bGanz').addEventListener('click', ganzZeigen);

SOT.debug(P);
/* Der Beobachter genügt — er feuert auch beim Fensterwechsel, und anders als
   `resize` auch dann, wenn nur das Reglerbrett die Bühne schmaler macht. */
new ResizeObserver(groesseStellen).observe(buehne);
requestAnimationFrame(schleife);
</script>
</body>
</html>
