    let d = seen.get(k);
    if (!d) { d = [1 + (rnd()-0.5)*0.55, 1 + (rnd()-0.5)*0.55, 1 + (rnd()-0.5)*0.55]; seen.set(k, d); }
    pos.setXYZ(i, pos.getX(i)*d[0], pos.getY(i)*d[1], pos.getZ(i)*d[2]);
  }
  return g;
}
const M = () => new THREE.Matrix4();
const stellen = (x, y, z, sx, sy, sz, dreh) => M()
  .makeTranslation(x, y, z)
  .multiply(M().makeRotationY(dreh || 0))
  .multiply(M().makeScale(sx, sy, sz === undefined ? sx : sz));

function baum(bau, rnd, x, y, z, groesse) {
  const h = groesse * (0.52 + rnd() * 0.30), dreh = rnd() * Math.PI * 2;
  const stammH = h * 0.28, stammR = groesse * 0.032;
  bau.form(new THREE.CylinderGeometry(stammR*0.8, stammR*1.25, stammH, 5, 1),
    stellen(x, y + stammH/2, z, 1, 1, 1, dreh),
    (vx, vy) => dunkler(PAL.stamm, 0.7 + (vy/stammH + 0.5) * 0.4));
  const lagen = 2 + Math.floor(rnd() * 2.4);
  for (let i = 0; i < lagen; i++) {
    const fq = i / lagen;
    const r = groesse * (0.20 - fq * 0.075) * (0.85 + rnd()*0.3);
    const lh = h * (0.42 - fq * 0.07);
    const yy = y + stammH * 0.75 + fq * h * 0.40;
    const c = PAL.nadel[Math.min(PAL.nadel.length - 1, i + (rnd() < 0.4 ? 1 : 0))];
    bau.form(kegelRoh(rnd, 6 + Math.floor(rnd()*2), r, lh, r*0.35),
      stellen(x, yy, z, 1, 1, 1, dreh + i * 0.7),
      (vx, vy) => dunkler(c, 0.80 + (vy / lh) * 0.28));
  }
}
function busch(bau, rnd, x, y, z, groesse) {
  const n = 1 + Math.floor(rnd() * 2.4);
  for (let i = 0; i < n; i++) {
    const s = groesse * (0.07 + rnd() * 0.05);
    bau.form(steinRoh(rnd),
      stellen(x + (rnd()-0.5)*groesse*0.12, y + s*0.62, z + (rnd()-0.5)*groesse*0.12,
              s, s*0.9, s, rnd()*3),
      (vx, vy) => dunkler(PAL.busch, 0.72 + (vy + 1) * 0.19));
  }
  if (rnd() < 0.45)
    for (let i = 0; i < 2 + Math.floor(rnd()*2); i++) {
      const s = groesse * 0.019;
      bau.form(new THREE.IcosahedronGeometry(1, 0),
        stellen(x + (rnd()-0.5)*groesse*0.13, y + groesse*(0.09 + rnd()*0.06),
                z + (rnd()-0.5)*groesse*0.13, s, s, s), () => PAL.beere);
    }
}
function steinhaufen(bau, rnd, x, y, z, groesse) {
  /* Kein EIN grosser Fels: drei bis fünf verschieden grosse, geclustert. */
  const n = 2 + Math.floor(rnd() * 3.4);
  for (let i = 0; i < n; i++) {
    const s = groesse * (0.055 + rnd() * 0.085) * (i === 0 ? 1.35 : 1);
    const c = PAL.fels[Math.floor(rnd() * PAL.fels.length)];
    bau.form(steinRoh(rnd),
      stellen(x + (rnd()-0.5)*groesse*0.22, y + s*0.44, z + (rnd()-0.5)*groesse*0.22,
              s, s*(0.7 + rnd()*0.5), s, rnd()*3),
      (vx, vy) => dunkler(c, 0.62 + (vy + 1) * 0.24));
  }
}
function halme(bau, rnd, x, y, z, groesse, c) {
  /* Offene Zylinder (sechs Dreiecke) — bei tausend Feldern zählt jede Fläche. */
  for (let i = 0; i < 2; i++) {
    const h = groesse * (0.05 + rnd() * 0.05), b = groesse * 0.006;
    bau.form(new THREE.CylinderGeometry(b*0.3, b, h, 3, 1, true),
      stellen(x + (rnd()-0.5)*groesse*0.09, y + h/2, z + (rnd()-0.5)*groesse*0.09,
              1, 1, 1, rnd()*3),
      (vx, vy) => dunkler(c, 0.72 + (vy/h + 0.5) * 0.4));
  }
}

let feuerStelle = null;
function zelt(bau, rnd, x, y, z) {
  const h = 0.30, r = 0.14;
  bau.form(kegelRoh(rnd, 5, r, h, 0.02), stellen(x, y, z, 1, 1, 1, rnd()*3),
    (vx, vy, vz) => dunkler(PAL.zelt[vx + vz > 0 ? 0 : (vx < 0 ? 2 : 1)], 0.78 + (vy / h) * 0.3));
  for (const a of [0.4, 2.5]) {
    const m = M().makeTranslation(x, y + h*0.55, z)
      .multiply(M().makeRotationY(a)).multiply(M().makeRotationX(0.17));
    bau.form(new THREE.CylinderGeometry(0.008, 0.008, h*1.25, 4, 1), m, () => PAL.stamm);
  }
}
/* Winzige Figuren. Es zählt die SILHOUETTE, nicht die Anatomie: ein grosser
   Kopf, ein Hut, ein Speer oder ein Korb — mehr liest bei dieser Grösse
   niemand, und mehr braucht es nicht. */
function person(bau, rnd, x, y, z, wer) {
  const dreh = rnd() * Math.PI * 2;
  const kleid = wer === 'jaeger' ? PAL.kleid : PAL.kleid2;
  bau.form(new THREE.CylinderGeometry(0.030, 0.046, 0.088, 6, 1),
    stellen(x, y + 0.052, z, 1, 1, 1, dreh),
    (vx, vy) => dunkler(kleid, 0.72 + (vy/0.088 + 0.5)*0.4));
  for (const s of [-1, 1])
    bau.form(new THREE.CylinderGeometry(0.011, 0.010, 0.045, 4, 1),
      stellen(x + Math.cos(dreh)*0.016*s, y + 0.022, z + Math.sin(dreh)*0.016*s, 1,1,1, dreh),
      () => dunkler(kleid, 0.62));
  bau.form(new THREE.IcosahedronGeometry(0.034, 0),
    stellen(x, y + 0.121, z, 1, 1, 1, dreh), () => PAL.haut);
  bau.form(kegelRoh(rnd, 6, 0.040, 0.030, 0.004),
    stellen(x, y + 0.138, z, 1, 1, 1, dreh), () => dunkler(kleid, 0.55));
  if (wer === 'jaeger') {
    const hx = x + Math.cos(dreh+1.2)*0.042, hz = z + Math.sin(dreh+1.2)*0.042;
    bau.form(new THREE.CylinderGeometry(0.006, 0.006, 0.21, 4, 1),
      M().makeTranslation(hx, y + 0.105, hz).multiply(M().makeRotationZ(0.13)),
      () => PAL.speer);
    bau.form(kegelRoh(rnd, 4, 0.016, 0.042, 0.002),
      stellen(hx, y + 0.212, hz, 1, 1, 1, dreh), () => PAL.klinge);
  } else {
    /* Der Korb auf dem Rücken ist die ganze Erkennung der Sammlerin. */
    bau.form(new THREE.CylinderGeometry(0.030, 0.024, 0.052, 7, 1),
      stellen(x - Math.cos(dreh)*0.030, y + 0.078, z - Math.sin(dreh)*0.030, 1,1,1, dreh),
      (vx, vy) => dunkler(PAL.korb, 0.74 + (vy/0.052 + 0.5)*0.4));
  }
}
function feuerBauen(bau, rnd, x, y, z, klan) {
  /* Jeder Klan hat ein Lagerfeuer, aber nur EINES trägt das Punktlicht: das
     des Klans am Zug. Zwei Glutlichter über ein halbes Tal hinweg wären zwei
     warme Flecken in einem Bild, das genau einen braucht. */
  feuerStellen[klan || 'oben'] = new THREE.Vector3(x, y + 0.05, z);
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * Math.PI * 2, s = 0.020 + rnd()*0.012;
    bau.form(steinRoh(rnd), stellen(x + Math.cos(a)*0.075, y + s*0.4, z + Math.sin(a)*0.075,
      s, s*0.75, s, rnd()*3), () => dunkler(PAL.asche, 0.8 + rnd()*0.3));
  }
  for (const a of [0.5, 2.3]) {
    const m = M().makeTranslation(x, y + 0.020, z).multiply(M().makeRotationY(a))
      .multiply(M().makeRotationZ(Math.PI/2 + 0.22));
    bau.form(new THREE.CylinderGeometry(0.014, 0.012, 0.11, 5, 1), m,
      (vx, vy) => dunkler(PAL.stamm, 0.7 + (vy/0.11 + 0.5)*0.4));
  }
}

function bewuchsBauen(bau) {
  const dichte = P.dichte / 100;
  for (const f of felder.values()) {
    f.bewVon = bau.anz;
    const rnd = rngFeld(f.c, f.r, 3);
    const s = f.G.streu;
    const belegt = !!f.requisit;
    const anzahl = (p, max) => belegt ? 0 : Math.round(p * dichte * (0.6 + rnd() * max));
    const plaetze = [];
    /* Innerhalb der Feldgrenze bleiben — freie Streuung sieht schlechter aus
       als eine bewusste. Darum Kreis mit 0.8·Inkreis und Mindestabstand. */
    const platz = (min) => {
      for (let v = 0; v < 12; v++) {
        const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * INKREIS * 0.80;
        const lx = Math.cos(a) * rr, lz = Math.sin(a) * rr;
        if (plaetze.every(q => (q[0]-lx)**2 + (q[1]-lz)**2 > min*min)) {
          plaetze.push([lx, lz]); return [lx, lz];
        }
      }
      return null;
    };
    const setzen = (n, min, fn) => {
      for (let i = 0; i < n; i++) {
        const q = platz(min); if (!q) continue;
        fn(f.x + q[0], hoeheAn(f, q[0], q[1]) - 0.012, f.z + q[1]);
      }
    };
    setzen(anzahl(s.baum,  3.2), 0.20, (x,y,z) => baum(bau, rnd, x, y, z, W));
    setzen(anzahl(s.stein, 2.2), 0.16, (x,y,z) => steinhaufen(bau, rnd, x, y, z, W));
    setzen(anzahl(s.busch, 2.0), 0.13, (x,y,z) => busch(bau, rnd, x, y, z, W));
    setzen(anzahl(s.halm,  3.0), 0.08, (x,y,z) =>
      halme(bau, rnd, x, y, z, W, f.wasser ? PAL.schilf : PAL.nadel[3]));

    if (f.requisit) {
      const rq = rngFeld(f.c, f.r, 5), y = hoeheAn(f, 0, 0) - 0.005;
      if (f.requisit.art === 'feuer')  feuerBauen(bau, rq, f.x, y, f.z, f.requisit.klan);
      if (f.requisit.art === 'zelt')   zelt(bau, rq, f.x, y, f.z);
      if (f.requisit.art === 'person') person(bau, rq, f.x, y, f.z, f.requisit.wer);
    }
    f.bewBis = bau.anz;
  }
  feuerStelle = feuerStellen[aktiv().id] || null;
}

/* -------------------------------------------------------------- Die Flamme ---
   Eigenes Netz, additiv gemischt, damit sie glüht statt zu kleben — und damit
   sie sich für sich bewegen kann. Sie ist der Brennpunkt des Bildes: der
   einzige warme Fleck in einer grün-blauen Szene.
   --------------------------------------------------------------------------- */
let mFlamme = null, mFunken = null, funkenStart = null;
const FUNKEN_N = 14;
/* Die Flamme wandert mit dem Zug ans andere Lager — darum muss sie auch wieder
   weg können, ohne dass die ganze Welt neu gebaut wird. */
function flammeWeg() {
  for (const m of [mFlamme, mFunken]) {
    if (!m) continue;
    scene.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material) m.material.dispose();
  }
  mFlamme = mFunken = null;
}
function flammeBauen() {
  flammeWeg();
  if (!feuerStelle) return;
  const rnd = rngAus(mix32(P.seed, 3131));
  const bau = new Bauplan();
  /* Um den EIGENEN Nullpunkt gebaut: nur so skalieren und drehen Flackern und
     Zug um die Flamme selbst und nicht um den Weltursprung. */
  for (let i = 0; i < 3; i++) {
    const h = 0.13 - i * 0.032, r = 0.048 - i * 0.011;
    const c = i === 0 ? PAL.glut : PAL.glut.clone().lerp(PAL.glutKern, i * 0.5);
    bau.form(kegelRoh(rnd, 6, r, h, r * 0.5),
      stellen((rnd()-0.5)*0.012, -0.03 + i*0.012, (rnd()-0.5)*0.012, 1, 1, 1, rnd()*3),
      (vx, vy) => c.clone().multiplyScalar(0.7 + (vy / h) * 0.9));
  }
  mFlamme = new THREE.Mesh(bau.geometrie(), new THREE.MeshBasicMaterial({
    vertexColors:true, transparent:true, opacity:0.82,
    blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false
  }));
  mFlamme.frustumCulled = false;
  mFlamme.position.copy(feuerStelle);
  scene.add(mFlamme);

  mFunken = new THREE.InstancedMesh(new THREE.BoxGeometry(0.008, 0.008, 0.008),
    new THREE.MeshBasicMaterial({ color:PAL.glutKern, blending:THREE.AdditiveBlending,
      transparent:true, depthWrite:false, toneMapped:false }), FUNKEN_N);
  mFunken.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mFunken.frustumCulled = false;
  funkenStart = [];
  for (let i = 0; i < FUNKEN_N; i++)
    funkenStart.push({ a:rnd()*Math.PI*2, r:0.01 + rnd()*0.03, p:rnd(), v:0.5 + rnd()*0.6 });
  scene.add(mFunken);
  funkenStellen(0);
}
function funkenStellen(t) {
  if (!mFunken || !feuerStelle) return;
  const m = M(), p = feuerStelle;
  for (let i = 0; i < FUNKEN_N; i++) {
    const s = funkenStart[i], fq = (s.p + t * s.v * 0.30) % 1, s2 = (1 - fq) * 0.9 + 0.1;
    m.makeTranslation(p.x + Math.cos(s.a + fq * 2.2) * s.r * (0.4 + fq),
                      p.y + 0.03 + fq * 0.42,
                      p.z + Math.sin(s.a + fq * 2.2) * s.r * (0.4 + fq))
     .multiply(M().makeScale(s2, s2, s2));
    mFunken.setMatrixAt(i, m);
  }
  mFunken.instanceMatrix.needsUpdate = true;
}

/* ============================================================================
   10 · Wetter
   ========================================================================= */
function wolkeBauen(bau, mitte) {
  const rnd = rngAus(mix32(P.seed, 8123));
  /* Viele KLEINE Ballen, dicht gepackt: wenige grosse lesen sich als grauer
     Kristall, nicht als Wolke. */
  for (let i = 0; i < 20; i++) {
    const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd());
    const s = 0.20 + rnd() * 0.22;
    bau.form(steinRoh(rnd), stellen(
      mitte.x + Math.cos(a)*rr*1.15, mitte.y + (rnd()-0.5)*0.22 - rr*0.10,
      mitte.z + Math.sin(a)*rr*0.75, s, s*0.52, s*0.85, rnd()*3),
      (vx, vy) => dunkler(PAL.wolke[Math.floor(rnd() * PAL.wolke.length)], 0.80 + (vy + 1) * 0.14));
  }
}
const REGEN_N = 260;
let regenStart = null, regenBoden = 1;
function regenBauen(wm) {
  mRegen = new THREE.InstancedMesh(new THREE.BoxGeometry(0.012, 0.16, 0.012),
    new THREE.MeshBasicMaterial({ color:PAL.tropfen, transparent:true, opacity:0.62,
      toneMapped:false }), REGEN_N);
  mRegen.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  mRegen.frustumCulled = false;
  const rnd = rngAus(mix32(P.seed, 5150));
  regenBoden = wm.y - 2.4;
  regenStart = [];
  for (let i = 0; i < REGEN_N; i++)
    regenStart.push({ x:wm.x + (rnd()-0.5)*4.4, z:wm.z + (rnd()-0.5)*2.6,
                      y0:wm.y - 0.25, p:rnd(), v:0.85 + rnd()*0.6 });
  scene.add(mRegen);
  regenStellen(0);
}
function regenStellen(t) {
  if (!mRegen) return;
  const m = M();
  for (let i = 0; i < REGEN_N; i++) {
    const s = regenStart[i], fall = (s.p + t * s.v * 0.36) % 1;
    m.makeTranslation(s.x, s.y0 - fall * (s.y0 - regenBoden), s.z);
    mRegen.setMatrixAt(i, m);
  }
  mRegen.instanceMatrix.needsUpdate = true;
}

/* ============================================================================
   11 · Bühne: Renderer, Kamera, Licht, Nachbearbeitung
   ========================================================================= */
const buehne = document.getElementById('buehne');
const leinwand = document.getElementById('gl');
let renderer, scene, kamera, sonne, fuell, rueck, glutlicht;
let mGelaende, mWasser, mSonstiges, mWolke, mRegen, mSchatten, mRing, mRingHover;
let mReich = null, mSichtRinge = null, mDecke = null;
let matGelaende, matWasser, matSonstiges, matWolke, matDecke;
/* Die Wolkenfarbe muss auch im Wasser-Shader ankommen: Vertexfarbe erreicht
   den Spiegelglanz nicht, und ein Fluss unter der Wolke wäre sonst der einzige
   blaue Strich in einer weissen Fläche. */
const uNebelFarbe = { value: new THREE.Vector3(0.88, 0.87, 0.85) };
let rtScene, rtA, rtB, quad, quadScene, quadCam, matHell, matBlur, matEnde;
/* Der Normalen- und Tiefenpuffer der Kontur. EIN zusätzlicher Durchgang der
   ganzen Szene mit `MeshNormalMaterial` als Übermaterial liefert beides: die
   Normalen in der Farbe, die Tiefe in der angehängten Tiefentextur. Warum
   nicht die Tiefe aus `rtScene`? Der trägt Mehrfachabtastung (samples:4), und
   eine mehrfach abgetastete Tiefentextur ist in WebGL2 nicht verlässlich
   auszulesen. Der eigene Puffer hat keine — und braucht auch keine, denn eine
   geglättete Kante ergäbe eine geglättete Linie, also eine schlechtere. */
let rtNorm = null, matNormal = null, texPapier = null;
/* Die Hebel als Uniformen. Sie werden IMMER in die Materialien eingespleisst
   und zur Laufzeit verzweigt — würde man den Code je nach Stil ein- und
   aushängen, müsste bei jedem Umschalten jedes Material neu übersetzt werden,
   und das Labor ruckelte genau dort, wo es überzeugen soll. */
const uStufen       = { value: 3 };
const uKante        = { value: 0.06 };
const uSchattenTon  = { value: 1 };
const uLichtFarbe   = { value: new THREE.Vector3(1, 0.97, 0.90) };
const uSchattenFarbe= { value: new THREE.Vector3(0.36, 0.42, 0.53) };
const uZeit = { value: 0 };
let inselMitte = new THREE.Vector3(), inselHoch = 1, inselSpan = new THREE.Vector3(8,1,10);
let schattenTex = null;
/* Die Blickmitte — Ziel des Schiebens, geklemmt auf die Reichweite. */
const blickZiel = new THREE.Vector3();

function rendererBauen() {
  /* `preserveDrawingBuffer` NUR mit ?still: zeichnet man auf Zuruf, darf der
     Bildpuffer zwischen zwei Zeichnungen nicht verworfen werden. Ohne das legt
     headless Chrome unter `--virtual-time-budget` gelegentlich einen geleerten,
     nie neu gezeichneten Puffer vor — das Bildschirmfoto ist dann leeres
     Papier, und man sucht den Fehler in der Kamerapassung. */
  renderer = new THREE.WebGLRenderer({
    canvas:leinwand, antialias:true, alpha:false, preserveDrawingBuffer:!!P.still
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  /* `PCFSoftShadowMap` ist in r185 abgekündigt und fällt still auf PCF zurück —
     „weich" hätte gar nichts getan. Weiche Schatten kommen darum aus VSM. */
  renderer.shadowMap.enabled = P.schatten !== 'aus';
  renderer.shadowMap.type = P.schatten === 'weich' ? THREE.VSMShadowMap : THREE.PCFShadowMap;
  scene = new THREE.Scene();
  kamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);

  sonne = new THREE.DirectionalLight(0xffffff, 1);
  sonne.castShadow = true;
  sonne.shadow.mapSize.set(1024, 1024);
  sonne.shadow.bias = -0.0012; sonne.shadow.normalBias = 0.02;
  sonne.shadow.radius = 2; sonne.shadow.blurSamples = 10;
  scene.add(sonne, sonne.target);
  fuell = new THREE.HemisphereLight(0xffffff, 0x888888, 1); scene.add(fuell);
  rueck = new THREE.DirectionalLight(0xffffff, 0.2); scene.add(rueck);
  glutlicht = new THREE.PointLight(0xffffff, 0, 2.4, 2); scene.add(glutlicht);

  matGelaende  = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.92, metalness:0 });
  matSonstiges = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:0.86, metalness:0 });
  matWolke     = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:1, metalness:0 });
  matDecke     = new THREE.MeshStandardMaterial({ vertexColors:true, roughness:1, metalness:0 });
  matWasser    = new THREE.MeshStandardMaterial({
    vertexColors:true, roughness:0.24, metalness:0.04,
    transparent:true, opacity:0.93, side:THREE.DoubleSide
  });
  /* Alle beleuchteten Materialien bekommen die Stufung. `matWasser` auch —
     ein glänzender Fluss in einem flachen Bild wäre der eine Gegenstand, der
     verrät, dass hier gerendert und nicht gemalt wurde. */
  for (const m of [matGelaende, matSonstiges, matWolke, matDecke])
    m.onBeforeCompile = toonInjizieren;

  matWasser.onBeforeCompile = s => {
    /* Reihenfolge: erst stufen, dann vernebeln. Beide hängen sich vor
       `<tonemapping_fragment>`, und wer zuerst ersetzt, steht oben. Der Nebel
       muss das schon geflachte Bild ergrauen, nicht umgekehrt. */
    toonInjizieren(s);
    s.uniforms.uZeit = uZeit;
    s.uniforms.uNebelFarbe = uNebelFarbe;
    s.vertexShader = 'attribute vec2 aFluss;\nattribute float aNebel;\n' +
      'varying vec2 vFlu;\nvarying float vNebel;\n' + s.vertexShader.replace(
      '#include <begin_vertex>', '#include <begin_vertex>\n  vFlu = aFluss;\n  vNebel = aNebel;');
    s.fragmentShader = 'uniform float uZeit;\nuniform vec3 uNebelFarbe;\n' +
      'varying vec2 vFlu;\nvarying float vNebel;\n' +
      s.fragmentShader.replace(
        '#include <color_fragment>',
        '#include <color_fragment>\n' +
        '  float w = sin(vFlu.y * 6.2831 - uZeit * 2.1) * 0.5 + 0.5;\n' +
        '  float w2 = sin(vFlu.y * 17.0 + vFlu.x * 5.0 - uZeit * 3.4) * 0.5 + 0.5;\n' +
        '  diffuseColor.rgb *= 0.93 + 0.10 * w + 0.05 * w2;')
      /* Der Nebel muss NACH der Beleuchtung greifen. Über die Eckenfarbe allein
         blieb der Fluss ausser Sicht blau: der Glanz spiegelt das kühle
         Fülllicht, und den erreicht keine Vertexfarbe. Wasser ist die einzige
         glatte, spiegelnde Fläche der Szene — darum trifft es nur sie.
         `aNebel` trägt jetzt DREI Zustände: 0 in Sicht, 1 Erinnerung,
         2 volle Wolke. Die Werte dazwischen sind die Rampe der Front. */
      .replace('#include <tonemapping_fragment>',
        '  float nl = dot(gl_FragColor.rgb, vec3(0.2126, 0.7152, 0.0722));\n' +
        '  vec3 nZiel = mix(vec3(0.10 + nl * 0.80), uNebelFarbe * (0.76 + nl * 0.38),\n' +
        '                   clamp(vNebel - 1.0, 0.0, 1.0));\n' +
        '  gl_FragColor.rgb = mix(gl_FragColor.rgb, nZiel, clamp(vNebel, 0.0, 1.0));\n' +
        '#include <tonemapping_fragment>');
  };

  /* Nachbearbeitung. RawShaderMaterial, damit three NICHTS anhängt — keine
     Tonwertabbildung, keine Farbraumwandlung. Der letzte Durchgang macht beides
     selbst; sonst wäre das Bild doppelt kodiert.
     Wichtig: in ein Rendertarget wendet three toneMapping NICHT an (geprüft in
     der Quelle), die Zwischenbilder sind also linear und dürfen HDR tragen. */
  const vs = `attribute vec3 position; varying vec2 vUv;
    void main(){ vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const roh = (fs, uni) => new THREE.RawShaderMaterial({
    vertexShader:vs, fragmentShader:fs, uniforms:uni, depthTest:false, depthWrite:false });

  matHell = roh(`precision highp float; varying vec2 vUv;
    uniform sampler2D tBild; uniform float uSchwelle;
    void main(){ vec3 c = texture2D(tBild, vUv).rgb;
      float l = max(max(c.r, c.g), c.b);
      gl_FragColor = vec4(c * smoothstep(uSchwelle, uSchwelle + 0.7, l), 1.0); }`,
    { tBild:{ value:null }, uSchwelle:{ value:1.05 } });

  matBlur = roh(`precision highp float; varying vec2 vUv;
    uniform sampler2D tBild; uniform vec2 uRichtung;
    void main(){
      vec3 s = texture2D(tBild, vUv).rgb * 0.2270;
      s += (texture2D(tBild, vUv + uRichtung*1.3846).rgb + texture2D(tBild, vUv - uRichtung*1.3846).rgb) * 0.3162;
      s += (texture2D(tBild, vUv + uRichtung*3.2308).rgb + texture2D(tBild, vUv - uRichtung*3.2308).rgb) * 0.0702;
      gl_FragColor = vec4(s, 1.0); }`,
    { tBild:{ value:null }, uRichtung:{ value:new THREE.Vector2() } });

  /* Der Schlussdurchgang trägt jetzt SECHS Dinge statt einem, in genau dieser
     Reihenfolge — und die Reihenfolge ist die halbe Miete:

       1 Kochen      versetzt die ABTASTUNG, also wackelt alles Folgende mit
       2 Fotografie  Nachschärfen und Glut — die Kamera-Idiome
       3 Tonwert     ACES nur, soweit fotografiert wird; sonst schlicht klemmen
       4 Kontur      die Linie, aus Tiefe und Normalen
       5 Papierton   noch LINEAR, denn es ist eine Farboperation
       ——— hier erst nach sRGB, ab jetzt wird gedruckt statt gerechnet ———
       6 Papierkorn  und 7 Rastern — beide gehören in den Anzeigeraum, sonst
                     sind die Stufen ungleich verteilt und das Korn wandert
                     in den Lichtern zu

     Alle Hebel sind Uniformen mit Null als Aus. Ein Stil ist damit ein
     Zahlenwechsel, keine Neuübersetzung — das Umschalten ruckelt nicht. */
  matEnde = roh(`precision highp float; varying vec2 vUv;
    uniform sampler2D tBild, tGlut, tNormal, tTiefe, tPapier;
    uniform vec2 uPixel;                 /* Texel des SZENEN-Puffers (klein beim Pixeln) */
    uniform vec2 uSchirm;                /* Bildpunkte des Ausgabebilds */
    uniform float uBelichtung, uGlut, uSaettigung, uScharf, uVignette, uFoto;
    uniform float uKontur, uStrich, uTiefenSpanne;
    uniform float uKorn, uKochen, uPhase, uRaster, uFarbstufen, uZeige;
    uniform vec3 uWarm, uKuehl, uTinte, uPapierTon;
    const vec3 WL = vec3(0.2126, 0.7152, 0.0722);
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
    vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(max(c, vec3(1e-5)), vec3(1.0/2.4)) - 0.055,
                                  step(vec3(0.0031308), c)); }
    float hash21(vec2 p){ p = fract(p * vec2(123.34, 345.45)); p += dot(p, p + 34.345);
                          return fract(p.x * p.y); }
    /* Bayer als Formel statt als Tabelle — kürzer, und ohne Verzweigung. */
    float bayer2(vec2 a){ a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float bayer8(vec2 a){ return bayer4(0.5 * a) * 0.25 + bayer2(a); }
    void main(){
      /* 1 · Kochen. Der Versatz wird nur ~10x je Sekunde neu gewürfelt
         (uPhase ist in JS gerastet): ein Zittern in JEDEM Bild sähe aus wie
         Rauschen — erst das Stehenbleiben dazwischen liest sich als
         gezeichneter Trickfilm. Deshalb ist das Kochen im Standbild
         unsichtbar und nur in Bewegung zu beurteilen. */
      vec2 uv = vUv;
      if (uKochen > 0.0) {
        vec2 g = floor(vUv * uSchirm / 7.0);
        vec2 w = vec2(hash21(g + uPhase * 1.7), hash21(g + uPhase * 1.7 + 71.3)) - 0.5;
        uv += w * uKochen * uPixel * 2.4;
      }
      vec3 c = texture2D(tBild, uv).rgb;

      /* 2 · Fotografie */
      if (uFoto > 0.0) {
        vec3 u = texture2D(tBild, uv + vec2(uPixel.x, 0.0)).rgb
               + texture2D(tBild, uv - vec2(uPixel.x, 0.0)).rgb
               + texture2D(tBild, uv + vec2(0.0, uPixel.y)).rgb
               + texture2D(tBild, uv - vec2(0.0, uPixel.y)).rgb;
        c += (c - u * 0.25) * uScharf;
        c += texture2D(tGlut, uv).rgb * uGlut;
      }

      /* 3 · Tonwert. ACES ist eine FILMkurve. Ohne Fotografie wird schlicht
         geklemmt — sonst zöge die Kurve die flachen Stufen wieder krumm, und
         genau ihre Flachheit ist der Punkt. */
      vec3 b = c * uBelichtung;
      c = mix(clamp(b, 0.0, 1.0), aces(b), clamp(uFoto, 0.0, 1.0));
      if (uFoto > 0.0) {
        float l = dot(c, WL);
        c *= mix(uKuehl, uWarm, smoothstep(0.16, 0.86, l));
        c = mix(vec3(l), c, uSaettigung);
        c *= 1.0 - uVignette * smoothstep(0.34, 0.90, distance(vUv, vec2(0.5)));
      }

      /* 4 · Die Linie. Aussenkontur aus der Tiefe, Binnenkontur aus den
         Normalen — beide nötig: die Tiefe allein umreisst nur die Silhouette
         und lässt jede Kante INNERHALB eines Hangs weg, die Normalen allein
         verlieren die Kante gegen den Hintergrund.
         Die Tiefe wird in WELT-Einheiten gerechnet (uTiefenSpanne): eine
         Schwelle in [0,1] wäre bei jedem Kameraabstand eine andere. Dass das
         ohne Linearisierung geht, ist ein Geschenk der orthografischen
         Kamera — dort IST die Tiefe linear. */
      if (uKontur > 0.0) {
        vec2 e = uPixel * uStrich;
        float d0 = texture2D(tTiefe, uv).x;
        float dd = abs(d0 - texture2D(tTiefe, uv + vec2(e.x, 0.0)).x)
                 + abs(d0 - texture2D(tTiefe, uv - vec2(e.x, 0.0)).x)
                 + abs(d0 - texture2D(tTiefe, uv + vec2(0.0, e.y)).x)
                 + abs(d0 - texture2D(tTiefe, uv - vec2(0.0, e.y)).x);
        dd *= uTiefenSpanne;
        vec3 n0 = texture2D(tNormal, uv).xyz * 2.0 - 1.0;
        float nn = (1.0 - dot(n0, texture2D(tNormal, uv + vec2(e.x, 0.0)).xyz * 2.0 - 1.0))
                 + (1.0 - dot(n0, texture2D(tNormal, uv - vec2(e.x, 0.0)).xyz * 2.0 - 1.0))
                 + (1.0 - dot(n0, texture2D(tNormal, uv + vec2(0.0, e.y)).xyz * 2.0 - 1.0))
                 + (1.0 - dot(n0, texture2D(tNormal, uv - vec2(0.0, e.y)).xyz * 2.0 - 1.0));
        float k = max(smoothstep(0.035, 0.14, dd), smoothstep(0.14, 0.70, nn));
        c = mix(c, uTinte, clamp(k * uKontur, 0.0, 1.0));
      }

      /* Zwischenbilder. Bewusst NACH der Kontur und vor allem Weiteren: was
         hier zu sehen ist, ist genau das, womit die Linie gerechnet hat. */
      if (uZeige > 0.5) {
        float dz = texture2D(tTiefe, uv).x;
        if (uZeige < 1.5) { gl_FragColor = vec4(vec3(fract(dz * 64.0)), 1.0); return; }
        if (uZeige < 2.5) { gl_FragColor = vec4(texture2D(tNormal, uv).rgb, 1.0); return; }
        vec2 e2 = uPixel * uStrich;
        float dd2 = abs(dz - texture2D(tTiefe, uv + vec2(e2.x, 0.0)).x)
                  + abs(dz - texture2D(tTiefe, uv - vec2(e2.x, 0.0)).x)
                  + abs(dz - texture2D(tTiefe, uv + vec2(0.0, e2.y)).x)
                  + abs(dz - texture2D(tTiefe, uv - vec2(0.0, e2.y)).x);
        vec3 nq = texture2D(tNormal, uv).xyz * 2.0 - 1.0;
        float nn2 = (1.0 - dot(nq, texture2D(tNormal, uv + vec2(e2.x, 0.0)).xyz * 2.0 - 1.0))
                  + (1.0 - dot(nq, texture2D(tNormal, uv - vec2(e2.x, 0.0)).xyz * 2.0 - 1.0))
                  + (1.0 - dot(nq, texture2D(tNormal, uv + vec2(0.0, e2.y)).xyz * 2.0 - 1.0))
                  + (1.0 - dot(nq, texture2D(tNormal, uv - vec2(0.0, e2.y)).xyz * 2.0 - 1.0));
        /* Rot = Tiefe (Aussenkontur), Grün = Normalen (Binnenkontur). Wer
           beides getrennt sieht, weiss sofort, welcher Schwellwert klemmt. */
        gl_FragColor = vec4(smoothstep(0.035, 0.14, dd2 * uTiefenSpanne),
                            smoothstep(0.14, 0.70, nn2), 0.0, 1.0);
        return;
      }

      /* 5 · Papierton — noch linear, weil es eine Farboperation ist. Er hebt
         nebenbei das Schwarz an: gedrucktes Schwarz ist nie Null, und ein
         Bild mit echtem Schwarz sieht sofort wieder nach Bildschirm aus. */
      if (uKorn > 0.0) c = mix(c, uPapierTon, 0.055 * uKorn);

      vec3 d = srgb(clamp(c, 0.0, 1.0));

      /* 6 · Papierkorn — BILDSCHIRMFEST, nicht mitgedreht. Das sagt „dies ist
         ein Bild von der Welt", nicht „die Welt besteht aus Papier". */
      if (uKorn > 0.0) {
        float f = texture2D(tPapier, vUv * uSchirm / 512.0).r;
        d *= 1.0 + (f - 0.5) * 0.5 * uKorn;
      }

      /* 7 · Rastern. Die Bayer-Schwelle wird VOR dem Stufen addiert — genau
         das macht aus einer harten Farbtreppe ein Muster. Gerechnet im Raster
         des SZENEN-Puffers, sonst zerfiele es beim Pixeln in Matsch, weil
         die Schwelle innerhalb eines Bildpunkts weiterliefe. */
      if (uRaster > 0.0) {
        float bq = bayer8(vUv / uPixel) - 0.5;
        vec3 q = floor(d * uFarbstufen + 0.5 + bq * clamp(uRaster, 0.0, 1.5)) / uFarbstufen;
        d = mix(d, clamp(q, 0.0, 1.0), min(uRaster, 1.0));
      }
      gl_FragColor = vec4(clamp(d, 0.0, 1.0), 1.0); }`,
    { tBild:{ value:null }, tGlut:{ value:null }, tNormal:{ value:null },
      tTiefe:{ value:null }, tPapier:{ value:null },
      uPixel:{ value:new THREE.Vector2() }, uSchirm:{ value:new THREE.Vector2() },
      uBelichtung:{ value:1 }, uGlut:{ value:0.5 }, uSaettigung:{ value:1.12 },
      uScharf:{ value:0.30 }, uVignette:{ value:0.16 }, uFoto:{ value:1 },
      uKontur:{ value:0 }, uStrich:{ value:1 }, uTiefenSpanne:{ value:200 },
      uKorn:{ value:0 }, uKochen:{ value:0 }, uPhase:{ value:0 },
      uRaster:{ value:0 }, uFarbstufen:{ value:6 }, uZeige:{ value:0 },
      uWarm:{ value:new THREE.Vector3(1,1,1) }, uKuehl:{ value:new THREE.Vector3(1,1,1) },
      uTinte:{ value:new THREE.Vector3(0.1,0.07,0.05) },
      uPapierTon:{ value:new THREE.Vector3(0.9,0.85,0.75) } });

  quadScene = new THREE.Scene();
  quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), matHell);
  quad.frustumCulled = false;
  quadScene.add(quad);
  quadCam = new THREE.Camera();

  const opt = { type:THREE.HalfFloatType, colorSpace:THREE.NoColorSpace, stencilBuffer:false };
  rtScene = new THREE.WebGLRenderTarget(2, 2, { ...opt, depthBuffer:true, samples:4 });
  rtA = new THREE.WebGLRenderTarget(2, 2, { ...opt, depthBuffer:false });
  rtB = new THREE.WebGLRenderTarget(2, 2, { ...opt, depthBuffer:false });

  /* Konturpuffer: KEINE Mehrfachabtastung (die Kante soll hart sein, und eine
     mehrfach abgetastete Tiefentextur ist nicht verlässlich auszulesen) und
     überall Nächster-Nachbar — eine weichgezeichnete Tiefe ergäbe eine
     weichgezeichnete Linie. */
  rtNorm = new THREE.WebGLRenderTarget(2, 2, { ...opt, depthBuffer:true });
  rtNorm.texture.minFilter = rtNorm.texture.magFilter = THREE.NearestFilter;
  rtNorm.depthTexture = new THREE.DepthTexture(2, 2);
  rtNorm.depthTexture.type = THREE.UnsignedIntType;
  rtNorm.depthTexture.minFilter = rtNorm.depthTexture.magFilter = THREE.NearestFilter;
  /* `MeshNormalMaterial` statt eines eigenen Shaders: es bringt Instanzierung,
     Morphing und Häutung schon mit — ein handgeschriebenes Übermaterial
     zeichnete den Regen und die Funken an die falsche Stelle. */
  matNormal = new THREE.MeshNormalMaterial();
  texPapier = papierTextur();
  matEnde.uniforms.tPapier.value = texPapier;
}

/* ----------------------------------------------------------------------------
   Die Lichtquantisierung — DER Hebel dieses Labors.

   Der Kniff: three's Beleuchtung wird nicht nachgebaut, sondern ZURÜCKGELESEN.
   Nach `<color_fragment>` steht in `diffuseColor` die Grundfarbe (bei uns die
   Eckenfarbe), vor `<tonemapping_fragment>` in `gl_FragColor` das beleuchtete
   Ergebnis. Der Quotient ihrer Helligkeiten IST der Lichtfaktor — und ein
   Faktor lässt sich stufen.

   Und dann der zweite, wichtigere Teil: statt `farbe * faktor` wird zwischen
   einer SCHATTENFARBE und einer LICHTFARBE gemischt und das Ergebnis über die
   Grundfarbe gelegt. Damit kippt die Schattenseite ins Kühle, statt bloss
   dunkler zu werden. Das ist der Unterschied zwischen einem Rendering und
   einem Bild — grösser als jede Linie, und er kostet vier Zeilen.
   -------------------------------------------------------------------------- */
function toonInjizieren(s) {
  s.uniforms.uStufen = uStufen;
  s.uniforms.uKante = uKante;
  s.uniforms.uSchattenTon = uSchattenTon;
  s.uniforms.uLichtFarbe = uLichtFarbe;
  s.uniforms.uSchattenFarbe = uSchattenFarbe;
  s.fragmentShader =
    'uniform float uStufen, uKante, uSchattenTon;\n' +
    'uniform vec3 uLichtFarbe, uSchattenFarbe;\n' +
    'vec3 gGrundfarbe = vec3(1.0);\n' +
    s.fragmentShader
      .replace('#include <color_fragment>',
        '#include <color_fragment>\n  gGrundfarbe = diffuseColor.rgb;')
      .replace('#include <tonemapping_fragment>', [
        '  if (uStufen > 0.5) {',
        '    const vec3 WL = vec3(0.2126, 0.7152, 0.0722);',
        '    float aL = max(dot(gGrundfarbe, WL), 1e-4);',
        '    float f  = dot(gl_FragColor.rgb, WL) / aL;',
        /* Die Stufe wird mit `smoothstep` angeschrägt, sonst flimmert sie auf
           jeder schrägen Fläche. uKante = 0 heisst messerscharf. */
        '    float tt = clamp(f, 0.0, 1.8) * uStufen;',
        '    float kk = max(uKante, 1e-4);',
        '    float fq = (floor(tt) + smoothstep(0.5 - kk, 0.5 + kk, fract(tt))) / uStufen;',
        '    float fc = clamp(fq, 0.0, 1.0);',
        /* uSchattenTon blendet zwischen „nur gestuft" (der Wert) und
           „gefärbt" (die Farbe) — damit ist im Regler zu sehen, welcher der
           beiden Anteile das Bild eigentlich dreht. */
        '    vec3 gefaerbt = mix(uSchattenFarbe, uLichtFarbe, fc);',
        /* NICHT geklemmt: über 100 % wird EXTRApoliert, der Schatten kippt
           also weiter ins Kühle, als der Token allein ihn brächte. Genau davon
           leben die harten Spielarten („hart", „Siebdruck"), und ohne das
           sähen sie aus wie die weichen. Unten abgefangen, damit die
           Extrapolation nicht ins Negative läuft. */
        '    vec3 ton = max(vec3(0.0), mix(vec3(fc), gefaerbt, uSchattenTon));',
        /* Was über die oberste Stufe hinausschiesst (Glanz) bleibt als
           weisser Zuschlag stehen — sonst verliert das Wasser sein Licht. */
        '    gl_FragColor.rgb = gGrundfarbe * ton + vec3(max(fq - 1.0, 0.0) * 0.45);',
        '  }',
        '#include <tonemapping_fragment>'].join('\n'));
}

/* Papier als Textur, nicht als Rauschen. Reines Rauschen liest sich als
   Fernsehschnee; erst kurze Fasern in zwei Vorzugsrichtungen lesen sich als
   Bogen. 512² reicht, weil sie bildschirmfest gekachelt wird und niemand die
   Kachel sucht. */
function papierTextur() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 512;
  const g = cv.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 512, 512);
  const rnd = rngAus(mix32(P.seed, 4242));
  for (let i = 0; i < 11000; i++) {
    const x = rnd() * 512, y = rnd() * 512;
    const a = (rnd() - 0.5) * 0.8 + (rnd() < 0.5 ? 0 : Math.PI / 2);
    const l = 2 + rnd() * 10;
    g.strokeStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  /* Einschlüsse — ein Bogen ist nicht gleichmässig, und genau das sieht man. */
  for (let i = 0; i < 260; i++) {
    const x = rnd() * 512, y = rnd() * 512, r = 0.6 + rnd() * 2.2;
    g.fillStyle = 'rgba(0,0,0,' + (0.03 + rnd() * 0.05).toFixed(3) + ')';
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.NoColorSpace;
  return t;
}

function schattenTextur() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  rg.addColorStop(0, 'rgba(0,0,0,0.62)');
  rg.addColorStop(0.5, 'rgba(0,0,0,0.34)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================================
   12 · Die Welt aufbauen
   ========================================================================= */
let messung = { dreiecke:0, bauzeit:0, gel:0, bew:0, decke:0, deckezeit:0, calls:0, tris:0 };
let weltSig = null;
let gelFarbenAlt = null, bewFarbenAlt = null;

function altWeg() {
  for (const m of [mGelaende, mWasser, mSonstiges, mWolke, mRegen, mSchatten,
                   mRing, mRingHover, mFlamme, mFunken, mReich, mSichtRinge, mDecke]) {
    if (!m) continue;
    scene.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material && ![matGelaende, matWasser, matSonstiges, matWolke, matDecke].includes(m.material))
      m.material.dispose();
  }
  mGelaende = mWasser = mSonstiges = mWolke = mRegen = null;
  mSchatten = mRing = mRingHover = mFlamme = mFunken = mReich = mSichtRinge = null;
  mDecke = null;
}

function weltBauen() {
  const t0 = performance.now();
  paletteLesen();
  altWeg();
  felderRechnen();
  /* Nur eine ANDERE Welt setzt die Wolken zurück. Sonst kostete jeder Wechsel
     der Tageszeit (der die Welt neu baut, weil die Palette in den Ecken steckt)
     den ganzen Spielstand der Front — und ausgerechnet nachts will man sehen,
     wie weit die Erinnerung reicht. */
  const sig = P.karte + '|' + P.breite + '|' + P.seed;
  const neueWelt = sig !== weltSig;
  weltSig = sig;
  wolkenAnlegen(neueWelt);
  gemaltZuruecksetzen();
  leuteSetzen();
  sichtRechnen();
  if (neueWelt) {
    /* Die beiden Debug-Griffe für den interessanten Zustand. Er ist durch
       Klicken NICHT erreichbar und durch eine URL bisher auch nicht: die
       Sichtscheibe schützt sich selbst, also frisst die Front dort nie etwas.
       Erst eine ERKUNDETE Fläche, die grösser ist als die Sicht, gibt der
       Front etwas zu tun — genau das, was im Spiel entsteht, wenn Leute
       weiterziehen. `entdeckt` legt sie an, `vorlauf` lässt die Runden laufen. */
    if (P.entdeckt > 0) for (const K of KLANE) {
      if (!K.anker) continue;
      for (const q of SOT.hex.disc(K.anker.c, K.anker.r, P.entdeckt)) {
        const f = feldAn(q.c, q.r); if (f) K.wolke[f.i] = 0;
      }
    }
    for (let i = 0; i < P.vorlauf; i++) for (const K of KLANE) frontSchieben(K);
    runde = 1 + P.vorlauf;
  }

  const bGel = new Bauplan();
  kachelnBauen(bGel);
  messung.gel = bGel.anz;
  mGelaende = new THREE.Mesh(bGel.geometrie(), matGelaende);
  mGelaende.castShadow = true; mGelaende.receiveShadow = true;
  scene.add(mGelaende);

  /* Bewuchs zuerst, dann das Wasser: `wasserBauen` legt die Stürze und den
     Schaum in DIESES Netz (sie sind Körper, kein Wasserband) und gibt die
     Wassergeometrie zurück. */
  const bRest = new Bauplan();
  bewuchsBauen(bRest);
  const wg = wasserBauen(bRest);
  messung.bew = bRest.anz;
  if (wg) {
    mWasser = new THREE.Mesh(wg, matWasser);
    mWasser.receiveShadow = true;
    scene.add(mWasser);
  }
  mSonstiges = new THREE.Mesh(bRest.geometrie(), matSonstiges);
  mSonstiges.castShadow = true; mSonstiges.receiveShadow = true;
  scene.add(mSonstiges);
  flammeBauen();

  /* Die Urfarben merken — der Nebel schreibt sie um und muss zurückkönnen. */
  gelFarbenAlt = mGelaende.geometry.attributes.color.array.slice();
  bewFarbenAlt = mSonstiges.geometry.attributes.color.array.slice();

  mGelaende.geometry.computeBoundingBox();
  const bb = mGelaende.geometry.boundingBox;
  inselMitte.set((bb.min.x + bb.max.x)/2, 0, (bb.min.z + bb.max.z)/2);
  inselHoch = bb.max.y;
  inselSpan.set(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z);

  if (P.wetter === 'regen') {
    const bW = new Bauplan();
    const wm = new THREE.Vector3(blickZiel.x - W * 0.9, inselHoch + 2.0, blickZiel.z - H * 2.0);
    wolkeBauen(bW, wm);
    mWolke = new THREE.Mesh(bW.geometrie(), matWolke);
    mWolke.geometry.computeBoundingBox();
    scene.add(mWolke);
    regenBauen(wm);
    messung.dreiecke = bGel.anz + bRest.anz + bW.anz;
  } else messung.dreiecke = bGel.anz + bRest.anz;

  if (!schattenTex) schattenTex = schattenTextur();
  mSchatten = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
    map:schattenTex, transparent:true, depthWrite:false, color:PAL.boden, toneMapped:false }));
  mSchatten.rotation.x = -Math.PI / 2;
  mSchatten.scale.set(inselSpan.x * 1.9, inselSpan.z * 1.45, 1);
  mSchatten.position.set(inselMitte.x + 0.25, UNTEN - 0.02, inselMitte.z + 0.35);
  scene.add(mSchatten);

  mRing = ringBauen(farbe('--ember'), 0.11);
  mRingHover = ringBauen(farbe('--ink2'), 0.055);
  mRing.visible = mRingHover.visible = false;
  scene.add(mRing, mRingHover);
  reichweiteZeichnen();

  matGelaende.wireframe = matSonstiges.wireframe = !!P.gitter;

  nebelAnwenden(true);
  deckeBauen();
  lichtStellen();
  kameraStellen();
  messung.bauzeit = performance.now() - t0;
  legendeBauen();
  klankarteBauen();
  leuteKartenBauen();
}

/* -------------------------------------------------------------------- Ringe ---*/
function ringBauen(col, breite) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(12 * 3), 3));
  const idx = [];
  for (let k = 0; k < 6; k++) {
    const a = k*2, b = a+1, c = ((k+1)%6)*2, d = c+1;
    idx.push(a, b, d, a, d, c);
  }
  g.setIndex(idx);
  /* Ein BAND, keine Linie: `linewidth` ignoriert WebGL, ein Ring aus
     THREE.Line wäre auf jedem Gerät ein Haar breit. */
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color:col, toneMapped:false, transparent:true, opacity:0.95,
    depthWrite:false, side:THREE.DoubleSide }));
  m.frustumCulled = false;
  m.userData.breite = breite;
  return m;
}
function ringSetzen(l, f) {
  if (!l) return;
  if (!f) { l.visible = false; neuZeichnen(); return; }
  const b = l.userData.breite, a = l.geometry.attributes.position;
  for (let k = 0; k < 6; k++) {
    const dx = f.eck[k][0] - f.x, dz = f.eck[k][1] - f.z, y = f.hoehen[k] + 0.035;
    a.setXYZ(k*2,   f.x + dx * (1 - b), y, f.z + dz * (1 - b));
    a.setXYZ(k*2+1, f.x + dx * (1 + b * 0.35), y, f.z + dz * (1 + b * 0.35));
  }
  a.needsUpdate = true;
  l.geometry.computeBoundingSphere();
  l.visible = true;
  neuZeichnen();
}

/* Die Reichweite als Saum um das erreichbare Gebiet: nur die Kanten, hinter
   denen KEIN erreichbares Feld mehr liegt. Das zeigt die Schiebegrenze, ohne
   die Karte zuzudecken. */
function reichweiteZeichnen() {
  if (mReich) { scene.remove(mReich); mReich.geometry.dispose(); mReich.material.dispose(); }
  const bau = new Bauplan();
  /* Der Saum trägt die Farbe des Klans, der am Zug ist — sonst sieht man beim
     Zugwechsel nicht, WESSEN Reichweite dort liegt. */
  const kf = (PAL.klan && PAL.klan[aktiv().id]) || PAL.reich;
  const c1 = kf, c2 = dunkler(kf, 0.7);
  for (const k of erreichbar) {
    const f = felder.get(k); if (!f) continue;
    for (const n of SOT.hex.neighbors(f.c, f.r)) {
      if (erreichbar.has(schluessel(n.c, n.r))) continue;
      const ka = KANTE_VON_DIR[n.dir], kb = (ka + 1) % 6;
      const b = 0.055;
      const p = [ka, kb].map(kk => {
        const dx = f.eck[kk][0] - f.x, dz = f.eck[kk][1] - f.z;
        return { i:[f.x + dx*(1-b), f.hoehen[kk] + 0.05, f.z + dz*(1-b)],
                 a:[f.x + dx*(1+b), f.hoehen[kk] + 0.05, f.z + dz*(1+b)] };
      });
      bau.viereck(p[0].i, p[0].a, p[1].a, p[1].i, c1, c2, c2, c1);
    }
  }
  if (!bau.anz) { mReich = null; return; }
  mReich = new THREE.Mesh(bau.geometrie(), new THREE.MeshBasicMaterial({
    vertexColors:true, toneMapped:false, transparent:true, opacity:0.75,
    depthWrite:false, side:THREE.DoubleSide }));
  mReich.frustumCulled = false;
  scene.add(mReich);
}

/* ============================================================================
   13 · Nebel und Wolke — drei Zustände statt zwei

   Kein Neuaufbau: die Farben liegen als Attribut vor, und ein Feld kennt seine
   Dreiecksspanne (gelVon..gelBis, bewVon..bewBis). Umfärben heisst darum, in
   einen vorhandenen Puffer zu schreiben — bei tausend Feldern der Unterschied
   zwischen ruckfrei und unbenutzbar. Das gilt jetzt auch für die Wolke: was
   unter ihr liegt, wird nicht ausgeblendet, sondern in die Wolkenfarbe gemalt.

   Das ist der Trick, mit dem die Decke DICHT wirkt, ohne dicht zu sein: die
   Ballen darüber sind eine Handvoll Ikosaeder mit Lücken — durch die Lücken
   sieht man auf Land, das dieselbe Farbe hat. Eine geschlossene Decke hätte
   das Vielfache an Dreiecken gekostet.
   ========================================================================= */
/* Die Schwellen der Front: unter `EIN` sieht man saubere Erinnerung, ab `VOLL`
   volle Wolke. Dazwischen liegt die Rampe — rund ein Feld breit, und genau die
   macht aus einer Maske eine Front. */
const NEBEL_EIN = 0.18, NEBEL_VOLL = 0.85;
const wolkig = w => {
  const t = Math.min(1, Math.max(0, (w - NEBEL_EIN) / (NEBEL_VOLL - NEBEL_EIN)));
  return t * t * (3 - 2 * t);
};

/* Eine Ecke von der Farbe weg. `k` = 0 gibt die Erinnerung (entfärbt), `k` = 1
   die Wolke. Nicht ganz grau und etwas dunkler: ein reines Grau liest sich als
   Fehler, ein entsättigtes, leicht kühles als „nicht gesehen".
   Gelände, Bewuchs UND Wasser gehen durch DIESE Formel — mit einer eigenen
   bekam der Fluss ausser Sicht einen lila Ton. Ein Nebel hat eine Farbe.
   Die Wolke NIMMT DIE HELLIGKEIT DES FELDES MIT (`h`): eine Fläche in genau
   einem Ton hat keine Facetten mehr, und dann steht dort ein Loch im Diorama
   statt einer Wolke. */
let NEBEL_RGB = { r:0.88, g:0.87, b:0.85 };
function nebelEck(arr, alt, i, k) {
  const l = 0.2126*alt[i] + 0.7152*alt[i+1] + 0.0722*alt[i+2];
  /* Angehoben statt abgedunkelt (früher schlicht `l * 0.82`). Mit drei
     Zuständen war die Erinnerung sonst der DUNKELSTE der drei — dunkler als
     die Farbe, aus der sie kommt, und weit dunkler als die Wolke, in die sie
     übergeht. Ein entsättigter Wald wurde fast schwarz. Jetzt liegt sie dem
     Wert nach zwischen beiden: staubig, flach, aber nicht finster. */
  const g = 0.10 + l * 0.80;
  const r0 = g + (alt[i]   - l) * 0.10;
  const g0 = g + (alt[i+1] - l) * 0.10;
  const b0 = g * 1.03 + (alt[i+2] - l) * 0.10;
  if (k <= 0) { arr[i] = r0; arr[i+1] = g0; arr[i+2] = b0; return; }
  const h = 0.76 + l * 0.38;
  arr[i]   = r0 + (NEBEL_RGB.r * h - r0) * k;
  arr[i+1] = g0 + (NEBEL_RGB.g * h - g0) * k;
  arr[i+2] = b0 + (NEBEL_RGB.b * h - b0) * k;
}
function nebelStufe(arr, alt, von, bis, k) {
  for (let i = von * 9; i < bis * 9; i += 3) nebelEck(arr, alt, i, k);
}
function farbStufe(arr, alt, von, bis) {
  for (let i = von * 9; i < bis * 9; i++) arr[i] = alt[i];
}

/* Was zuletzt gemalt wurde, je Feld — als STUFE, nicht als Fliesskommawert:
   0 = in Sicht, 1..17 = Erinnerung bis volle Wolke. Ohne die Quantisierung
   müsste bei jeder Runde jedes Feld neu gemalt werden, obwohl sich für das
   Auge nichts ändert. 255 heisst „noch nie gemalt". */
let gemalt = null;
function gemaltZuruecksetzen() {
  gemalt = new Uint8Array(felder.size).fill(255);
}

function nebelAnwenden(alles) {
  if (!mGelaende) return;
  if (!gemalt || gemalt.length !== felder.size) gemaltZuruecksetzen();
  if (alles) gemalt.fill(255);
  const an = P.nebel === 1;
  const K = aktiv();
  const gA = mGelaende.geometry.attributes.color, bA = mSonstiges.geometry.attributes.color;
  /* Das Wasser wird FELDWEISE gebaut, also hat es Spannen wie das Gelände. Der
     Nebel geht dort über `aNebel` (nach der Beleuchtung), weil Vertexfarbe den
     Spiegelglanz nicht erreicht: 0 = in Sicht, 1 = Erinnerung, 2 = Wolke. */
  const wA = mWasser ? mWasser.geometry.attributes.aNebel : null;
  const wIdx = mWasser ? mWasser.geometry.index : null;
  let etwas = false, wasEtwas = false;
  for (const f of felders()) {
    const sicht = !an || K.sicht.has(schluessel(f.c, f.r));
    const k = (an && !sicht && K.wolke) ? wolkig(K.wolke[f.i]) : 0;
    const stufe = sicht ? 0 : 1 + Math.round(k * 16);
    if (gemalt[f.i] === stufe) continue;
    gemalt[f.i] = stufe;
    f.sichtbar = sicht; f.wolkig = k;
    etwas = true;
    if (sicht) {
      farbStufe(gA.array, gelFarbenAlt, f.gelVon, f.gelBis);
      farbStufe(bA.array, bewFarbenAlt, f.bewVon, f.bewBis);
    } else {
      nebelStufe(gA.array, gelFarbenAlt, f.gelVon, f.gelBis, k);
      nebelStufe(bA.array, bewFarbenAlt, f.bewVon, f.bewBis, k);
    }
    if (wA && f.wasBis > f.wasVon) {
      /* Das Wasser ist indiziert: die Spanne zählt DREIECKE, die Ecken stehen
         im Index. Direkt in `aNebel` zu schreiben würde die falschen treffen. */
      const v = sicht ? 0 : 1 + k;
      for (let t3 = f.wasVon * 3; t3 < f.wasBis * 3; t3++) wA.array[wIdx.array[t3]] = v;
      wasEtwas = true;
    }
  }
  if (!etwas) return;
  gA.needsUpdate = true; bA.needsUpdate = true;
  if (wasEtwas) wA.needsUpdate = true;
  neuZeichnen();
}
const felders = () => felder.values();

/* ------------------------------------------------------------- Die Decke ----
   Die Wolke als Körper. Sie ist NICHT das Wetter aus Abschnitt 10: die liegt
   über dem Tal, diese liegt AUF ihm und wächst mit der Front. Beides derselbe
   Ballen, zwei verschiedene Dinge.

   Gebaut wird sie aus VORLAGEN: ein `steinRoh()` je Ballen hiesse bei tausend
   Feldern tausende Geometrien im Aufbau. Acht fertig verzogene Ikosaeder
   reichen — sie werden nur noch verschoben und skaliert, ohne Matrix und ohne
   Vector3 je Ecke. Der Ballen wächst mit `t`: bei kleinem `t` ein flacher
   Bodenschleier, bei vollem `t` drei dicke Ballen. Damit ist der Übergang von
   Erinnerung zu Wolke nicht nur eine Farbe, sondern eine Höhe.
   --------------------------------------------------------------------------- */
const DECKE_TPL = [];
function deckeVorlagen() {
  if (DECKE_TPL.length) return;
  const rnd = rngAus(mix32(4711, 13, 29));
  for (let v = 0; v < 12; v++) {
    /* NICHT `steinRoh`: dessen Verzug von ±0.55 ist für Findlinge gedacht und
       machte aus der Decke ein Eisfeld — jeder Ballen war einzeln als Kristall
       lesbar. Ein Ikosaeder mit ±0.16 Verzug, kräftig abgeflacht und in
       VIELEN kleinen Exemplaren gestapelt, liest sich dagegen als Watte: die
       Kante eines Ballens verschwindet im nächsten. Wolken haben keine
       Silhouette, sie haben eine Menge. */
    const g = new THREE.IcosahedronGeometry(1, 0);
    const pos = g.attributes.position, seen = new Map();
    for (let i = 0; i < pos.count; i++) {
      const k = [pos.getX(i), pos.getY(i), pos.getZ(i)].map(v2 => v2.toFixed(3)).join('|');
      let d = seen.get(k);
      if (!d) { d = [1 + (rnd()-0.5)*0.32, 1 + (rnd()-0.5)*0.32, 1 + (rnd()-0.5)*0.32]; seen.set(k, d); }
      pos.setXYZ(i, pos.getX(i)*d[0], pos.getY(i)*d[1], pos.getZ(i)*d[2]);
    }
    const dreh = rnd() * Math.PI * 2, co = Math.cos(dreh), si = Math.sin(dreh);
    const a = new Float32Array(pos.count * 3);
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      a[i*3] = x * co - z * si; a[i*3+1] = y; a[i*3+2] = x * si + z * co;
    }
    g.dispose();
    DECKE_TPL.push(a);
  }
}
/* Ein Ballen. Die Farbe kommt aus einer VORGERECHNETEN Leiter (hell oben,
   dunkel unten) — ein `clone()` je Ecke wären hier hunderttausend Objekte. */
function ballen(bau, tpl, x, y, z, sx, sy, leiter) {
  const n = leiter.length - 1;
  for (let i = 0; i < tpl.length; i += 9) {
    const A = [x + tpl[i]*sx,   y + tpl[i+1]*sy, z + tpl[i+2]*sx];
    const B = [x + tpl[i+3]*sx, y + tpl[i+4]*sy, z + tpl[i+5]*sx];
    const C = [x + tpl[i+6]*sx, y + tpl[i+7]*sy, z + tpl[i+8]*sx];
    const cA = leiter[Math.min(n, (tpl[i+1] + 1) * 0.5 * n | 0)];
    const cB = leiter[Math.min(n, (tpl[i+4] + 1) * 0.5 * n | 0)];
    const cC = leiter[Math.min(n, (tpl[i+7] + 1) * 0.5 * n | 0)];
    bau.dreieck(A, B, C, cA, cB, cC);
  }
}
function deckeWeg() {
  if (!mDecke) return;
  scene.remove(mDecke); mDecke.geometry.dispose(); mDecke = null;
}
function deckeBauen() {
  deckeWeg();
  messung.decke = 0;
  if (P.nebel !== 1) { neuZeichnen(); return; }
  const K = aktiv();
  if (!K.wolke) { neuZeichnen(); return; }
  deckeVorlagen();
  const t0 = performance.now();
  /* Drei Töne × acht Helligkeiten, EINMAL je Aufbau gerechnet. Die Spanne ist
     ABSICHTLICH eng: mit 0.74…1.15 hatte jeder Ballen scharfe Facetten und die
     Decke sah aus wie Bruchstein. Eine Wolke ist fast schattenlos. */
  const leitern = PAL.nebel.map(c => {
    const a = []; for (let i = 0; i < 8; i++) a.push(dunkler(c, 0.90 + i * 0.026));
    return a;
  });
  const bau = new Bauplan();
  for (const f of felders()) {
    const t = wolkig(K.wolke[f.i]);
    if (t <= 0.02) continue;
    const rnd = rngFeld(f.c, f.r, 21);
    /* Zwei Ballen im Anflug, fünf in der vollen Wolke. Die Zahl trägt die
       Dichte genauso wie die Höhe — der Übergang ist damit dreifach lesbar:
       Farbe, Höhe, Menge. */
    const anz = 2 + (t > 0.35 ? 1 : 0) + (t > 0.65 ? 1 : 0) + (t > 0.90 ? 1 : 0);
    const y0 = f.hoehe + 0.01 + 0.07 * t;
    for (let i = 0; i < anz; i++) {
      const s = W * (0.19 + 0.13 * t) * (0.80 + rnd() * 0.42);
      ballen(bau, DECKE_TPL[(rnd() * DECKE_TPL.length) | 0],
             f.x + (rnd() - 0.5) * W * 0.86,
             y0 + rnd() * 0.10 * t,
             f.z + (rnd() - 0.5) * H * 0.66,
             s, s * (0.46 + 0.30 * t),
             leitern[(rnd() * leitern.length) | 0]);
    }
  }
  messung.decke = bau.anz;
  messung.deckezeit = performance.now() - t0;
  if (!bau.anz) { neuZeichnen(); return; }
  /* Kein Schattenwurf und kein Schattenempfang: die Decke soll gleichmässig
     ausgeleuchtet daliegen. Mit Schlagschatten warf jeder Ballen einen Fleck
     auf den nächsten und das Weiss zerfiel in graue Krümel. */
  mDecke = new THREE.Mesh(bau.geometrie(), matDecke);
  mDecke.frustumCulled = false;
  scene.add(mDecke);
  neuZeichnen();
}

/* ============================================================================
   14 · Licht und Kamera
   ========================================================================= */
function lichtStellen() {
  const L = LICHT[P.zeit] || LICHT.mittag;
  const azi = (P.lichtdreht ? P.azimut + L.azimut : L.azimut) * Math.PI / 180;
  const hoe = L.hoehe * Math.PI / 180;
  const d = 9;
  /* Die Sonne folgt der BLICKMITTE, nicht der Inselmitte: bei einem Tal, das
     dreissig Felder weit reicht, stünde sie sonst irgendwo im Nichts und die
     Schattenkarte deckte den sichtbaren Ausschnitt nicht mehr. */
  sonne.target.position.copy(blickZiel);
  sonne.position.set(
    blickZiel.x + Math.cos(hoe) * Math.sin(azi) * d,
    blickZiel.y + Math.sin(hoe) * d,
    blickZiel.z + Math.cos(hoe) * Math.cos(azi) * d
  );
  sonne.color.copy(PAL.sonne); sonne.intensity = L.sonne;
  /* Die Schattenkamera eng um den SICHTBAREN Ausschnitt legen, nicht um die
     ganze Karte: jede überflüssige Einheit kostet Auflösung. */
  const sc = sonne.shadow.camera;
  const rad = Math.min(0.5 * Math.hypot(inselSpan.x, inselSpan.z) + 0.4, P.zoom * 0.85 + 2);
  sc.left = -rad; sc.right = rad; sc.top = rad; sc.bottom = -rad;
  sc.near = 0.1; sc.far = d + rad + 4;
  sc.updateProjectionMatrix();
  sonne.shadow.radius = P.schatten === 'weich' ? 2 : 1;

  fuell.color.copy(PAL.fuell); fuell.groundColor.copy(PAL.rueck); fuell.intensity = L.fuell;
  rueck.color.copy(PAL.fuell); rueck.intensity = L.rueck;
  rueck.position.set(blickZiel.x - Math.sin(azi) * 6, blickZiel.y + 1.6,
                     blickZiel.z - Math.cos(azi) * 6);

  if (feuerStelle) {
    glutlicht.position.copy(feuerStelle);
    glutlicht.color.copy(PAL.glut);
    glutlicht.intensity = L.glut;
  } else glutlicht.intensity = 0;

  scene.background = PAL.papier;
  stilStellen();
  matEnde.uniforms.uBelichtung.value = L.belichtung;
  matEnde.uniforms.uWarm.value.set(PAL.warm.r, PAL.warm.g, PAL.warm.b);
  matEnde.uniforms.uKuehl.value.set(PAL.kuehl.r, PAL.kuehl.g, PAL.kuehl.b);
  renderer.toneMappingExposure = L.belichtung;
  neuZeichnen();
}

/* Die Hebel in die Uniformen tragen. Getrennt von `lichtStellen`, weil ein
   Stilwechsel weder Sonne noch Schattenkamera anfasst — und weil ein Regler
   sonst die ganze Beleuchtung neu stellte, um drei Zahlen zu ändern. */
function stilStellen() {
  uStufen.value = P.stufen;
  uKante.value = P.kante / 100;
  uSchattenTon.value = P.schattenton / 100;
  if (PAL) {
    uLichtFarbe.value.set(PAL.licht.r, PAL.licht.g, PAL.licht.b);
    uSchattenFarbe.value.set(PAL.schatten.r, PAL.schatten.g, PAL.schatten.b);
    matEnde.uniforms.uTinte.value.set(PAL.tinte.r, PAL.tinte.g, PAL.tinte.b);
    matEnde.uniforms.uPapierTon.value.set(PAL.papier.r, PAL.papier.g, PAL.papier.b);
  }
  neuZeichnen();
}

const istOben = () => P.sicht === 'oben';
const neigungJetzt = () => istOben() ? 90 : P.neigung;

/* Die Blickmitte auf das Erreichbare klemmen — „nur so weit, wie die Leute
   reichen". Geklemmt wird das RECHTECK des Erreichbaren; an einer gezackten
   Feldkante zu hängen fühlt sich wie ein Fehler an. */
/* Der Überblick ist ein WERKZEUG dieses Labors, keine Spielhandlung: um den
   Renderer zu beurteilen muss man das ganze Tal sehen dürfen. Darum hebt er
   die Klemme auf — bis der nächste Zug am Bild wieder in die Spielregel
   zurückführt. Ohne diesen Merker schnappte der Blick beim nächsten
   Neuaufbau (oder einer Fenstergrössenänderung) sofort zurück. */
let ueberblick = false;
function blickKlemmen() {
  if (!reichBox || ueberblick) return;
  blickZiel.x = Math.max(reichBox.x0, Math.min(reichBox.x1, blickZiel.x));
  blickZiel.z = Math.max(reichBox.z0, Math.min(reichBox.z1, blickZiel.z));
}

function kameraStellen() {
  blickKlemmen();
  const azi = P.azimut * Math.PI / 180;
  const neig = neigungJetzt() * Math.PI / 180;
  const ziel = blickZiel.clone();
  ziel.y = 0.25;
  const d = 60;
  kamera.position.set(
    ziel.x + Math.cos(neig) * Math.sin(azi) * d,
    ziel.y + Math.sin(neig) * d,
    ziel.z + Math.cos(neig) * Math.cos(azi) * d
  );
  /* Senkrecht von oben ist `lookAt` mit der Hochachse als Aufwärtsvektor
     entartet — dann zeigt Norden nach oben, indem der Aufwärtsvektor auf −z
     kippt. Ohne das dreht sich das Bild bei 90° willkürlich weg. */
  kamera.up.set(0, 1, 0);
  if (neigungJetzt() > 88) kamera.up.set(0, 0, -1);
  kamera.lookAt(ziel);

  const w = buehne.clientWidth || 1, h = buehne.clientHeight || 1;
  /* Der Maßstab ist „so viele Felder in der Bildbreite" — auflösungsunabhängig
     und in Spielgrößen gedacht, nicht in Weltmetern. */
  const hx = P.zoom * W / 2;
  const hy = hx * h / w;
  kamera.left = -hx; kamera.right = hx; kamera.top = hy; kamera.bottom = -hy;
  kamera.near = 0.1; kamera.far = 200;
  kamera.updateProjectionMatrix();
  kamera.updateMatrixWorld(true);

  const nf = naechstesFeld(blickZiel.x, blickZiel.z);
  document.getElementById('stempel').textContent =
    'Runde ' + runde + ' · ' + aktiv().kurz + ' am Zug · ' +
    (istOben() ? 'Aufsicht' : 'Schräg ' + P.azimut + '°/' + P.neigung + '°') +
    ' · ' + P.zoom + ' Felder · Blick ' + (nf ? nf.c + ',' + nf.r : '—') +
    ' · ' + felder.size + ' Felder';
  neuZeichnen();
}

/* Das ganze Tal ins Bild holen — der alte „Füllgrad", jetzt als Handgriff. */
function ganzZeigen() {
  const w = buehne.clientWidth || 1, h = buehne.clientHeight || 1;
  const azi = P.azimut * Math.PI / 180;
  const neig = neigungJetzt() * Math.PI / 180;
  /* Breite und Höhe der Silhouette im Kamerasystem, aus den Feldecken. */
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const cr = new THREE.Vector3(Math.cos(azi), 0, -Math.sin(azi));
  const cu = new THREE.Vector3(-Math.sin(azi) * Math.sin(neig), Math.cos(neig),
                               -Math.cos(azi) * Math.sin(neig));
  for (const f of felders())
    for (let k = 0; k < 6; k++)
      for (const y of [f.hoehen[k], UNTEN]) {
        const px = f.eck[k][0]*cr.x + y*cr.y + f.eck[k][1]*cr.z;
        const py = f.eck[k][0]*cu.x + y*cu.y + f.eck[k][1]*cu.z;
        if (px < x0) x0 = px; if (px > x1) x1 = px;
        if (py < y0) y0 = py; if (py > y1) y1 = py;
      }
  const brX = (x1 - x0) / 0.92, brY = ((y1 - y0) / 0.92) * w / h;
  P.set('zoom', Math.min(60, Math.max(5, Math.ceil(Math.max(brX, brY) / W))));
  ueberblick = true;
  blickZiel.set(inselMitte.x, 0, inselMitte.z);
  kameraStellen(); lichtStellen();
  SOT.toast('Ganzes Tal — ' + P.zoom + ' Felder breit. Schieben führt zurück.');
}

/* ============================================================================
   15 · Bildgrösse und Zeichnen
   ========================================================================= */
let letztesK = -1;
function groesseStellen() {
  const w = Math.max(1, buehne.clientWidth), h = Math.max(1, buehne.clientHeight);
  renderer.setSize(w, h, false);
  const dpr = renderer.getPixelRatio();
  const pw = Math.max(2, Math.floor(w * dpr)), ph = Math.max(2, Math.floor(h * dpr));
  /* Gepixelt wird durch KLEINER RENDERN, nicht durch nachträgliches Verklotzen
     eines scharfen Bildes. Der Unterschied ist der ganze Unterschied: klein
     gerendert ergibt saubere Bildpunkte mit ehrlichen Kanten, nachträglich
     verklotzt ergibt Matsch aus verrechneten Nachbarn — und sieht aus wie ein
     Fehler, nicht wie eine Entscheidung. */
  const k = Math.max(1, P.pixelig | 0);
  const sw = Math.max(2, Math.floor(pw / k)), sh = Math.max(2, Math.floor(ph / k));
  const nf = k > 1 ? THREE.NearestFilter : THREE.LinearFilter;
  if (k !== letztesK) {
    /* Der Filter sitzt an der Textur des Puffers und wird erst beim Anlegen
       übernommen — ohne das Verwerfen bliebe das erste gepixelte Bild
       weichgezeichnet. */
    rtScene.texture.minFilter = rtScene.texture.magFilter = nf;
    rtScene.dispose();
    letztesK = k;
  }
  rtScene.setSize(sw, sh);
  rtNorm.setSize(sw, sh);
  rtA.setSize(Math.max(2, sw >> 2), Math.max(2, sh >> 2));
  rtB.setSize(Math.max(2, sw >> 2), Math.max(2, sh >> 2));
  /* uPixel ist der Texel des SZENEN-Puffers, nicht des Bildschirms: Kontur,
     Kochen und Rastern sollen im Raster rechnen, in dem auch gerendert wurde. */
  matEnde.uniforms.uPixel.value.set(1 / sw, 1 / sh);
  matEnde.uniforms.uSchirm.value.set(pw, ph);
  kameraStellen();
}

function durchgang(mat, ziel) {
  quad.material = mat;
  renderer.setRenderTarget(ziel);
  renderer.render(quadScene, quadCam);
}

/* Ist überhaupt ein Hebel gestellt? Wenn nicht UND keine Fotografie gewünscht
   ist, darf der rohe Weg auf den Bildschirm bleiben — das ist die Vergleichs-
   marke „gar keine Nachbearbeitung", die es vorher schon gab. */
const stilAktiv = () => P.stufen > 0 || P.kontur > 0 || P.korn > 0 ||
                        P.kochen > 0 || P.raster > 0 || P.pixelig > 1;

/* Was NICHT in den Konturpuffer gehört: alles, was ein AUFKLEBER ist und kein
   Körper. Der Bodenschatten etwa ist eine liegende Fläche mit eigener Normale
   — er bekäme sonst eine Linie rundherum, und die Karte sähe beklebt aus statt
   gezeichnet. Regen, Flamme und Funken ebenso: sie sind Licht, keine Sache. */
function nurKoerper(an) {
  for (const m of [mSchatten, mRing, mRingHover, mReich, mSichtRinge,
                   mRegen, mFlamme, mFunken])
    if (m) m.visible = an;
}

/* `renderer.info` setzt sich bei JEDEM `render()` zurück. Wird es erst im
   Messblatt gelesen, misst man das zuletzt gezeichnete Vollbildviereck — also
   „1 Zeichenaufruf, 2 Dreiecke", und die ganze Aussage des Blattes kippt.
   Darum gleich nach dem Szenendurchgang sichern. */
function szeneGemessen() {
  const r = renderer.info.render;
  messung.calls = r.calls; messung.tris = r.triangles;
}

let fpsProbe = [];
function zeichnen() {
  const t0 = performance.now();
  if (P.post > 0 || stilAktiv()) {
    /* Der Konturdurchgang. Er kostet einen zweiten Durchlauf der ganzen Szene
       — der Preis der Linie, und der einzige Posten dieses Labors, der wirklich
       etwas kostet. Alles andere sind Uniformen. */
    if (P.kontur > 0) {
      nurKoerper(false);
      scene.overrideMaterial = matNormal;
      renderer.setRenderTarget(rtNorm);
      renderer.clear();
      renderer.render(scene, kamera);
      scene.overrideMaterial = null;
      nurKoerper(true);
    }
    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene, kamera);
    szeneGemessen();
    matHell.uniforms.tBild.value = rtScene.texture;
    durchgang(matHell, rtA);
    matBlur.uniforms.tBild.value = rtA.texture;
    matBlur.uniforms.uRichtung.value.set(1 / rtA.width, 0);
    durchgang(matBlur, rtB);
    matBlur.uniforms.tBild.value = rtB.texture;
    matBlur.uniforms.uRichtung.value.set(0, 1 / rtA.height);
    durchgang(matBlur, rtA);
    const s = P.post / 100;
    const u = matEnde.uniforms;
    u.tBild.value = rtScene.texture;
    u.tGlut.value = rtA.texture;
    u.tNormal.value = rtNorm.texture;
    u.tTiefe.value = rtNorm.depthTexture;
    u.uFoto.value = s;
    u.uGlut.value = 0.55 * s;
    u.uSaettigung.value = 1 + 0.14 * s;
    u.uScharf.value = 0.34 * s;
    u.uVignette.value = 0.18 * s;
    u.uKontur.value = P.kontur / 100;
    u.uStrich.value = P.strich;
    u.uKorn.value = P.korn / 100;
    u.uKochen.value = P.kochen / 100;
    u.uRaster.value = P.raster / 100;
    u.uFarbstufen.value = P.farbstufen;
    /* Die Konturschwelle rechnet in WELT-Einheiten; die Spanne der Kamera ist
       der Umrechnungsfaktor. Sie hier zu holen statt sie zu merken kostet
       nichts und übersteht jedes Umstellen der Kamera. */
    u.uTiefenSpanne.value = kamera.far - kamera.near;
    u.uZeige.value = ['bild','tiefe','normal','kontur'].indexOf(P.zeige);
    durchgang(matEnde, null);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, kamera);
    szeneGemessen();
  }
  fpsProbe.push(performance.now() - t0);
  if (fpsProbe.length > 60) fpsProbe.shift();
}

/* `?still` heisst NICHT „bewegte Szene eingefroren", sondern „nur auf Zuruf
   zeichnen" — und dann SOFORT, nicht beim nächsten Bild. Der Unterschied ist
   der Bildschirmfoto-Ablauf der Werkstatt: `--virtual-time-budget` spult die
   Zeit vor; eine laufende rAF-Schleife rendert dann hunderte volle Bilder (in
   Software Minuten), eine wartende dagegen liefert einen geleerten Puffer, wenn
   das Budget zwischen Grössenänderung und nächstem Bild ausläuft. Synchron
   zeichnen umgeht beides. */
let bereit = false;
function neuZeichnen() {
  if (!bereit) return;
  if (P.still) zeichnen(); else schmutzig = true;
}
let t = 0, letzterStempel = 0, schmutzig = true;

function schleife(jetzt) {
  requestAnimationFrame(schleife);
  if (P.still) return;                     /* dort wird synchron gezeichnet */
  const dt = letzterStempel ? Math.min(0.05, (jetzt - letzterStempel) / 1000) : 0;
  letzterStempel = jetzt;
  t += dt;
  uZeit.value = t;
  /* Das Kochen läuft mit ~10 Bildern je Sekunde, NICHT mit der Bildrate. Genau
     dieses Stehenbleiben zwischen zwei Würfen liest sich als gezeichnet;
     zittert es in jedem Bild, liest es sich als Rauschen. */
  matEnde.uniforms.uPhase.value = Math.floor(t * 10);
  regenStellen(t);
  funkenStellen(t);
  if (mWolke) mWolke.position.y = Math.sin(t * 0.32) * 0.05;
  /* Das Flackern ist EIN Wert für Licht und Flamme — sonst atmen sie
     gegeneinander und das Feuer liest sich als zwei Dinge. */
  if (feuerStelle) {
    const L = LICHT[P.zeit] || LICHT.mittag;
    const fl = 0.86 + 0.14 * Math.sin(t * 9.1) + 0.06 * Math.sin(t * 21.3);
    glutlicht.intensity = L.glut * fl;
    if (mFlamme) {
      mFlamme.scale.set(0.94 + 0.10 * fl, fl, 0.94 + 0.10 * fl);
      mFlamme.rotation.y = Math.sin(t * 2.3) * 0.18;
    }
  }
  zeichnen();
}

/* ============================================================================
   16 · Anfassen: Schieben, Drehen, Wählen
   ========================================================================= */
const strahl = new THREE.Raycaster();
const maus = new THREE.Vector2();
let gewaehlt = null, ueber = null;

function naechstesFeld(x, z) {
  let best = null, bd = Infinity;
  for (const f of felders()) {
    const d = (f.x - x) ** 2 + (f.z - z) ** 2;
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}
/* Zeiger → Feld. Über den Strahl auf das Gelände; trifft er nichts (Papier),
   wird die Grundebene geschnitten, damit auch der Rand noch antwortet. */
function feldUnter(ev) {
  const b = leinwand.getBoundingClientRect();
  maus.x = ((ev.clientX - b.left) / b.width) * 2 - 1;
  maus.y = -((ev.clientY - b.top) / b.height) * 2 + 1;
  strahl.setFromCamera(maus, kamera);
  if (mGelaende) {
    const tr = strahl.intersectObject(mGelaende, false);
    if (tr.length) {
      const p = tr[0].point;
      return naechstesFeld(p.x, p.z);
    }
  }
  return null;
}
/* Zeigerbewegung → Weltverschiebung auf der Grundebene. Waagrecht entspricht
   der Kamera-Rechtsachse; senkrecht der Blickrichtung am Boden, und die wird
   durch die Neigung gestaucht — darum das Teilen durch sin(Neigung). */
function schiebeAchsen() {
  const azi = P.azimut * Math.PI / 180;
  const neig = Math.max(12, neigungJetzt()) * Math.PI / 180;
  const w = Math.max(1, buehne.clientWidth), h = Math.max(1, buehne.clientHeight);
  const hx = P.zoom * W / 2, hy = hx * h / w;
  return {
    rechts:{ x:Math.cos(azi), z:-Math.sin(azi) },
    vor:{ x:Math.sin(azi), z:Math.cos(azi) },
    sx:(2 * hx) / w,
    sz:(2 * hy) / h / Math.sin(neig)
  };
}

let zieht = null, zogGerade = false;
leinwand.addEventListener('pointerdown', ev => {
  zieht = { x:ev.clientX, y:ev.clientY, weit:0, dreht:ev.shiftKey || ev.button === 2,
            a:P.azimut, n:P.neigung, zx:blickZiel.x, zz:blickZiel.z };
  leinwand.setPointerCapture(ev.pointerId);
  leinwand.classList.add('zieht');
});
leinwand.addEventListener('contextmenu', ev => ev.preventDefault());
/* EIN pointermove für alles: zeigen, schieben, drehen. Zwei Zuhörer würden
   während des Ziehens jedes Bild einen Strahl schiessen. */
leinwand.addEventListener('pointermove', ev => {
  if (!zieht) {
    if (ev.pointerType === 'touch') return;
    const f = feldUnter(ev);
    if (f !== ueber) { ueber = f; ringSetzen(mRingHover, f && f !== gewaehlt ? f : null); }
    return;
  }
  const dx = ev.clientX - zieht.x, dy = ev.clientY - zieht.y;
  zieht.weit = Math.max(zieht.weit, Math.abs(dx) + Math.abs(dy));
  if (zieht.weit < 5) return;
  if (mRingHover) mRingHover.visible = false;
  if (zieht.dreht) {
    P.azimut = ((Math.round(zieht.a - dx * 0.4) % 360) + 360) % 360;
    P.neigung = Math.max(12, Math.min(80, Math.round(zieht.n + dy * 0.25)));
    kameraStellen();
    if (P.lichtdreht) lichtStellen();
  } else {
    ueberblick = false;                  /* Schieben gilt wieder der Regel */
    const A = schiebeAchsen();
    blickZiel.x = zieht.zx - A.rechts.x * dx * A.sx - A.vor.x * dy * A.sz;
    blickZiel.z = zieht.zz - A.rechts.z * dx * A.sx - A.vor.z * dy * A.sz;
    kameraStellen();
    lichtStellen();
  }
});
addEventListener('pointerup', () => {
  if (!zieht) return;
  leinwand.classList.remove('zieht');
  if (zieht.weit > 5) {
    zogGerade = true;
    /* Der Stand ist die URL — ein gefundener Blick muss teilbar sein. */
    const nf = naechstesFeld(blickZiel.x, blickZiel.z);
    if (nf) P.set('blick', nf.c + ',' + nf.r);
    if (zieht.dreht) { P.set('azimut', P.azimut); P.set('neigung', P.neigung); }
  }
  zieht = null;
});
leinwand.addEventListener('click', ev => {
  /* Ein Ziehen endet ebenfalls in einem `click`. Ohne diese Sperre wählt jedes
     Schieben ein Feld — und die Feldkarte springt beim Loslassen auf. */
  if (zogGerade) { zogGerade = false; return; }
  waehlen(feldUnter(ev));
});
leinwand.addEventListener('wheel', ev => {
  ev.preventDefault();
  const z = Math.max(5, Math.min(60, P.zoom + (ev.deltaY > 0 ? 2 : -2)));
  if (z === P.zoom) return;
  P.set('zoom', z);
  kameraStellen(); lichtStellen();
}, { passive:false });

addEventListener('keydown', ev => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target || {}).tagName || '')) return;
  const A = schiebeAchsen(), s = (ev.shiftKey ? 3 : 1) * W;
  let hin = null;
  if (ev.key === 'ArrowLeft')  hin = [-A.rechts.x * s, -A.rechts.z * s];
  else if (ev.key === 'ArrowRight') hin = [A.rechts.x * s, A.rechts.z * s];
  else if (ev.key === 'ArrowUp')    hin = [-A.vor.x * s, -A.vor.z * s];
  else if (ev.key === 'ArrowDown')  hin = [A.vor.x * s, A.vor.z * s];
  else if (ev.key === '[' || ev.key === ']') {
    P.set('azimut', ((P.azimut + (ev.key === '[' ? -15 : 15)) % 360 + 360) % 360);
    kameraStellen(); if (P.lichtdreht) lichtStellen(); return;
  } else if (ev.key === 'Enter') {
    /* Enter = Zug beenden. Die Front zehn Runden laufen zu sehen ist die
       eigentliche Prüfung dieses Durchgangs, und zehnmal zielen lenkt ab. */
    ev.preventDefault(); zugBeenden(); return;
  } else return;
  ev.preventDefault();
  blickZiel.x += hin[0]; blickZiel.z += hin[1];
  kameraStellen(); lichtStellen();
  const nf = naechstesFeld(blickZiel.x, blickZiel.z);
  if (nf) P.set('blick', nf.c + ',' + nf.r);
});

function waehlen(f) {
  gewaehlt = f;
  ringSetzen(mRing, f);
  const k = document.getElementById('feldkarte');
  if (!f) { k.classList.add('hid'); P.set('wahl', null); return; }
  P.set('wahl', f.c + ',' + f.r);
  const nb = SOT.hex.neighbors(f.c, f.r)
    .map(n => { const g = feldAn(n.c, n.r); return n.dir + ' ' + (g ? g.G.name : '—'); });
  const wer = LEUTE.find(L => L.c === f.c && L.r === f.r);
  const K = aktiv();
  const w = K.wolke ? K.wolke[f.i] : 0;
  const zustand = f.sichtbar ? 'in Sicht'
    : (w >= NEBEL_VOLL ? 'unter der Wolke'
    : (w > NEBEL_EIN ? 'die Front läuft darüber' : 'Erinnerung'));
  const wa = f.wasser;
  const fallWort = { fall:'Wasserfall', schnelle:'Stromschnelle' }[wa && wa.faelle[wa.ab]] || '—';
  k.innerHTML =
    '<div class="kopf">' + SOT.icon(GZEICHEN[f.t] || 'hexfeld') +
      '<b>' + f.G.name + '</b><span class="co">' + f.c + ',' + f.r + '</span></div>' +
    (wer ? '<div class="kv"><span>Hier steht</span><b>' + wer.name + ' · ' +
             klanVon(wer.klan).kurz + '</b></div>' : '') +
    /* Wasser ist eine EIGENSCHAFT des Feldes, kein zweiter Name für sein
       Gelände — die Karteikarte zeigt es darum als eigene Zeilen. */
    (wa
      ? '<div class="kv"><span>Wasser</span><b>' + wa.kl.name + '</b></div>' +
        '<div class="kv"><span>Abfluss nach</span><b>' +
          (wa.rand ? 'aus der Karte' : wa.ab) + '</b></div>' +
        '<div class="kv"><span>Zufluss aus</span><b>' +
          (wa.zu.length ? wa.zu.map(z => z.dir).join(' · ') : 'Quelle') + '</b></div>' +
        '<div class="kv"><span>Menge</span><b>' + wa.q.toFixed(1) + '</b></div>' +
        '<div class="kv"><span>Stufe</span><b>' + fallWort + '</b></div>'
      : '<div class="kv"><span>Wasser</span><b>—</b></div>') +
    '<div class="kv"><span>Höhe</span><b>' + f.hoehe.toFixed(2) +
      (f.senke ? ' · aufgestaut' : '') + '</b></div>' +
    '<div class="kv"><span>Für ' + K.kurz + '</span><b>' + zustand + '</b></div>' +
    '<div class="kv"><span>Wolkendichte</span><b>' + w.toFixed(2) + '</b></div>' +
    '<div class="kv"><span>Erreichbar</span><b>' +
      (erreichbar.has(schluessel(f.c, f.r)) ? 'ja' : 'nein') + '</b></div>' +
    '<div class="nb">' + nb.map(s => '<span>' + s + '</span>').join('') + '</div>' +
    '<p class="note">Der Zufluss ist <b>abgeleitet</b>, nicht gespeichert: es sind die ' +
    'Nachbarn, deren Abfluss hierher zeigt. Darum kann ein Lauf nicht reissen.<br>' +
    'Die <b>Wolkendichte</b> gehört dem Klan, nicht dem Feld — für den anderen steht ' +
    'hier eine andere Zahl.</p>';
  k.classList.remove('hid');
}

/* ============================================================================
   17 · Klankarte, Einheitenkarten, Zugwechsel
   ========================================================================= */
const kFarbe = id => 'var(--d-klan-' + (id === 'oben' ? 'o' : 'u') + ')';

/* Beide Klane in EINER Karte. Der am Zug steht offen (Balken, Zahlen), der
   andere zusammengeklappt — aber seine Kultur bleibt einstellbar. Ohne das
   müsste man für jeden Vergleich den Zug wechseln, und der Vergleich der
   beiden Vergessenstempi ist die Prüffrage dieses Durchgangs. */
function klankarteBauen() {
  const el = document.getElementById('klankarte');
  el.innerHTML = KLANE.map((K, i) => {
    const dran = i === amZug;
    const z = dran ? frontZaehlen(K) : null;
    const ges = z ? Math.max(1, z.sicht + z.erinnert + z.wolke) : 1;
    return '<div class="kzeile' + (dran ? ' aktiv' : '') + '" style="--kf:' + kFarbe(K.id) + '">' +
      '<div class="kkopf">' + SOT.icon('lager') + '<b>' + K.name + '</b>' +
        (dran ? '<span class="zug">Runde ' + runde + '</span>' : '') + '</div>' +
      '<div class="ew"><span>Kultur</span>' +
        '<button class="small" data-k="' + K.id + '" data-d="-1">−</button>' +
        '<b>' + K.kultur + '</b>' +
        '<button class="small" data-k="' + K.id + '" data-d="1">+</button></div>' +
      '<p class="knote">Die Wolke rückt <b>1 Feld je ' + K.kultur + ' Runde' +
        (K.kultur === 1 ? '' : 'n') + '</b> über die Erinnerung.</p>' +
      (dran
        ? '<div class="wbalken">' +
            '<i class="s" style="flex:' + (z.sicht / ges) + '"></i>' +
            '<i class="e" style="flex:' + (z.erinnert / ges) + '"></i>' +
            '<i class="w" style="flex:' + (z.wolke / ges) + '"></i></div>' +
          '<div class="wlegende">' +
            '<span><i style="background:' + kFarbe(K.id) + '"></i>Sicht ' + z.sicht + '</span>' +
            '<span><i style="background:var(--ink2)"></i>Erinnert ' + z.erinnert + '</span>' +
            '<span><i style="background:var(--d-nebel-2)"></i>Wolke ' + z.wolke + '</span>' +
          '</div>'
        : '') +
    '</div>';
  }).join('');
  el.querySelectorAll('button[data-k]').forEach(b => {
    b.addEventListener('click', () => {
      const K = klanVon(b.dataset.k);
      const neu = Math.max(1, Math.min(8, K.kultur + Number(b.dataset.d)));
      if (neu === K.kultur) return;
      K.kultur = neu; P.set(K.pK, neu);
      klankarteBauen();
      SOT.toast(K.kurz + ': Kultur ' + neu + ' — 1 Feld je ' + neu +
                (neu === 1 ? ' Runde' : ' Runden'));
    });
  });
}

/* Nur die Leute des Klans am Zug. Die anderen zwei stehen auf dem Brett, aber
   sie gehören dem Gegenüber — ihre Regler hier zu zeigen wäre ein Blick in
   fremde Karten. Über das Reglerbrett (`?ujsicht=` …) sind sie trotzdem
   erreichbar: dies ist ein Labor, kein Spiel. */
function leuteKartenBauen() {
  const wrap = document.getElementById('leute');
  wrap.innerHTML = leuteVon(aktiv().id).map(L =>
    '<div class="einheit' + (gewaehlteEinheit === L.id ? ' sel' : '') + '" data-id="' + L.id + '">' +
      '<div class="ekopf">' + SOT.icon(L.icon) + '<b>' + L.name + '</b>' +
        '<span class="ort">' + L.c + ',' + L.r + '</span></div>' +
      '<div class="ewerte">' +
        wertZeile(L, 'sicht', 'Sicht') + wertZeile(L, 'tempo', 'Tempo') +
      '</div>' +
      (gewaehlteEinheit === L.id
        ? '<p class="ehint">Sicht drückt die Wolke zurück — sofort und ganz. ' +
          'Zurück kriecht sie mit 1/Kultur.</p>' : '') +
    '</div>').join('');
  wrap.querySelectorAll('.einheit').forEach(el => {
    el.addEventListener('click', ev => {
      if (ev.target.closest('button')) return;
      const L = LEUTE.find(x => x.id === el.dataset.id);
      gewaehlteEinheit = gewaehlteEinheit === L.id ? null : L.id;
      zuEinheit(L);
      leuteKartenBauen();
    });
  });
  wrap.querySelectorAll('button[data-w]').forEach(b => {
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      const L = LEUTE.find(x => x.id === b.dataset.id);
      const w = b.dataset.w, d = Number(b.dataset.d);
      const neu = Math.max(0, Math.min(14, L[w] + d));
      if (neu === L[w]) return;
      L[w] = neu;
      P.set(w === 'sicht' ? L.pS : L.pT, neu);
      sichtRechnen();
      nebelAnwenden(false);
      /* Grössere Sicht heisst: die Wolke ist an dieser Stelle WEG, nicht
