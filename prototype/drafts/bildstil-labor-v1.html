<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bildstil-Labor — vom Rendering zur Zeichnung</title>
<link rel="stylesheet" href="../kit/sot.css">
<style>
/* ============================================================================
   Bildstil-Labor v1 — vom Rendering zur Zeichnung

   Prüffrage dieses Labors: das Diorama sieht poliert und volumetrisch aus —
   wie ein Foto eines Modells. Die Kunstrichtung des Projekts sagt aber etwas
   anderes (`art-direction-handbuch.html`, Karte „Stil"):

     „Stilisierte, fast HOLZSCHNITTARTIGE Illustration mit weichen, aber
      klaren Formen. Kein Realismus, KEIN PIXEL-ART, kein Comic."

   Was fehlt also zwischen dem, was three.js hier liefert, und dem, was dort
   steht? Dieses Labor beantwortet das nicht mit Worten, sondern mit einem
   Schalter: DIESELBE Welt, fünf Bilder.

     jetzt        das Diorama unverändert — die Vergleichsmarke
     holzschnitt  gestuftes Licht, gefärbter Schatten, Kontur, keine Fotografie
     papier       dazu Korn, Papierton, Kochen der Kanten
     raster       dazu geordnetes Rastern — gedruckt, nicht gerendert
     pixel        klein gerendert und hart hochgezogen — die Gegenprobe

   Und weil die eigentliche Frage nie „Holzschnitt ja oder nein" lautet,
   sondern „WIE hart", hat jede Familie mehrere SPIELARTEN — im Kopf über den
   Pfeil am Knopf, in der Adresse über `?variante=`:

     holzschnitt  klassisch · hart · feder · ohne Linie
     papier       bogen · Bütten · aquarell · skizze
     raster       risografie · zu wenig · feinraster · siebdruck
     pixel        grob · fein · ohne Raster · gerastert

   Die Spielarten sind absichtlich WEIT auseinander gelegt, nicht fein
   abgestuft: zwischen „hart" (zwei Tonstufen, kein Zwischenton) und „feder"
   (sechs Stufen, fette Linie) liegt der ganze Spielraum der Familie, und wer
   beide gesehen hat, kann sagen, wo dazwischen er hin will. Eine Reihe
   ähnlicher Vorschläge könnte das nicht.

   Die Familien sind KEINE fünf Schalter, sondern Voreinstellungen über SECHS
   Hebeln (`STILE` unten). Wer streitet, streitet über einen Hebel, nicht über
   einen Namen — das ist der eigentliche Zweck der Datei:

     stufen  Lichtquantisierung — wie viele Helligkeitsstufen es überhaupt gibt
     kontur  die Linie — Aussenkontur (Tiefe) und Binnenkontur (Normalen)
     korn    Papier — Faser und Ton des Untergrunds, bildschirmfest
     kochen  das Zittern der Kante, mit ~10 Bildern/s neu gewürfelt
     raster  geordnetes Rastern (Bayer) auf begrenzte Farbzahl
     pixelig Kantenlänge des Bildpunkts — 1 heisst aus

   DREI Befunde vorweg, damit sie niemand im Bild suchen muss:
   · Der grösste Sprung kommt von `stufen` und der SCHATTENFARBE, nicht von
     der Kontur. Ein Schatten ist gemalt nicht „dasselbe Grün mal 0,6",
     sondern ein anderer, kühlerer Ton — darum gibt es `--d-schatten`.
   · `pixelig` macht das Bild unpoliert, aber NICHT gezeichnet. Es macht es zu
     Pixel-Art — eine andere Disziplin, die die Kunstrichtung ausschliesst.
     Der Schalter ist als Gegenprobe drin, nicht als Vorschlag.
   · VIER Farbstufen je Kanal sind die Untergrenze. Die Spielart `zu wenig`
     (drei) ist ausdrücklich drin, um das zu zeigen: dort kippen die Farben
     ins Giftgrüne. Echter Zeitungsdruck wäre ein Duplex — eine Druckfarbe,
     gerastert —, und den kann dieser Schlussdurchgang nicht.

   Bekannte Grenze: bei `pixelig > 1` ist die Kamera nicht auf das Pixelraster
   gerastet. Im Stand (und im Bildschirmfoto) ist das unsichtbar, beim Schieben
   kriecht die Kante. Das Rasten wäre der nächste Schritt, nicht das Ergebnis.

   Der Unterbau — Gelände, Wasser, Nebel, die zwei Klane — stammt unverändert
   aus `diorama-labor-v1.html` (Stand 25. Aug 2026). Dessen Prüffrage und
   Begründungen stehen ab hier weiter, sie gelten alle noch.
   ============================================================================

   Diorama-Labor v1 — three.js als Kartenrenderer

   Prüffrage: taugt three.js für die Spielfläche, wenn das Ziel NICHT eine
   3D-Landschaft ist, sondern ein gemaltes Tischdiorama? Vorlage ist
   `../hex-valley.html` — ein einzelnes, fest gemaltes SVG-Bild. Dessen
   Schattierung stimmt nur aus EINER Kamerastellung; genau das soll hier fallen.

   Die Gegenprobe in CSS steht in `kamera-labor-v1.html` (echte Extrusion mit
   preserve-3d, feste Welt-Sonne). Dieses Labor beantwortet, was dort offen
   blieb: weiche Schlagschatten, Kontaktverschattung, eine Palette, die je
   Ecke variiert, und eine Bildstimmung über allem.

   Zweiter Durchgang: ein GANZES Tal (rund zehnfache Fläche), Schieben statt
   Gesamtschau, Aufsicht oder Schrägsicht, und zwei Leute mit Sicht und Tempo —
   was ausserhalb der Sicht liegt, verliert seine Farbe. Damit prüft das Labor
   nicht mehr nur das Bild, sondern die Karte als Spielfläche.

   Dritter Durchgang: ZWEI Klane, einer am Oberlauf, einer an der Mündung, und
   der Nebel bekommt drei Zustände statt zwei. Das ist die eigentliche Neuerung
   dieses Durchgangs — und sie ist eine Modellfrage, keine Bildfrage:

     in Sicht    — volle Farbe
     Erinnerung  — einfarbig; hier war jemand, aber niemand ist mehr da
     Wolke       — was ein Klan NIE gesehen hat, liegt unter einer Wolke

   Die Wolke ist keine Maske, sondern eine **Diffusionsfront**: jeder Klan hat
   ein eigenes Feld `w ∈ [0,1]` über der Karte (1 = Wolke, 0 = klare
   Erinnerung). Sicht drückt `w` auf 0. Je Runde nimmt jedes Feld ausserhalb der
   Sicht `1/Kultur` in Richtung seines dichtesten Nachbarn zu — mehr nicht.
   Daraus folgt alles Weitere von selbst: die Vollwolken-Kante wandert mit
   genau `1/Kultur` Feldern je Runde über die Erinnerung, ihr läuft eine
   weiche Rampe von rund einem Feld voraus, und eine Sippe mit langem
   Gedächtnis (hohe Kultur) hält ihre Karte länger offen als eine mit kurzem.
   Kultur ist damit KEIN Sichtbonus, sondern ein Vergessenstempo.

   Der Baukasten trägt die ganze Bedienung (Kopf, Flächen, Knöpfe, Blatt,
   Reglerbrett, Zeichensatz) — three.js kümmert sich nur um die Miniaturwelt.
   Das ist die Architekturentscheidung, nicht bloß Bequemlichkeit: die
   Bedienung bleibt scharf, bedienbar und in Tokens gefärbt.
   ========================================================================= */

/* ---------------------------------------------------------------------------
   Die Diorama-Palette. Handgemalt, nicht fotografisch — die Töne sind aus
   der Vorlage abgenommen. Sie liegen als Tokens hier, NICHT als #hex im JS:
   nur so drehen Nacht und Werkbank die Welt mit, und der Bau liest sie beim
   Aufbau aus dem berechneten Stil zurück.
   --------------------------------------------------------------------------- */
:root{
  /* Gras — fünf benachbarte Töne. Die Streuung je Ecke macht das Gemalte. */
  --d-gras-1:#6F9D32; --d-gras-2:#78A83A; --d-gras-3:#86BD63;
  --d-gras-4:#66952F; --d-gras-5:#8BAE45;
  /* Wiese (dunkler, kurzgrasig) · Waldboden · Hochebene (heller, lichter) */
  --d-wiese-1:#5E8F31; --d-wiese-2:#6B9B38; --d-wiese-3:#7EB65B;
  --d-wald-boden-1:#4F7C2E; --d-wald-boden-2:#5C8A36; --d-wald-boden-3:#69973C;
  --d-hoch-1:#8EC468; --d-hoch-2:#9ACF74; --d-hoch-3:#7FB65C;
  /* Flanken und Erde — die Seitenwände tragen die halbe Bildwirkung */
  --d-flanke:#4D7C3A; --d-erde:#6B5236; --d-erde-tief:#42301D;
  --d-strata:#9AA0A0;
  /* Fels */
  --d-fels-1:#B6BABB; --d-fels-2:#8F9394; --d-fels-3:#CFD2D3;
  /* Sand und Kies */
  --d-sand-1:#DDC98F; --d-sand-2:#CDB67E; --d-sand-3:#C2AB73;
  --d-sand-flanke:#AD9662;
  /* Wasser — nie tief, immer gemalt */
  --d-wasser:#4E9FD6; --d-wasser-tief:#3A7FAE; --d-wasser-glanz:#7CC4E9;
  --d-schaum:#EAF7FF;
  /* Bewuchs */
  --d-nadel-1:#2E6B39; --d-nadel-2:#367A41; --d-nadel-3:#3F8B4A; --d-nadel-4:#4D9C56;
  --d-stamm:#6B4A2B; --d-busch:#4D9C56; --d-beere:#C8383C; --d-schilf:#A8A44E;
  /* Bauten, Feuer, Leute, Wild */
  --d-zelt-1:#C69663; --d-zelt-2:#A97A4C; --d-zelt-3:#7D5733;
  --d-glut:#EF8F2D; --d-glut-kern:#F7D13F; --d-asche:#C9CCCD;
  --d-haut:#D9A878; --d-kleid:#8A6A45; --d-kleid-2:#6E5738; --d-wild:#8A5C33;
  --d-speer:#7D5733; --d-klinge:#C9CCC9; --d-korb:#B08A4E;
  /* Wetter */
  --d-wolke-1:#FBFBFA; --d-wolke-2:#E2E4E5; --d-wolke-3:#C9CCCD;
  --d-tropfen:#5FA8DB;
  /* Die Wolke des Ungesehenen. Kühler und stumpfer als die Regenwolke: sie
     liegt AUF dem Land, nicht darüber, und darf nicht wie Wetter aussehen. */
  --d-nebel-1:#EDEBE4; --d-nebel-2:#DAD9D4; --d-nebel-3:#C3C4C3;
  /* Die beiden Klane. Zwei Marken, die nebeneinander lesbar bleiben — der
     Saum der Reichweite und die Klankarte nehmen sie auf. */
  --d-klan-o:#C96F2E; --d-klan-u:#3B7FA8;
  /* Bühne: das Papier, der Bodenschatten, die zwei Lichter */
  --d-papier:#ECE0C8; --d-boden:#B7A079;
  --d-sonne:#FFF3DE; --d-fuell:#BFD7FF; --d-rueck:#7E9A55;
  /* Bildstimmung: Lichter warm, Schatten kühl */
  --d-warm:#FFF0DC; --d-kuehl:#D6E2FF;
  /* Marken auf der Karte */
  --d-reich:#C96F2E;
  /* --- Bildstil ---------------------------------------------------------
     Tinte, Lichtfarbe, Schattenfarbe. Der Schatten ist eine FARBE, kein
     Faktor: `--d-schatten` wird über die Grundfarbe multipliziert, wo das
     Licht nicht hinkommt, `--d-licht` dort, wo es hinkommt. Damit kippt die
     Schattenseite ins Kühle, statt bloss dunkler zu werden — genau der
     Unterschied zwischen einem Rendering und einem Bild.
     Die Tinte ist NICHT schwarz: eine schwarze Linie liest sich technisch,
     eine warm-dunkle liest sich gezeichnet. */
  --d-tinte:#3B2A1C; --d-licht:#FFF6E4; --d-schatten:#5C6A88;
}
/* Nacht ist eine Spielmechanik, keine Vorliebe — die Welt kippt mit. */
body.night{
  --d-gras-1:#2A4426; --d-gras-2:#2F4B2A; --d-gras-3:#37542F;
  --d-gras-4:#264020; --d-gras-5:#33502D;
  --d-wiese-1:#243D21; --d-wiese-2:#294526; --d-wiese-3:#2F4C2A;
  --d-wald-boden-1:#1E3A1D; --d-wald-boden-2:#234121; --d-wald-boden-3:#284826;
  --d-hoch-1:#3B5A33; --d-hoch-2:#436439; --d-hoch-3:#35522E;
  --d-flanke:#1E3320; --d-erde:#2C2318; --d-erde-tief:#191309;
  --d-strata:#404849;
  --d-fels-1:#4A5254; --d-fels-2:#3A4143; --d-fels-3:#5A6365;
  --d-sand-1:#5B5138; --d-sand-2:#524931; --d-sand-3:#48402B;
  --d-sand-flanke:#3C3524;
  --d-wasser:#1E4C74; --d-wasser-tief:#153953; --d-wasser-glanz:#3A7AA8;
  --d-schaum:#8FB4CC;
  --d-nadel-1:#13301C; --d-nadel-2:#173821; --d-nadel-3:#1C4126; --d-nadel-4:#22492C;
  --d-stamm:#2C1F13; --d-busch:#22492C; --d-beere:#6B1F22; --d-schilf:#4A4823;
  --d-zelt-1:#5B452C; --d-zelt-2:#4A3823; --d-zelt-3:#332413;
  --d-asche:#5A5D5E; --d-korb:#4E3D22;
  --d-haut:#8A6A4C; --d-kleid:#443624; --d-kleid-2:#382C1D; --d-wild:#453020;
  --d-wolke-1:#586170; --d-wolke-2:#48505E; --d-wolke-3:#3A4250;
  --d-tropfen:#7CA6C8;
  --d-nebel-1:#3A414B; --d-nebel-2:#2F3640; --d-nebel-3:#262C35;
  --d-klan-o:#E08A3C; --d-klan-u:#5FA6CE;
  --d-papier:#0F1A22; --d-boden:#070C10;
  --d-sonne:#B8CBF0; --d-fuell:#4E6C96; --d-rueck:#20301F;
  --d-warm:#FFE6C0; --d-kuehl:#C3D4FF;
  --d-reich:#E08A3C;
  /* Nachts kehrt sich der Kontrast um: die Tinte muss HELLER als das Land
     sein, sonst verschwindet jede Linie im dunklen Grün. */
  --d-tinte:#93AABC; --d-licht:#9CB6E0; --d-schatten:#2A3550;
}
/* Tageszeiten drehen nur die Lichtfarben — das Gelände bleibt es selbst. */
body[data-zeit=morgen]{ --d-sonne:#FFD9C0; --d-fuell:#CFDCFF; --d-warm:#FFE2C4; }
body[data-zeit=abend] { --d-sonne:#FFCB93; --d-fuell:#B9CBF5; --d-warm:#FFDDAF; }

/* --------------------------------------------------------- Stil und Spielart ---
   Der Pfeil am Familienknopf ist eine INLINE-SVG, kein Schriftzeichen: „▾"
   erbt die Metrik der Schrift, sitzt je Gerät anders auf der Grundlinie und
   fehlt auf manchen ganz. Die Hausregel gilt auch für Bedienzeichen.
   -------------------------------------------------------------------------- */
#segStil button{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
#segStil .pfeil{width:11px;height:11px;flex:0 0 auto;opacity:.55;
                margin:-2px -3px -2px 0;padding:2px 3px;border-radius:var(--r-sm);}
#segStil button.on .pfeil{opacity:.9;}
#segStil .pfeil:hover{opacity:1;background:rgba(0,0,0,.10);}
/* Die Spielart steht AM Knopf, nicht daneben: sonst liest man „Holzschnitt"
   und weiss nicht, welchen. Nur der aktive Knopf trägt sie — sonst wäre die
   Leiste eine Wand aus Wörtern. */
#segStil .spielart{font-family:var(--f-mono);font-size:10px;letter-spacing:.02em;
                   opacity:.75;}

.stilmenu{position:fixed;z-index:60;min-width:190px;padding:5px;
          background:var(--panel);border:1px solid var(--line);
          border-radius:var(--r-md);box-shadow:var(--shadow);}
.stilmenu.hid{display:none;}
.stilmenu .kopf{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;
                letter-spacing:.08em;color:var(--ink2);padding:4px 8px 6px;}
.stilmenu button{display:block;width:100%;text-align:left;border:0;background:none;
                 font:inherit;font-size:13px;color:var(--ink);cursor:pointer;
                 padding:6px 8px;border-radius:var(--r-sm);}
.stilmenu button:hover{background:var(--panel2);}
.stilmenu button.on{background:var(--ember);color:var(--on-ember);}
.stilmenu .wie{display:block;font-family:var(--f-mono);font-size:10px;opacity:.62;
               margin-top:2px;}

/* ------------------------------------------------------------------ Bühne ---*/
html,body{height:100%;}
body{overflow:hidden;}
.app{height:100dvh;display:flex;flex-direction:column;
     padding:10px 12px 12px;max-width:1400px;margin:0 auto;box-sizing:border-box;}
.app > header.appbar{flex:0 0 auto;}

#buehne{position:relative;flex:1 1 auto;min-height:0;border-radius:var(--r-lg);
        overflow:hidden;background:var(--d-papier);border:1px solid var(--line);}
#gl{display:block;width:100%;height:100%;cursor:grab;}
#gl.zieht{cursor:grabbing;}

/* Alles, was über der Welt liegt, ist HTML — scharf in jeder Auflösung. */
.hud{position:absolute;inset:0;pointer-events:none;display:flex;padding:10px;gap:8px;}
.hud > *{pointer-events:auto;}
.hud .links{display:flex;flex-direction:column;gap:8px;align-items:flex-start;
            flex:1;min-width:0;}
.hud .rechts{display:flex;flex-direction:column;gap:8px;align-items:stretch;
             width:190px;flex:none;overflow-y:auto;max-height:100%;}
.hud .fuss{margin-top:auto;}
.hud .chip{background:color-mix(in srgb,var(--panel) 84%,transparent);backdrop-filter:blur(3px);}
.hud .chip svg{width:12px;height:12px;}

.stempel{font-family:var(--f-mono);font-size:9px;letter-spacing:.14em;
         text-transform:uppercase;color:var(--ink2);
         background:color-mix(in srgb,var(--panel) 80%,transparent);
         border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 9px;
         backdrop-filter:blur(3px);white-space:nowrap;}

/* --------------------------------------------------------- Einheitenkarten ---
   Kein `SOT.karte()`: das ist die 5:7-Spielkarte für Dinge, die AUSGESPIELT
   werden. Eine Person auf dem Brett ist ein Bestandseintrag — eine Fläche.
   --------------------------------------------------------------------------- */
.einheit{background:color-mix(in srgb,var(--panel) 92%,transparent);
         border:1px solid var(--line);border-radius:var(--r-md);
         padding:8px 9px;box-shadow:var(--shadow);cursor:pointer;
         backdrop-filter:blur(3px);transition:border-color .15s;}
.einheit:hover{border-color:var(--ember);}
.einheit.sel{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember),var(--shadow);}
.ekopf{display:flex;align-items:center;gap:7px;}
.ekopf svg{width:18px;height:18px;color:var(--ember);flex:none;}
.ekopf b{font-family:var(--f-display);font-size:13px;letter-spacing:.02em;}
.ekopf .ort{margin-left:auto;font-family:var(--f-mono);font-size:9.5px;color:var(--ink2);}
.ewerte{margin-top:7px;display:flex;flex-direction:column;gap:4px;}
.ew{display:flex;align-items:center;gap:5px;}
.ew > span{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;
           text-transform:uppercase;color:var(--ink2);flex:1;}
.ew b{font-family:var(--f-mono);font-size:12px;min-width:14px;text-align:center;}
.ew button{padding:1px 6px;font-size:12px;line-height:1.1;border-radius:5px;}
.ehint{font-size:9.5px;color:var(--ink2);margin-top:6px;line-height:1.4;}

/* ------------------------------------------------------------- Die Klankarte ---
   Sie steht ÜBER den Einheiten, weil sie über ihnen steht: die Leute gehören
   dem Klan, und was der Klan weiss, ist die Karte, die sie sehen. Beide Klane
   stehen in EINER Karte — nur so ist der Unterschied der Kulturen ablesbar,
   ohne den Zug zu wechseln.
   --------------------------------------------------------------------------- */
#klankarte{background:color-mix(in srgb,var(--panel) 92%,transparent);
           border:1px solid var(--line);border-radius:var(--r-md);
           box-shadow:var(--shadow);backdrop-filter:blur(3px);overflow:hidden;}
.kzeile{padding:8px 9px;border-top:1px solid var(--line);}
.kzeile:first-child{border-top:none;}
.kzeile.aktiv{background:color-mix(in srgb,var(--kf) 10%,transparent);
              box-shadow:inset 3px 0 0 var(--kf);}
.kkopf{display:flex;align-items:center;gap:7px;}
.kkopf svg{width:17px;height:17px;color:var(--kf);flex:none;}
.kkopf b{font-family:var(--f-display);font-size:12.5px;letter-spacing:.02em;}
.kkopf .zug{margin-left:auto;font-family:var(--f-mono);font-size:8.5px;
            letter-spacing:.12em;text-transform:uppercase;color:var(--kf);
            border:1px solid var(--kf);border-radius:var(--r-pill);padding:1px 6px;}
.kzeile .ew{margin-top:6px;}
.knote{font-size:9.5px;color:var(--ink2);margin-top:5px;line-height:1.45;}
.knote b{color:var(--ink);}

/* Der Dreiklang als Balken: Sicht · Erinnerung · Wolke. Er ist die Messung
   der Front — man sieht die Erinnerung schrumpfen, während die Runden laufen. */
.wbalken{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:7px;
         border:1px solid var(--line);}
.wbalken i{display:block;}
.wbalken i.s{background:var(--kf);}
.wbalken i.e{background:color-mix(in srgb,var(--ink2) 55%,transparent);}
.wbalken i.w{background:var(--d-nebel-2);}
.wlegende{display:flex;gap:9px;margin-top:5px;font-family:var(--f-mono);font-size:8.5px;
          letter-spacing:.06em;color:var(--ink2);}
.wlegende span{display:flex;align-items:center;gap:3px;}
.wlegende i{width:7px;height:7px;border-radius:2px;flex:none;}

#bZug{width:100%;justify-content:center;}
#bZug svg{width:13px;height:13px;margin-right:5px;}

/* Feldkarte unten links */
#feldkarte{width:min(290px,100%);}
#feldkarte .kopf{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
#feldkarte .kopf svg{width:18px;height:18px;color:var(--ember);flex:none;}
#feldkarte .kopf b{font-family:var(--f-display);font-size:14px;}
#feldkarte .kopf .co{font-family:var(--f-mono);font-size:10px;color:var(--ink2);margin-left:auto;}
#feldkarte .nb{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
#feldkarte .nb span{font-family:var(--f-mono);font-size:9px;color:var(--ink2);
                    border:1px solid var(--line);border-radius:var(--r-pill);padding:2px 6px;}

/* Messblatt */
#messblatt{width:min(440px,94vw);}
#messblatt h3{font-family:var(--f-display);font-size:13px;letter-spacing:.1em;
              text-transform:uppercase;color:var(--ink2);margin:14px 0 6px;}
#messblatt h3:first-child{margin-top:0;}
.mtab{width:100%;border-collapse:collapse;font-size:11px;}
.mtab td{padding:3px 0;vertical-align:top;}
.mtab td.s{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;

<script>
/* Wenn der Modulteil nicht anläuft (häufigste Ursache: Chrome verweigert
   ES-Module unter file://), soll die Seite es SAGEN statt weiß zu bleiben. */
window.__diorama = false;
setTimeout(function () {
  if (window.__diorama) return;
  var n = document.getElementById('not'), g = document.getElementById('notgrund');
  g.innerHTML = 'Der Modulteil hat sich nicht gemeldet. Unter <code>file://</code> ' +
    'verweigert Chrome ES-Module (Herkunft „null“). Zwei Wege:<br><br>' +
    '<b>1. Ordner ausliefern</b> — <code>npx http-server ..</code> und über ' +
    '<code>http://localhost:8080/drafts/diorama-labor-v1.html</code> öffnen.<br><br>' +
    '<b>2. Für Bildschirmfotos</b> — Chrome mit ' +
    '<code>--allow-file-access-from-files</code> starten.<br><br>' +
    'Falls stattdessen WebGL fehlt oder der Modulteil einen Fehler hat: die Konsole nennt es.';
  n.classList.remove('hid');
}, 2500);
</script>

<script type="module">
import * as THREE from '../vendor/three-0.185.1/three.module.min.js';

/* ============================================================================
   0 · Parameter — ein Bildschirmfoto kann nicht klicken
   ========================================================================= */
const P = SOT.params({
  karte:   { t:'enum', def:'tal', values:['tal','referenz'], help:'„tal“ = ganzes Tal (gerechnet) · „referenz“ = die 7×12-Insel der Vorlage' },
  breite:  { t:'int', def:28, min:7, max:40, step:1, help:'Spalten des Tals (Zeilen = 1,7×) — die Fläche des Labors' },
  sicht:   { t:'enum', def:'iso', values:['iso','oben'], help:'Schrägsicht (45°/37°) oder Aufsicht (senkrecht)' },
  azimut:  { t:'int', def:45,  min:0,  max:355, step:5, help:'Kamera-Drehung um die Welt-Hochachse (Grad)' },
  neigung: { t:'int', def:37,  min:12, max:80,  step:1, help:'Kamera-Neigung in der Schrägsicht (Grad)' },
  zoom:    { t:'int', def:14,  min:5,  max:60,  step:1, help:'Bildbreite in Feldern — der Maßstab' },
  blick:   { t:'str', def:'',  help:'Blickmitte als Feld, z. B. blick=12,20' },
  zeit:    { t:'enum', def:'mittag', values:['morgen','mittag','abend','nacht'], help:'Tageszeit — Licht und Palette' },
  wetter:  { t:'enum', def:'regen', values:['klar','regen'], help:'Wolke und Regen über dem Tal' },
  seed:    { t:'int', def:7, min:1, max:999, help:'Zufallssaat — Talform, Streuung, Unruhe' },
  quelle:  { t:'int', def:100, min:0, max:400, help:'Wasserdargebot je Feld (%) — bestimmt, ab wo ein Bach entsteht' },
  maeander:{ t:'int', def:100, min:0, max:300, help:'Seitliche Auslenkung des Laufs im Feld (%)' },
  unruhe:  { t:'int', def:100, min:0, max:300, help:'Störung der Hex-Ecken (%) — 0 = mathematisch flach' },
  ao:      { t:'int', def:100, min:0, max:200, help:'Eingebackene Kontaktverschattung (%)' },
  dichte:  { t:'int', def:100, min:0, max:200, help:'Dichte des Bewuchses (%) — der Dreieckszähler hängt daran' },
  post:    { t:'int', def:100, min:0, max:200, help:'Fotografische Nachbearbeitung (%): Glut, ACES, Nachschärfen, Vignette — die Kamera-Idiome' },
  /* --- die sechs Hebel des Bildstils.  `stil` setzt sie; wer einen einzeln
     in die Adresse schreibt, behält ihn (siehe `stilAnwenden`). ----------- */
  stil:    { t:'enum', def:'holzschnitt', values:['jetzt','holzschnitt','papier','raster','pixel'],
             help:'Familie der Voreinstellung — „jetzt" ist das unveränderte Diorama als Vergleichsmarke' },
  variante:{ t:'str', def:'',
             help:'Spielart innerhalb der Familie (z. B. stil=holzschnitt&variante=feder). Leer = die erste der Familie' },
  stufen:  { t:'int', def:3, min:0, max:8, help:'Lichtstufen (0 = stufenlos wie bisher). DER Hebel: gestuftes Licht macht aus dem Rendering ein Bild' },
  kante:   { t:'int', def:8, min:0, max:50, help:'Weichheit der Lichtstufe (%) — 0 = messerscharf, gross = wieder Verlauf' },
  schattenton:{ t:'int', def:100, min:0, max:200, help:'Wie stark die Schattenseite in --d-schatten kippt (%) — 0 = nur dunkler, kein Farbwechsel' },
  kontur:  { t:'int', def:100, min:0, max:250, help:'Stärke der Linie (%) — Aussenkontur aus der Tiefe, Binnenkontur aus den Normalen' },
  strich:  { t:'int', def:1, min:1, max:4, help:'Breite der Linie in Bildpunkten' },
  korn:    { t:'int', def:0, min:0, max:200, help:'Papier (%) — Faser und Ton des Untergrunds, bildschirmfest statt mitgedreht' },
  kochen:  { t:'int', def:0, min:0, max:200, help:'Kochen der Kanten (%) — Zittern, mit ~10 Bildern/s neu gewürfelt, wie bei gezeichnetem Trickfilm' },
  raster:  { t:'int', def:0, min:0, max:200, help:'Geordnetes Rastern (%) — Bayer-Matrix auf begrenzte Farbzahl, liest sich gedruckt' },
  farbstufen:{ t:'int', def:6, min:2, max:32, help:'Farbzahl je Kanal beim Rastern — klein = Risografie, gross = unsichtbar' },
  pixelig: { t:'int', def:1, min:1, max:12, help:'Kantenlänge des Bildpunkts (1 = aus). GEGENPROBE: macht unpoliert, aber nicht gezeichnet' },
  zeige:   { t:'enum', def:'bild', values:['bild','tiefe','normal','kontur'],
             help:'Zwischenbild statt Bild — die Linie ist der einzige Teil mit eigenen Puffern, und ohne Blick hinein sucht man den Fehler im Falschen' },
  schatten:{ t:'enum', def:'weich', values:['aus','hart','weich'], help:'Schlagschatten der Sonne' },
  lichtdreht:{ t:'int', def:1, min:0, max:1, help:'Sonne dreht mit der Kamera (1) oder steht in der Welt (0)' },
  nebel:   { t:'int', def:1, min:0, max:1, help:'Erinnerung und Wolke an (1) oder alles farbig (0)' },
  amzug:   { t:'enum', def:'oben', values:['oben','unten'], help:'Welcher Klan am Zug ist — SEINE Wolke ist zu sehen' },
  entdeckt:{ t:'int', def:0, min:0, max:24, help:'Schon erkundet: Radius um jedes Lager, der zu Beginn als Erinnerung gilt' },
  vorlauf: { t:'int', def:0, min:0, max:40, help:'Runden vorspulen — die Front kriecht ohne Klicken über die Erinnerung' },
  okultur: { t:'int', def:4, min:1, max:8, help:'Kultur des Klans am Oberlauf — die Wolke rückt 1/Kultur Felder je Runde' },
  ukultur: { t:'int', def:1, min:1, max:8, help:'Kultur des Klans an der Mündung' },
  ojsicht: { t:'int', def:5, min:0, max:14, help:'Sicht des Jägers am Oberlauf in Feldern' },
  ojtempo: { t:'int', def:4, min:0, max:14, help:'Tempo des Jägers am Oberlauf in Feldern' },
  ossicht: { t:'int', def:3, min:0, max:14, help:'Sicht der Sammlerin am Oberlauf in Feldern' },
  ostempo: { t:'int', def:2, min:0, max:14, help:'Tempo der Sammlerin am Oberlauf in Feldern' },
  ujsicht: { t:'int', def:5, min:0, max:14, help:'Sicht des Jägers an der Mündung in Feldern' },
  ujtempo: { t:'int', def:4, min:0, max:14, help:'Tempo des Jägers an der Mündung in Feldern' },
  ussicht: { t:'int', def:3, min:0, max:14, help:'Sicht der Sammlerin an der Mündung in Feldern' },
  ustempo: { t:'int', def:2, min:0, max:14, help:'Tempo der Sammlerin an der Mündung in Feldern' },
  gitter:  { t:'flag', help:'Drahtgitter — zeigt die Dreiecke' },
  mess:    { t:'flag', help:'Messblatt gleich offen — ein Bildschirmfoto kann nicht klicken' },
  still:   { t:'flag', help:'Bewegung anhalten und nur auf Zuruf zeichnen — für vergleichbare Bildschirmfotos' },
  wahl:    { t:'str', def:'', help:'Feld vorwählen, z. B. wahl=12,20' }
});

/* ----------------------------------------------------------------------------
   Die fünf Bilder als Zeilen über den sechs Hebeln. Wer einen Stil streitig
   macht, ändert hier eine Zahl — nicht den Aufbau. `post` steht bewusst mit
   drin: die fotografische Nachbearbeitung (Glut, ACES, Vignette, Nachschärfen)
   IST ein Stilmerkmal, und zwar das, was am lautesten „Kamera" sagt.
   -------------------------------------------------------------------------- */
/* Die Stiltabelle hat ZWEI Ebenen, und das ist der Punkt: die Familie sagt,
   welche Frage gestellt wird, die Spielart sagt, wie hart sie gestellt wird.
   Ein Streit über „Holzschnitt ja oder nein" ist meist in Wahrheit ein Streit
   über „hart oder Feder" — und der lässt sich nur entscheiden, wenn man beide
   nebeneinander sieht.

   Jede Spielart schreibt ALLE Hebel aus, auch die, die sie auf Null lässt.
   Das ist absichtlich redundant: so liest sich die Tabelle spaltenweise wie
   ein Vergleich, und wer eine Zeile ändert, sieht sofort, wovon sie abweicht.
   -------------------------------------------------------------------------- */
const STILE = {
  /* Die Vergleichsmarke: alles aus, Fotografie voll. So sieht das Diorama
     heute aus — ohne diese Zeile wäre das Labor kein Vergleich, sondern nur
     eine Sammlung Filter. Nur eine Spielart, es gibt nichts zu variieren. */
  jetzt: { titel:'Jetzt', varianten: {
    'wie gebaut': { stufen:0, kante:0,  schattenton:0,   kontur:0,   strich:1, korn:0,   kochen:0,   raster:0,   farbstufen:6,  pixelig:1, post:100 }
  }},

  /* HOLZSCHNITT — der Zielstil der Kunstrichtung. Die vier Spielarten fragen:
     wie viele Tonstufen verträgt das Bild, und wieviel muss die Linie tragen?
     „hart" und „Feder" sind die Gegenpole; wer beide gesehen hat, weiss, wo
     dazwischen die eigene Antwort liegt. */
  holzschnitt: { titel:'Holzschnitt', varianten: {
    /* Drei Stufen, Linie als Beiwerk. Der Mittelweg — und der Ausgangspunkt. */
    klassisch:   { stufen:3, kante:6,  schattenton:100, kontur:110, strich:1, korn:0,   kochen:0,   raster:0,   farbstufen:6,  pixelig:1, post:0 },
    /* ZWEI Stufen und ein übertriebener Schattenton: jede Fläche hat Licht-
       oder Schattenseite, nichts dazwischen. Der eigentliche Holzschnitt. */
    hart:        { stufen:2, kante:0,  schattenton:150, kontur:150, strich:1, korn:0,   kochen:0,   raster:0,   farbstufen:6,  pixelig:1, post:0 },
    /* Die Gegenthese: viele Tonstufen, kaum Farbwechsel im Schatten — dafür
       eine fette Linie, die allein die Form trägt. Federzeichnung mit Lavur. */
    feder:       { stufen:6, kante:4,  schattenton:55,  kontur:250, strich:2, korn:0,   kochen:0,   raster:0,   farbstufen:6,  pixelig:1, post:0 },
    /* Und der Beweis: GAR KEINE Linie, dafür der Farbschatten aufgedreht.
       Wenn das noch gezeichnet aussieht, liegt es nicht an der Kontur. */
    'ohne Linie':{ stufen:2, kante:14, schattenton:190, kontur:0,   strich:1, korn:0,   kochen:0,   raster:0,   farbstufen:6,  pixelig:1, post:0 }
  }},

  /* PAPIER — dieselbe Zeichnung auf einem Untergrund. Die Spielarten fragen,
     wieviel Untergrund das Bild verträgt, bevor er vom Motiv ablenkt. */
  papier: { titel:'Papier', varianten: {
    /* Glatter Bogen, vier Stufen, weiche Linie. */
    bogen:       { stufen:4, kante:10, schattenton:90,  kontur:80,  strich:1, korn:110, kochen:40,  raster:0,   farbstufen:6,  pixelig:1, post:0 },
    /* Büttenpapier: Faser voll aufgedreht, und die Kante hält nicht still. */
    'Bütten':    { stufen:3, kante:8,  schattenton:110, kontur:60,  strich:1, korn:200, kochen:90,  raster:0,   farbstufen:6,  pixelig:1, post:0 },
    /* Nass: sechs Stufen mit weichen Übergängen, blasser Schatten, kaum
       Linie. Das Gegenteil des Holzschnitts — prüft, wo „gemalt" aufhört
       und „gerendert" wieder anfängt. */
    aquarell:    { stufen:6, kante:34, schattenton:55,  kontur:30,  strich:1, korn:140, kochen:25,  raster:0,   farbstufen:6,  pixelig:1, post:0 },
    /* Skizzenbuch: zwei Stufen, fette zittrige Linie, mässiges Korn. */
    skizze:      { stufen:2, kante:4,  schattenton:120, kontur:220, strich:2, korn:90,  kochen:130, raster:0,   farbstufen:6,  pixelig:1, post:0 }
  }},

  /* RASTER — gedruckt statt gemalt. Die Spielarten fragen, wie WENIG Farbe
     das Tal noch lesbar hält. `farbstufen` ist hier der eigentliche Hebel. */
  raster: { titel:'Raster', varianten: {
    /* Fünf Farbstufen je Kanal, kräftiges Raster. Risografie. */
    risografie:  { stufen:3, kante:4,  schattenton:100, kontur:100, strich:1, korn:70,  kochen:0,   raster:130, farbstufen:5,  pixelig:1, post:0 },
    /* DREI Stufen je Kanal — und damit ausdrücklich ÜBER der Grenze. Die
       Farben kippen ins Giftgrüne, das Tal ist nicht mehr zu lesen. Die
       Spielart bleibt trotzdem drin: sie beantwortet „wie wenig geht noch"
       eindeutig mit „vier, nicht drei", und das ist mehr wert als eine
       weitere hübsche Zeile. Sie heisst darum NICHT „Zeitung" — echter
       Zeitungsdruck ist ein Duplex (EINE Farbe, gerastert), und den kann
       dieser Shader nicht: er stuft je Kanal, nicht je Druckfarbe. */
    'zu wenig':  { stufen:2, kante:0,  schattenton:130, kontur:150, strich:1, korn:120, kochen:0,   raster:190, farbstufen:3,  pixelig:1, post:0 },
    /* Die Gegenprobe nach oben: vierzehn Stufen, schwaches Raster — das
       Muster verschwindet, und übrig bleibt bloss ein Hauch Druck. */
    feinraster:  { stufen:5, kante:8,  schattenton:80,  kontur:70,  strich:1, korn:50,  kochen:0,   raster:60,  farbstufen:14, pixelig:1, post:0 },
    /* Siebdruck: flach, wenige Farben, KEINE Linie — die Farbfläche selbst
       muss die Form tragen. */
    siebdruck:   { stufen:2, kante:0,  schattenton:160, kontur:0,   strich:1, korn:40,  kochen:0,   raster:150, farbstufen:4,  pixelig:1, post:0 }
  }},

  /* PIXEL — die Gegenprobe, nicht der Vorschlag. Die Spielarten zeigen, dass
     die Frage nicht „gepixelt ja/nein" ist, sondern WIE GROB: bei „fein"
     überlebt der Bewuchs, bei „grob" zerfällt er. Kontur bleibt überall aus —
     eine Linie im Bildpunktraster ist entweder einen Punkt breit oder falsch. */
  pixel: { titel:'Pixel', varianten: {
    /* Vier Punkte Kantenlänge, mässiges Raster. Der Mittelweg. */
    grob:        { stufen:3, kante:0,  schattenton:100, kontur:0,   strich:1, korn:0,   kochen:0,   raster:55,  farbstufen:10, pixelig:6, post:0 },
    /* Zwei Punkte: fast noch scharf — hier überlebt der Bewuchs gerade so. */
    fein:        { stufen:4, kante:0,  schattenton:90,  kontur:0,   strich:1, korn:0,   kochen:0,   raster:35,  farbstufen:16, pixelig:2, post:0 },
    /* Ohne Raster: harte Farbtreppen statt Muster. Zeigt, was das Rastern
       überhaupt verdeckt — und wie wenig Farben in Wahrheit übrig sind. */
    'ohne Raster':{stufen:2, kante:0,  schattenton:140, kontur:0,   strich:1, korn:0,   kochen:0,   raster:0,   farbstufen:6,  pixelig:4, post:0 },
    /* Und andersherum: vier Farbstufen, Raster voll auf. Nur noch Muster. */
    gerastert:   { stufen:3, kante:0,  schattenton:110, kontur:0,   strich:1, korn:0,   kochen:0,   raster:150, farbstufen:4,  pixelig:4, post:0 }
  }}
};
const STIL_HEBEL = ['stufen','kante','schattenton','kontur','strich','korn','kochen',
                    'raster','farbstufen','pixelig','post'];

const stilNamen = () => Object.keys(STILE);
const variantenNamen = (stil) => Object.keys((STILE[stil] || STILE.jetzt).varianten);
/* Welche Spielart war in dieser Familie zuletzt zu sehen? Ohne das Gedächtnis
   fiele man beim Zurückschalten immer auf die erste zurück — und ein Vergleich
   „Feder gegen Bütten" wäre nur über die Adresse zu haben. */
const letzteVariante = {};

/* Einen Stil auf die Hebel schreiben. Beim Start werden nur die Hebel gesetzt,
   die NICHT in der Adresse stehen — sonst überschriebe `?stil=papier&korn=0`
   das ausdrücklich Gewünschte mit der Voreinstellung. Beim Klick auf den
   Schalter dagegen gewinnt die Spielart über alles: wer sie wählt, will sie. */
function stilAnwenden(name, variante, nurFehlende) {
  const fam = STILE[name]; if (!fam) return;
  const namen = Object.keys(fam.varianten);
  const v = namen.indexOf(variante) >= 0 ? variante : namen[0];
  const z = fam.varianten[v];
  const inAdresse = new URLSearchParams(location.search);
  for (const h of STIL_HEBEL) {
    if (nurFehlende && inAdresse.has(h)) continue;
    P[h] = z[h]; P.set(h, z[h]);
  }
  P.stil = name; P.set('stil', name);
  P.variante = v; P.set('variante', v);
  letzteVariante[name] = v;
}
stilAnwenden(P.stil, P.variante, true);

/* ============================================================================
   1 · Gelände als Daten

   Spitz-oben, odd-r — DIE Konvention des Projekts (`SOT.hex`,
   `app/src/stromlinien/grid.ts`).

     g Gras · G Wiese · w Wald · f Felsig · h Hochebene · s Kiesbank

   **Wasser ist KEIN Gelände.** Es gab hier einmal die Sorten `~` und `W`, und
   das war ein Rückschritt hinter eine bereits getroffene Entscheidung:
   `gewaesser-labor-v4` typisiert keine Zelle als Wasser, sondern gibt jeder
   Zelle eine ABFLUSSRICHTUNG (steilster Nachbar, D6) und akkumuliert die Menge
   talwärts; gezeichnet wird über Ports auf den KANTENMITTEN ("Ports fest auf
   der Kantenmitte (Entscheid)"). Ein Fluss läuft DURCH Gelände, er ersetzt es
   nicht — ein Wald am Wasser ist Auenwald, kein Loch im Wald.

   Der bauliche Gewinn: der Zufluss wird nicht geschrieben, sondern ABGELEITET
   (meine Zuflusskanten sind die Nachbarn, deren Abfluss auf mich zeigt). Damit
   ist ein unzusammenhängender Fluss nicht mehr darstellbar — bei einer Liste
   von Fluss-Feldern war er es.
   ========================================================================= */
const GELAENDE = {
  g:{ name:'Grasland',   oben:'gras',  flanke:'gras', streu:{ baum:0.30, busch:0.42, stein:0.16, halm:0.70 } },
  G:{ name:'Wiese',      oben:'wiese', flanke:'gras', streu:{ baum:0.10, busch:0.60, stein:0.10, halm:0.90 } },
  w:{ name:'Wald',       oben:'wald',  flanke:'gras', streu:{ baum:0.95, busch:0.60, stein:0.10, halm:0.40 } },

function rngAus(a) {

    return s / 4294967296;

  return h >>> 0;

/* Ein Feld zieht seinen Zufall aus (c,r,seed), nicht aus der Aufbaureihenfolge

const rngFeld = (c, r, salz) => rngAus(mix32(c * 73856093, r * 19349663, P.seed * 83492791, salz || 0));
/* Sanftes Wertrauschen für Waldinseln und Talbreite — reproduzierbar. */
function rausch(c, r, salz, weite) {
  const s = weite || 4;
  const x = c / s, z = r / s;
  const xi = Math.floor(x), zi = Math.floor(z);
  const tx = x - xi, tz = z - zi;
  const g = (a, b) => rngAus(mix32(a * 374761393, b * 668265263, P.seed, salz))();
  const f = t => t * t * (3 - 2 * t);
  const a = g(xi, zi), b = g(xi + 1, zi), c2 = g(xi, zi + 1), d = g(xi + 1, zi + 1);
  const u = f(tx), v = f(tz);
  return (a * (1 - u) + b * u) * (1 - v) + (c2 * (1 - u) + d * u) * v;

function ton(liste, rnd, drift) {

/* ============================================================================
   4 · Der Bauplan

   Alles wird in FLACHE Felder geschrieben und am Ende zu je einer Geometrie
   verschmolzen. Das ist die eigentliche Antwort auf die Prüffrage: das ganze
   Tal kostet eine Handvoll Zeichenaufrufe, nicht einen je Baum.

   Flächennormalen werden hier gerechnet, nicht interpoliert — damit ist die
   Facettierung eingebaut und `flatShading` unnötig.
   ========================================================================= */
class Bauplan {
  constructor() { this.p = []; this.n = []; this.c = []; this.anz = 0; }
  dreieck(A, B, C, cA, cB, cC) {
    const ux = B[0]-A[0], uy = B[1]-A[1], uz = B[2]-A[2];
    const vx = C[0]-A[0], vy = C[1]-A[1], vz = C[2]-A[2];
    let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
    const l = Math.hypot(nx, ny, nz) || 1; nx/=l; ny/=l; nz/=l;
    this.p.push(A[0],A[1],A[2], B[0],B[1],B[2], C[0],C[1],C[2]);
    this.n.push(nx,ny,nz, nx,ny,nz, nx,ny,nz);
    this.c.push(cA.r,cA.g,cA.b, cB.r,cB.g,cB.b, cC.r,cC.g,cC.b);
    this.anz++;
  }
  viereck(A, B, C, D, cA, cB, cC, cD) {
    this.dreieck(A, B, C, cA, cB, cC);
    this.dreieck(A, C, D, cA, cC, cD);
  }
  /* Ein Blatt ohne Rückseite: beide Umläufe. Für gemalte Flächen ohne Körper
     (der Wasserfallvorhang) — sonst verschwindet es, sobald die Kamera auf die
     andere Seite dreht, und das fällt beim Drehen sofort auf. */
  blatt(A, B, C, D, cA, cB, cC, cD) {
    this.viereck(A, B, C, D, cA, cB, cC, cD);
    this.viereck(A, D, C, B, cA, cD, cC, cB);
  }
  /* Eine fertige three-Geometrie einschmelzen: verschoben, gedreht, gefärbt.
     `ff` bekommt die LOKALE Ecke und gibt ihre Farbe — so kann eine Form ihre
     eigene Verschattung tragen (Wurzel dunkel, Krone hell). */
  form(geo, m, ff) {
    const g = geo.index ? geo.toNonIndexed() : geo;
    const pos = g.attributes.position, v = new THREE.Vector3();
    const E = [], F = [];
    for (let i = 0; i < pos.count; i++) {
      F.push(ff(pos.getX(i), pos.getY(i), pos.getZ(i), i));
      v.fromBufferAttribute(pos, i).applyMatrix4(m);
      E.push([v.x, v.y, v.z]);
    }
    for (let i = 0; i < E.length; i += 3) this.dreieck(E[i], E[i+1], E[i+2], F[i], F[i+1], F[i+2]);
    if (g !== geo) g.dispose();
  }
  geometrie() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('normal',   new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute('color',    new THREE.Float32BufferAttribute(this.c, 3));
    g.computeBoundingSphere();
    return g;
  }
}

/* ============================================================================
   5 · Das Tal rechnen

   Reihenfolge umgedreht gegenüber der ersten Fassung, und das ist der Kern
   der Umstellung: **erst die Höhe, dann das Wasser.** Vorher wurde ein Lauf
   gewürfelt und die Höhe aus der Entfernung zu ihm abgeleitet — Wasser war
   Ursache, Gelände Wirkung. Das ist verkehrt herum: Wasser fliesst bergab.

   Jetzt: ein Höhenfeld (Talachse, Flanken, Gefälle talwärts, Rauschen) →
   Abflussrichtung je Feld = steilster Nachbar (D6) → Menge talwärts
   akkumuliert. Ab einer Schwelle trägt ein Feld Wasser. Zuflüsse entstehen
   dabei von selbst, denn zwei Flanken entwässern in dieselbe Sohle.

   Das ist das Modell aus `gewaesser-labor-v4`, nur in 3D.
   ========================================================================= */
const felder = new Map();
const schluessel = (c, r) => c + ',' + r;
const feldAn = (c, r) => felder.get(schluessel(c, r)) || null;
let SPALTEN = 7, ZEILEN = 12;

/* Die Masse des Talprofils. `HANG > GEF` ist der Grund, warum die Flanken in
   die Sohle entwässern statt geradeaus: quer zur Achse fällt es steiler als
   talwärts.

   **Senkenfreiheit lässt sich damit NICHT erkaufen** — der erste Versuch hat
   es geglaubt und der Lauf zerfiel in Stücke. Der Grund ist die mäandernde
   Talachse: verschiebt sie sich je Zeile um δ Spalten, kostet ein Schritt
   talwärts `HANG·δ` und bringt nur `GEF` ein. Für δ bis 0,77 müsste GEF also
   grösser als 0,09 sein — ein Tal, das auf 47 Zeilen um vier Feldbreiten
   abfällt. Statt die Achse gerade zu biegen, werden die Pfannen GEFÜLLT
   (Priority-Flood, siehe `senkenFuellen`). Damit sind die Zahlen hier wieder
   frei für das Aussehen, und die Verbindung des Laufs hängt an einem
   Verfahren statt an gut geratenen Konstanten. */
const GEF = 0.020;        /* Gefälle je Zeile talwärts */
const HANG = 0.115;       /* Anstieg je Spalte quer zur Achse */
const MAXD = 6.2;         /* darüber hört die Flanke auf zu steigen */
const RAUSCH = 0.030;     /* Spannweite des Rauschens (also ±0.015) */
const STUFE = 0.105;      /* Terrassenhöhe — quantisiert wird nur die ANSICHT */
/* Die Schwelle ist in „Feldern oberhalb" gedacht: bei einem Dargebot von ~0.2
   je Feld braucht ein Bach rund vierzehn Felder Einzugsgebiet. Der erste
   Versuch übernahm die 0.8 aus `gewaesser-labor-v4` — dort steht sie auf einem
   viel grösseren Raster, hier machte sie 37 % der Karte zum Fluss und das Tal
   zerfiel in kurze Striche. Die Zahl ist also KEINE Konstante der Natur,
   sondern hängt an der Rasterweite. */
const JE = 0.2;           /* Dargebot je Feld (vor ?quelle) */
const THR = JE * 14;      /* ab dieser Menge trägt ein Feld Wasser */

/* Die Talachse je Zeile. Sie darf sich um WENIGER als eine Spalte je Zeile
   verschieben — sonst ist auf der Achse weder SE noch SW abwärts, und genau
   dort entstehen die Senken. Amplitude und Frequenz sind darauf gestimmt. */
function achseBei(rr) {
  return (SPALTEN - 1) / 2
       + Math.sin(rr * 0.18 + P.seed) * (SPALTEN * 0.11)
       + (rausch(0, rr, 77, 9) - 0.5) * SPALTEN * 0.07;
}
/* Abstand quer zur Achse in Feldbreiten. Die Zeilenparität kürzt sich weg,
   weil Feld und Achse dieselbe Zeile benutzen. */
const querAb = (cc, rr) => Math.abs(cc - achseBei(rr));
function elevBei(cc, rr) {
  return HANG * Math.min(querAb(cc, rr), MAXD)
       + GEF * (ZEILEN - 1 - rr)
       + RAUSCH * (rausch(cc, rr, 12, 4) - 0.5);
}

/* Ein Feld anlegen — Ecken, Unruhe, Terrassenhöhe. Gemeinsam für beide Karten. */
function feldAnlegen(cc, r, t, elev, d) {
  const u = P.unruhe / 100;
  const rf = rngFeld(cc, r, 1), m = mitteVon(cc, r);
  /* Terrassiert wird die ANSICHT, geflossen wird auf `elev`: die Stufen geben
     den Brettspiel-Blick, und an ihren Kanten entstehen die Wasserfälle von
     selbst — aber die Wegfindung braucht die stetige Höhe, sonst hat eine
     ganze Terrasse lauter gleich hohe Nachbarn und das Wasser weiss nicht wohin. */
  const basis = Math.round(elev / STUFE) * STUFE;
  const schrumpf = 1 - 0.012 - rf() * 0.020 * u;
  const hoehe = basis + (rf() - 0.5) * 0.055 * u;
  const eck = [], hoehen = [];
  for (let k = 0; k < 6; k++) {
    const j = 1 + (rf() - 0.5) * 0.05 * u;
    eck.push([ECKEN[k][0] * schrumpf * j + m.x, ECKEN[k][1] * schrumpf * j + m.z]);
    hoehen.push(hoehe + (rf() - 0.5) * 0.042 * u);
  }
  /* Der laufende Index ist der Schlüssel in die Wolkenfelder: die Klane halten
     ihr `w` als Float32Array, nicht als Map — je Runde läuft der Diffusions-
     schritt über JEDES Feld, und dort zählt der lineare Zugriff. */
  felder.set(schluessel(cc, r), {
    i:felder.size,
    c:cc, r, t, G:GELAENDE[t], s:Math.round(d), elev, x:m.x, z:m.z, eck, hoehen, hoehe,
    mitteH: hoehe + (rf() - 0.5) * 0.02 * u, schrumpf,
    ab:null, zu:[], q:0, wasser:null,
    requisit:null, sichtbar:true,
    gelVon:0, gelBis:0, bewVon:0, bewBis:0, wasVon:0, wasBis:0
  });
}

function talRechnen() {
  SPALTEN = P.breite;
  ZEILEN = Math.round(P.breite * 1.7);
  felder.clear();
  for (let r = 0; r < ZEILEN; r++)
    for (let cc = 0; cc < SPALTEN; cc++) {
      const d = querAb(cc, r);
      /* Der Umriss: die Talbreite atmet je Zeile, plus Rauschen. Nichts an
         einer gerechneten Karte verrät sie so schnell wie eine glatte Kante. */
      const breite = 4.2 + Math.sin(r * 0.15 + 1.3) * 1.6 + rausch(cc, r, 31, 6) * 4.4;
      if (d > breite) continue;
      const wald = rausch(cc, r, 12, 5);
      let t;
      if (d >= 6.5) t = 'h';
      else if (d >= 4.5) t = wald > 0.52 ? 'w' : 'f';
      else if (d < 1.1) t = wald > 0.66 ? 'g' : 's';
      else if (wald > 0.60) t = 'w';
      else if (wald < 0.34) t = 'G';
      else t = 'g';
      feldAnlegen(cc, r, t, elevBei(cc, r), d);
    }
  wasserRouten();
  /* Erst JETZT weiss die Karte, wo Wasser läuft — die Sohle darum nachträglich
     als Kiesbank ausweisen. Das ist die Alpenrhein-Lesart: der Fluss macht das
     Ufer, nicht umgekehrt. */
  for (const f of felder.values())
    if (f.wasser && f.s <= 2 && f.t !== 'h' && f.t !== 'f') { f.t = 's'; f.G = GELAENDE.s; }
}

/* Die Vorlage-Insel: Höhen wie gehabt von Hand, der Lauf wird als Kantenfolge
   EINGEPRÄGT statt geroutet. Damit läuft dieselbe Zeichnung über beide Karten
   — und beweist nebenbei, dass ein von Hand gelegter Lauf im neuen Modell
   genauso ausdrückbar ist wie ein gerechneter. */
function referenzRechnen() {
  SPALTEN = REFERENZ.spalten; ZEILEN = REFERENZ.zeilen.length;
  felder.clear();
  const basis = { g:0.42, G:0.40, w:0.44, f:0.46, h:0.92, s:0.30 };
  for (let r = 0; r < ZEILEN; r++)
    for (let cc = 0; cc < SPALTEN; cc++) {
      const t = REFERENZ.zeilen[r][cc];
      if (!t || t === '.' || !GELAENDE[t]) continue;
      feldAnlegen(cc, r, t, basis[t], t === 's' ? 0 : 2);
    }

}
const felderRechnen = () => (P.karte === 'referenz' ? referenzRechnen() : talRechnen());

/* ---------------------------------------------------------------------------
   Abfluss und Menge — das Herzstück.

   `ab` ist EINE Richtung je Feld (der steilste Nachbar). `zu` wird daraus
   ABGELEITET, nie geschrieben. Deshalb kann ein Lauf gar nicht mehr reissen:
   es gibt keine zweite Stelle, an der eine Kante behauptet werden könnte.
   --------------------------------------------------------------------------- */
/* Ein Minimalhaufen — für den Priority-Flood. Eine sortierte Einfügung täte es
   bei dieser Kartengrösse auch, aber der Haufen macht das Verfahren lesbar. */
class Halde {
  constructor() { this.a = []; }
  push(v) {
    const a = this.a; a.push(v);
    for (let i = a.length - 1; i > 0;) {
      const p = (i - 1) >> 1;
      if (a[p].e <= a[i].e) break;
      const t = a[p]; a[p] = a[i]; a[i] = t; i = p;
    }
  }
  pop() {
    const a = this.a, kopf = a[0], letzt = a.pop();
    if (a.length) {
      a[0] = letzt;
      for (let i = 0;;) {
        const l = 2*i + 1, r = l + 1; let m = i;
        if (l < a.length && a[l].e < a[m].e) m = l;
        if (r < a.length && a[r].e < a[m].e) m = r;
        if (m === i) break;
        const t = a[m]; a[m] = a[i]; a[i] = t; i = m;
      }
    }
    return kopf;
  }
  get anz() { return this.a.length; }
}

/* --------------------------------------------------------- Senken füllen ---
   Priority-Flood: von den Rändern her einwärts fluten, immer das TIEFSTE
   offene Feld zuerst. Jedes erreichte Feld bekommt
       fill = max(eigene Höhe, fill des Erreichers + ε)
   und ist damit garantiert höher als der Weg, über den es erreicht wurde.
   Daraus folgt genau die Eigenschaft, an der es vorher fehlte: **jedes Feld
   hat einen echt tieferen Nachbarn** (nämlich den Erreicher), also endet kein
   Lauf mehr im Nichts. Wo `fill > elev` lag eine Pfanne — das ist ein
   aufgestauter Boden, künftig der Ort für einen See.
   --------------------------------------------------------------------------- */
function senkenFuellen() {
  const EPS = 1e-4;
  const h = new Halde(), drin = new Set();
  for (const f of felder.values()) {
    f.fill = Infinity; f.randDir = null; f.senke = false;
    /* Randfeld = hat einen fehlenden Nachbarn. Dort verlässt das Wasser die
       Karte. Auch die hohen Flanken sind Randfelder — sie werden nur spät
       gepoppt, darum flutet das Tal vom TIEFSTEN Rand her, und das ist der
       Südsaum. Kein Sonderfall nötig. */
    const fehlt = SOT.hex.neighbors(f.c, f.r).filter(n => !feldAn(n.c, n.r));
    if (fehlt.length) {
      f.fill = f.elev;
      f.randDir = fehlt[0].dir;
      drin.add(f); h.push({ f, e:f.fill });
    }
  }
  while (h.anz) {
    const f = h.pop().f;
    for (const n of SOT.hex.neighbors(f.c, f.r)) {
      const g = feldAn(n.c, n.r);
      if (!g || drin.has(g)) continue;
      g.fill = Math.max(g.elev, f.fill + EPS);
      g.senke = g.fill > g.elev + EPS * 0.5;
      drin.add(g); h.push({ f:g, e:g.fill });
    }
  }
}

function wasserRouten() {
  senkenFuellen();
  const liste = [...felder.values()];
  for (const f of liste) {
    f.q = 0; f.zu = []; f.wasser = null;
    if (f.randDir) { f.ab = { rand:true, dir:f.randDir }; continue; }
    /* Auf der GEFÜLLTEN Höhe absteigen, nicht auf der rohen — nur dort ist ein
       tieferer Nachbar garantiert. */
    let best = null, bh = f.fill;
    for (const n of SOT.hex.neighbors(f.c, f.r)) {
      const g = feldAn(n.c, n.r);
      if (g && g.fill < bh) { bh = g.fill; best = n; }
    }
    f.ab = best;
  }
  /* Von oben nach unten abarbeiten, dann ist jedes Feld fertig, bevor sein
     Abfluss es braucht — dieselbe Reihenfolge wie in gewaesser-labor-v4. */
  liste.sort((a, b) => b.fill - a.fill);
  const je = JE * (P.quelle / 100);
  for (const f of liste) {
    /* Etwas mehr Dargebot auf den Höhen (orografisch) — das ist der Grund,
       warum Seitenbäche überhaupt aus den Flanken kommen und nicht nur aus
       der Sohle. */
    f.q += je * (0.75 + 0.5 * Math.min(1, f.s / 6));
    const z = f.ab && !f.ab.rand ? feldAn(f.ab.c, f.ab.r) : null;
    if (z) z.q += f.q;
  }
  wasserAusPruegen();
}

/* Aus Menge + Abfluss die Wasser-Eigenschaft je Feld bauen. */
function wasserAusPruegen() {
  const traegt = f => f.q >= THR && f.ab;
  for (const f of felder.values()) {
    if (!traegt(f)) continue;
    f.wasser = { ab:f.ab.dir, zu:[], q:f.q, kl:wklasse(f.q), rand:!!f.ab.rand, faelle:{} };
  }
  /* Zufluss ableiten: meine Zuflusskanten sind die Nachbarn, deren Abfluss
     auf mich zeigt. Nur hier — es gibt keine zweite Quelle dieser Wahrheit. */
  for (const f of felder.values()) {
    if (!f.wasser) continue;
    for (const n of SOT.hex.neighbors(f.c, f.r)) {
      const g = feldAn(n.c, n.r);
      if (g && g.wasser && !g.wasser.rand && g.ab.c === f.c && g.ab.r === f.r)
        f.wasser.zu.push({ dir:n.dir, q:g.q });
    }
  }
  faelleFinden();
}

/* Ein Lauf von Hand: Feldfolge → Kantenfolge. Die Menge wächst talwärts. */
function wasserEinpraegen(pfad) {
  for (const f of felder.values()) { f.ab = null; f.q = 0; f.zu = []; f.wasser = null; }
  for (let i = 0; i < pfad.length; i++) {
    const f = feldAn(pfad[i][0], pfad[i][1]); if (!f) continue;
    f.q = THR * (1.05 + i * 0.55);
    const nx = pfad[i + 1] && feldAn(pfad[i + 1][0], pfad[i + 1][1]);
    if (nx) {
      const n = SOT.hex.neighbors(f.c, f.r).find(n => n.c === nx.c && n.r === nx.r);
      f.ab = n ? { c:nx.c, r:nx.r, dir:n.dir } : null;
    } else f.ab = { rand:true, dir:(f.r & 1) ? 'SE' : 'SW' };
  }
  wasserAusPruegen();
}

/* Wasserfälle sind jetzt eine Eigenschaft der KANTE, nicht eine Feldsorte:
   fällt die Ansichtshöhe über eine Wasserkante zu stark, stürzt es dort.
   Damit sitzen sie automatisch an den Terrassenkanten — gefunden, nicht
   gesetzt. Kleinere Stufen geben Stromschnellen. */
const FALL_AB = 0.16, SCHNELLE_AB = 0.055;
function faelleFinden() {
  for (const f of felder.values()) {
    if (!f.wasser) continue;
    const z = f.ab && !f.ab.rand ? feldAn(f.ab.c, f.ab.r) : null;
    const drop = z ? f.hoehe - z.hoehe : 1.2;      /* über den Rand: voller Sturz */
    f.wasser.faelle[f.wasser.ab] =
      drop >= FALL_AB ? 'fall' : (drop >= SCHNELLE_AB ? 'schnelle' : null);
    f.wasser.drop = drop;
  }
}

/* Höhe der (welligen) Oberfläche an einem Punkt im Feld — damit Bäume und
   Steine wirklich AUF der Fläche stehen und nicht in ihr schweben. */
function hoeheAn(f, lx, lz) {
  /* Ecke k liegt bei −(k·60°+90°), darum der Sektor über den NEGATIVEN Winkel.
     Die 6π sind nur, um positiv zu bleiben — ein Vielfaches von 2π und damit
     von sechs Sektoren, sie verschieben also nichts. */
  const a = Math.atan2(lz, lx);
  const s = (-a - Math.PI / 2 + Math.PI * 6) / (Math.PI / 3);
  const k = ((Math.floor(s) % 6) + 6) % 6, tt = s - Math.floor(s);
  const d = Math.min(1, Math.hypot(lx, lz) / RAD);
  const rand = f.hoehen[k] * (1 - tt) + f.hoehen[(k + 1) % 6] * tt;
  return f.mitteH * (1 - d) + rand * d;
}

/* ============================================================================
   6 · Zwei Klane — Leute, Kultur, und die Wolke des Ungesehenen

   Ein Klan ist hier drei Dinge in einem: zwei Leute mit Sicht und Tempo, eine
   Kultur (das Vergessenstempo), und ein eigenes Wolkenfeld über der Karte.
   Das Wolkenfeld gehört dem KLAN, nicht dem Feld — dasselbe Stück Tal liegt
   für den einen unter dichter Wolke und ist dem anderen vertraut. Genau das
   ist der Punkt: es gibt keine Karte, es gibt zwei Karten.

   `zeile` ist die Lage im Tal als Anteil: 0 = Talkopf (oben, hoch, jung),
   1 = Mündung (unten, breit, wasserreich).
   ========================================================================= */
const KLANE = [
  { id:'oben',  name:'Die vom Oberlauf',  kurz:'Oberlauf', ort:'am Talkopf',
    zeile:0.22, pK:'okultur', kultur:4 },
  { id:'unten', name:'Die von der Mündung', kurz:'Mündung', ort:'am Talausgang',
    zeile:0.80, pK:'ukultur', kultur:1 }
];
const LEUTE = [
  { id:'o-jaeger',    klan:'oben',  rolle:'jaeger',    name:'Jäger',     icon:'jaeger',    c:0, r:0, sicht:5, tempo:4, pS:'ojsicht', pT:'ojtempo' },
  { id:'o-sammlerin', klan:'oben',  rolle:'sammlerin', name:'Sammlerin', icon:'sammlerin', c:0, r:0, sicht:3, tempo:2, pS:'ossicht', pT:'ostempo' },
  { id:'u-jaeger',    klan:'unten', rolle:'jaeger',    name:'Jäger',     icon:'jaeger',    c:0, r:0, sicht:5, tempo:4, pS:'ujsicht', pT:'ujtempo' },
  { id:'u-sammlerin', klan:'unten', rolle:'sammlerin', name:'Sammlerin', icon:'sammlerin', c:0, r:0, sicht:3, tempo:2, pS:'ussicht', pT:'ustempo' }
];
let amZug = 0, runde = 1;
const aktiv = () => KLANE[amZug];
const klanVon = id => KLANE.find(K => K.id === id);
const leuteVon = id => LEUTE.filter(L => L.klan === id);
let gewaehlteEinheit = null;
let sichtbareFelder = new Set(), erreichbar = new Set();
let reichBox = null;
let feuerStellen = {};

/* Die Wolkenfelder anlegen — je Klan zwei Puffer, weil der Diffusionsschritt
   GLEICHZEITIG sein muss: läse er aus demselben Feld, in das er schreibt,
   liefe die Front in Iterationsrichtung schneller als quer dazu, und aus der
   runden Front würde eine schräge Welle. */
function wolkenAnlegen(frisch) {
  const n = felder.size;
  for (const K of KLANE) {
    if (!frisch && K.wolke && K.wolke.length === n) continue;
    K.wolke = new Float32Array(n).fill(1);
    K.puffer = new Float32Array(n);
    K.sicht = new Set(); K.reich = new Set();
  }
}

/* Die Leute stehen am Wasser, nicht irgendwo: jeder Klan sucht den grössten
   Lauf auf SEINER Höhe des Tals — über die Abflussmenge, nicht über eine
   Feldliste. */
function leuteSetzen() {
  feuerStellen = {};
  const belegt = [];
  for (const K of KLANE) {
    K.kultur = P[K.pK];
    const zielZeile = Math.round(ZEILEN * K.zeile);
    let anker = null, best = -Infinity;
    for (const f of felder.values()) {
      if (!f.wasser) continue;
      /* Die Zeilenstrafe muss STÄRKER wiegen als der Mengenzuwachs talwärts
         (~2.5 je Zeile), sonst gewinnt immer die Mündung — und für den Klan
         am Oberlauf wäre das die falsche Hälfte des Tals. */
      const punkt = f.wasser.q - Math.abs(f.r - zielZeile) * 8;
      if (punkt > best) { best = punkt; anker = f; }
    }
    if (!anker) anker = felder.values().next().value;
    if (!anker) return;
    K.anker = anker;
    const frei = () => SOT.hex.disc(anker.c, anker.r, 3)
      .map(q => feldAn(q.c, q.r))
      .filter(f => f && !f.wasser && !belegt.some(w => w.c === f.c && w.r === f.r));
    for (const L of leuteVon(K.id)) {
      L.sicht = P[L.pS]; L.tempo = P[L.pT];
      const f = frei()[0] || anker;
      L.c = f.c; L.r = f.r; belegt.push({ c:f.c, r:f.r });
    }
    /* Lagerfeuer und Zelt gehören zu den Leuten — Komposition, nicht Zufall.
       Jeder Klan bekommt sein eigenes Lager; die Glut trägt den Klan mit,
       damit nachher das RICHTIGE Feuer das Punktlicht bekommt. */
    const lager = frei();
    if (lager[0]) { lager[0].requisit = { art:'feuer', klan:K.id }; belegt.push({ c:lager[0].c, r:lager[0].r }); }
    if (lager[1]) { lager[1].requisit = { art:'zelt',  klan:K.id }; belegt.push({ c:lager[1].c, r:lager[1].r }); }
    for (const L of leuteVon(K.id)) {
      const f = feldAn(L.c, L.r);
      if (f) f.requisit = { art:'person', wer:L.rolle, klan:K.id };
    }
  }
}

/* Sicht und Reichweite als Feldmengen, JE KLAN. Beides über `SOT.hex.disc` —
   dieselbe Kubusrechnung wie das Spiel, nicht eine zweite Wahrheit fürs Bild.
   Was in Sicht ist, ist gesehen: die Wolke weicht dort SOFORT und ganz. Das
   ist die Retraktion — sie ist augenblicklich, nur das Vergessen ist langsam. */
function sichtRechnen() {
  for (const K of KLANE) {
    K.kultur = P[K.pK];
    K.sicht = new Set(); K.reich = new Set();
    for (const L of leuteVon(K.id)) {
      L.sicht = P[L.pS]; L.tempo = P[L.pT];
      for (const q of SOT.hex.disc(L.c, L.r, L.sicht)) {
        const k = schluessel(q.c, q.r); if (felder.has(k)) K.sicht.add(k);
      }
      for (const q of SOT.hex.disc(L.c, L.r, L.tempo)) {
        const k = schluessel(q.c, q.r); if (felder.has(k)) K.reich.add(k);
      }
    }
    if (K.wolke) for (const k of K.sicht) { const f = felder.get(k); if (f) K.wolke[f.i] = 0; }
  }
  sichtbareFelder = aktiv().sicht;
  erreichbar = aktiv().reich;
  /* Die Schiebegrenze ist das umschliessende Rechteck des Erreichbaren, nicht
     die Feldmenge selbst: an einer gezackten Kante zu klemmen fühlt sich
     kaputt an, an einem Rechteck nach Grenze. */
  let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (const k of erreichbar) {
    const f = felder.get(k); if (!f) continue;
    x0 = Math.min(x0, f.x); x1 = Math.max(x1, f.x);
    z0 = Math.min(z0, f.z); z1 = Math.max(z1, f.z);
  }
  reichBox = isFinite(x0) ? { x0:x0 - W, x1:x1 + W, z0:z0 - H * 0.75, z1:z1 + H * 0.75 } : null;
}

/* ----------------------------------------------------------- Die Front ------
   EIN Diffusionsschritt = eine Runde dieses Klans.

       w'(f) = 0                                       f in Sicht
       w'(f) = w(f) + VOLL/Kultur                      ein Nachbar drückt (≥ VOLL)
       w'(f) = w(f)                                    sonst

   Zwei Dinge machen daraus eine Front und nicht ein Ausbleichen:

   **Die Schwelle.** Ein Feld drückt erst, wenn es SELBST voll ist. Damit
   braucht ein leeres Feld neben voller Wolke genau `Kultur` Runden, bis es
   die Schwelle erreicht — und erst dann fängt das nächste an. Die Kante
   wandert also mit exakt `1/Kultur` Feldern je Runde.

   Der erste Versuch deckelte stattdessen auf den dichtesten Nachbarn
   (`min(max(Nachbarn), w + Rate)`). Das war falsch, und zwar auf eine Art,
   die man erst beim Zählen sieht: die Deckelung begrenzt die HÖHE, nicht den
   BEGINN. Ein Feld fing schon an zu steigen, sobald sein Nachbar den ersten
   Bruchteil hatte — die Rampe lief mit einem Feld je Runde los, unabhängig
   von der Kultur, und nur die Steilheit hing an ihr. Bei Kultur 4 frass die
   Front in acht Runden nicht zwei Felder, sondern fünf.

   **Die Rate.** `VOLL/Kultur` statt `1/Kultur`: gemessen wird die Front an
   der Schwelle VOLL, nicht an der 1. So stimmt die Ansage der Klankarte
   („1 Feld je N Runden") mit dem überein, was man sieht. Über die Schwelle
   hinaus steigt ein Feld weiter bis 1 — daher ist die Rampe rund ein Feld
   breit und die Front hat eine weiche Schulter statt einer Kante.

   Der Rand der Karte drückt NICHT: dort ist nichts unbekannt, sondern nichts.
   Ohne diese Regel frässe sich die Front vom Papierrand her ins Tal.

   `wirbel` streut das Tempo je Feld um ±30 %. Eine mathematisch exakte Front
   ist ein sauberer Ring — und ein sauberer Ring liest sich als Zirkel, nicht
   als Wetter. Die Streuung ist fest je Feld (aus der Saat), damit zwei
   Bildschirmfotos desselben Standes gleich aussehen. */
function frontSchieben(K) {
  if (!K.wolke) return;
  const rate = NEBEL_VOLL / Math.max(1, K.kultur);
  const alt = K.wolke, neu = K.puffer;
  neu.set(alt);
  for (const f of felders()) {
    if (K.sicht.has(schluessel(f.c, f.r))) { neu[f.i] = 0; continue; }
    if (alt[f.i] >= 1) continue;
    let drueckt = false;
    for (const n of SOT.hex.neighbors(f.c, f.r)) {
      const g = feldAn(n.c, n.r);
      if (g && alt[g.i] >= NEBEL_VOLL) { drueckt = true; break; }
    }
    if (!drueckt) continue;
    const wirbel = 0.70 + rausch(f.c, f.r, 4242, 3) * 0.60;
    neu[f.i] = Math.min(1, alt[f.i] + rate * wirbel);
  }
  K.wolke = neu; K.puffer = alt;
}

/* Der Dreiklang in Zahlen — die Klankarte und das Messblatt lesen ihn. */
function frontZaehlen(K) {
  let sicht = 0, erinnert = 0, wolke = 0;
  for (const f of felders()) {
    if (K.sicht.has(schluessel(f.c, f.r))) sicht++;
    else if (K.wolke[f.i] >= NEBEL_VOLL) wolke++;
    else erinnert++;
  }
  return { sicht, erinnert, wolke };
}

/* ============================================================================
   7 · Die Kacheln
   ========================================================================= */
function kachelnBauen(bau) {
  const ao = P.ao / 100;
  for (const f of felder.values()) {
    const rnd = rngFeld(f.c, f.r, 2);
    const listeOben = { gras:PAL.gras, wiese:PAL.wiese, wald:PAL.wald, hoch:PAL.hoch,
                        sand:PAL.sand, kies:PAL.kies }[f.G.oben];
    /* Kontakt: eine Kante, hinter der es HÖHER weitergeht, verschattet ihre
       zwei Ecken. Das ist der Ersatz für SSAO — billig und steuerbar. */
    const dunkel = [1,1,1,1,1,1];
    for (const n of SOT.hex.neighbors(f.c, f.r)) {
      const g = feldAn(n.c, n.r); if (!g) continue;
      const kante = KANTE_VON_DIR[n.dir];
      const d = g.hoehe - f.hoehe;
      if (d > 0.05) {
        const sv = 1 - Math.min(0.34, d * 0.42) * ao;
        dunkel[kante] = Math.min(dunkel[kante], sv);
        dunkel[(kante + 1) % 6] = Math.min(dunkel[(kante + 1) % 6], sv);
      }
    }

    /* Fase: die Deckfläche sitzt auf einem eingezogenen Ring, der Ring fällt
       ein Stück ab. Ein Segment genügt — der Grat fängt das Licht. */
    const FASE = 0.11, FALL = 0.035;
    const innen = f.eck.map(([x, z], k) => {
      const dx = x - f.x, dz = z - f.z;
      return [f.x + dx * (1 - FASE), f.hoehen[k], f.z + dz * (1 - FASE)];
    });
    const aussen = f.eck.map(([x, z], k) => [x, f.hoehen[k] - FALL, z]);

    /* Das Ufer: die zwei Ecken einer Wasserkante ziehen zum Kies. Damit macht
       der Fluss sein Ufer selbst — genau der Grund, warum „Kiesbank" keine
       eigene Feldsorte mehr sein muss. */
    const ufer = [0,0,0,0,0,0];
    if (f.wasser) {
      const kanten = [f.wasser.ab].concat(f.wasser.zu.map(z => z.dir));
      for (const dir of kanten) {
        const ka = KANTE_VON_DIR[dir];
        if (ka === undefined) continue;
        ufer[ka] = Math.max(ufer[ka], 0.55);
        ufer[(ka + 1) % 6] = Math.max(ufer[(ka + 1) % 6], 0.55);
      }
    }
    const fOben = innen.map((_, k) => {
      const c = ton(listeOben, rnd, 0.45);
      if (ufer[k]) c.lerp(PAL.kies[1], ufer[k]);
      return dunkler(c, dunkel[k]);
    });
    const fMitte = ton(listeOben, rnd, 0.3);
    if (f.wasser) fMitte.lerp(PAL.kies[1], 0.35);
    const mitte = [f.x, f.mitteH, f.z];
    f.gelVon = bau.anz;

    for (let k = 0; k < 6; k++) {
      const k2 = (k + 1) % 6;
      bau.dreieck(mitte, innen[k], innen[k2], fMitte, fOben[k], fOben[k2]);
    }
    for (let k = 0; k < 6; k++) {
      const k2 = (k + 1) % 6;
      bau.viereck(innen[k], aussen[k], aussen[k2], innen[k2],
        dunkler(fOben[k], 0.93), dunkler(fOben[k], 0.8),
        dunkler(fOben[k2], 0.8), dunkler(fOben[k2], 0.93));
    }
    /* Flanke in zwei Bändern — das mittlere darf Gestein zeigen. */
    const stein = f.G.flanke === 'fels';
    /* Die OBERE Flanke bleibt Gras, auch bei Gestein — sonst hat die Hochebene
       einen grauen Kragen direkt unter ihrer grünen Decke. */
    const oben = stein ? PAL.flanke.gras : (PAL.flanke[f.G.flanke] || PAL.flanke.gras);
    const yTeil = 0.52;
    for (let k = 0; k < 6; k++) {
      const k2 = (k + 1) % 6;
      const yT1 = aussen[k][1], yT2 = aussen[k2][1];
      const yM1 = UNTEN + (yT1 - UNTEN) * yTeil, yM2 = UNTEN + (yT2 - UNTEN) * yTeil;
      /* Das Gestein ist ein ANFLUG in der Erde, keine Betonwand: mit fast
         reinem Grau lasen die Hochebene und die felsigen Kacheln wie gegossene
         Blöcke — und dasselbe Grau blitzte durch jede Kachelnaht. */
      const cMitte = stein
        ? PAL.erde.clone().lerp(PAL.strata, 0.20 + rnd() * 0.22)
        : PAL.erde.clone().lerp(oben, 0.18);
      const s1 = 1 - 0.16 * ao, s2 = 1 - 0.46 * ao;
      bau.viereck([aussen[k][0],yT1,aussen[k][2]], [aussen[k][0],yM1,aussen[k][2]],
                  [aussen[k2][0],yM2,aussen[k2][2]], [aussen[k2][0],yT2,aussen[k2][2]],
                  dunkler(oben, dunkel[k]), dunkler(cMitte, s1),
                  dunkler(cMitte, s1), dunkler(oben, dunkel[k2]));
      bau.viereck([aussen[k][0],yM1,aussen[k][2]], [aussen[k][0],UNTEN,aussen[k][2]],
                  [aussen[k2][0],UNTEN,aussen[k2][2]], [aussen[k2][0],yM2,aussen[k2][2]],
                  dunkler(cMitte, s1), dunkler(PAL.erdeTief, s2),
                  dunkler(PAL.erdeTief, s2), dunkler(cMitte, s1));
    }
    /* Boden — nie zu sehen, aber ohne ihn klafft die Platte beim flachen Blick. */
    const bodenF = dunkler(PAL.erdeTief, 1 - 0.5 * ao);
    for (let k = 1; k < 5; k++)
      bau.dreieck([f.eck[0][0],UNTEN,f.eck[0][1]], [f.eck[k+1][0],UNTEN,f.eck[k+1][1]],
                  [f.eck[k][0],UNTEN,f.eck[k][1]], bodenF, bodenF, bodenF);
    f.gelBis = bau.anz;
  }
}

/* ============================================================================
   8 · Das Wasser — je Feld gebaut, an den Kantenmitten verknüpft

   Die Baueinheit ist die SPEICHE: ein Band von einem Port (Kantenmitte) zum
   Durchgangspunkt des Feldes. Ein Feld gibt eine Speiche je Wasserkante aus.
   Damit gilt derselbe Code für alles:

       zwei Kanten  → EINE glatte Kurve Port → Port (der Regelfall)
       drei+        → Speichen + kleiner Teich in der Mitte (Zusammenfluss)
       eine         → Quelle bzw. Mündung
       Rand         → Sturz aus der Karte

   **Warum das nicht an jeder Feldgrenze knickt:** der Port liegt genau auf der
   Mitte zwischen zwei Feldmitten, und die Kante eines Sechsecks steht senkrecht
   auf der Verbindung ihrer beiden Feldmitten. Setzt man die Tangente am Port
   auf DIESE Verbindungsrichtung, dann kommen beide Nachbarn mit derselben
   Tangentenrichtung an — die Naht ist glatt, obwohl jedes Feld für sich
   gerechnet hat. Ohne den Griff sieht man jede Feldgrenze als Knick.

   Der Port braucht darum auch keine Registratur: er ist eine reine Funktion
   der beiden Feldmitten, und beide Seiten rechnen dasselbe. (Die Ecken der
   Kacheln taugen dafür NICHT — die sind je Feld einzeln geschrumpft und
   verzogen, die beiden Nachbarn wären sich über die Kantenmitte nicht einig.)
   ========================================================================= */
const BAHNEN = [
  { u:-1.00, f:'wasserTief' }, { u:-0.52, f:'wasser' },
  { u:-0.12, f:'wasserGlanz' }, { u:0.42, f:'wasser' }, { u:1.00, f:'wasserTief' }
];
const WLIFT = 0.020;      /* das Wasser liegt AUF dem Gelände, nicht darin */

/* Der Port zwischen f und dem Nachbarn in Richtung dir. Höhe ist das Mittel
   der beiden Ansichtshöhen — dadurch neigt sich das Band im Gefälle und die
   beiden Seiten treffen sich auf demselben Wert. */
function port(f, dir) {
  const n = SOT.hex.neighbor(f.c, f.r, dir);
  const g = feldAn(n.c, n.r);
  const m = mitteVon(n.c, n.r);
  const gx = g ? g.x : m.x, gz = g ? g.z : m.z;
  const gh = g ? g.hoehe : f.hoehe - 0.9;          /* über den Rand: es fällt */
  return {
    x:(f.x + gx) / 2, z:(f.z + gz) / 2,
    y:(f.hoehe + gh) / 2 + WLIFT,
    /* Einwärts-Richtung = von der Nachbarmitte zur eigenen Mitte. Senkrecht
       zur Kante, und für beide Nachbarn dieselbe Gerade. */
    ix:f.x - gx, iz:f.z - gz,
    nachbar:g
  };
}
function normiert(v) {
  const l = Math.hypot(v.ix, v.iz) || 1;
  return { x:v.ix / l, z:v.iz / l };
}

/* Ein Band einer Kurve folgen: fünf Bahnen quer, Breite von wA nach wB.
   Schreibt in einen eigenen kleinen Puffer, den `wasserBauen` verschmilzt. */
function bandLegen(B, kurve, wA, wB, segmente) {
  const L = BAHNEN.length, basis = B.pos.length / 3;
  const p = new THREE.Vector3(), t = new THREE.Vector3();
  for (let i = 0; i <= segmente; i++) {
    const s = i / segmente;
    kurve.getPoint(s, p); kurve.getTangent(s, t);
    /* Querachse aus der Tangente. Bei senkrechter Tangente (Sturz) fällt das
       Kreuzprodukt zusammen — dann die letzte gute Achse behalten. */
    let sx = t.z, sz = -t.x;
    const l = Math.hypot(sx, sz);
    if (l < 1e-4) { sx = B.letzteX; sz = B.letzteZ; } else { sx /= l; sz /= l; B.letzteX = sx; B.letzteZ = sz; }
    const halb = wA + (wB - wA) * s;
    for (let j = 0; j < L; j++) {
      const b = BAHNEN[j];
      B.pos.push(p.x + sx * halb * b.u, p.y, p.z + sz * halb * b.u);
      const c = PAL[b.f];
      B.col.push(c.r, c.g, c.b);
      /* v läuft ECHT stromabwärts — die Wellen wissen jetzt, wohin. */
      B.flu.push((b.u + 1) / 2, B.laufend + s * segmente * 0.9);
    }
  }
  B.laufend += segmente * 0.9;
  /* Umlauf so, dass die Oberseite nach oben zeigt: die Querachse ist t×auf und
     damit nach links. computeVertexNormals() folgt dem Umlauf — falsch
     gewickelt wäre das Wasser von unten beleuchtet und stumpf dunkel. */
  for (let i = 0; i < segmente; i++)
    for (let j = 0; j < L - 1; j++) {
      const a = basis + i*L + j, b = a + 1, c2 = basis + (i+1)*L + j, d = c2 + 1;
      B.idx.push(a, b, c2, b, d, c2);
    }
}

/* Der Durchgangspunkt: die Feldmitte, seitlich ausgelenkt. Das ist der Mäander
   — ohne ihn läuft das Wasser von Kantenmitte zu Kantenmitte und die Karte
   sieht gestrickt aus. Auslenkung quer zur Verbindung der beiden Ports. */
function durchgangspunkt(f, pa, pb) {
  const y = f.hoehe + WLIFT;
  if (!pa || !pb) return new THREE.Vector3(f.x, y, f.z);
  let dx = pb.x - pa.x, dz = pb.z - pa.z;
  const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
  const amp = (rngFeld(f.c, f.r, 9)() - 0.5) * INKREIS * 0.55 * (P.maeander / 100);
  return new THREE.Vector3(f.x - dz * amp, y, f.z + dx * amp);
}

function wasserBauen(bau) {
  const B = { pos:[], col:[], flu:[], idx:[], laufend:0, letzteX:1, letzteZ:0 };
  const halbVon = q => W * wklasse(q).halb;
  for (const f of felder.values()) {
    f.wasVon = B.idx.length / 3;
    const wa = f.wasser;
    if (!wa) { f.wasBis = f.wasVon; continue; }

    const kanten = [{ dir:wa.ab, q:wa.q, aus:true }]
      .concat(wa.zu.map(z => ({ dir:z.dir, q:z.q, aus:false })));
    const ports = kanten.map(k => ({ k, p:port(f, k.dir) }));
    const mitteQ = wa.q;

    if (ports.length === 2) {
      /* Der Regelfall: EINE Kurve von Port zu Port. Die Tangenten an den Ports
         stehen auf der Feldmitten-Verbindung — darum passt sie zum Nachbarn. */
      const zu = ports.find(o => !o.k.aus) || ports[0];
      const ab = ports.find(o => o.k.aus) || ports[1];
      const dg = durchgangspunkt(f, zu.p, ab.p);
      const nA = normiert(zu.p), nB = normiert(ab.p);
      const k = INKREIS * 0.62;
      const kurve = new THREE.CubicBezierCurve3(
        new THREE.Vector3(zu.p.x, zu.p.y, zu.p.z),
        new THREE.Vector3(zu.p.x + nA.x * k + (dg.x - f.x), dg.y, zu.p.z + nA.z * k + (dg.z - f.z)),
        new THREE.Vector3(ab.p.x + nB.x * k + (dg.x - f.x), dg.y, ab.p.z + nB.z * k + (dg.z - f.z)),
        new THREE.Vector3(ab.p.x, ab.p.y, ab.p.z));
      bandLegen(B, kurve, halbVon(zu.k.q), halbVon(ab.k.q), 6);
    } else {
      /* Quelle, Mündung oder Zusammenfluss: je Kante eine Speiche zur Mitte. */
      const dg = durchgangspunkt(f, ports[0] && ports[0].p, ports[1] && ports[1].p);
      for (const o of ports) {
        const n = normiert(o.p), k = INKREIS * 0.55;
        const kurve = new THREE.QuadraticBezierCurve3(
          new THREE.Vector3(o.p.x, o.p.y, o.p.z),
          new THREE.Vector3(o.p.x + n.x * k, (o.p.y + dg.y) / 2, o.p.z + n.z * k),
          dg);
        const wPort = halbVon(o.k.q), wMitte = halbVon(mitteQ);
        bandLegen(B, kurve, o.k.aus ? wMitte : wPort, o.k.aus ? wPort : wMitte, 4);
      }
      /* Ein kleiner Teich an der Nahtstelle, sonst klaffen die Speichen. */
      if (ports.length >= 3) {
        const rr = halbVon(mitteQ) * 1.15, L = BAHNEN.length, basis = B.pos.length / 3;
        for (let i = 0; i <= 8; i++) {
          const a = i / 8 * Math.PI * 2;
          for (let j = 0; j < L; j++) {
            const t2 = Math.abs(BAHNEN[j].u);
            B.pos.push(dg.x + Math.cos(-a) * rr * t2, dg.y, dg.z + Math.sin(-a) * rr * t2);
            const c = PAL[BAHNEN[j].f]; B.col.push(c.r, c.g, c.b);
            B.flu.push(t2, B.laufend);
          }
        }
        for (let i = 0; i < 8; i++)
          for (let j = 0; j < L - 1; j++) {
            const a = basis + i*L + j, b = a + 1, c2 = basis + (i+1)*L + j, d = c2 + 1;
            B.idx.push(a, b, c2, b, d, c2);
          }
      }
    }

    /* Stürze und Schnellen: eine Eigenschaft der KANTE. Der Vorhang steht am
       Port und verdeckt das durchlaufende Band — Wasser geht über die Lippe. */
    const art = wa.faelle[wa.ab];
    if (art) {
      const p = port(f, wa.ab), n = normiert(p);
      const zNb = p.nachbar;
      const unten = zNb ? zNb.hoehe + WLIFT : UNTEN - 1.15;
      const halb = halbVon(wa.q);
      /* quer zur Einwärtsrichtung = entlang der Kante */
      const qx = -n.z, qz = n.x;
      const oben = p.y + 0.012;
      if (art === 'fall') {
        const cO = PAL.wasser, cU = PAL.wasserGlanz.clone().lerp(PAL.schaum, 0.45);
        bau.blatt([p.x + qx*halb, oben, p.z + qz*halb], [p.x + qx*halb, unten, p.z + qz*halb],
                  [p.x - qx*halb, unten, p.z - qz*halb], [p.x - qx*halb, oben, p.z - qz*halb],
                  cO, cU, cU, cO);
        for (const u of [-0.5, 0.05, 0.55]) {
          const b = halb * 0.16, x = p.x + qx*halb*u - n.x*0.012, z = p.z + qz*halb*u - n.z*0.012;
          bau.blatt([x + qx*b, oben, z + qz*b], [x + qx*b, unten + 0.06, z + qz*b],
                    [x - qx*b, unten + 0.06, z - qz*b], [x - qx*b, oben, z - qz*b],
                    dunkler(PAL.schaum, 0.8), PAL.schaum, PAL.schaum, dunkler(PAL.schaum, 0.8));
        }
        const rnd = rngFeld(f.c, f.r, 991);
        for (let i = 0; i < 3; i++) {
          const s = halb * (0.5 + i * 0.28);
          bau.form(steinRoh(rnd), M()
            .makeTranslation(p.x - n.x*0.10 + (rnd()-0.5)*0.12, unten + 0.03 + i*0.045,
                             p.z - n.z*0.10 + (rnd()-0.5)*0.12)
            .multiply(M().makeScale(s, s * 0.30, s)),
            () => PAL.schaum.clone().lerp(PAL.wasserGlanz, i * 0.25));
        }
      } else {
        /* Stromschnelle: nur Schaumtupfen auf der Stufe. */
        const rnd = rngFeld(f.c, f.r, 77);
        for (let i = 0; i < 3; i++) {
          const s = halb * (0.22 + rnd() * 0.20);
          bau.form(steinRoh(rnd), M()
            .makeTranslation(p.x + qx*halb*(rnd()-0.5)*1.4, (oben + unten)/2 + 0.01,
                             p.z + qz*halb*(rnd()-0.5)*1.4)
            .multiply(M().makeScale(s, s * 0.35, s)),
            () => PAL.schaum.clone().lerp(PAL.wasserGlanz, 0.35));
        }
      }
    }
    f.wasBis = B.idx.length / 3;
  }

  if (!B.idx.length) return null;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(B.pos, 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(B.col, 3));
  /* Eigener Name, NICHT `uv`: das Standardmaterial deklariert `attribute vec2
     uv` nur, wenn eine Textur im Spiel ist — ohne Karte wäre `uv` im Shader
     unbekannt und das Programm liesse sich nicht übersetzen. */
  g.setAttribute('aFluss',   new THREE.Float32BufferAttribute(B.flu, 2));
  /* Nebel je Ecke — wird beim Umschalten der Sicht beschrieben. */
  g.setAttribute('aNebel',   new THREE.Float32BufferAttribute(new Float32Array(B.pos.length / 3), 1));
  g.setIndex(B.idx);
  g.computeVertexNormals();          /* Wasser ist glatt — die Ausnahme */
  return g;
}

/* ============================================================================
   9 · Bewuchs, Fels, Requisiten, Leute

   Alle Formen sind absichtlich UNSYMMETRISCH. Ein mathematisch perfekter Kegel
   liest sich als Kegel; ein schiefer liest sich als Baum.
   ========================================================================= */
function kegelRoh(rnd, seiten, r, h, schief) {
  const pos = [], sx = (rnd()-0.5)*schief, sz = (rnd()-0.5)*schief;
  const ring = [];
  for (let k = 0; k < seiten; k++) {
    /* Negativer Winkel aus demselben Grund wie bei ECKEN — sonst zeigt der
       Kegel nach innen und ein Baum ist eine Baumhülle von hinten. */
    const a = -k / seiten * Math.PI * 2 + rnd() * 0.2;
    const rr = r * (0.82 + rnd() * 0.36);
    ring.push([Math.cos(a)*rr, (rnd()-0.5)*h*0.12, Math.sin(a)*rr]);
  }
  const spitze = [sx, h, sz];
  for (let k = 0; k < seiten; k++) {
    const a = ring[k], b = ring[(k+1) % seiten];
    pos.push(a[0],a[1],a[2], b[0],b[1],b[2], spitze[0],spitze[1],spitze[2]);
    pos.push(a[0],a[1],a[2], 0,-h*0.04,0, b[0],b[1],b[2]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  return g;
}
function steinRoh(rnd) {
  /* Ikosaeder, Ecken verzogen — flach schattiert. PolyhedronGeometry ist schon
     unindiziert; ein `toNonIndexed()` hier wäre nur eine Warnung je Stein. */
  const g = new THREE.IcosahedronGeometry(1, 0);
  const pos = g.attributes.position, seen = new Map();
  for (let i = 0; i < pos.count; i++) {
    const k = [pos.getX(i), pos.getY(i), pos.getZ(i)].map(v => v.toFixed(3)).join('|');
