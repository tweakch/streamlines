         glatte, spiegelnde Fläche der Szene — darum trifft es nur sie.
         `aNebel` trägt DREI Zustände: 0 in Sicht, 1 Erinnerung, 2 ganz
         niedergedrückt. Die Werte dazwischen sind die Rampe der Front. */
      .replace('#include <tonemapping_fragment>',
        '  float nl = dot(gl_FragColor.rgb, vec3(0.2126, 0.7152, 0.0722));\n' +
        '  vec3 nZiel = mix(vec3(0.10 + nl * 0.80), uGrundFarbe * (0.86 + nl * 0.22),\n' +
        '                   clamp(vNebel - 1.0, 0.0, 1.0));\n' +
        '  gl_FragColor.rgb = mix(gl_FragColor.rgb, nZiel, clamp(vNebel, 0.0, 1.0));\n' +
        '#include <tonemapping_fragment>');
  };

  /* Nachbearbeitung. RawShaderMaterial, damit three NICHTS anhängt — keine
     Tonwertabbildung, keine Farbraumwandlung. Der letzte Durchgang macht beides
     selbst; sonst wäre das Bild doppelt kodiert.
     Wichtig: in ein Rendertarget wendet three toneMapping NICHT an (geprüft in
     der Quelle), die Zwischenbilder sind also linear und dürfen HDR tragen. */
  const vs = `attribute vec3 position; varying vec2 vUv;
    void main(){ vUv = position.xy * 0.5 + 0.5; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const roh = (fs, uni) => new THREE.RawShaderMaterial({
    vertexShader:vs, fragmentShader:fs, uniforms:uni, depthTest:false, depthWrite:false });

  matHell = roh(`precision highp float; varying vec2 vUv;
    uniform sampler2D tBild; uniform float uSchwelle;
    void main(){ vec3 c = texture2D(tBild, vUv).rgb;
      float l = max(max(c.r, c.g), c.b);
      gl_FragColor = vec4(c * smoothstep(uSchwelle, uSchwelle + 0.7, l), 1.0); }`,
    { tBild:{ value:null }, uSchwelle:{ value:1.05 } });

  matBlur = roh(`precision highp float; varying vec2 vUv;
    uniform sampler2D tBild; uniform vec2 uRichtung;
    void main(){
      vec3 s = texture2D(tBild, vUv).rgb * 0.2270;
      s += (texture2D(tBild, vUv + uRichtung*1.3846).rgb + texture2D(tBild, vUv - uRichtung*1.3846).rgb) * 0.3162;
      s += (texture2D(tBild, vUv + uRichtung*3.2308).rgb + texture2D(tBild, vUv - uRichtung*3.2308).rgb) * 0.0702;
      gl_FragColor = vec4(s, 1.0); }`,
    { tBild:{ value:null }, uRichtung:{ value:new THREE.Vector2() } });

  matEnde = roh(`precision highp float; varying vec2 vUv;
    uniform sampler2D tBild, tGlut; uniform vec2 uPixel;
    uniform float uBelichtung, uGlut, uSaettigung, uScharf, uVignette;
    uniform vec3 uWarm, uKuehl;
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
    vec3 srgb(vec3 c){ return mix(c*12.92, 1.055*pow(max(c, vec3(1e-5)), vec3(1.0/2.4)) - 0.055,
                                  step(vec3(0.0031308), c)); }
    void main(){
      vec3 c = texture2D(tBild, vUv).rgb;
      vec3 u = texture2D(tBild, vUv + vec2(uPixel.x, 0.0)).rgb
             + texture2D(tBild, vUv - vec2(uPixel.x, 0.0)).rgb
             + texture2D(tBild, vUv + vec2(0.0, uPixel.y)).rgb
             + texture2D(tBild, vUv - vec2(0.0, uPixel.y)).rgb;
      c += (c - u * 0.25) * uScharf;                     /* leichtes Nachschärfen */
      c += texture2D(tGlut, vUv).rgb * uGlut;
      c = aces(c * uBelichtung);
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      c *= mix(uKuehl, uWarm, smoothstep(0.16, 0.86, l));  /* Lichter warm, Schatten kühl */
      c = mix(vec3(l), c, uSaettigung);
      c *= 1.0 - uVignette * smoothstep(0.34, 0.90, distance(vUv, vec2(0.5)));
      gl_FragColor = vec4(srgb(clamp(c, 0.0, 1.0)), 1.0); }`,
    { tBild:{ value:null }, tGlut:{ value:null }, uPixel:{ value:new THREE.Vector2() },
      uBelichtung:{ value:1 }, uGlut:{ value:0.5 }, uSaettigung:{ value:1.12 },
      uScharf:{ value:0.30 }, uVignette:{ value:0.16 },
      uWarm:{ value:new THREE.Vector3(1,1,1) }, uKuehl:{ value:new THREE.Vector3(1,1,1) } });

  quadScene = new THREE.Scene();
  quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), matHell);
  quad.frustumCulled = false;
  quadScene.add(quad);
  quadCam = new THREE.Camera();

  const opt = { type:THREE.HalfFloatType, colorSpace:THREE.NoColorSpace, stencilBuffer:false };
  rtScene = new THREE.WebGLRenderTarget(2, 2, { ...opt, depthBuffer:true, samples:4 });
  rtA = new THREE.WebGLRenderTarget(2, 2, { ...opt, depthBuffer:false });
  rtB = new THREE.WebGLRenderTarget(2, 2, { ...opt, depthBuffer:false });
}

function schattenTextur() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  const rg = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  rg.addColorStop(0, 'rgba(0,0,0,0.62)');
  rg.addColorStop(0.5, 'rgba(0,0,0,0.34)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================================
   12 · Die Welt aufbauen
   ========================================================================= */
let messung = { dreiecke:0, bauzeit:0, gel:0, bew:0, decke:0, deckezeit:0 };
let weltSig = null;
let gelFarbenAlt = null, bewFarbenAlt = null;
let gelPosAlt = null, bewPosAlt = null, wasPosAlt = null;

function altWeg() {
  for (const m of [mGelaende, mWasser, mSonstiges, mWolke, mRegen, mSchatten,
                   mRing, mRingHover, mFlamme, mFunken, mReich, mSichtRinge, mUmriss, mLeute]) {
    if (!m) continue;
    scene.remove(m);
    if (m.geometry) m.geometry.dispose();
    if (m.material && ![matGelaende, matWasser, matSonstiges, matWolke, matUmriss, matLeute].includes(m.material))
      m.material.dispose();
  }
  mGelaende = mWasser = mSonstiges = mWolke = mRegen = null;
  mSchatten = mRing = mRingHover = mFlamme = mFunken = mReich = mSichtRinge = null;
  mUmriss = mLeute = null;
}

function weltBauen() {
  const t0 = performance.now();
  paletteLesen();
  altWeg();
  felderRechnen();
  /* Nur eine ANDERE Welt setzt die Wolken zurück. Sonst kostete jeder Wechsel
     der Tageszeit (der die Welt neu baut, weil die Palette in den Ecken steckt)
     den ganzen Spielstand der Front — und ausgerechnet nachts will man sehen,
     wie weit die Erinnerung reicht. */
  const sig = P.karte + '|' + P.breite + '|' + P.seed;
  const neueWelt = sig !== weltSig;
  weltSig = sig;
  wolkenAnlegen(neueWelt);
  gemaltZuruecksetzen();
  leuteSetzen(neueWelt);
  sichtRechnen();
  if (neueWelt) {
    /* Die beiden Debug-Griffe für den interessanten Zustand. Er ist durch
       Klicken NICHT erreichbar und durch eine URL bisher auch nicht: die
       Sichtscheibe schützt sich selbst, also frisst die Front dort nie etwas.
       Erst eine ERKUNDETE Fläche, die grösser ist als die Sicht, gibt der
       Front etwas zu tun — genau das, was im Spiel entsteht, wenn Leute
       weiterziehen. `entdeckt` legt sie an, `vorlauf` lässt die Runden laufen. */
    if (P.entdeckt > 0) for (const K of KLANE) {
      if (!K.anker) continue;
      for (const q of SOT.hex.disc(K.anker.c, K.anker.r, P.entdeckt)) {
        const f = feldAn(q.c, q.r); if (f) K.druck[f.i] = 0;
      }
    }
    runde = 1;
  }

  const bGel = new Bauplan();
  kachelnBauen(bGel);
  messung.gel = bGel.anz;
  mGelaende = new THREE.Mesh(bGel.geometrie(), matGelaende);
  mGelaende.castShadow = true; mGelaende.receiveShadow = true;
  scene.add(mGelaende);

  /* Bewuchs zuerst, dann das Wasser: `wasserBauen` legt die Stürze und den
     Schaum in DIESES Netz (sie sind Körper, kein Wasserband) und gibt die
     Wassergeometrie zurück. */
  const bRest = new Bauplan();
  bewuchsBauen(bRest);
  const wg = wasserBauen(bRest);
  messung.bew = bRest.anz;
  if (wg) {
    mWasser = new THREE.Mesh(wg, matWasser);
    mWasser.receiveShadow = true;
    scene.add(mWasser);
  }
  mSonstiges = new THREE.Mesh(bRest.geometrie(), matSonstiges);
  mSonstiges.castShadow = true; mSonstiges.receiveShadow = true;
  scene.add(mSonstiges);
  flammeBauen();

  /* Die Urfarben UND die Urhöhen merken — der Nebel schreibt beides um und
     muss zurückkönnen. Die Höhen sind der Preis dieses Durchgangs: rund
     zwei Megabyte bei tausend Feldern. Er ist es wert, weil damit auch die
     HEBUNG ohne Neuaufbau auskommt, genau wie vorher schon die Farbe. */
  gelFarbenAlt = mGelaende.geometry.attributes.color.array.slice();
  bewFarbenAlt = mSonstiges.geometry.attributes.color.array.slice();
  gelPosAlt = mGelaende.geometry.attributes.position.array.slice();
  bewPosAlt = mSonstiges.geometry.attributes.position.array.slice();
  wasPosAlt = mWasser ? mWasser.geometry.attributes.position.array.slice() : null;

  mGelaende.geometry.computeBoundingBox();
  const bb = mGelaende.geometry.boundingBox;
  inselMitte.set((bb.min.x + bb.max.x)/2, 0, (bb.min.z + bb.max.z)/2);
  inselHoch = bb.max.y;
  inselSpan.set(bb.max.x - bb.min.x, bb.max.y - bb.min.y, bb.max.z - bb.min.z);

  if (P.wetter === 'regen') {
    const bW = new Bauplan();
    const wm = new THREE.Vector3(blickZiel.x - W * 0.9, inselHoch + 2.0, blickZiel.z - H * 2.0);
    wolkeBauen(bW, wm);
    mWolke = new THREE.Mesh(bW.geometrie(), matWolke);
    mWolke.geometry.computeBoundingBox();
    scene.add(mWolke);
    regenBauen(wm);
    messung.dreiecke = bGel.anz + bRest.anz + bW.anz;
  } else messung.dreiecke = bGel.anz + bRest.anz;

  if (!schattenTex) schattenTex = schattenTextur();
  mSchatten = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({
    map:schattenTex, transparent:true, depthWrite:false, color:PAL.boden, toneMapped:false }));
  mSchatten.rotation.x = -Math.PI / 2;
  mSchatten.scale.set(inselSpan.x * 1.9, inselSpan.z * 1.45, 1);
  mSchatten.position.set(inselMitte.x + 0.25, UNTEN - 0.02, inselMitte.z + 0.35);
  scene.add(mSchatten);

  mRing = ringBauen(farbe('--ember'), 0.11);
  mRingHover = ringBauen(farbe('--ink2'), 0.055);
  mRing.visible = mRingHover.visible = false;
  scene.add(mRing, mRingHover);
  reichweiteZeichnen();

  matGelaende.wireframe = matSonstiges.wireframe = !!P.gitter;

  umrissAnlegen();
  nebelAnwenden(true);
  leuteBauen();
  markenBauen();
  lichtStellen();
  kameraStellen();
  messung.bauzeit = performance.now() - t0;
  legendeBauen();
  klankarteBauen();
  leuteKartenBauen();
}

/* -------------------------------------------------------------------- Ringe ---*/
function ringBauen(col, breite) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(12 * 3), 3));
  const idx = [];
  for (let k = 0; k < 6; k++) {
    const a = k*2, b = a+1, c = ((k+1)%6)*2, d = c+1;
    idx.push(a, b, d, a, d, c);
  }
  g.setIndex(idx);
  /* Ein BAND, keine Linie: `linewidth` ignoriert WebGL, ein Ring aus
     THREE.Line wäre auf jedem Gerät ein Haar breit. */
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color:col, toneMapped:false, transparent:true, opacity:0.95,
    depthWrite:false, side:THREE.DoubleSide }));
  m.frustumCulled = false;
  m.userData.breite = breite;
  return m;
}
/* ----------------------------------------------------- Die flache Ansicht ---
   `T` ebnet das Gelände ein: jede Kachel bekommt dieselbe Deckhöhe, die
   Hebung des Nebels bleibt. Das ist kein Bildschalter, sondern ein
   Bedienungswerkzeug — ein Berg verdeckt, was hinter ihm liegt, und was
   verdeckt ist, kann man nicht antippen. Eingeebnet ist jedes Feld erreichbar,
   und die einzige Höhe im Bild ist die, die etwas BEDEUTET: gehoben = bekannt.

   Das Gelände wird dafür SKALIERT (sein Boden muss auf UNTEN bleiben, sonst
   hinge die Platte durch), alles darauf — Bewuchs, Wasser, Stürze, Figuren —
   dagegen VERSCHOBEN, damit ein Baum auf dem Berg nicht zum Zwerg wird.
   Beide treffen sich an der Deckfläche, und deshalb passt es zusammen.
   Nebenbei verschwindet damit der Riss, den das Wasserband an einer Kante
   zwischen zwei verschieden hohen Feldern hatte. */
const FLACH = 0.42;
let flachAn = false;
const relVon = f => flachAn ? (FLACH - UNTEN) / Math.max(0.06, f.hoehe - UNTEN) : 1;
const offVon = f => flachAn ? FLACH - f.hoehe : 0;

/* Die Ecke k eines Feldes auf seiner AKTUELLEN Höhe. Alles, was auf dem Land
   liegt statt in ihm — Auswahlring, Zeigerring, Reichweitensaum —, muss durch
   diese Funktion: sonst schwebt es dort, wo das Feld einmal stand, und über
   einem niedergedrückten Feld hängt ein Ring in der Luft. */
const hebVon = f => (f.hIst === undefined ? 1 : f.hIst);
const eckHoehe = (f, k) => UNTEN + (f.hoehen[k] - UNTEN) * hebVon(f) * relVon(f);
/* Dieselbe Rechnung für die Mitte — das ist die Fläche, auf die der
   Auswahlstrahl trifft. */
const flaecheVon = f => UNTEN + (f.hoehe - UNTEN) * hebVon(f) * relVon(f);

function ringSetzen(l, f) {
  if (!l) return;
  if (!f) { l.visible = false; neuZeichnen(); return; }
  const b = l.userData.breite, a = l.geometry.attributes.position;
  for (let k = 0; k < 6; k++) {
    const dx = f.eck[k][0] - f.x, dz = f.eck[k][1] - f.z, y = eckHoehe(f, k) + 0.035;
    a.setXYZ(k*2,   f.x + dx * (1 - b), y, f.z + dz * (1 - b));
    a.setXYZ(k*2+1, f.x + dx * (1 + b * 0.35), y, f.z + dz * (1 + b * 0.35));
  }
  a.needsUpdate = true;
  l.geometry.computeBoundingSphere();
  l.visible = true;
  neuZeichnen();
}

/* Die Reichweite als Saum um das erreichbare Gebiet: nur die Kanten, hinter
   denen KEIN erreichbares Feld mehr liegt. Das zeigt die Grenze, ohne die
   Karte zuzudecken.

   Ist jemand gewählt, zeigt der Saum SEINE Reichweite und nicht mehr die des
   ganzen Klans — denn seit die Leute gehen, ist der Saum keine Anzeige mehr,
   sondern eine Schaltfläche: was darin liegt, ist antippbar. Die Vereinigung
   beider Leute zu zeigen und dann die Hälfte davon nicht anzunehmen wäre eine
   Lüge im Bild. */
function reichweiteZeichnen() {
  if (mReich) { scene.remove(mReich); mReich.geometry.dispose(); mReich.material.dispose(); }
  const bau = new Bauplan();
  /* Der Saum trägt die Farbe des Klans, der am Zug ist — sonst sieht man beim
     Zugwechsel nicht, WESSEN Reichweite dort liegt. */
  const kf = PAL.klan[aktiv().id];
  const c1 = kf, c2 = dunkler(kf, 0.7);
  const gew = gewaehlteEinheit && LEUTE.find(x => x.id === gewaehlteEinheit);
  let menge = erreichbar;
  if (gew && gew.klan === aktiv().id) {
    menge = new Set();
    for (const q of SOT.hex.disc(gew.c, gew.r, gew.tempo)) {
      const k = schluessel(q.c, q.r); if (felder.has(k)) menge.add(k);
    }
  }
  for (const k of menge) {
    const f = felder.get(k); if (!f) continue;
    for (const n of SOT.hex.neighbors(f.c, f.r)) {
      if (menge.has(schluessel(n.c, n.r))) continue;
      const ka = KANTE_VON_DIR[n.dir], kb = (ka + 1) % 6;
      const b = 0.055;
      const p = [ka, kb].map(kk => {
        const dx = f.eck[kk][0] - f.x, dz = f.eck[kk][1] - f.z, y = eckHoehe(f, kk) + 0.05;
        return { i:[f.x + dx*(1-b), y, f.z + dz*(1-b)],
                 a:[f.x + dx*(1+b), y, f.z + dz*(1+b)] };
      });
      bau.viereck(p[0].i, p[0].a, p[1].a, p[1].i, c1, c2, c2, c1);
    }
  }
  if (!bau.anz) { mReich = null; return; }
  mReich = new THREE.Mesh(bau.geometrie(), new THREE.MeshBasicMaterial({
    vertexColors:true, toneMapped:false, transparent:true, opacity:0.75,
    depthWrite:false, side:THREE.DoubleSide }));
  mReich.frustumCulled = false;
  scene.add(mReich);
}

/* ============================================================================
   13 · Der Nebel als HEBUNG — das Land selbst ist der Nebel

   Der vorige Durchgang legte eine Wolke aus Ballen ÜBER das Ungesehene. Das
   war eine Verpackung: der eigentliche Gegenstand (ein Feld, das dieser Klan
   nicht kennt) blieb da, unverändert, und bekam einen Deckel. Es sah gut aus
   und war trotzdem die falsche Idee — verworfen, samt Ballen, Vorlagen und
   Deckeln.

   Jetzt trägt DAS LAND SELBST den Zustand. Jedes Feld hat eine **Hebung**
   `heb ∈ [0,1]`, und die ganze Darstellung ist eine Zeile:

       y′ = UNTEN + (y − UNTEN) · heb

   `heb = 1` — das Feld steht in voller Höhe. `heb = 0` — es ist flach auf den
   Grund gedrückt, farblich fast das Papier, und was bleibt, ist sein Umriss.
   Dazwischen sackt es ab. Die Hebung ist schlicht die Gegenzahl der Front:
   `heb = 1 − gedrueckt(w)`. Die Diffusionsfront ist damit ein **Gewicht**, das
   über die Erinnerung wandert und die Felder niederdrückt; Sicht hebt sie
   wieder an.

   Warum das besser ist als die Wolke, und zwar nicht nur hübscher:

   · **Es sagt dasselbe mit weniger.** Kein zweites Netz, keine Ballen, keine
     Deckel — die Information sitzt in der Geometrie, die ohnehin da ist.
   · **Es verdeckt nicht, es entzieht.** Eine Wolke liegt VOR etwas; ein
     niedergedrücktes Feld IST nichts mehr. Der Unterschied ist im Bild
     sichtbar: das Bekannte steht als Plateau da, und die Sonne wirft seinen
     Schlagschatten auf den leeren Grund. Diese Silhouette ist umsonst zu
     haben und liest sich sofort.
   · **Die Rampe der Front wird zu einem Gefälle.** Wo das Gewicht gerade
     wirkt, sackt das Land — eine Böschung statt einer Farbkante.
   · **Die Bewegung ist gekrümmt und kurz** (0.30 s, siehe `hebenTakt`), und
     zwar richtungsabhängig: hoch klingt aus wie etwas, dem die Last genommen
     wurde, nieder legt sich auf wie ein Gewicht. Eine lineare Bewegung hat
     kein Gewicht, und eine lange fühlt sich wie Warten an.
   · **Y-Skalierung um UNTEN lässt die Normalen in Ruhe.** Eine senkrechte
     Flanke behält bei reiner Höhenstauchung ihre (waagrechte) Normale; nur
     die Wellen der Deckfläche flachen ab, und deren Normale steht ohnehin
     fast senkrecht. Darum muss nichts neu gerechnet werden — nur y.
   · **Die Feldgrenzen wandern nicht.** x und z bleiben, also stimmen Auswahl,
     Nachbarschaft und `naechstesFeld` weiter.

   Alles läuft wie beim Umfärben über die Dreiecksspannen je Feld
   (gelVon..gelBis, bewVon..bewBis, wasVon..wasBis) in vorhandene Puffer —
   kein Neuaufbau.
   ========================================================================= */
/* Die Schwellen der Front: unter `EIN` sieht man saubere Erinnerung, ab `VOLL`
   liegt das Feld ganz unten. Dazwischen liegt die Rampe — rund ein Feld breit,
   und genau die macht aus einer Maske eine Front. */
const DRUCK_EIN = 0.18, DRUCK_VOLL = 0.85;
const gedrueckt = w => {
  const t = Math.min(1, Math.max(0, (w - DRUCK_EIN) / (DRUCK_VOLL - DRUCK_EIN)));
  return t * t * (3 - 2 * t);
};

/* Eine Ecke von der Farbe weg. `k` = 0 gibt die Erinnerung (entfärbt), `k` = 1
   den Grund. Nicht ganz grau und etwas dunkler: ein reines Grau liest sich als
   Fehler, ein entsättigtes, leicht kühles als „nicht gesehen".
   Gelände, Bewuchs UND Wasser gehen durch DIESE Formel — mit einer eigenen
   bekam der Fluss ausser Sicht einen lila Ton. Ein Nebel hat eine Farbe. */
let GRUND_RGB = { r:0.87, g:0.82, b:0.73 };
function nebelEck(arr, alt, i, k) {
  const l = 0.2126*alt[i] + 0.7152*alt[i+1] + 0.0722*alt[i+2];
  /* Angehoben statt abgedunkelt (früher schlicht `l * 0.82`). Mit drei
     Zuständen war die Erinnerung sonst der DUNKELSTE der drei — dunkler als
     die Farbe, aus der sie kommt, und weit dunkler als der Grund, in den sie
     übergeht. Ein entsättigter Wald wurde fast schwarz. Jetzt liegt sie dem
     Wert nach zwischen beiden: staubig, flach, aber nicht finster. */
  const g = 0.10 + l * 0.80;
  const r0 = g + (alt[i]   - l) * 0.10;
  const g0 = g + (alt[i+1] - l) * 0.10;
  const b0 = g * 1.03 + (alt[i+2] - l) * 0.10;
  if (k <= 0) { arr[i] = r0; arr[i+1] = g0; arr[i+2] = b0; return; }
  /* Der Grund nimmt noch einen Rest der Feldhelligkeit mit (`s`), sonst steht
     dort eine tote Fläche in genau einem Ton — aber viel weniger als die
     Wolke es tat: ein niedergedrücktes Feld soll KEINE Struktur mehr haben. */
  const s = 0.86 + l * 0.22;
  arr[i]   = r0 + (GRUND_RGB.r * s - r0) * k;
  arr[i+1] = g0 + (GRUND_RGB.g * s - g0) * k;
  arr[i+2] = b0 + (GRUND_RGB.b * s - b0) * k;
}
function nebelStufe(arr, alt, von, bis, k) {
  for (let i = von * 9; i < bis * 9; i += 3) nebelEck(arr, alt, i, k);
}
function farbStufe(arr, alt, von, bis) {
  for (let i = von * 9; i < bis * 9; i++) arr[i] = alt[i];
}

/* --------------------------------------------------------- Höhen schreiben ---
   `tief` senkt ein Netz beim vollen Niederdrücken noch ein Stück UNTER den
   Grund. Ohne das lägen Bewuchs, Wasser und Deckfläche am Ende alle exakt auf
   `UNTEN` und flimmerten gegeneinander (z-Fighting). Mit dem Versatz
   verschwindet beides sauber unter der Deckfläche des eigenen Feldes. */
/* Jede Höhe entsteht aus EINER affinen Abbildung der Urhöhe, danach der
   Hebung: `y′ = ab + (alt·a + b − UNTEN) · heb`. Drei Zeilen Rechnung, aber sie
   trägt alle vier Fälle, und darum steht hier kein Wald aus Schaltern:

     Gelände    a = rel, b = UNTEN·(1−rel)   — SKALIERT um UNTEN, damit der
                                               Boden der Platte auf ihr bleibt
     Bewuchs    a = 1,   b = off             — VERSCHOBEN, damit ein Baum auf
                                               dem Berg kein Zwerg wird
     Wasser     a = 1,   b = 0               — wie gewachsen
     Wasser flach a = 0, b = FLACH + WLIFT   — auf EINE Höhe (siehe unten) */
function hebenStufe(arr, alt, von, bis, heb, tief, a, b) {
  const ab = UNTEN - tief * (1 - heb);
  for (let i = von * 9 + 1; i < bis * 9; i += 3)
    arr[i] = ab + (alt[i] * a + b - UNTEN) * heb;
}
/* Das Wasser ist INDIZIERT: die Spanne zählt Dreiecke, die Ecken stehen im
   Index. Eine Ecke mehrfach zu schreiben ist harmlos — der Wert ist derselbe. */
function hebenWasser(arr, alt, idx, von, bis, heb, tief, a, b) {
  const ab = UNTEN - tief * (1 - heb);
  for (let t3 = von * 3; t3 < bis * 3; t3++) {
    const j = idx[t3] * 3 + 1;
    arr[j] = ab + (alt[j] * a + b - UNTEN) * heb;
  }
}
function hebenSchreiben(f) {
  const heb = f.hIst, rel = relVon(f), off = offVon(f);
  const gP = mGelaende.geometry.attributes.position.array;
  const bP = mSonstiges.geometry.attributes.position.array;
  hebenStufe(gP, gelPosAlt, f.gelVon, f.gelBis, heb, 0, rel, UNTEN * (1 - rel));
  /* Der Bewuchs geht QUADRATISCH und damit schneller nieder als sein Boden:
     erst verliert ein Feld seine Merkmale, dann seine Höhe. Genau in dieser
     Reihenfolge vergisst man auch — man weiss noch, dass da ein Tal war,
     aber nicht mehr, was darin stand. */
  hebenStufe(bP, bewPosAlt, f.bewVon, f.bewBis, heb * heb, 0.006, 1, off);
  /* Wasser und Sturz gehören zusammen und NICHT zum Bewuchs: sie sinken linear
     mit dem Gelände, sonst risse der Sturz von seiner eigenen Lippe ab.

     Im flachen Brett bekommen sie EINE gemeinsame Höhe. Das ist keine Willkür:
     das einzige senkrechte Merkmal eines Wasserbandes IST das Gefälle, und das
     ist gerade weggeebnet. Eine Kantenmitte trägt die MITTELWERTS-Höhe ihrer
     zwei Felder — verschiebt man sie je Feld verschieden, klafft das Band an
     jeder Kante um den ganzen Höhenunterschied auf. Mit einer festen Höhe
     treffen sich beide Seiten wieder, und der Sturz fällt auf null und
     verschwindet, was richtig ist: ohne Gefälle gibt es keinen. */
  const wa = flachAn ? 0 : 1, wb = flachAn ? FLACH + WLIFT : 0;
  if (f.fallBis > f.fallVon)
    hebenStufe(bP, bewPosAlt, f.fallVon, f.fallBis, heb, 0.010, wa, wb);
  if (mWasser && f.wasBis > f.wasVon)
    hebenWasser(mWasser.geometry.attributes.position.array, wasPosAlt,
                mWasser.geometry.index.array, f.wasVon, f.wasBis, heb, 0.010, wa, wb);
  umrissFeld(f);
}
/* Alles neu schreiben, ohne dass sich die Hebung geändert hat — für `T`. */
function hebenAlleSchreiben() {
  if (!mGelaende) return;
  for (const f of felders()) hebenSchreiben(f);
  hebenHochladen();
  leuteBauen();
  reichweiteZeichnen();
  if (gewaehlt) ringSetzen(mRing, gewaehlt);
  neuZeichnen();
}
function hebenHochladen() {
  mGelaende.geometry.attributes.position.needsUpdate = true;
  mSonstiges.geometry.attributes.position.needsUpdate = true;
  if (mWasser) mWasser.geometry.attributes.position.needsUpdate = true;
  if (mUmriss) {
    mUmriss.geometry.attributes.position.needsUpdate = true;
    mUmriss.geometry.attributes.color.needsUpdate = true;
  }
}

/* Die Umschlagkiste bleibt gültig, ohne dass sie je neu gerechnet werden
   müsste: die Felder wandern NUR nach unten, und nur bis `UNTEN` — also
   innerhalb dessen, was beim Aufbau schon vermessen wurde. Das ist der stille
   Gewinn der Skalierung um UNTEN: Auswahlstrahl und Frustum stimmen weiter. */

/* -------------------------------------------------------------- Das Senken ---
   Ein Zug ändert die Front um 1/Kultur — das Feld sackt also ohnehin über
   RUNDEN ab, nicht in einem Sprung. Die Hebung selbst muss darum nur den
   kleinen Rest überbrücken. Sie tut es trotzdem, und zwar für den anderen
   Fall: Sicht hebt SOFORT und ganz. Ohne Übergang würde ein halbes Tal in
   einem Bild hochschnellen, und man sähe nicht, dass es hochkommt — man sähe
   nur, dass es plötzlich anders ist. */
let hebenLaeuft = false;
/* Kurz. Ein Zug soll sich anfühlen wie eine Antwort, nicht wie eine
   Vorführung — alles über einer knappen Drittelsekunde liest sich als Warten.
   Gerechnet wird über die VERGANGENE ZEIT je Feld, nicht mit einem Zuwachs je
   Bild: nur so ist die Dauer dieselbe, ob der Rechner sechzig oder dreissig
   Bilder schafft, und nur so kann die Kurve gekrümmt sein. */
const HEB_DAUER = 0.30;
/* Zwei Kurven, und zwar richtungsabhängig — das ist der Unterschied zwischen
   „animiert" und „fühlt sich richtig an". Beide sind gekrümmt, keine ist
   linear; eine lineare Bewegung hat kein Gewicht.

   HOCH ist ein Heben: die Last ist weg, also schnellt es los und legt sich
   weich an (kubisch ausklingend — nach einem Drittel der Zeit ist es schon
   zu zwei Dritteln oben).

   NIEDER ist ein Gewicht, das sich auflegt: es gibt erst zögernd nach, wird
   schneller und kommt ruhig auf (weich an beiden Enden). Ein Ausklang wäre
   hier falsch — er sähe aus, als fiele das Feld, statt gedrückt zu werden. */
const hoch    = p => 1 - (1 - p) * (1 - p) * (1 - p);
const nieder  = p => p * p * (3 - 2 * p);
function hebenTakt(dt) {
  if (!hebenLaeuft || !mGelaende) return;
  let offen = false, etwas = false;
  for (const f of felders()) {
    if (f.hIst === f.hSoll) continue;
    f.hZeit += dt;
    const p = f.hZeit / HEB_DAUER;
    if (p >= 1) f.hIst = f.hSoll;
    else {
      const k = f.hSoll > f.hVon ? hoch(p) : nieder(p);
      f.hIst = f.hVon + (f.hSoll - f.hVon) * k;
    }
    hebenSchreiben(f);
    etwas = true;
    if (f.hIst !== f.hSoll) offen = true;
  }
  if (etwas) {
    hebenHochladen();
    /* Ringe und Figuren liegen AUF dem Land, nicht in ihm — sie müssen
       mitfahren. Vier Figuren neu zu bauen ist billiger, als für sie einen
       zweiten Weg durch die Puffer zu schreiben. */
    if (gewaehlt && mRing && mRing.visible) ringSetzen(mRing, gewaehlt);
    if (ueber && mRingHover && mRingHover.visible) ringSetzen(mRingHover, ueber);
    leuteBauen();
    schmutzig = true;
  }
  hebenLaeuft = offen;
}
/* Sofort setzen — beim Weltaufbau, beim Zugwechsel und unter `?still`. Ein
   Zugwechsel ist ein harter Schnitt („jetzt siehst du durch andere Augen");
   ihn zu animieren hiesse, eine Bewegung zu zeigen, die niemand macht. */
function hebenSofort() {
  if (!mGelaende) return;
  let etwas = false;
  for (const f of felders()) {
    if (f.hIst === f.hSoll) continue;
    f.hIst = f.hVon = f.hSoll; f.hZeit = HEB_DAUER;
    hebenSchreiben(f); etwas = true;
  }
  hebenLaeuft = false;
  if (etwas) hebenHochladen();
}

/* Was zuletzt gemalt wurde, je Feld — als STUFE, nicht als Fliesskommawert:
   0 = in Sicht, 1..17 = Erinnerung bis ganz unten. Ohne die Quantisierung
   müsste bei jeder Runde jedes Feld neu gemalt werden, obwohl sich für das
   Auge nichts ändert. 255 heisst „noch nie gemalt". */
let gemalt = null;
function gemaltZuruecksetzen() {
  gemalt = new Uint8Array(felder.size).fill(255);
}

function nebelAnwenden(alles) {
  if (!mGelaende) return;
  if (!gemalt || gemalt.length !== felder.size) gemaltZuruecksetzen();
  if (alles) gemalt.fill(255);
  const an = P.nebel === 1;
  const K = aktiv();
  const gA = mGelaende.geometry.attributes.color, bA = mSonstiges.geometry.attributes.color;
  /* Der Nebel geht beim Wasser über `aNebel` (nach der Beleuchtung), weil
     Vertexfarbe den Spiegelglanz nicht erreicht: 0 = in Sicht, 1 = Erinnerung,
     2 = ganz unten. */
  const wA = mWasser ? mWasser.geometry.attributes.aNebel : null;
  const wIdx = mWasser ? mWasser.geometry.index : null;
  let etwas = false, wasEtwas = false;
  for (const f of felders()) {
    const sicht = !an || K.sicht.has(schluessel(f.c, f.r));
    const k = (an && !sicht && K.druck) ? gedrueckt(K.druck[f.i]) : 0;
    /* Die HEBUNG wird immer gesetzt, auch wenn die Farbe auf derselben Stufe
       bleibt: sie ist stetig, und ein Feld, das nur um ein Sechzehntel absackt,
       soll auch um ein Sechzehntel absacken. */
    const soll = P.heben ? 1 - k : 1;
    if (f.hIst === undefined) { f.hIst = soll; f.hVon = soll; f.hZeit = HEB_DAUER; }
    /* Ein NEUES Ziel setzt die Kurve neu auf — und zwar ab dem Wert, auf dem
       das Feld gerade steht. Wer mitten in der Senkung weitergeht, sieht das
       Feld von dort aus umkehren, nicht springen. */
    if (soll !== f.hSoll) { f.hVon = f.hIst; f.hZeit = 0; }
    f.hSoll = soll;
    const stufe = sicht ? 0 : 1 + Math.round(k * 16);
    if (gemalt[f.i] !== stufe) {
      gemalt[f.i] = stufe;
      f.sichtbar = sicht; f.gedrueckt = k;
      etwas = true;
      if (sicht) {
        farbStufe(gA.array, gelFarbenAlt, f.gelVon, f.gelBis);
        farbStufe(bA.array, bewFarbenAlt, f.bewVon, f.bewBis);
        farbStufe(bA.array, bewFarbenAlt, f.fallVon, f.fallBis);
      } else {
        nebelStufe(gA.array, gelFarbenAlt, f.gelVon, f.gelBis, k);
        nebelStufe(bA.array, bewFarbenAlt, f.bewVon, f.bewBis, k);
        nebelStufe(bA.array, bewFarbenAlt, f.fallVon, f.fallBis, k);
      }
      if (wA && f.wasBis > f.wasVon) {
        const v = sicht ? 0 : 1 + k;
        for (let t3 = f.wasVon * 3; t3 < f.wasBis * 3; t3++) wA.array[wIdx.array[t3]] = v;
        wasEtwas = true;
      }
    }
  }
  if (etwas) {
    gA.needsUpdate = true; bA.needsUpdate = true;
    if (wasEtwas) wA.needsUpdate = true;
  }
  if (alles || P.still) hebenSofort();
  else { hebenLaeuft = felderBewegtSich(); if (!hebenLaeuft) hebenSofort(); }
  neuZeichnen();
}
const felderBewegtSich = () => {
  for (const f of felders()) if (f.hIst !== f.hSoll) return true;
  return false;
};
const felders = () => felder.values();

/* ------------------------------------------------------------- Der Umriss ----
   Was von einem ganz niedergedrückten Feld bleibt. Ein eigenes, flaches Netz
   in FESTER Grösse: sechsunddreissig Ecken je Feld, einmal angelegt, danach
   nur noch beschrieben — genau wie Farbe und Höhe. Ein Neuaufbau je Bild wäre
   bei tausend Feldern das Teuerste am ganzen Labor.

   Warum überhaupt ein eigenes Netz? Weil die Kacheln um ein bis zwei Prozent
   geschrumpft sind: unten angekommen liegen sie zwar nebeneinander, aber die
   Fuge dazwischen ist einen halben Bildpunkt breit. Sichtbar ist sie nicht,
   und ein Umriss, den man nicht sieht, ist keiner.
   --------------------------------------------------------------------------- */
const UMR_ECKEN = 36;               /* 6 Kanten × 2 Dreiecke × 3 Ecken */
const UMR_BREITE = 0.05;
const umrFarbe = new THREE.Color();
function umrissAnlegen() {
  const n = felder.size;
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(n * UMR_ECKEN * 3), 3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(new Float32Array(n * UMR_ECKEN * 3), 3));
  /* Die Kugel von Hand: die Ecken stehen beim Anlegen alle auf null, eine
     gerechnete Kugel hätte den Radius null und three würde das Netz wegwerfen. */
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e6);
  mUmriss = new THREE.Mesh(g, matUmriss);
  mUmriss.frustumCulled = false;
  scene.add(mUmriss);
  for (const f of felders()) { if (f.hIst === undefined) f.hIst = 1; umrissFeld(f); }
}
function umrissFeld(f) {
  if (!mUmriss) return;
  const pos = mUmriss.geometry.attributes.position.array;
  const col = mUmriss.geometry.attributes.color.array;
  let p = f.i * UMR_ECKEN * 3;
  const heb = f.hIst;
  /* Ein stehendes Feld hat keinen Umriss. Statt das Netz zu teilen, wird der
     Ring auf einen Punkt gefaltet — entartete Dreiecke kosten nichts und
     halten die Spanne je Feld konstant. */
  if (heb > 0.97) {
    for (let i = 0; i < UMR_ECKEN * 3; i++) { pos[p + i] = 0; col[p + i] = 0; }
    return;
  }
  /* EIN Farbobjekt für alle Felder: während des Senkens läuft diese Funktion
     je Bild für jedes bewegte Feld, ein `clone()` wären Tausende Objekte je
     Sekunde für die Müllabfuhr. */
  const a = Math.min(1, (1 - heb) * 1.7);
  const c = umrFarbe.copy(PAL.grund[1]).lerp(PAL.umriss, a);
  const eck = [];
  for (let k = 0; k < 6; k++) {
    const dx = f.eck[k][0] - f.x, dz = f.eck[k][1] - f.z;
    const y = eckHoehe(f, k) + 0.008;
    eck.push([[f.x + dx * (1 - UMR_BREITE), y, f.z + dz * (1 - UMR_BREITE)],
              [f.x + dx * (1 + UMR_BREITE), y, f.z + dz * (1 + UMR_BREITE)]]);
  }
  const setzen = (v) => { pos[p] = v[0]; pos[p+1] = v[1]; pos[p+2] = v[2];
                          col[p] = c.r; col[p+1] = c.g; col[p+2] = c.b; p += 3; };
  for (let k = 0; k < 6; k++) {
    const A = eck[k], B = eck[(k + 1) % 6];
    setzen(A[0]); setzen(A[1]); setzen(B[1]);
    setzen(A[0]); setzen(B[1]); setzen(B[0]);
  }
}

/* ============================================================================
   14 · Licht und Kamera
   ========================================================================= */
function lichtStellen() {
  const L = LICHT[P.zeit] || LICHT.mittag;
  const azi = (P.lichtdreht ? P.azimut + L.azimut : L.azimut) * Math.PI / 180;
  const hoe = L.hoehe * Math.PI / 180;
  const d = 9;
  /* Die Sonne folgt der BLICKMITTE, nicht der Inselmitte: bei einem Tal, das
     dreissig Felder weit reicht, stünde sie sonst irgendwo im Nichts und die
     Schattenkarte deckte den sichtbaren Ausschnitt nicht mehr. */
  sonne.target.position.copy(blickZiel);
  sonne.position.set(
    blickZiel.x + Math.cos(hoe) * Math.sin(azi) * d,
    blickZiel.y + Math.sin(hoe) * d,
    blickZiel.z + Math.cos(hoe) * Math.cos(azi) * d
  );
  sonne.color.copy(PAL.sonne); sonne.intensity = L.sonne;
  /* Die Schattenkamera eng um den SICHTBAREN Ausschnitt legen, nicht um die
     ganze Karte: jede überflüssige Einheit kostet Auflösung. */
  const sc = sonne.shadow.camera;
  const rad = Math.min(0.5 * Math.hypot(inselSpan.x, inselSpan.z) + 0.4, P.zoom * 0.85 + 2);
  sc.left = -rad; sc.right = rad; sc.top = rad; sc.bottom = -rad;
  sc.near = 0.1; sc.far = d + rad + 4;
  sc.updateProjectionMatrix();
  sonne.shadow.radius = P.schatten === 'weich' ? 2 : 1;

  fuell.color.copy(PAL.fuell); fuell.groundColor.copy(PAL.rueck); fuell.intensity = L.fuell;
  rueck.color.copy(PAL.fuell); rueck.intensity = L.rueck;
  rueck.position.set(blickZiel.x - Math.sin(azi) * 6, blickZiel.y + 1.6,
                     blickZiel.z - Math.cos(azi) * 6);

  if (feuerStelle) {
    glutlicht.position.copy(feuerStelle);
    glutlicht.color.copy(PAL.glut);
    glutlicht.intensity = L.glut;
  } else glutlicht.intensity = 0;

  scene.background = PAL.papier;
  matEnde.uniforms.uBelichtung.value = L.belichtung;
  matEnde.uniforms.uWarm.value.set(PAL.warm.r, PAL.warm.g, PAL.warm.b);
  matEnde.uniforms.uKuehl.value.set(PAL.kuehl.r, PAL.kuehl.g, PAL.kuehl.b);
  renderer.toneMappingExposure = L.belichtung;
  neuZeichnen();
}

const istOben = () => P.sicht === 'oben';
const neigungJetzt = () => istOben() ? 90 : P.neigung;

/* Die Blickmitte auf das Erreichbare klemmen — „nur so weit, wie die Leute
   reichen". Geklemmt wird das RECHTECK des Erreichbaren; an einer gezackten
   Feldkante zu hängen fühlt sich wie ein Fehler an. */
/* Der Überblick ist ein WERKZEUG dieses Labors, keine Spielhandlung: um den
   Renderer zu beurteilen muss man das ganze Tal sehen dürfen. Darum hebt er
   die Klemme auf — bis der nächste Zug am Bild wieder in die Spielregel
   zurückführt. Ohne diesen Merker schnappte der Blick beim nächsten
   Neuaufbau (oder einer Fenstergrössenänderung) sofort zurück. */
let ueberblick = false;
function blickKlemmen() {
  if (!reichBox || ueberblick) return;
  blickZiel.x = Math.max(reichBox.x0, Math.min(reichBox.x1, blickZiel.x));
  blickZiel.z = Math.max(reichBox.z0, Math.min(reichBox.z1, blickZiel.z));
}

function kameraStellen() {
  blickKlemmen();
  const azi = P.azimut * Math.PI / 180;
  const neig = neigungJetzt() * Math.PI / 180;
  const ziel = blickZiel.clone();
  ziel.y = 0.25;
  const d = 60;
  kamera.position.set(
    ziel.x + Math.cos(neig) * Math.sin(azi) * d,
    ziel.y + Math.sin(neig) * d,
    ziel.z + Math.cos(neig) * Math.cos(azi) * d
  );
  /* Senkrecht von oben ist `lookAt` mit der Hochachse als Aufwärtsvektor
     entartet — dann zeigt Norden nach oben, indem der Aufwärtsvektor auf −z
     kippt. Ohne das dreht sich das Bild bei 90° willkürlich weg. */
  kamera.up.set(0, 1, 0);
  if (neigungJetzt() > 88) kamera.up.set(0, 0, -1);
  kamera.lookAt(ziel);

  const w = buehne.clientWidth || 1, h = buehne.clientHeight || 1;
  /* Der Maßstab ist „so viele Felder in der Bildbreite" — auflösungsunabhängig
     und in Spielgrößen gedacht, nicht in Weltmetern. */
  const hx = P.zoom * W / 2;
  const hy = hx * h / w;
  kamera.left = -hx; kamera.right = hx; kamera.top = hy; kamera.bottom = -hy;
  kamera.near = 0.1; kamera.far = 200;
  kamera.updateProjectionMatrix();
  kamera.updateMatrixWorld(true);

  const nf = naechstesFeld(blickZiel.x, blickZiel.z);
  document.getElementById('stempel').textContent =
    'Runde ' + runde + ' · ' + aktiv().kurz + ' am Zug · ' +
    (istOben() ? 'Aufsicht' : 'Schräg ' + P.azimut + '°/' + P.neigung + '°') +
    ' · ' + P.zoom + ' Felder · Blick ' + (nf ? nf.c + ',' + nf.r : '—') +
    ' · ' + felder.size + ' Felder';
  neuZeichnen();
}

/* Das ganze Tal ins Bild holen — der alte „Füllgrad", jetzt als Handgriff. */
function ganzZeigen() {
  const w = buehne.clientWidth || 1, h = buehne.clientHeight || 1;
  const azi = P.azimut * Math.PI / 180;
  const neig = neigungJetzt() * Math.PI / 180;
  /* Breite und Höhe der Silhouette im Kamerasystem, aus den Feldecken. */
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  const cr = new THREE.Vector3(Math.cos(azi), 0, -Math.sin(azi));
  const cu = new THREE.Vector3(-Math.sin(azi) * Math.sin(neig), Math.cos(neig),
                               -Math.cos(azi) * Math.sin(neig));
  for (const f of felders())
    for (let k = 0; k < 6; k++)
      for (const y of [f.hoehen[k], UNTEN]) {
        const px = f.eck[k][0]*cr.x + y*cr.y + f.eck[k][1]*cr.z;
        const py = f.eck[k][0]*cu.x + y*cu.y + f.eck[k][1]*cu.z;
        if (px < x0) x0 = px; if (px > x1) x1 = px;
        if (py < y0) y0 = py; if (py > y1) y1 = py;
      }
  const brX = (x1 - x0) / 0.92, brY = ((y1 - y0) / 0.92) * w / h;
  P.set('zoom', Math.min(60, Math.max(5, Math.ceil(Math.max(brX, brY) / W))));
  ueberblick = true;
  blickZiel.set(inselMitte.x, 0, inselMitte.z);
  kameraStellen(); lichtStellen();
  SOT.toast('Ganzes Tal — ' + P.zoom + ' Felder breit. Schieben führt zurück.');
}

/* ============================================================================
   15 · Bildgrösse und Zeichnen
   ========================================================================= */
function groesseStellen() {
  const w = Math.max(1, buehne.clientWidth), h = Math.max(1, buehne.clientHeight);
  renderer.setSize(w, h, false);
  const dpr = renderer.getPixelRatio();
  const pw = Math.max(2, Math.floor(w * dpr)), ph = Math.max(2, Math.floor(h * dpr));
  rtScene.setSize(pw, ph);
  rtA.setSize(Math.max(2, pw >> 2), Math.max(2, ph >> 2));
  rtB.setSize(Math.max(2, pw >> 2), Math.max(2, ph >> 2));
  matEnde.uniforms.uPixel.value.set(1 / pw, 1 / ph);
  kameraStellen();
}

function durchgang(mat, ziel) {
  quad.material = mat;
  renderer.setRenderTarget(ziel);
  renderer.render(quadScene, quadCam);
}

let fpsProbe = [];
function zeichnen() {
  const t0 = performance.now();
  if (P.post > 0) {
    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene, kamera);
    matHell.uniforms.tBild.value = rtScene.texture;
    durchgang(matHell, rtA);
    matBlur.uniforms.tBild.value = rtA.texture;
    matBlur.uniforms.uRichtung.value.set(1 / rtA.width, 0);
    durchgang(matBlur, rtB);
    matBlur.uniforms.tBild.value = rtB.texture;
    matBlur.uniforms.uRichtung.value.set(0, 1 / rtA.height);
    durchgang(matBlur, rtA);
    const s = P.post / 100;
    matEnde.uniforms.tBild.value = rtScene.texture;
    matEnde.uniforms.tGlut.value = rtA.texture;
    matEnde.uniforms.uGlut.value = 0.55 * s;
    matEnde.uniforms.uSaettigung.value = 1 + 0.14 * s;
    matEnde.uniforms.uScharf.value = 0.34 * s;
    matEnde.uniforms.uVignette.value = 0.18 * s;
    durchgang(matEnde, null);
  } else {
    renderer.setRenderTarget(null);
    renderer.render(scene, kamera);
  }
  /* Die Marken hängen an der Kamera, also werden sie mit JEDEM Bild gestellt —
     auch unter `?still`, wo synchron gezeichnet wird. Es ist eine `transform`
     je Figur; das kostet den Compositor nichts und erspart die Frage, welcher
     der zwanzig Wege, die die Kamera bewegen, daran denken muss. */
  markenStellen();
  fpsProbe.push(performance.now() - t0);
  if (fpsProbe.length > 60) fpsProbe.shift();
}

/* `?still` heisst NICHT „bewegte Szene eingefroren", sondern „nur auf Zuruf
   zeichnen" — und dann SOFORT, nicht beim nächsten Bild. Der Unterschied ist
   der Bildschirmfoto-Ablauf der Werkstatt: `--virtual-time-budget` spult die
   Zeit vor; eine laufende rAF-Schleife rendert dann hunderte volle Bilder (in
   Software Minuten), eine wartende dagegen liefert einen geleerten Puffer, wenn
   das Budget zwischen Grössenänderung und nächstem Bild ausläuft. Synchron
   zeichnen umgeht beides. */
let bereit = false;
function neuZeichnen() {
  if (!bereit) return;
  if (P.still) zeichnen(); else schmutzig = true;
}
let t = 0, letzterStempel = 0, schmutzig = true;

function schleife(jetzt) {
  requestAnimationFrame(schleife);
  if (P.still) return;                     /* dort wird synchron gezeichnet */
  const dt = letzterStempel ? Math.min(0.05, (jetzt - letzterStempel) / 1000) : 0;
  letzterStempel = jetzt;
  t += dt;
  uZeit.value = t;
  hebenTakt(dt);
  regenStellen(t);
  funkenStellen(t);
  if (mWolke) mWolke.position.y = Math.sin(t * 0.32) * 0.05;
  /* Das Flackern ist EIN Wert für Licht und Flamme — sonst atmen sie
     gegeneinander und das Feuer liest sich als zwei Dinge. */
  if (feuerStelle) {
    const L = LICHT[P.zeit] || LICHT.mittag;
    const fl = 0.86 + 0.14 * Math.sin(t * 9.1) + 0.06 * Math.sin(t * 21.3);
    glutlicht.intensity = L.glut * fl;
    if (mFlamme) {
      mFlamme.scale.set(0.94 + 0.10 * fl, fl, 0.94 + 0.10 * fl);
      mFlamme.rotation.y = Math.sin(t * 2.3) * 0.18;
    }
  }
  zeichnen();
}

/* ============================================================================
   16 · Anfassen: Schieben, Drehen, Wählen
   ========================================================================= */
const strahl = new THREE.Raycaster();
const maus = new THREE.Vector2();
let gewaehlt = null, ueber = null;

function naechstesFeld(x, z) {
  let best = null, bd = Infinity;
  for (const f of felders()) {
    const d = (f.x - x) ** 2 + (f.z - z) ** 2;
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}
/* Zeiger → Feld. Über den Strahl auf das Gelände; trifft er nichts (Papier),
   wird die Grundebene geschnitten, damit auch der Rand noch antwortet. */
/* Weltpunkt → Feld, in KONSTANTER Zeit. `naechstesFeld` läuft über alle Felder;
   das ist für einen einzelnen Klick egal, aber der Auswahlstrahl unten fragt
   hundertmal je Zeigerbewegung. Aus `mitteVon` rückwärts: die Zeile folgt aus
   z, die Spalte aus x abzüglich des Zeilenversatzes. Weil sich die Zeilen
   überlappen, werden die drei Zeilen ringsum geprüft und die nächste Mitte
   gewonnen — neun Kandidaten, nicht tausend. */
function feldBei(x, z) {
  const r0 = Math.round(z / (H * 0.75));
  let best = null, bd = Infinity;
  for (let r = r0 - 1; r <= r0 + 1; r++) {
    const c0 = Math.round(x / W - (r & 1) * 0.5);
    for (let c = c0 - 1; c <= c0 + 1; c++) {
      const f = feldAn(c, r); if (!f) continue;
      const d = (f.x - x) ** 2 + (f.z - z) ** 2;
      if (d < bd) { bd = d; best = f; }
    }
  }
  /* Ausserhalb des eigenen Sechsecks liegt kein Feld — sonst „trifft" der
     Strahl neben der Karte noch das nächstbeste. */
  return best && bd <= RAD * RAD ? best : null;
}

/* Zeiger → Feld.

   NICHT mehr über den Schnitt mit dem Netz. Der lieferte den Trefferpunkt auf
   der zuerst getroffenen FLÄCHE, und in der Schrägsicht ist das bei jedem
   Höhenunterschied die FLANKE der Kachel davor. Die Rückrechnung
   `naechstesFeld(p.x, p.z)` landete dann auf der Mitte, die dieser Flanke am
   nächsten lag — also systematisch auf dem erhöhten Feld VOR dem, auf das man
   zeigte. Sichtbar wurde es erst mit dem Niederdrücken: von einem Plateau auf
   ein flaches Feld daneben zu tippen wählte zuverlässig das Plateau, und der
   Schritt kam nie zustande.

   Stattdessen wird der Strahl über das HÖHENFELD geschritten: an jedem Schritt
   das Feld unter (x,z) nachschlagen und prüfen, ob der Strahl schon unter
   dessen Deckfläche liegt. Das erste solche Feld ist das, worauf man zeigt —
   erhöht oder nicht. Nebenwirkung, und eine erwünschte: der BEWUCHS spielt
   dabei keine Rolle mehr. Ein Baum ist kein Gelände; durch ihn hindurch zeigt
   man auf das Feld, auf dem er steht.

   Was von einem Berg verdeckt ist, bleibt unerreichbar — das ist richtig so,
   und `T` ebnet dafür ein. */
const PICK_SCHRITT = 0.055;
function feldUnter(ev) {
  if (!mGelaende) return null;
  const b = leinwand.getBoundingClientRect();
  maus.x = ((ev.clientX - b.left) / b.width) * 2 - 1;
  maus.y = -((ev.clientY - b.top) / b.height) * 2 + 1;
  strahl.setFromCamera(maus, kamera);
  const o = strahl.ray.origin, d = strahl.ray.direction;
  const yMax = inselHoch + 0.5;
  /* Bei senkrechtem Blick (Aufsicht) ist d.y ≈ −1; bei flachem Blick wird die
     Strecke länger. Beides deckt derselbe Bereich ab: von oberhalb des
     höchsten Punktes bis auf die Grundplatte. */
  if (Math.abs(d.y) < 1e-6) return null;
  const t0 = Math.max(0, (yMax - o.y) / d.y);
  const t1 = (UNTEN - o.y) / d.y;
  if (!(t1 > t0)) return null;
  for (let t = t0; t <= t1; t += PICK_SCHRITT) {
    const f = feldBei(o.x + d.x * t, o.z + d.z * t);
    if (f && o.y + d.y * t <= flaecheVon(f)) return f;
  }
  /* Nichts getroffen: das Feld an der Grundplatte — damit antwortet auch der
     leere Rand noch, statt gar nicht. */
  return feldBei(o.x + d.x * t1, o.z + d.z * t1);
}
/* Zeigerbewegung → Weltverschiebung auf der Grundebene. Waagrecht entspricht
   der Kamera-Rechtsachse; senkrecht der Blickrichtung am Boden, und die wird
   durch die Neigung gestaucht — darum das Teilen durch sin(Neigung). */
function schiebeAchsen() {
  const azi = P.azimut * Math.PI / 180;
  const neig = Math.max(12, neigungJetzt()) * Math.PI / 180;
  const w = Math.max(1, buehne.clientWidth), h = Math.max(1, buehne.clientHeight);
  const hx = P.zoom * W / 2, hy = hx * h / w;
  return {
    rechts:{ x:Math.cos(azi), z:-Math.sin(azi) },
    vor:{ x:Math.sin(azi), z:Math.cos(azi) },
    sx:(2 * hx) / w,
    sz:(2 * hy) / h / Math.sin(neig)
  };
}

let zieht = null, zogGerade = false;
leinwand.addEventListener('pointerdown', ev => {
  /* Ein Ziehen, das AUSSERHALB der Leinwand endet, bekommt nie sein `click` —
     die Sperre bliebe stehen und frässe den nächsten echten Klick. Hier ist
     der sichere Ort, sie zurückzunehmen: vor jeder neuen Geste. */
  zogGerade = false;
  zieht = { x:ev.clientX, y:ev.clientY, weit:0, dreht:ev.shiftKey || ev.button === 2,
            a:P.azimut, n:P.neigung, zx:blickZiel.x, zz:blickZiel.z };
  leinwand.setPointerCapture(ev.pointerId);
  leinwand.classList.add('zieht');
});
leinwand.addEventListener('contextmenu', ev => ev.preventDefault());
/* EIN pointermove für alles: zeigen, schieben, drehen. Zwei Zuhörer würden
   während des Ziehens jedes Bild einen Strahl schiessen. */
leinwand.addEventListener('pointermove', ev => {
  if (!zieht) {
    if (ev.pointerType === 'touch') return;
    const f = feldUnter(ev);
    if (f !== ueber) {
      ueber = f;
      /* Der Zeigerring SAGT etwas, seit die Leute gehen: in der Klanfarbe
         heisst „hier kann der Gewählte hin", in Grau heisst „nur ansehen".
         Vorher war er immer grau und man erfuhr erst beim Klicken, ob ein
         Feld ein Ziel ist. */
      if (mRingHover) {
        const L = gewaehlteEinheit && LEUTE.find(x => x.id === gewaehlteEinheit);
        const ziel = f && L && L.klan === aktiv().id && istErreichbar(L, f);
        mRingHover.material.color.copy(ziel ? PAL.klan[aktiv().id] : PAL.neutral);
        leinwand.classList.toggle('ziel', !!ziel);
      }
      ringSetzen(mRingHover, f && f !== gewaehlt ? f : null);
    }
    return;
  }
  const dx = ev.clientX - zieht.x, dy = ev.clientY - zieht.y;
  zieht.weit = Math.max(zieht.weit, Math.abs(dx) + Math.abs(dy));
  if (zieht.weit < 5) return;
  if (mRingHover) mRingHover.visible = false;
  if (zieht.dreht) {
    P.azimut = ((Math.round(zieht.a - dx * 0.4) % 360) + 360) % 360;
    P.neigung = Math.max(12, Math.min(80, Math.round(zieht.n + dy * 0.25)));
    kameraStellen();
    if (P.lichtdreht) lichtStellen();
  } else {
    ueberblick = false;                  /* Schieben gilt wieder der Regel */
    const A = schiebeAchsen();
    blickZiel.x = zieht.zx - A.rechts.x * dx * A.sx - A.vor.x * dy * A.sz;
    blickZiel.z = zieht.zz - A.rechts.z * dx * A.sx - A.vor.z * dy * A.sz;
    kameraStellen();
    lichtStellen();
  }
});
addEventListener('pointerup', () => {
  if (!zieht) return;
  leinwand.classList.remove('zieht');
  if (zieht.weit > 5) {
    zogGerade = true;
    /* Der Stand ist die URL — ein gefundener Blick muss teilbar sein. */
    const nf = naechstesFeld(blickZiel.x, blickZiel.z);
    if (nf) P.set('blick', nf.c + ',' + nf.r);
    if (zieht.dreht) { P.set('azimut', P.azimut); P.set('neigung', P.neigung); }
  }
  zieht = null;
});
leinwand.addEventListener('click', ev => {
  /* Ein Ziehen endet ebenfalls in einem `click`. Ohne diese Sperre wählt jedes
     Schieben ein Feld — und die Feldkarte springt beim Loslassen auf. */
  if (zogGerade) { zogGerade = false; return; }
  const f = feldUnter(ev);
  /* Ist jemand gewählt und liegt das Feld in SEINEM Saum, ist der Klick ein
     Schritt und keine Auswahl. Sonst gäbe es keinen Weg, ein Feld unter den
     eigenen Füssen nur anzusehen. */
  if (f && gewaehlteEinheit) {
    const L = LEUTE.find(x => x.id === gewaehlteEinheit);
    if (L && L.klan === aktiv().id && istErreichbar(L, f)) { gehen(L, f); return; }
  }
  waehlen(f);
});
leinwand.addEventListener('wheel', ev => {
  ev.preventDefault();
  const z = Math.max(5, Math.min(60, P.zoom + (ev.deltaY > 0 ? 2 : -2)));
  if (z === P.zoom) return;
  P.set('zoom', z);
  kameraStellen(); lichtStellen();
}, { passive:false });

/* --------------------------------------------------- Zwei Sichthilfen --------
   Beide sind Bedienung, nicht Bild: was verdeckt ist, kann man nicht antippen.

   `Alt` (halten) macht den BEWUCHS durchsichtig. Ein Wald deckt sein eigenes
   Feld zu; durch ihn hindurch sieht man wieder den Boden. Die Leute behalten
   ihr eigenes Material und bleiben darum sichtbar — sie mit verschwinden zu
   lassen wäre das Gegenteil von hilfreich.

   `T` ebnet das GELÄNDE ein. Gemeint war ursprünglich Strg+T; das vergibt
   Chrome für „neuer Tab" und lässt es eine Seite nicht abfangen — kein
   `preventDefault` hilft dagegen. Darum die blanke Taste.

   Der Auswahlstrahl selbst braucht keine der beiden: er läuft über das
   Höhenfeld und kennt den Bewuchs gar nicht. Sie helfen dem AUGE, nicht dem
   Zeiger — man muss sehen, wohin man tippt. */
let durchsichtAn = false;
function durchsichtSetzen(an) {
  if (an === durchsichtAn || !matSonstiges) return;
  durchsichtAn = an;
  matSonstiges.transparent = an;
  matSonstiges.opacity = an ? 0.22 : 1;
  matSonstiges.depthWrite = !an;
  matSonstiges.needsUpdate = true;
  /* Ein durchsichtiger Wald, der einen vollen Schatten wirft, sieht nach
     Fehler aus — der Schatten geht mit. */
  if (mSonstiges) mSonstiges.castShadow = !an;
  neuZeichnen();
}
function flachSetzen(an) {
  if (an === flachAn) return;
  flachAn = an;
  P.set('flach', an || null);
  hebenAlleSchreiben();
  lichtStellen();
  SOT.toast(an ? 'Gelände eingeebnet — nur die Hebung bleibt' : 'Gelände wieder in voller Höhe');
}
addEventListener('keyup', ev => { if (ev.key === 'Alt') durchsichtSetzen(!!P.durchsicht); });
/* Verlässt das Fenster den Vordergrund, kommt das `keyup` nie an — ohne das
   hier bliebe der Wald durchsichtig hängen. */
addEventListener('blur', () => durchsichtSetzen(!!P.durchsicht));

addEventListener('keydown', ev => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target || {}).tagName || '')) return;
  if (ev.key === 'Alt') { ev.preventDefault(); durchsichtSetzen(true); return; }
  if (ev.key === 't' || ev.key === 'T') { flachSetzen(!flachAn); return; }
  const A = schiebeAchsen(), s = (ev.shiftKey ? 3 : 1) * W;
  let hin = null;
  if (ev.key === 'ArrowLeft')  hin = [-A.rechts.x * s, -A.rechts.z * s];
  else if (ev.key === 'ArrowRight') hin = [A.rechts.x * s, A.rechts.z * s];
  else if (ev.key === 'ArrowUp')    hin = [-A.vor.x * s, -A.vor.z * s];
  else if (ev.key === 'ArrowDown')  hin = [A.vor.x * s, A.vor.z * s];
  else if (ev.key === '[' || ev.key === ']') {
    P.set('azimut', ((P.azimut + (ev.key === '[' ? -15 : 15)) % 360 + 360) % 360);
    kameraStellen(); if (P.lichtdreht) lichtStellen(); return;
  } else if (ev.key === 'Enter') {
    /* Enter = Zug beenden. Die Front zehn Runden laufen zu sehen ist die
       eigentliche Prüfung dieses Durchgangs, und zehnmal zielen lenkt ab. */
    ev.preventDefault(); zugBeenden(); return;
  } else return;
  ev.preventDefault();
  blickZiel.x += hin[0]; blickZiel.z += hin[1];
  kameraStellen(); lichtStellen();
  const nf = naechstesFeld(blickZiel.x, blickZiel.z);
  if (nf) P.set('blick', nf.c + ',' + nf.r);
});

function waehlen(f) {
  gewaehlt = f;
  ringSetzen(mRing, f);
  const k = document.getElementById('feldkarte');
  if (!f) { k.classList.add('hid'); P.set('wahl', null); return; }
  P.set('wahl', f.c + ',' + f.r);
  const nb = SOT.hex.neighbors(f.c, f.r)
    .map(n => { const g = feldAn(n.c, n.r); return n.dir + ' ' + (g ? g.G.name : '—'); });
  const wer = LEUTE.find(L => L.c === f.c && L.r === f.r);
  const K = aktiv();
  const w = K.druck ? K.druck[f.i] : 0;
  const zustand = f.sichtbar ? 'in Sicht'
    : (w >= DRUCK_VOLL ? 'vergessen — ganz unten'
    : (w > DRUCK_EIN ? 'sackt gerade ab' : 'Erinnerung'));
  const wa = f.wasser;
  const fallWort = { fall:'Wasserfall', schnelle:'Stromschnelle' }[wa && wa.faelle[wa.ab]] || '—';
  k.innerHTML =
    '<div class="kopf">' + SOT.icon(GZEICHEN[f.t] || 'hexfeld') +
      '<b>' + f.G.name + '</b><span class="co">' + f.c + ',' + f.r + '</span></div>' +
    (wer ? '<div class="kv"><span>Hier steht</span><b>' + wer.name + ' · ' +
             klanVon(wer.klan).kurz + '</b></div>' : '') +
    /* Wasser ist eine EIGENSCHAFT des Feldes, kein zweiter Name für sein
       Gelände — die Karteikarte zeigt es darum als eigene Zeilen. */
    (wa
      ? '<div class="kv"><span>Wasser</span><b>' + wa.kl.name + '</b></div>' +
        '<div class="kv"><span>Abfluss nach</span><b>' +
          (wa.rand ? 'aus der Karte' : wa.ab) + '</b></div>' +
        '<div class="kv"><span>Zufluss aus</span><b>' +
          (wa.zu.length ? wa.zu.map(z => z.dir).join(' · ') : 'Quelle') + '</b></div>' +
        '<div class="kv"><span>Menge</span><b>' + wa.q.toFixed(1) + '</b></div>' +
        '<div class="kv"><span>Stufe</span><b>' + fallWort + '</b></div>'
      : '<div class="kv"><span>Wasser</span><b>—</b></div>') +
    '<div class="kv"><span>Höhe</span><b>' + f.hoehe.toFixed(2) +
      (f.senke ? ' · aufgestaut' : '') + '</b></div>' +
    '<div class="kv"><span>Für ' + K.kurz + '</span><b>' + zustand + '</b></div>' +
    '<div class="kv"><span>Druck / Hebung</span><b>' + w.toFixed(2) + ' / ' +
      (f.hIst === undefined ? '1.00' : f.hIst.toFixed(2)) + '</b></div>' +
    '<div class="kv"><span>Erreichbar</span><b>' +
      (erreichbar.has(schluessel(f.c, f.r)) ? 'ja' : 'nein') + '</b></div>' +
    '<div class="nb">' + nb.map(s => '<span>' + s + '</span>').join('') + '</div>' +
    '<p class="note">Der Zufluss ist <b>abgeleitet</b>, nicht gespeichert: es sind die ' +
    'Nachbarn, deren Abfluss hierher zeigt. Darum kann ein Lauf nicht reissen.<br>' +
    'Der <b>Druck</b> gehört dem Klan, nicht dem Feld — für den anderen steht hier eine ' +
    'andere Zahl. Die <b>Hebung</b> ist seine Gegenzahl und zugleich die Höhe, in der ' +
    'das Feld gerade steht.</p>';
  k.classList.remove('hid');
}

/* ============================================================================
   17 · Klankarte, Einheitenkarten, Zugwechsel
   ========================================================================= */
const kFarbe = id => 'var(--d-klan-' + (id === 'oben' ? 'o' : 'u') + ')';

/* Beide Klane in EINER Karte. Der am Zug steht offen (Balken, Zahlen), der
   andere zusammengeklappt — aber seine Kultur bleibt einstellbar. Ohne das
   müsste man für jeden Vergleich den Zug wechseln, und der Vergleich der
   beiden Vergessenstempi ist die Prüffrage dieses Durchgangs. */
function klankarteBauen() {
  const el = document.getElementById('klankarte');
  el.innerHTML = KLANE.map((K, i) => {
    const dran = i === amZug;
    const z = dran ? frontZaehlen(K) : null;
    const ges = z ? Math.max(1, z.sicht + z.erinnert + z.vergessen) : 1;
    return '<div class="kzeile' + (dran ? ' aktiv' : '') + '" style="--kf:' + kFarbe(K.id) + '">' +
      '<div class="kkopf">' + SOT.icon('lager') + '<b>' + K.name + '</b>' +
        (dran ? '<span class="zug">Runde ' + runde + '</span>' : '') + '</div>' +
      '<div class="ew"><span>Kultur</span>' +
        '<button class="small" data-k="' + K.id + '" data-d="-1">−</button>' +
        '<b>' + K.kultur + '</b>' +
        '<button class="small" data-k="' + K.id + '" data-d="1">+</button></div>' +
      '<p class="knote">' + (K.kultur <= 0
        ? '<b>Kein Gedächtnis.</b> Was gerade niemand ansieht, ist im selben ' +
          'Augenblick vergessen — die Front ist unendlich schnell.'
        : 'Die Front rückt <b>1 Feld je ' + K.kultur + ' Runde' +
          (K.kultur === 1 ? '' : 'n') + '</b> über die Erinnerung.') + '</p>' +
      (dran
        ? '<div class="wbalken">' +
            '<i class="s" style="flex:' + (z.sicht / ges) + '"></i>' +
            '<i class="e" style="flex:' + (z.erinnert / ges) + '"></i>' +
            '<i class="w" style="flex:' + (z.vergessen / ges) + '"></i></div>' +
          '<div class="wlegende">' +
            '<span><i style="background:' + kFarbe(K.id) + '"></i>Sicht ' + z.sicht + '</span>' +
            '<span><i style="background:var(--ink2)"></i>Erinnert ' + z.erinnert + '</span>' +
            '<span><i style="background:var(--d-umriss)"></i>Vergessen ' + z.vergessen + '</span>' +
          '</div>'
        : '') +
    '</div>';
  }).join('');
  el.querySelectorAll('button[data-k]').forEach(b => {
    b.addEventListener('click', () => {
      const K = klanVon(b.dataset.k);
      const neu = Math.max(0, Math.min(8, K.kultur + Number(b.dataset.d)));
      if (neu === K.kultur) return;
      K.kultur = neu; P.set(K.pK, neu);
      /* Kultur 0 wirkt SOFORT (ihr Festpunkt hängt an keiner Runde) — also
         muss das Bild hier schon nachziehen, nicht erst am Zugende. */
      sichtRechnen(); nebelAnwenden(false); leuteBauen(); markenBauen();
      klankarteBauen();
      SOT.toast(K.kurz + ': Kultur ' + neu + (neu === 0
        ? ' — kein Gedächtnis'
        : ' — 1 Feld je ' + neu + (neu === 1 ? ' Runde' : ' Runden')));
    });
  });
}

/* Nur die Leute des Klans am Zug. Die anderen zwei stehen auf dem Brett, aber
   sie gehören dem Gegenüber — ihre Regler hier zu zeigen wäre ein Blick in
   fremde Karten. Über das Reglerbrett (`?ujsicht=` …) sind sie trotzdem
   erreichbar: dies ist ein Labor, kein Spiel. */
function leuteKartenBauen() {
  const wrap = document.getElementById('leute');
  wrap.innerHTML = leuteVon(aktiv().id).map(L =>
    '<div class="einheit' + (gewaehlteEinheit === L.id ? ' sel' : '') + '" data-id="' + L.id + '">' +
      '<div class="ekopf">' + SOT.icon(L.icon) + '<b>' + L.name + '</b>' +
        '<span class="ort">' + L.c + ',' + L.r + '</span></div>' +
      '<div class="ewerte">' +
        wertZeile(L, 'sicht', 'Sicht') + wertZeile(L, 'tempo', 'Tempo') +
      '</div>' +
      (gewaehlteEinheit === L.id
        ? '<p class="ehint">Ein Feld im Saum antippen — dorthin gehen.<br>' +
          '<b>Alt</b> halten: Bewuchs durchsichtig · <b>T</b>: Gelände flach</p>' : '') +
    '</div>').join('');
  wrap.querySelectorAll('.einheit').forEach(el => {
    el.addEventListener('click', ev => {
      if (ev.target.closest('button')) return;
      einheitWaehlen(el.dataset.id);
    });
    /* Über der Karte zeigen — die Marke auf dem Brett leuchtet mit. */
    el.addEventListener('mouseenter', () => betonen(el.dataset.id, true));
    el.addEventListener('mouseleave', () => betonen(el.dataset.id, false));
  });
  wrap.querySelectorAll('button[data-w]').forEach(b => {
    b.addEventListener('click', ev => {
      ev.stopPropagation();
      const L = LEUTE.find(x => x.id === b.dataset.id);
      const w = b.dataset.w, d = Number(b.dataset.d);
      const neu = Math.max(0, Math.min(14, L[w] + d));
      if (neu === L[w]) return;
      L[w] = neu;
      P.set(w === 'sicht' ? L.pS : L.pT, neu);
      sichtRechnen();
      /* Nicht `alles`: mehr Sicht hebt genau die neu gesehenen Felder, und
         DIE sollen sichtbar hochkommen statt umzuspringen. */
      nebelAnwenden(false);
      leuteBauen();
      markenBauen();
      reichweiteZeichnen();
      kameraStellen();          /* die Klemme kann enger geworden sein */
      klankarteBauen();
      leuteKartenBauen();
    });
  });
}

/* ------------------------------------------------------------- Das Gehen -----
   Der Zug selbst. Er ist ABSICHTLICH billig: kein Verbrauch, keine Grenze von
   einem Schritt je Runde — das Labor prüft, was die Front tut, wenn Leute sich
   bewegen, und dafür will man gehen können, ohne zu haushalten. Die einzige
   Grenze ist das Tempo der Figur.

   Wasser ist begehbar. Furten und Übergänge sind eine eigene Frage
   (`gewaesser-labor-v4`), und sie hier zu erfinden hiesse, eine Regel zu
   setzen, die dieses Labor nicht prüfen kann.
   --------------------------------------------------------------------------- */
/* `SOT.hex.dist` nimmt zwei FELDER, nicht vier Zahlen. */
const istErreichbar = (L, f) => SOT.hex.dist(L, f) <= L.tempo;

function gehen(L, f) {
  if (L.c === f.c && L.r === f.r) { waehlen(f); return; }
  L.c = f.c; L.r = f.r;
  sichtRechnen();
  /* Ohne `alles`: das Land vor der Figur soll sichtbar HOCHKOMMEN und das
     hinter ihr absacken. Genau dafür ist die Senkung da. */
  nebelAnwenden(false);
  leuteBauen();
  markenBauen();
  reichweiteZeichnen();
  klankarteBauen();
  leuteKartenBauen();
  waehlen(f);
  kameraStellen(); lichtStellen();
  P.set('blick', f.c + ',' + f.r);
}
const wertZeile = (L, w, txt) =>
  '<div class="ew"><span>' + txt + '</span>' +
  '<button class="small" data-id="' + L.id + '" data-w="' + w + '" data-d="-1">−</button>' +
  '<b>' + L[w] + '</b>' +
  '<button class="small" data-id="' + L.id + '" data-w="' + w + '" data-d="1">+</button></div>';

/* ------------------------------------------------------------- Die Marken ---
   Eine Marke je gezeichneter Figur. Gebaut wird sie, wenn sich ändert WER da
   ist; gestellt wird sie bei jedem Bild, weil sie an der Kamera hängt.

   Beides getrennt zu halten ist der ganze Trick: Bauen heisst `innerHTML` und
   neue Zuhörer, Stellen heisst eine einzige `transform` — das eine darf nicht
   sechzigmal je Sekunde passieren, das andere muss.
   --------------------------------------------------------------------------- */
let marken = [];
const markenLage = new THREE.Vector3();
function markenBauen() {
  const wrap = document.getElementById('marken');
  const K = aktiv();
  const zeigen = LEUTE.filter(L =>
    feldAn(L.c, L.r) && (L.klan === K.id || K.sicht.has(schluessel(L.c, L.r))));
  wrap.innerHTML = zeigen.map(L => {
    const eigen = L.klan === K.id;
    return '<button class="marke' + (eigen ? '' : ' fremd') +
      (gewaehlteEinheit === L.id ? ' sel' : '') + '" data-id="' + L.id + '"' +
      ' style="--mk:' + kFarbe(L.klan) + '"' +
      ' title="' + L.name + ' · ' + klanVon(L.klan).kurz + '">' + SOT.icon(L.icon) + '</button>';
  }).join('');
  marken = [...wrap.querySelectorAll('.marke')].map(el => ({
    el, L: LEUTE.find(x => x.id === el.dataset.id)
  }));
  for (const m of marken) {
    if (m.L.klan !== K.id) continue;
    m.el.addEventListener('click', ev => { ev.stopPropagation(); einheitWaehlen(m.L.id); });
    m.el.addEventListener('mouseenter', () => betonen(m.L.id, true));
    m.el.addEventListener('mouseleave', () => betonen(m.L.id, false));
  }
  markenStellen();
}
/* Weltpunkt → Bildpunkt. Der Punkt ist der KOPF der Figur, nicht ihr Feld:
   die Marke soll an der Person hängen, auch wenn das Feld gerade steigt. */
function markenStellen() {
  if (!marken.length || !kamera) return;
  const w = leinwand.clientWidth, h = leinwand.clientHeight;
  for (const m of marken) {
    const f = feldAn(m.L.c, m.L.r);
    if (!f) { m.el.style.display = 'none'; continue; }
    const heb = hebVon(f);
    markenLage.set(f.x, UNTEN + (hoeheAn(f, 0, 0) + offVon(f) - UNTEN) * heb + 0.17, f.z);
    markenLage.project(kamera);
    m.el.style.display = '';
    m.el.style.transform = 'translate(' + Math.round((markenLage.x * 0.5 + 0.5) * w) +
                           'px,' + Math.round((-markenLage.y * 0.5 + 0.5) * h) + 'px)';
  }
}
/* Karte und Marke zeigen auf dasselbe — also leuchten sie gemeinsam auf. Das
   ist der Sinn der Übung: man soll sehen, WO auf dem Brett steht, was hier
   rechts in der Liste steht. */
function betonen(id, an) {
  for (const m of marken) if (m.L.id === id) m.el.classList.toggle('hover', an);
  document.querySelectorAll('#leute .einheit').forEach(el =>
    { if (el.dataset.id === id) el.classList.toggle('hover', an); });
}
/* EIN Weg, eine Einheit zu wählen — Karte und Marke rufen beide hierher. */
function einheitWaehlen(id) {
  const L = LEUTE.find(x => x.id === id); if (!L) return;
  gewaehlteEinheit = gewaehlteEinheit === id ? null : id;
  reichweiteZeichnen();
  zuEinheit(L);
  leuteKartenBauen();
  markenBauen();
}

function zuEinheit(L) {
  const f = feldAn(L.c, L.r); if (!f) return;
  ueberblick = false;
  blickZiel.set(f.x, 0, f.z);
  kameraStellen(); lichtStellen();
  P.set('blick', L.c + ',' + L.r);
  waehlen(f);
}

/* --------------------------------------------------------- Der Zugwechsel ---
   „Zug beenden" tut ZWEI Dinge, und die Reihenfolge ist die Regel: erst altert
   die Erinnerung des Klans, der gespielt hat (ein Diffusionsschritt), dann
   kommt der andere an die Reihe. Wer nichts tut, verliert Karte — das ist der
   ganze Druck, den dieses Labor prüfen will.

   Neu gebaut wird beim Wechsel nichts ausser der Decke: Gelände, Wasser und
   Bewuchs sind für beide Klane dasselbe Netz, es wird nur anders eingefärbt. */
/* `?wandern=` geht, ohne dass jemand klicken muss: jede Figur zieht das Tal
   entlang (der Oberlauf talwärts, die Mündung bergwärts), immer auf die
   Nachbarzelle, die der Talachse am nächsten liegt. Die Sicht wird nach jedem
   Schritt neu gerechnet, also entsteht dieselbe Spur wie beim Gehen von Hand —
   und genau darum ist der Griff auch die Probe: er läuft durch `sichtRechnen`,
   nicht daran vorbei. Mit Kultur 0 bleibt keine Spur; das ist der Punkt. */
function wandernVorspulen(n) {
  for (let i = 0; i < n; i++) {
    for (const L of LEUTE) {
      const dr = klanVon(L.klan).zeile < 0.5 ? 1 : -1;
      let best = null, bd = Infinity;
      for (const q of SOT.hex.neighbors(L.c, L.r)) {
        const g = feldAn(q.c, q.r);
        if (!g || (g.r - L.r) * dr <= 0) continue;
        const d = Math.abs(g.c - achseBei(g.r));
        if (d < bd) { bd = d; best = g; }
      }
      if (best) { L.c = best.c; L.r = best.r; }
    }
    sichtRechnen();
  }
}

/* Die REGEL für sich — ohne Bild. `?zuege=` läuft dieselbe Regel N-mal und
   zeichnet erst danach; sonst baute ein Bildschirmfoto von Runde zwölf die
   Decke zwölfmal umsonst. */
function zugRechnen() {
  frontSchieben(aktiv());
  amZug = (amZug + 1) % KLANE.length;
  if (amZug === 0) runde++;
}
function zugBeenden() {
  zugRechnen();
  P.set('amzug', aktiv().id);
  zugAnzeigen(true);
  SOT.toast('Runde ' + runde + ' · ' + aktiv().name + ' am Zug');
}

/* Alles, was am aktiven Klan hängt, auf den Stand bringen. */
function zugAnzeigen(hinschauen) {
  gewaehlteEinheit = null;
  sichtRechnen();
  nebelAnwenden(true);
  leuteBauen();
  markenBauen();
  reichweiteZeichnen();
  feuerStelle = feuerStellen[aktiv().id] || null;
  flammeBauen();
  klankarteBauen();
  leuteKartenBauen();
  if (hinschauen) {
    const L = leuteVon(aktiv().id)[0], f = L && feldAn(L.c, L.r);
    if (f) { ueberblick = false; blickZiel.set(f.x, 0, f.z); P.set('blick', f.c + ',' + f.r); }
  }
  kameraStellen(); lichtStellen();
  if (gewaehlt) waehlen(gewaehlt);
}

/* ============================================================================
   18 · Legende und Messblatt
   ========================================================================= */
function legendeBauen() {
  const zaehl = {}, wz = {};
  let wn = 0, faelle = 0, muendungen = 0;
  for (const f of felders()) {
    zaehl[f.t] = (zaehl[f.t] || 0) + 1;
    if (!f.wasser) continue;
    wn++;
    wz[f.wasser.kl.name] = (wz[f.wasser.kl.name] || 0) + 1;
    if (f.wasser.faelle[f.wasser.ab] === 'fall') faelle++;
    if (f.wasser.zu.length >= 2) muendungen++;
  }
  /* Gelände und Wasser stehen NEBENEINANDER in der Legende — genau das ist
     die Umstellung: ein Feld kann beides sein. */
  const gel = Object.keys(zaehl).sort((a, b) => zaehl[b] - zaehl[a])
    .map(t => '<span class="chip" title="' + GELAENDE[t].name + '">' +
      SOT.icon(GZEICHEN[t] || 'hexfeld') + GELAENDE[t].name + ' ' + zaehl[t] + '</span>').join('');
  const was = wn
    ? '<span class="chip on" title="Felder, durch die Wasser läuft">' +
        SOT.icon('stromschnelle') + 'Wasser ' + wn + '</span>' +
      Object.keys(wz).map(k => '<span class="chip" title="Breitenklasse">' + k + ' ' + wz[k] + '</span>').join('') +
      (muendungen ? '<span class="chip">' + SOT.icon('furt') + 'Zusammenfluss ' + muendungen + '</span>' : '') +
      (faelle ? '<span class="chip">' + SOT.icon('wasserfall') + 'Sturz ' + faelle + '</span>' : '')
    : '';
  document.getElementById('legende').innerHTML = gel + was;
}
const zeile = (s, v) => '<tr><td class="s">' + s + '</td><td class="v">' + v + '</td></tr>';
const punkt = (n, kopf, txt) =>
  '<li><span class="sterne">' + '★'.repeat(n) + '</span> <b>' + kopf + '</b> — ' + txt + '</li>';
function grafikName() {
  try {
    const gl = renderer.getContext();
    const e = gl.getExtension('WEBGL_debug_renderer_info');
    const s = e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.VERSION);
    return String(s).replace(/\s*\(.*$/, '').slice(0, 42);
  } catch (e) { return '—' }
}
function messblattFuellen() {
  const inf = renderer.info.render;
  const mittel = fpsProbe.length ? fpsProbe.reduce((a, b) => a + b, 0) / fpsProbe.length : 0;
  const n = (x) => x.toLocaleString('de-CH');
  document.getElementById('messinhalt').innerHTML =
    '<h3>Gemessen</h3><table class="mtab">' +
    zeile('Felder', n(felder.size)) +
    zeile('Zeichenaufrufe', inf.calls) +
    zeile('Dreiecke gezeichnet', n(inf.triangles)) +
    zeile('davon Gelände / Bewuchs', n(messung.gel) + ' / ' + n(messung.bew)) +
    zeile('davon Umrisse', n(felder.size * 12) + ' (feste Grösse)') +
    zeile('Zeichnen ⌀ CPU (60)', mittel.toFixed(2) + ' ms') +
    zeile('Bauzeit der Welt', messung.bauzeit.toFixed(0) + ' ms') +
    zeile('Geometrien / Texturen',
      renderer.info.memory.geometries + ' / ' + renderer.info.memory.textures) +
    zeile('Runde / am Zug', runde + ' / ' + aktiv().kurz) +
    KLANE.map(K => {
      const z = frontZaehlen(K);
      return zeile(K.kurz + ' (Kultur ' + K.kultur + ')',
        z.sicht + ' Sicht · ' + z.erinnert + ' erinnert · ' + z.vergessen + ' vergessen');
    }).join('') +
    zeile('In Sicht / erreichbar', sichtbareFelder.size + ' / ' + erreichbar.size) +
    zeile('Wasserfelder', [...felders()].filter(f => f.wasser).length +
      ' (Schwelle ' + THR.toFixed(1) + ')') +
    zeile('Maßstab', P.zoom + ' Felder breit') +
    zeile('Nachbearbeitung', P.post > 0 ? P.post + ' % (4 Durchgänge)' : 'aus') +
    zeile('Schatten', P.schatten +
      (P.schatten !== 'aus' ? (P.schatten === 'weich' ? ' · VSM 1024²' : ' · PCF 1024²') : '')) +
    zeile('Renderer', grafikName()) +
    '</table>' +
    '<p class="note">Gemessen ist die <b>CPU-Zeit</b> der Zeichenaufrufe, nicht die Zeit ' +
    'der Grafikkarte — der Treiber arbeitet asynchron weiter. Als Belastungsmass taugt sie ' +
    'trotzdem: sie zeigt, was JavaScript je Bild kostet. Steht oben <b>SwiftShader</b>, ' +
    'läuft WebGL in Software (headless Chrome) — dann sagen nur Zeichenaufrufe und ' +
    'Dreiecke etwas.</p>' +

    '<h3>Der Befund</h3>' +
    '<p class="urteil">Die ganze Karte hängt an <b>' + inf.calls + ' Zeichenaufrufen</b>. ' +
    'Das ist die Antwort auf die Prüffrage: nicht die Zahl der Felder entscheidet, sondern ' +
    'die Zahl der Netze — und die bleibt gleich, ob das Tal ' + n(felder.size) + ' Felder hat ' +
    'oder zehnmal so viele. Drehen, Neigen, Tageszeit, Regen und der Nebel kosten nichts ' +
    'extra: der Nebel schreibt in einen bestehenden Farbpuffer, statt neu zu bauen.</p>' +

    '<h3>Was dieses Labor macht</h3><ul class="urteil">' +
    punkt(5, 'Orthografische Kamera', 'Maßstab in FELDERN, nicht in Weltmetern. Aufsicht und Schrägsicht am selben Ziel; senkrecht kippt der Aufwärtsvektor auf Norden, sonst entartet <code>lookAt</code>.') +
    punkt(5, 'Klobige, unregelmässige Hex-Prismen', 'Ecken gestört, Kacheln geschrumpft, Nähte ungleich. <code>?unruhe=0</code> zeigt den Unterschied.') +
    punkt(5, 'Weiches Licht + Kontaktverschattung', 'VSM-Schlagschatten; AO ist <b>in die Eckenfarben gebacken</b> (Kante zum höheren Nachbarn, Flanke nach unten) statt SSAO — kein Addon, steuerbar über <code>?ao=</code>.') +
    punkt(5, 'Handgemalte Palette', 'Alle Töne sind CSS-Tokens; je Ecke ein anderer Nachbarton. Nacht und Tageszeit drehen die ganze Welt mit.') +
    punkt(5, 'Das Tal ist gerechnet — erst die Höhe, dann das Wasser', 'Höhenfeld (Talachse, Flanken, Gefälle) → Senken füllen (Priority-Flood) → Abflussrichtung je Feld (steilster Nachbar, D6) → Menge talwärts akkumuliert. Ab einer Schwelle trägt ein Feld Wasser; Zuflüsse und Zusammenflüsse entstehen dabei von selbst.') +
    punkt(5, 'Wasser ist kein Gelände', 'Ein Feld hat eine <b>Abflusskante</b> und eine Menge — kein Feld ist „Fluss". Der Zufluss wird ABGELEITET (die Nachbarn, deren Abfluss hierher zeigt), darum kann ein Lauf nicht reissen. Gezeichnet wird je Feld: Speichen von den Kantenmitten zum Durchgangspunkt, bei zwei Kanten eine glatte Kurve. Modell und Kantenvertrag aus <code>gewaesser-labor-v4</code>.') +
    punkt(5, 'Marken statt Figuren anfassen', 'Eine Person im Diorama ist rund ein Zehntel einer Feldbreite hoch — bei dreissig Feldern im Bild ein paar Bildpunkte, im Wald hinter Bäumen, die dreimal so hoch sind. Sie ist weder zu finden noch zu treffen. Jede gezeichnete Figur bekommt darum eine <b>Marke</b>: HTML über der Leinwand, in Weltkoordinaten gesetzt, aber in Bildpunkten gross — dieselbe Entscheidung wie beim ganzen Kopf dieser Datei. Gebaut wird sie, wenn sich ändert WER da ist; <b>gestellt</b> bei jedem Bild, weil sie an der Kamera hängt: eine <code>transform</code> je Figur, die den Compositor nichts kostet und die Frage erspart, welcher der zwanzig Wege, die die Kamera bewegen, daran denken muss. Karte und Marke sind zwei Ansichten desselben — sie leuchten gemeinsam auf und wählen über <b>denselben</b> Weg. Die Leute des anderen Klans bekommen eine gestrichelte Marke ohne Griff: sichtbar, solange jemand hinsieht, aber nichts zum Anfassen.') +
    punkt(5, 'Ein Container ist Luft', 'Der schwerste Fehler dieses Durchgangs, und er stand seit dem ersten Tag da: <code>.hud > *{pointer-events:auto}</code>. Das trifft nicht nur die Chips und Karten, sondern auch <code>.links</code> — ein Flex-Element mit <code>flex:1</code>, also ein unsichtbarer Kasten über der halben Bühne. Er hat jeden Klick geschluckt, bevor er die Leinwand erreichte. Ein Feld wählen ging nur ganz rechts; Gehen ging überhaupt nicht, und es sah nach einem Fehler in der Auswahl aus. Nachgewiesen mit <code>document.elementFromPoint</code> auf der Bühnenmitte: vorher <code>links</code>, jetzt <code>gl</code>. Zeiger gehören auf das, was etwas IST — ein Container ist Luft, und Luft fängt keine Klicks.') +
    punkt(4, 'Der Zeigerring sagt etwas', 'Seit die Leute gehen, ist ein Feld unter dem Zeiger entweder ein Ziel oder nicht. Der Ring trägt das: in der Klanfarbe heisst „hier kann der Gewählte hin", in Grau heisst „nur ansehen", und der Zeiger wird zur Hand. Vorher war er immer grau und man erfuhr es erst beim Klicken — oder eben nicht.') +
    punkt(5, 'Zeigen heisst treffen', 'Der Auswahlstrahl läuft über das <b>Höhenfeld</b>, nicht über das Netz: Schritt für Schritt am Strahl entlang das Feld unter (x,z) nachschlagen und prüfen, ob man schon unter dessen Deckfläche ist. Vorher wurde der Netztreffer auf die nächste Feldmitte zurückgerechnet — und in der Schrägsicht liegt der Treffer auf der FLANKE der Kachel davor, also landete man systematisch auf dem erhöhten Feld VOR dem gemeinten. Mit dem Niederdrücken wurde daraus ein echter Fehler: von einem Plateau auf ein flaches Feld daneben zu tippen wählte zuverlässig das Plateau, und der Schritt kam nie zustande. Nebengewinn: der Bewuchs spielt keine Rolle mehr (ein Baum ist kein Gelände), und es ist <b>schneller</b> als vorher — kein Netzschnitt über tausende Dreiecke, sondern ein Nachschlagen in konstanter Zeit je Schritt. Gemessen über projizierte Feldmitten: in der Aufsicht 100 % genau, in der Schrägsicht alles ausser dem, was ein Berg wirklich verdeckt.') +
    punkt(4, 'Zwei Sichthilfen — Bedienung, nicht Bild', '<b>Alt</b> (halten) macht den Bewuchs durchsichtig; die Leute behalten ihr eigenes Material und bleiben sichtbar. <b>T</b> ebnet das Gelände ein: jede Kachel bekommt dieselbe Deckhöhe, die Hebung des Nebels bleibt — die einzige Höhe im Bild ist dann die, die etwas BEDEUTET. Was verdeckt ist, kann man nicht antippen; beides sind darum Werkzeuge und keine Verzierungen. (Gemeint war Strg+T — das vergibt Chrome für „neuer Tab" und lässt es eine Seite nicht abfangen.) Im flachen Brett bekommt das Wasser EINE gemeinsame Höhe: sein einziges senkrechtes Merkmal ist das Gefälle, und eine Kantenmitte trägt die Mittelwerts-Höhe ihrer zwei Felder — je Feld verschieden verschoben klaffte das Band an jeder Kante auf.') +
