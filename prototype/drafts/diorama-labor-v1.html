    punkt(5, 'Die Leute gehen', 'Eine gewählte Figur, ein Tipp in ihren Saum — sie geht hin, und die Karte antwortet im selben Bild: das Land vor ihr kommt hoch, das hinter ihr sackt ab. Möglich wurde es durch eine kleine Umstellung: die Figuren sind aus dem grossen Bewuchsnetz heraus in ein EIGENES Netz gewandert. Im grossen wären sie eingebacken, und ein Schritt hätte das ganze Tal neu gebaut. Sie sind auch keine <b>Requisiten</b> mehr — ein Requisit unterdrückt den Bewuchs seines Feldes, und wo jemand einmal stand, bliebe sonst für immer eine kahle Stelle. Lager und Feuer bleiben Requisiten, weil sie bleiben. Wer gezeichnet wird, ist dabei eine Spielregel: die eigenen Leute immer, die des anderen Klans nur, solange sie jemand ansieht.') +
    punkt(5, 'Kultur 0 — kein Gedächtnis', 'Der Grenzfall, und der lehrreichste: die Front hat unendliche Geschwindigkeit, ihr Festpunkt ist also in null Runden erreicht — alles ausser Sicht ist vergessen. Weil ein Festpunkt (anders als ein Zuwachs) keine Rundengrenze braucht, an der er zählt, darf er JEDERZEIT angewandt werden; er greift schon bei der Sichtänderung. Genau deshalb wird die Diffusion hier sichtbar, statt auf das Zugende zu warten: man geht, und die Karte hebt und senkt sich mit jedem Schritt. Derselbe Gang mit Kultur 4 lässt einen langen Korridor Erinnerung stehen — die beiden Bilder nebeneinander sind die ganze Aussage des Modells.') +
    punkt(4, 'Sicht und Tempo', 'Beide über <code>SOT.hex.disc</code>. Sicht hebt das Land, Tempo ist die Schrittweite — und seit die Leute gehen, ist der Saum keine Anzeige mehr, sondern eine Schaltfläche: er zeigt darum die Reichweite der GEWÄHLTEN Figur und nicht mehr die des ganzen Klans.') +
    punkt(5, 'Zwei Klane, zwei Karten', 'Jeder Klan hat ein EIGENES Druckfeld über derselben Welt. Beim Zugwechsel wird nichts neu gebaut — Gelände, Wasser und Bewuchs sind dasselbe Netz, nur anders eingefärbt und anders hoch. Das ist der Beleg, dass verdeckte Information kein zweites Weltmodell braucht.') +
    punkt(5, 'Das Vergessen als Diffusionsfront', 'Drei Zustände statt zwei: <b>Sicht</b> (Farbe) · <b>Erinnerung</b> (einfarbig) · <b>Vergessen</b> (flach). Die Regel ist eine Zeile — <code>w′ = w + VOLL/Kultur</code> für jedes Feld ausser Sicht, <b>aber nur, wenn ein Nachbar selbst schon voll ist</b>. Daraus folgt die Frontgeschwindigkeit von genau 1/Kultur Feldern je Runde, die weiche Rampe davor und die Tatsache, dass Sicht sofort ganz hebt, das Vergessen aber langsam drückt. Die Schwelle ist der Kern: eine Deckelung auf den dichtesten Nachbarn (der erste Versuch) begrenzt die HÖHE, nicht den BEGINN — die Front lief dann mit einem Feld je Runde, unabhängig von der Kultur.') +
    punkt(4, 'Kultur ist ein Vergessenstempo, kein Sichtbonus', 'Sie erhöht nichts, sie verzögert nur — 1/Kultur je Runde. Damit ist sie im Bild ablesbar (wie weit die Karte offen bleibt) statt in einer Zahl versteckt.') +
    punkt(5, 'Der Nebel ist eine HEBUNG, keine Decke', 'Das Ungesehene wird nicht verdeckt, sondern niedergedrückt: <code>y′ = UNTEN + (y − UNTEN) · heb</code> mit <code>heb = 1 − Druck</code>. Erkundetes steht als Plateau da und wirft seinen Schlagschatten auf den leeren Grund; Vergessenes liegt flach, fast in Papierfarbe, und behält nur seinen Umriss. Die Y-Skalierung um UNTEN lässt die Normalen in Ruhe (eine senkrechte Flanke behält ihre waagrechte Normale) und die Umschlagkiste gültig (die Felder wandern nur nach unten, nie unter UNTEN) — es muss also nur <code>y</code> geschrieben werden, genau wie vorher nur die Farbe. Der Bewuchs geht <b>quadratisch</b> nieder, also schneller als sein Boden: erst verliert ein Feld seine Merkmale, dann seine Höhe.') +
    punkt(4, 'Bewuchs', 'Unsymmetrische Kegel, gestörte Ikosaeder, geclusterte Steine — flach schattiert, alles in EINEM Netz.') +
    punkt(4, 'Stürze und Ufer sind Folgen, keine Sorten', 'Fällt die Höhe über eine Wasserkante zu stark, stürzt es dort — die Wasserfälle sitzen darum von selbst an den Terrassenkanten. Und das Ufer entsteht, weil die Ecken einer Wasserkante zum Kies ziehen: „Kiesbank" braucht keine eigene Feldsorte mehr.') +
    punkt(3, 'Wetter', 'Regenwolke als Geometrie über dem Tal, Regen als 260 Instanzen. Sie hat mit dem Nebel nichts zu tun — sie liegt über der Welt, der Nebel IST die Welt.') +
    punkt(3, 'Figuren', 'Silhouette statt Anatomie: grosser Kopf, Hut, Speer bzw. Korb.') +
    punkt(2, 'Bildstimmung', 'Eigene Nachbearbeitung in vier Durchgängen (Helligkeitsauszug, 2× Unschärfe, Zusammenzug mit ACES, Sättigung, Warm/Kühl, Vignette, Nachschärfen) — <code>?post=0</code> für den rohen Renderer.') +
    '</ul>' +

    '<h3>Verworfen: die Wolkendecke</h3>' +
    '<p class="note">Ein Durchgang lang lag über dem Ungesehenen eine <b>Wolke aus Ballen</b> — ' +
    'ein bis fünf verzogene Ikosaeder je Feld aus zwölf vorgerechneten Vorlagen, dazu ein ' +
    'Deckel aus sechs Dreiecken gegen die durchscheinenden Kachelnähte. Sie sah gut aus und ' +
    'war trotzdem die falsche Idee: <b>eine Wolke verdeckt, sie entzieht nicht.</b> Das Feld ' +
    'darunter blieb da, unverändert, und bekam eine Verpackung — die Karte wurde nicht ' +
    'kleiner, nur trüber. Der Nachfolger sagt dasselbe mit weniger: die Hebung braucht kein ' +
    'zweites Netz, weil die Information in der Geometrie sitzt, die ohnehin da ist. Und sie ' +
    'sagt mehr: das Bekannte steht als Plateau da und wirft einen Schlagschatten auf den ' +
    'leeren Grund — diese Silhouette ist umsonst zu haben und liest sich sofort. ' +
    'Was die Wolke unterwegs kostete, bevor sie überhaupt gut aussah: ' +
    '<code>steinRoh</code>s Verzug von ±0.55 machte aus ihr ein <b>Eisfeld</b> (jeder Ballen ' +
    'einzeln als Kristall lesbar); die Facettenspanne 0.74…1.15 war zu weit (eine Wolke ist ' +
    'fast schattenlos); und in der Aufsicht standen die <b>Kachelnähte durch sie hindurch</b>, ' +
    'man konnte die Felder unter ihr abzählen. Drei Nachbesserungen für eine Verpackung — ' +
    'im Rückblick der deutlichste Hinweis, dass der Ansatz nicht trug.</p>' +

    '<h3>Nicht drin — bewusst</h3>' +
    '<p class="note">Kein SSAO/GTAO und kein EffectComposer: die stehen in ' +
    '<code>three/examples/jsm</code>, also ausserhalb des Kerns, und hätten ein halbes ' +
    'Dutzend weitere Dateien in <code>vendor/</code> bedeutet. Was fehlt, ist die ' +
    'Verschattung zwischen frei stehenden Objekten (Steinhaufen untereinander).<br><br>' +
    'Keine Sichtlinie: die Sicht ist eine Scheibe, kein Sichtfeld — Berge verdecken ' +
    'nichts.<br><br>' +
    'Kein Haushalten beim Gehen: eine Figur darf so oft ziehen, wie man mag, nur nie weiter ' +
    'als ihr Tempo. Das ist eine Laborvereinfachung und keine Regel — geprüft wird, was die ' +
    'Front tut, wenn Leute sich bewegen, und dafür will man gehen können, ohne zu rechnen. ' +
    'Auch Wasser ist begehbar: Furten sind eine eigene Frage (<code>gewaesser-labor-v4</code>), ' +
    'und sie hier zu erfinden hiesse, eine Regel zu setzen, die dieses Labor nicht prüfen kann.' +
    '<br><br>' +
    'Kein Vergessen der Erinnerung von INNEN: ein Feld weit hinter der Front bleibt erinnert, ' +
    'solange die Front es nicht erreicht. Das ist Absicht — ein Klan verliert Wissen von den ' +
    'Rändern her, nicht in Flecken. Bei <b>Kultur 0</b> fällt diese Unterscheidung weg, weil ' +
    'es dort keine Ränder mehr gibt: alles ausser Sicht ist gleichzeitig fort.<br><br>' +
    'Beim Wasser fehlen <b>Seen</b>: der Priority-Flood WEISS, wo eine Pfanne aufgestaut ist ' +
    '(<code>senke</code>), aber eine Wasserfläche über dem ganzen Feld wird nicht gebaut — dort ' +
    'läuft das Band bloss durch. Ebenso offen: die <b>Furt</b> (wäre geringe Menge plus geringes ' +
    'Gefälle an einer Kante — im neuen Modell ausdrückbar, nur nicht gebaut) und die ' +
    '<b>Klamm</b>.</p>' +

    '<h3>Vergleich</h3>' +
    '<p class="note"><b>hex-valley.html</b> — EIN gemaltes SVG-Bild; die Schattierung ' +
    'stimmt nur aus einer Kamerastellung.<br>' +
    '<b>kamera-labor-v1.html</b> — CSS-Extrusion mit <code>preserve-3d</code>, feste ' +
    'Welt-Sonne, Klippen als stehende Flächen. Dreht korrekt, aber jede Kachel ist DOM — ' +
    'und der Baukasten nennt bei ~2 000 Feldern selbst die Grenze.<br>' +
    '<b>dieses Labor</b> — ' + n(felder.size) + ' Felder in ' + inf.calls + ' Aufrufen.</p>';
}

/* ============================================================================
   19 · Start
   ========================================================================= */
function zeitKnopf() {
  const b = document.getElementById('bZeit');
  b.innerHTML = SOT.icon({ morgen:'morgen', mittag:'sonne', abend:'abend', nacht:'mond' }[P.zeit]) +
    ' ' + P.zeit;
  b.querySelector('svg').style.cssText =
    'width:13px;height:13px;vertical-align:-2px;margin-right:3px';
}
function sichtKnopf() {
  document.querySelectorAll('#segSicht button').forEach(b =>
    b.classList.toggle('on', b.dataset.s === P.sicht));
}
function zeitStellen(name) {
  P.zeit = name; P.set('zeit', name);
  SOT.zeit(name);
  document.body.classList.toggle('night', name === 'nacht');
  weltBauen();
  zeitKnopf();
}

try {
  rendererBauen();
} catch (e) {
  window.__diorama = true;
  document.getElementById('notgrund').textContent = 'WebGL liess sich nicht starten: ' + e.message;
  document.getElementById('not').classList.remove('hid');
  throw e;
}
window.__diorama = true;

SOT.zeit(P.zeit);
document.body.classList.toggle('night', P.zeit === 'nacht');
/* Vor dem ersten Aufbau: die Einebnung steckt in jeder geschriebenen Höhe. */
flachAn = !!P.flach;

/* Wer am Zug ist, muss VOR dem ersten Aufbau feststehen: Glutlicht, Saum und
   Wolkendecke hängen daran. */
amZug = Math.max(0, KLANE.findIndex(K => K.id === P.amzug));

/* Erst rechnen, damit die Blickmitte auf die Leute gesetzt werden kann —
   sonst zeigt der erste Aufbau auf den Weltursprung. */
felderRechnen();
wolkenAnlegen(true);
leuteSetzen(true);
sichtRechnen();
{
  const b = (P.blick || '').split(',').map(Number);
  const f = (b.length === 2 && !isNaN(b[0])) ? feldAn(b[0], b[1]) : null;
  const erste = leuteVon(aktiv().id)[0] || LEUTE[0];
  const start = f || feldAn(erste.c, erste.r) || naechstesFeld(0, 0);
  if (start) blickZiel.set(start.x, 0, start.z);
}
weltBauen();
groesseStellen();
zeitKnopf();
sichtKnopf();
bereit = true;
durchsichtSetzen(!!P.durchsicht);

/* `?zuege=` nimmt dem Bildschirmfoto das Klicken ab. Es läuft durch DIESELBE
   Regel wie der Knopf, nur ohne Zwischenbilder — damit ist der Debug-Griff
   auch eine Probe auf den Zugwechsel und nicht ein zweiter Weg daneben. */
/* Erst gehen, dann Zeit vergehen lassen — die Spur entsteht, und danach frisst
   sie die Front. Umgekehrt wäre die Reihenfolge sinnlos. */
if (P.wandern > 0 || P.zuege > 0) {
  wandernVorspulen(P.wandern);
  for (let i = 0; i < P.zuege; i++) zugRechnen();
  P.set('amzug', aktiv().id);
  zugAnzeigen(false);
}
neuZeichnen();

if (P.wahl) {
  const w = P.wahl.split(',').map(Number);
  waehlen(feldAn(w[0], w[1]));
}

const blatt = SOT.sheet('#messblatt');
document.getElementById('bMess').addEventListener('click', () => { messblattFuellen(); blatt.toggle(); });
document.getElementById('bZeit').addEventListener('click', () => {
  const o = ['morgen','mittag','abend','nacht'];
  zeitStellen(o[(o.indexOf(P.zeit) + 1) % o.length]);
});
document.querySelectorAll('#segSicht button').forEach(b =>
  b.addEventListener('click', () => {
    P.sicht = b.dataset.s; P.set('sicht', P.sicht);
    sichtKnopf(); kameraStellen(); lichtStellen();
  }));
{
  const b = document.getElementById('bZug');
  b.innerHTML = SOT.icon('runde') + 'Zug beenden';
  b.addEventListener('click', zugBeenden);
}

const LEUTE_P = new Set(LEUTE.flatMap(L => [L.pS, L.pT]));
const KULTUR_P = new Set(KLANE.map(K => K.pK));
SOT.regler(P, { onChange:(name) => {
  if (name === 'azimut' || name === 'neigung' || name === 'zoom' || name === 'sicht') {
    kameraStellen(); if (P.lichtdreht) lichtStellen();
  } else if (name === 'post' || name === 'still') neuZeichnen();
  else if (name === 'gitter') {
    matGelaende.wireframe = matSonstiges.wireframe = !!P.gitter; neuZeichnen();
  } else if (name === 'zeit') zeitStellen(P.zeit);
  else if (name === 'nebel' || name === 'heben') nebelAnwenden(true);
  else if (name === 'flach') { flachAn = !!P.flach; hebenAlleSchreiben(); lichtStellen(); }
  else if (name === 'durchsicht') durchsichtSetzen(!!P.durchsicht);
  else if (name === 'amzug') {
    /* Am Regler wird nur UMGESCHALTET, nicht gezogen: den Zug beenden heisst
       vergessen, und das darf kein Nebeneffekt eines Reglers sein. */
    amZug = Math.max(0, KLANE.findIndex(K => K.id === P.amzug));
    zugAnzeigen(true);
  }
  else if (KULTUR_P.has(name)) {
    for (const K of KLANE) K.kultur = P[K.pK];
    klankarteBauen();
  }
  else if (LEUTE_P.has(name)) {
    for (const L of LEUTE) { L.sicht = P[L.pS]; L.tempo = P[L.pT]; }
    sichtRechnen(); nebelAnwenden(false); leuteBauen(); markenBauen(); reichweiteZeichnen();
    kameraStellen(); klankarteBauen(); leuteKartenBauen();
  } else if (name === 'schatten') {
    renderer.shadowMap.enabled = P.schatten !== 'aus';
    renderer.shadowMap.type = P.schatten === 'weich' ? THREE.VSMShadowMap : THREE.PCFShadowMap;
    /* Schattenart steckt im Shader — JEDES Material muss neu übersetzt werden,
       sonst schaltet nur um, was danach zum ersten Mal gezeichnet wird. */
    for (const m of [matGelaende, matSonstiges, matWolke, matWasser, matLeute]) m.needsUpdate = true;
    /* `matUmriss` steht ABSICHTLICH nicht in der Liste: er ist unbeleuchtet,
       im Shader kommt kein Schatten vor, ein Neuübersetzen wäre umsonst. */
    lichtStellen();
  } else if (name === 'lichtdreht') lichtStellen();
  else weltBauen();
} });
document.getElementById('bGanz').addEventListener('click', ganzZeigen);

SOT.debug(P);
/* Der Beobachter genügt — er feuert auch beim Fensterwechsel, und anders als
   `resize` auch dann, wenn nur das Reglerbrett die Bühne schmaler macht. */
new ResizeObserver(groesseStellen).observe(buehne);
requestAnimationFrame(schleife);
</script>
</body>
</html>
