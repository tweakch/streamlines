<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115.47">
<title>Subboreal × Pontisch-steppisch</title>
<!-- Master-Set-Kombination aus art-direction-handbuch.html Kap. 2/3/4:
     kühler, trockener werdende Steppen-Wald-Mosaik-Landschaft mit den
     ersten, noch sehr zurückhaltenden menschlichen Eingriffen. -->
<style>
:root{
  --ground-base:#C9B77E;
  --ground-shade:#B8A468;
  --veg-primary:#7C8C4A;
  --veg-primary-dark:#66753A;
  --veg-secondary:#A9A163;
  --climate:#F4EEDD;
  --climate-haze:#E3B36A;
  --human:#4A4038;
  --edge:#8C8468;
}
</style>
<clipPath id="hex"><path d="M50,0 L100,28.87 L100,86.6 L50,115.47 L0,86.6 L0,28.87 Z"/></clipPath>
<g clip-path="url(#hex)">
  <g id="base-terrain">
    <rect x="0" y="0" width="100" height="115.47" fill="var(--ground-base)"/>
    <path d="M0,20 Q50,35 100,18 L100,0 L0,0 Z" fill="var(--ground-shade)" opacity="0.5"/>
  </g>
  <g id="vegetation-primary">
    <!-- Steppen-Wald-Mosaik: wenige, isolierte Baumgruppen statt Kronenschluss -->
    <g><circle cx="18" cy="25" r="10" fill="var(--veg-primary-dark)"/><circle cx="14" cy="20" r="6" fill="var(--veg-primary)"/></g>
    <g><circle cx="85" cy="35" r="11" fill="var(--veg-primary-dark)"/><circle cx="89" cy="29" r="7" fill="var(--veg-primary)"/></g>
    <g><circle cx="30" cy="95" r="9" fill="var(--veg-primary-dark)"/><circle cx="26" cy="90" r="6" fill="var(--veg-primary)"/></g>
  </g>
  <g id="vegetation-secondary">
    <!-- Steppengras füllt die offenen Flächen zwischen den Baumgruppen -->
    <path d="M40,45 l-2,-6 M40,45 l2,-6 M45,50 l-2,-6 M45,50 l2,-6 M50,44 l-2,-6 M50,44 l2,-6" stroke="var(--veg-secondary)" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
    <path d="M62,60 l-2,-6 M62,60 l2,-6 M68,65 l-2,-6 M68,65 l2,-6" stroke="var(--veg-secondary)" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
    <path d="M28,60 l-2,-6 M28,60 l2,-6 M33,55 l-2,-6 M33,55 l2,-6" stroke="var(--veg-secondary)" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
    <path d="M55,80 l-2,-6 M55,80 l2,-6 M60,86 l-2,-6 M60,86 l2,-6 M65,79 l-2,-6 M65,79 l2,-6" stroke="var(--veg-secondary)" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g id="water-features">
    <!-- keine — Steppe, kein Dauergewässer in dieser Kombination -->
  </g>
  <g id="climate-indicators">
    <rect x="0" y="0" width="100" height="115.47" fill="var(--climate-haze)" opacity="0.05"/>
    <path d="M53,53 l4,3 l-1,5 M57,56 l5,-1 M56,58 l2,5" stroke="var(--climate)" stroke-width="0.8" fill="none" opacity="0.55" stroke-linecap="round"/>
    <path d="M63,78 l4,3 l-1,4 M67,81 l4,-1" stroke="var(--climate)" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
  </g>
  <g id="human-traces">
    <!-- extrem zurückhaltend: ein Weidepfad, ein angedeutetes Feldstück -->
    <path d="M10,92 Q35,70 40,50 T90,20" stroke="var(--human)" stroke-width="0.8" fill="none" opacity="0.5" stroke-linecap="round"/>
    <rect x="58" y="83" width="18" height="12" fill="none" stroke="var(--human)" stroke-width="0.7" opacity="0.35"/>
  </g>
</g>
<g id="edge-mask">
  <path d="M50,0 L100,28.87 L100,86.6 L50,115.47 L0,86.6 L0,28.87 Z" fill="none" stroke="var(--edge)" stroke-width="1.2" opacity="0.4"/>
</g>
</svg>
