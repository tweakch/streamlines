<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115.47">
<title>Subatlantikum × Arid/Naher Osten</title>
<!-- Master-Set-Kombination aus art-direction-handbuch.html Kap. 2/3/4/6:
     "die fragile Balance zwischen Fruchtbarkeit und Trockenheit" —
     Vegetation und Siedlungsspuren folgen sichtbar dem Wadi. -->
<style>
:root{
  --ground-base:#D9C79A;
  --ground-shade:#C9B583;
  --wadi-bed:#C4A868;
  --water:#6FA6A3;
  --veg-primary:#7A8F5E;
  --veg-primary-dark:#647849;
  --veg-secondary:#96A56E;
  --climate:#F2ECD8;
  --climate-haze:#E3B36A;
  --human:#3D3226;
  --edge:#8C7A54;
}
</style>
<clipPath id="hex"><path d="M50,0 L100,28.87 L100,86.6 L50,115.47 L0,86.6 L0,28.87 Z"/></clipPath>
<g clip-path="url(#hex)">
  <g id="base-terrain">
    <rect x="0" y="0" width="100" height="115.47" fill="var(--ground-base)"/>
    <path d="M0,10 Q50,25 100,8 L100,0 L0,0 Z" fill="var(--ground-shade)" opacity="0.4"/>
  </g>
  <g id="vegetation-primary">
    <!-- Tamarisken/Akazien: flache Schirmkrone auf dünnem Stamm, dem Wadi folgend -->
    <g><line x1="28" y1="70" x2="28" y2="60" stroke="var(--veg-primary-dark)" stroke-width="1.2"/><ellipse cx="28" cy="58" rx="10" ry="4" fill="var(--veg-primary)"/></g>
    <g><line x1="46" y1="80" x2="46" y2="71" stroke="var(--veg-primary-dark)" stroke-width="1.2"/><ellipse cx="46" cy="69" rx="9" ry="3.6" fill="var(--veg-primary)"/></g>
    <g><line x1="63" y1="90" x2="63" y2="81" stroke="var(--veg-primary-dark)" stroke-width="1.2"/><ellipse cx="63" cy="79" rx="10" ry="4" fill="var(--veg-primary)"/></g>
    <g><line x1="18" y1="58" x2="18" y2="50" stroke="var(--veg-primary-dark)" stroke-width="1"/><ellipse cx="18" cy="48" rx="7" ry="3" fill="var(--veg-primary)"/></g>
  </g>
  <g id="vegetation-secondary">
    <!-- sparsamer Bewuchs nur direkt am Wadi-Rand -->
    <path d="M34,64 l-1,-4 M34,64 l1,-4 M52,74 l-1,-4 M52,74 l1,-4" stroke="var(--veg-secondary)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g id="water-features">
    <!-- trockenes Wadi-Bett, mit schwacher, unterbrochener Wasserspur -->
    <path d="M8,45 Q30,58 40,68 T75,95 L90,105 L100,95 Q70,80 58,68 Q42,52 20,38 Z" fill="var(--wadi-bed)" opacity="0.55"/>
    <path d="M10,46 Q32,59 42,69 T78,97" stroke="var(--water)" stroke-width="1.1" fill="none" opacity="0.5" stroke-dasharray="2,3" stroke-linecap="round"/>
  </g>
  <g id="climate-indicators">
    <rect x="0" y="0" width="100" height="115.47" fill="var(--climate-haze)" opacity="0.06"/>
    <g opacity="0.55"><ellipse cx="78" cy="30" rx="9" ry="5" fill="var(--climate)"/><circle cx="75" cy="29" r="0.6" fill="var(--ground-shade)"/><circle cx="80" cy="31" r="0.6" fill="var(--ground-shade)"/><circle cx="78" cy="27" r="0.6" fill="var(--ground-shade)"/></g>
    <g opacity="0.5"><ellipse cx="15" cy="90" rx="7" ry="4" fill="var(--climate)"/><circle cx="13" cy="89" r="0.5" fill="var(--ground-shade)"/><circle cx="17" cy="91" r="0.5" fill="var(--ground-shade)"/></g>
  </g>
  <g id="human-traces">
    <!-- winzige Siedlungs-/Bewässerungspunkte entlang des Wadis, ein Kanalansatz -->
    <circle cx="35" cy="63" r="1" fill="var(--human)" opacity="0.75"/>
    <circle cx="50" cy="72" r="1" fill="var(--human)" opacity="0.75"/>
    <circle cx="66" cy="85" r="1" fill="var(--human)" opacity="0.75"/>
    <path d="M50,72 Q60,74 66,68" stroke="var(--human)" stroke-width="0.6" fill="none" opacity="0.4"/>
  </g>
</g>
<g id="edge-mask">
  <path d="M50,0 L100,28.87 L100,86.6 L50,115.47 L0,86.6 L0,28.87 Z" fill="none" stroke="var(--edge)" stroke-width="1.2" opacity="0.4"/>
</g>
</svg>
