<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 115.47">
<title>Atlantikum × Mitteleuropäisch-temperiert</title>
<!-- Master-Set-Kombination aus art-direction-handbuch.html Kap. 2/3/6:
     "üppig, fast bedrückend dicht" — maximale Waldausdehnung des
     Climatic Optimum, keine menschlichen Spuren (liegt vor Subboreal). -->
<style>
:root{
  --ground-base:#3E4A2E;
  --ground-shade:#31401F;
  --veg-primary:#5C7D4C;
  --veg-primary-dark:#3F5A34;
  --veg-secondary:#2E4224;
  --climate-haze:#E3B36A;
  --edge:#2A3620;
}
</style>
<clipPath id="hex"><path d="M50,0 L100,28.87 L100,86.6 L50,115.47 L0,86.6 L0,28.87 Z"/></clipPath>
<g clip-path="url(#hex)">
  <g id="base-terrain">
    <rect x="0" y="0" width="100" height="115.47" fill="var(--ground-base)"/>
    <path d="M0,95 Q50,80 100,98 L100,115.47 L0,115.47 Z" fill="var(--ground-shade)" opacity="0.6"/>
  </g>
  <g id="vegetation-primary">
    <g><circle cx="30" cy="38" r="18" fill="var(--veg-primary-dark)"/><circle cx="24" cy="30" r="12" fill="var(--veg-primary)"/><circle cx="38" cy="33" r="11" fill="var(--veg-primary)"/></g>
    <g><circle cx="68" cy="30" r="17" fill="var(--veg-primary-dark)"/><circle cx="62" cy="24" r="11" fill="var(--veg-primary)"/><circle cx="76" cy="28" r="10" fill="var(--veg-primary)"/></g>
    <g><circle cx="50" cy="58" r="21" fill="var(--veg-primary-dark)"/><circle cx="42" cy="50" r="13" fill="var(--veg-primary)"/><circle cx="60" cy="52" r="12" fill="var(--veg-primary)"/></g>
    <g><circle cx="22" cy="72" r="16" fill="var(--veg-primary-dark)"/><circle cx="16" cy="65" r="10" fill="var(--veg-primary)"/><circle cx="30" cy="68" r="9" fill="var(--veg-primary)"/></g>
    <g><circle cx="78" cy="70" r="17" fill="var(--veg-primary-dark)"/><circle cx="72" cy="63" r="11" fill="var(--veg-primary)"/><circle cx="86" cy="66" r="10" fill="var(--veg-primary)"/></g>
    <g><circle cx="50" cy="93" r="15" fill="var(--veg-primary-dark)"/><circle cx="43" cy="87" r="9" fill="var(--veg-primary)"/><circle cx="58" cy="88" r="9" fill="var(--veg-primary)"/></g>
    <g><circle cx="12" cy="48" r="12" fill="var(--veg-primary-dark)"/><circle cx="8" cy="42" r="8" fill="var(--veg-primary)"/></g>
    <g><circle cx="90" cy="46" r="12" fill="var(--veg-primary-dark)"/><circle cx="94" cy="40" r="8" fill="var(--veg-primary)"/></g>
  </g>
  <g id="vegetation-secondary">
    <!-- Unterwuchs nur in den wenigen Lücken der dichten Kronenschicht sichtbar -->
    <path d="M46,8 q2,-5 4,0 M52,9 q2,-5 4,0" stroke="var(--veg-secondary)" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M48,108 q2,-6 4,0 M54,109 q2,-6 4,0" stroke="var(--veg-secondary)" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>
  <g id="water-features">
    <!-- keine — dichter Wald, kein offenes Gewässer in dieser Kombination -->
  </g>
  <g id="climate-indicators">
    <rect x="0" y="0" width="100" height="115.47" fill="var(--climate-haze)" opacity="0.07"/>
    <line x1="22" y1="6" x2="35" y2="46" stroke="var(--climate-haze)" stroke-width="3" opacity="0.18" stroke-linecap="round"/>
    <line x1="70" y1="10" x2="58" y2="52" stroke="var(--climate-haze)" stroke-width="3" opacity="0.16" stroke-linecap="round"/>
    <line x1="50" y1="60" x2="46" y2="100" stroke="var(--climate-haze)" stroke-width="2.5" opacity="0.14" stroke-linecap="round"/>
  </g>
  <g id="human-traces">
    <!-- keine menschlichen Spuren: Atlantikum liegt vor Subboreal, siehe Kap. 4 -->
  </g>
</g>
<g id="edge-mask">
  <path d="M50,0 L100,28.87 L100,86.6 L50,115.47 L0,86.6 L0,28.87 Z" fill="none" stroke="var(--edge)" stroke-width="1.2" opacity="0.5"/>
</g>
</svg>
