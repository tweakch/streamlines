<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>HLS Link-Sammler</title>
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 260px; margin: 0; padding: 12px; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  .zeile { display: flex; gap: 6px; margin-bottom: 4px; }
  input[type="text"] { flex: 1; padding: 4px 6px; box-sizing: border-box; }
  button { padding: 4px 10px; cursor: pointer; }
  .hinweis { color: #666; font-size: 11px; margin: 4px 0 12px; }
  .status { font-size: 11px; color: #2a7a2a; min-height: 14px; margin-bottom: 8px; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 160px; overflow-y: auto; }
  li { padding: 3px 0; border-bottom: 1px solid #eee; }
  .zaehler { font-weight: 600; }
</style>
</head>
<body>
  <h1>HLS Link-Sammler</h1>

  <label for="ordner">Downloads-Unterordner</label>
  <div class="zeile">
    <input type="text" id="ordner" placeholder="hls-links" />
    <button id="speichern">Speichern</button>
  </div>
  <div class="hinweis">Relativ zum Chrome-Downloads-Ordner — Erweiterungen dürfen nicht auf beliebige Pfade schreiben.</div>
  <div class="status" id="status"></div>

  <div><span class="zaehler" id="anzahl">0</span> Artikel in dieser Browser-Sitzung erfasst</div>
  <ul id="letzte"></ul>

  <script src="popup.js"></script>
</body>
</html>
